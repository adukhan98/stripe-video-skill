<!doctype html>
<!-- stripe-youtube starter: TALK OVERLAY (transparent, rendered --format mov) — the kinetic accent on a talk beat: ONE
     line he says, on a tile low-left, never over his face. About one per 45–90 s, never as running captions (the SRT
     is the captions). Render with a transparent background; first and last frame fully transparent. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>talk overlay</title>
    <link rel="stylesheet" href="board.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="board.js"></script>
    <script src="marker.js"></script>
  </head>
  <body data-theme="{{THEME}}" data-bg="transparent">
    <div id="root" class="{{HUE}}" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
      <div id="cam"><div id="punch">
        <div id="strip" class="tile" style="left:96px;top:742px;width:600px;height:250px"></div>
        <div class="k k900" style="left:136px;top:776px;font-size:118px;color:var(--tile-text)"><span class="w" data-t="0.25">talk</span><span class="w gap" data-t="0.4">to</span><span class="w gap" data-t="0.5">it</span></div>
        <div class="k" style="left:140px;top:900px;font-size:66px;color:var(--tile-text)"><span class="w" data-t="0.8">instead</span><span class="w gap" data-t="0.95">of</span><span class="w gap emph" data-t="1.1" data-hero>typing.</span></div>
      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const B = await Board.init();
        const { D, F } = B;
        B.in("#strip", 0.05, { type: "left", dist: 80 });
        B.out(["#root .k", "#strip"], D - 8 * F, { to: "left" });   // gone before the cut: last frame transparent
      })();
    </script>
  </body>
</html>
