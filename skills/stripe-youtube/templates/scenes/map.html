<!doctype html>
<!-- stripe-youtube starter: MAP — the video's recurring framework board (Eric's stage map / Greg's board). One tile per
     chapter in its hue, laid out ONCE (copy the same geometry into every map scene — SHARED.md), the camera starts on
     the whole map and pushes into the current chapter; marker loop + note on the chapter's hook line. Doubles as the
     chapter card and the YouTube chapter marker. Keep #card-zone empty AFTER the push (check the snapshot). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>map</title>
    <link rel="stylesheet" href="board.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="board.js"></script>
    <script src="marker.js"></script>
    <style>
      .tile .coin { left: 36px; top: -36px; }
      .tile .k { left: 36px; top: 74px; font-size: 52px; line-height: 1; }
    </style>
  </head>
  <body data-theme="{{THEME}}">
    <div id="root" class="{{HUE}}" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">
        <!-- MAP GEOMETRY (board px, the whole map fits 1920x1080 at scale 1): keep identical across map scenes -->
        <div id="t1" class="tile blue"   style="left:140px; top:200px;width:430px;height:220px"><div class="coin">1</div><div class="k">Talk instead<br>of typing</div></div>
        <div id="t2" class="tile green"  style="left:740px; top:200px;width:430px;height:220px"><div class="coin">2</div><div class="k">Build something<br>you can see</div></div>
        <div id="t3" class="tile yellow" style="left:1340px;top:200px;width:430px;height:220px"><div class="coin">3</div><div class="k">Let it<br>interview you</div></div>
        <div id="t4" class="tile violet" style="left:140px; top:560px;width:430px;height:220px"><div class="coin">4</div><div class="k">Ask for flaws,<br>not opinions</div></div>
        <div id="t5" class="tile orange" style="left:740px; top:560px;width:430px;height:220px"><div class="coin">5</div><div class="k">Real task,<br>real files</div></div>
        <div id="t6" class="tile teal"   style="left:1340px;top:560px;width:430px;height:220px"><div class="coin">6</div><div class="k">Stay open to<br>every shape</div></div>
      </div></div>
      <div class="small" style="left:120px;top:990px" data-in="fade" data-at="1.6">Habit 4 of 6</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const B = await Board.init();
        const M = Marker.init(B);
        const { tl } = B;
        const cur = "#t4", [cx, cy] = [355, 670];          // the current chapter's tile centre (board px)
        B.camSet(960, 490, 1);                               // whole map
        B.in(["#t1", "#t2", "#t3", "#t4", "#t5", "#t6"], 0, { type: "pop" });   // frame 0 = the whole map
        B.recede(["#t1", "#t2", "#t3", "#t5", "#t6"], 0.9, { opacity: 0.4, blur: 0, scale: 1 });
        B.camera(1.0, cx + 120, cy - 40, 1.9, 1.0);          // push in; leave the right third clear for the card
        M.circle(cx, cy, 300, 175, 2.1, { width: 7 });       // loop round the chapter (board px: rides the camera)
        M.note("the one most people get wrong", 240, 900, 2.6, { size: 70, rot: -3, parent: document.querySelector("#root") });   // screen space: not zoomed
      })();
    </script>
  </body>
</html>
