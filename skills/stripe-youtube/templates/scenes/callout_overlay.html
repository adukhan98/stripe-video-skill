<!doctype html>
<!-- stripe-youtube starter: CALLOUT OVERLAY (transparent, rendered --format mov) — drawn ON a screen stretch after the
     zoom has landed: a marker loop round the thing he clicks/names, a short arrow, a 2–3 word note. Uses the theme's
     CALLOUT colour (ink on light, orange on dark — the screen itself is light either way). Coordinates come from
     compose.py's zoom plan (`compose.py where <t>` prints where a screen point lands in the frame at output time t). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>callout overlay</title>
    <link rel="stylesheet" href="board.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="board.js"></script>
    <script src="marker.js"></script>
  </head>
  <body data-theme="{{THEME}}" data-bg="transparent">
    <div id="root" class="{{HUE}}" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
      <div id="cam"><div id="punch"></div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const B = await Board.init();
        const M = Marker.init(B);
        const { D, F } = B;
        const [x, y] = [1073, 563];                                        // the target, in frame px at this moment
        const loop = M.circle(x, y, 175, 155, 0.2, { color: "callout", width: 10 });
        const arr = M.arrow(x + 217, y + 227, x + 157, y + 117, 0.7, { color: "callout", bend: 0.3 });
        const note = M.note("it's listening", x + 167, y + 227, 0.9, { size: 66, rot: -5, color: "var(--callout)" });
        M.erase(loop, D - 7 * F, 6 * F); M.erase(arr, D - 7 * F, 6 * F);
        B.out(note, D - 7 * F);
      })();
    </script>
  </body>
</html>
