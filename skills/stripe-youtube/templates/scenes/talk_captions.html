<!doctype html>
<!-- stripe-youtube TALK CAPTIONS (v7 MINT, full coverage) — GENERATED by helpers/talkcaps.py, do not hand-edit (re-run it).
     Every word he says in this talk window, in sense phrases of <= 7 words, 2-3 words per line, collage-staggered in a left
     column; white Inter Tight 800 with ONE mint hero word per phrase; words pop on their spoken times, a phrase blurs up as
     the next one starts, the stack exits in the last 6 frames. No box, no underline, only a very soft radial scrim.
     Approved on IMG_2533 (2026-10-17): "for all the ones where I am full screen, add the captions there".
     Transparent → rendered with board.py render (ProRes 4444 .mov). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>talk captions {{ID}}</title>
    <link rel="stylesheet" href="board.css" />
    <link rel="stylesheet" href="v7yt.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="board.js"></script>
    <script src="v7yt.js"></script>
    <style>
      #col { position: absolute; left: {{X}}px; top: 0; width: 700px; height: 1080px; }
      .ph { position: absolute; left: 0; top: 0; width: max-content; }
      /* word-spacing: at -.04em letter-spacing the words ran together ("anddefend") */
      .ln { position: relative; display: block; width: max-content; white-space: nowrap; line-height: .95; font-weight: 800; letter-spacing: -.04em; word-spacing: .16em; }
      .ln.l0 { margin-left: 0; }
      .ln.l1 { margin-left: 34px; font-size: .9em; }     /* collage stagger: alternate lines are offset and a touch smaller */
      .kw { display: inline-block; will-change: transform, opacity, filter; }
      .kw.hero { font-weight: 900; font-size: 1.3em; }
      .w7.mint { text-shadow: 0 0 2px rgba(0,0,0,.7), 0 2px 4px rgba(0,0,0,.6), 0 4px 20px rgba(0,0,0,.75); }   /* mint must hold on grass */
      #scrim { position: absolute; left: -96px; top: -140px; width: 940px; height: 840px; pointer-events: none;
        background: radial-gradient(ellipse 56% 52% at 36% 50%, rgba(0,0,0,.20) 0%, rgba(0,0,0,.10) 50%, rgba(0,0,0,0) 100%); }
    </style>
  </head>
  <body data-theme="light" data-bg="transparent">
    <div id="root" class="mint" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
      <div id="col">
        <div id="scrim"></div>
{{PHRASES}}
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const B = await Board.init();
        const { tl, D, F } = B;
        const col = document.getElementById("col");
        const phs = Array.from(col.querySelectorAll(".ph"));
        // fit PER PHRASE: biggest size (<=110) whose widest line (indent + 1.3x hero) is <= 620 px
        const fit = [];
        for (const p of phs) {
          p.style.fontSize = "100px";
          const pl = Array.from(p.querySelectorAll(".ln"));
          const w100 = Math.max(...pl.map((l) => l.offsetWidth + parseFloat(getComputedStyle(l).marginLeft)));
          const size = Math.max(56, Math.min(110, Math.floor(620 / w100 * 100)));
          p.style.fontSize = size + "px"; fit.push(size);
        }
        // each phrase block is centred on y = {{Y}} (layout.json captions.y — a calm area of HIS background: sky, a wall;
        // never over bright buildings or his face)
        for (const p of phs) p.style.top = Math.round({{Y}} - p.offsetHeight / 2) + "px";
        window.__fit = { fit, hs: phs.map((p) => p.offsetHeight) };
        for (const w of col.querySelectorAll(".kw")) {
          const at = parseFloat(w.dataset.t), hero = w.classList.contains("hero");
          // pop: scale .6 -> 1.08 -> 1 with a small rise and a blur-up (~7 f); the hero punches a little harder
          tl.fromTo(w, { opacity: 0, y: 30, scale: 0.6, filter: "blur(8px)" }, { opacity: 1, y: 0, scale: hero ? 1.16 : 1.08, filter: "blur(0px)", duration: 4 * F, ease: "power3.out" }, at);
          tl.to(w, { scale: 1, duration: 4 * F, ease: "power2.inOut" }, at + 4 * F);
        }
        // phrase swap: the previous block blurs up and fades as the next one starts
        const starts = {{STARTS}};
        tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 10 * F, ease: "power1.out" }, Math.max(0, starts[0] - 0.1));
        for (let k = 0; k < phs.length - 1; k++)
          tl.to(phs[k], { y: -60, opacity: 0, filter: "blur(10px)", duration: 5 * F, ease: "power2.in", immediateRender: false }, starts[k + 1] - F);
        // exit: the whole stack slides left and fades in the last 6 frames (last frame fully transparent)
        tl.to(col, { x: -90, opacity: 0, duration: 5 * F, ease: "power2.in", immediateRender: false }, D - 6 * F);
      })();
    </script>
  </body>
</html>
