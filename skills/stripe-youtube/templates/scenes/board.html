<!doctype html>
<!-- stripe-youtube starter: BOARD — Greg's signature section: a numbered section card with a flow of coloured boxes
     (input → steps → output), one plain line under it, a handwritten note. Box labels are short (≤ 4 words) and say
     what he says; the flow builds box by box ON the words. Keep #card-zone empty. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>board</title>
    <link rel="stylesheet" href="board.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="board.js"></script>
    <script src="marker.js"></script>
    <style> .flowtile .k { left: 30px; top: 50%; transform: translateY(-50%); font-size: 44px; line-height: 1; } </style>
  </head>
  <body data-theme="{{THEME}}">
    <div id="root" class="{{HUE}}" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">
        <div class="chap" data-in="left" data-at="0"><div class="coin">3</div><div class="t"><span class="num">03 · </span>Let it interview you</div></div>
        <div id="sheet" class="card" style="left:120px;top:220px;width:1420px;height:640px" data-in="up" data-at="0"></div>
        <div class="label" style="left:180px;top:270px;font-size:40px" data-in="fade" data-at="0.3">Stop guessing the context. Let it ask.</div>
        <div id="f1" class="tile blue flowtile"   style="left:180px; top:400px;width:270px;height:170px"><div class="k">Your task</div></div>
        <div id="a1" class="arrowline" style="left:465px; top:483px;width:70px"></div>
        <div id="f2" class="tile green flowtile"  style="left:550px; top:400px;width:270px;height:170px"><div class="k">It asks every<br>question</div></div>
        <div id="a2" class="arrowline" style="left:835px; top:483px;width:70px"></div>
        <div id="f3" class="tile yellow flowtile" style="left:920px; top:400px;width:270px;height:170px"><div class="k">One at<br>a time</div></div>
        <div id="a3" class="arrowline" style="left:1205px;top:483px;width:70px"></div>
        <div id="f4" class="tile violet flowtile" style="left:1290px;top:400px;width:210px;height:170px"><div class="k">You<br>answer</div></div>
        <div class="label muted" style="left:180px;top:660px;font-size:34px" data-in="fade" data-at="3.4">“Ask me every question you need, one at a time.”</div>
      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const B = await Board.init();
        const M = Marker.init(B);
        B.flow(["#f1", "#a1", "#f2", "#a2", "#f3", "#a3", "#f4"], 1.0, { gap: 0.5 });
        M.note("copy this prompt", 980, 740, 3.8, { size: 62, rot: -3 });
        M.arrow(960, 760, 820, 712, 4.4, { bend: -0.25 });
      })();
    </script>
  </body>
</html>
