<!doctype html>
<!-- m12_recap — v7 MINT. HABIT CHAIN recap part 1 (CHAIN_SHARED.md; chain built by chain_common.js v2, same as m00–m11).
     Frame 0 = WHOLE (1146, 640, 0.85): connector drawn, all 11 discs charcoal, checks on 1–11, no habit labels, small caps
     'QUICK RECAP' (screen-fixed, exits before habit 1's label lands).
     0.16 the camera anticipates (a breath out), 0.28–1.30 one eased glide WHOLE → FOCUS 1; 1.27 'Try': disc 1 mint + label 1.
     1.92 label 1 exits, disc 1 charcoal, glide → FOCUS 2 (small arc lift); 2.50 'Make': disc 2 mint + label 2.
     3.78 → FOCUS 3; 4.34 'Ask': disc 3 + label 3.   4.84 → FOCUS 4; 5.31 'explain': disc 4 + label 4.
     6.00 → FOCUS 5 down the turn (x swings out and back); 6.57 'quiz': disc 5 + label 5 (below the disc).
     Hold: exam glyph ticks on 'yourself' (6.81; the ? ticks on 'questions' 3.62), neighbours 4 / 6 / 3 breathe 2 px back to rest, a tiny push 1 → 1.012 → 1
     that returns to EXACTLY FOCUS 5 (1647, 732, 1.2) on the last frame (m13_recap opens on it). Only one label on screen. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>m12_recap</title>
    <link rel="stylesheet" href="board.css" />
    <link rel="stylesheet" href="v7yt.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="board.js"></script>
    <script src="v7yt.js"></script>
    <script src="chain_common.js"></script>
    <style>
      #recap-kicker { position: absolute; left: 177px; top: 104px; white-space: nowrap; font-family: "Inter", sans-serif;
        font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    </style>
  </head>
  <body data-theme="light">
    <div id="root" class="mint" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="7.466">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch"></div></div>
      <div id="recap-kicker">Quick recap</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const B = await Board.init();
        const V = V7Y.init(B);
        const { tl, D, F } = B;
        const LAST = 223 / 30;                                 // time of the last rendered frame (224 frames)

        // ---------------- chain at its episode end: all charcoal, checks on 1–11, no labels ----------------
        const ALL = Array.from({ length: 11 }, (_, i) => i + 1);
        const C = buildChain(V, B, { current: 0, done: ALL, labels: [] });

        // ---------------- camera: one pure function of time (seek-safe), applied by a clock ----------------
        const E = (n) => gsap.parseEase(n);
        const e2io = E("power2.inOut"), e3io = E("power3.inOut"), esout = E("sine.out"), esio = E("sine.inOut");
        const cl = (v) => Math.max(0, Math.min(1, v));
        const PW = C.pose("whole"), P = [null, C.pose(1), C.pose(2), C.pose(3), C.pose(4), C.pose(5)];
        // segments: [start, dur, from, to, arc] — x power2.inOut, y + s power3.inOut (different eases = an arc)
        //   arc.lift: cy rises mid-move (horizontal glides); arc.swing: cx swings out mid-move (the vertical turn); arc.zout: breath of zoom-out
        const T_ANT = 0.16, ANT = 0.012;                       // anticipation: tiny pull-back before the first glide
        const SEGS = [
          [0.28, 1.02, PW, P[1], { lift: 0, swing: 0, zout: 0 }],
          [1.92, 0.64, P[1], P[2], { lift: 14, swing: 0, zout: 0.025 }],
          [3.78, 0.62, P[2], P[3], { lift: 14, swing: 0, zout: 0.025 }],
          [4.84, 0.60, P[3], P[4], { lift: 14, swing: 0, zout: 0.025 }],
          [6.00, 0.66, P[4], P[5], { lift: 0, swing: 30, zout: 0.04 }],
        ];
        const T_END = SEGS[4][0] + SEGS[4][1];
        function camPose(t) {
          if (t >= LAST) return P[5].slice();
          if (t < SEGS[0][0]) {                                // WHOLE hold + anticipation (a breath out, sine)
            const u = cl((t - T_ANT) / (SEGS[0][0] - T_ANT));
            return [PW[0], PW[1], PW[2] * (1 - ANT * esout(u))];
          }
          for (let i = 0; i < SEGS.length; i++) {
            const [t0, dur, A, Bp, arc] = SEGS[i];
            const nextT = i + 1 < SEGS.length ? SEGS[i + 1][0] : Infinity;
            if (t >= t0 && t < nextT) {
              if (t >= t0 + dur) {                             // holding on the target
                if (i === SEGS.length - 1) {                   // final alive hold: 1 → 1.012 → 1, zero velocity at both ends
                  const u = cl((t - T_END) / (LAST - T_END));
                  return [Bp[0], Bp[1], Bp[2] * (1 + 0.012 * (1 - Math.cos(2 * Math.PI * u)) / 2)];
                }
                return Bp.slice();
              }
              const u = cl((t - t0) / dur), px = e2io(u), py = e3io(u), bell = Math.sin(Math.PI * px);
              const A2 = i === 0 ? A[2] * (1 - ANT) : A[2];    // the first glide starts from the anticipation pose
              const cx = A[0] + (Bp[0] - A[0]) * px + arc.swing * bell;
              const cy = A[1] + (Bp[1] - A[1]) * py - arc.lift * bell;
              const s = (A2 + (Bp[2] - A2) * py) * (1 - arc.zout * bell);
              return [cx, cy, s];
            }
          }
          return P[5].slice();
        }
        const applyCam = (t) => B.camSet(...camPose(t));
        applyCam(0);
        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => applyCam(clock.t) }, 0);

        // ---------------- 'quick recap' kicker: on at frame 0, exits as the camera arrives on habit 1 ----------------
        B.out("#recap-kicker", 1.02, { dur: 6 * F, to: "up" });

        // ---------------- the five habits, on his words ----------------
        // [habit, mint + label time (his word), leave time (label exits, disc back to charcoal) or null]
        const BEATS = [[1, 1.27, 1.92], [2, 2.50, 3.78], [3, 4.34, 4.84], [4, 5.31, 6.00], [5, 6.57, null]];
        for (const [n, tOn, tOff] of BEATS) {
          C.mintTo(n, tOn);
          C.label(n, tOn);
          const g = C.ch.glyphs[n - 1];                        // the glyph answers the punch (secondary action)
          tl.to(g, { scale: 1.14, duration: 4 * F, ease: "power2.out" }, tOn + F);
          tl.to(g, { scale: 1, duration: 7 * F, ease: "power2.inOut" }, tOn + 5 * F);
          if (tOff !== null) { C.labelOut(n, tOff); C.charcoalTo(n, tOff); }
        }

        // glyph ticks keep the holds alive: question mark on 'questions' (3.62), exam on 'yourself' (6.81)
        [[1, 3.62], [4, 6.81]].forEach(([i, t]) => {
          const g = C.ch.glyphs[i];
          tl.to(g, { rotation: -10, duration: 4 * F, ease: "power2.out" }, t);
          tl.to(g, { rotation: 5, duration: 4 * F, ease: "power2.inOut" }, t + 4 * F);
          tl.to(g, { rotation: 0, duration: 6 * F, ease: "power2.inOut" }, t + 8 * F);
        });

        // ---------------- hold alive: neighbours breathe 2 px (scale 1.0267 on d 150), back to 1 before the end ----------------
        [4, 6, 3].forEach((n, i) => {
          const el = C.disc(n), t = 6.74 + i * 2 * F;
          tl.to(el, { scale: 1 + 4 / 150, duration: 0.24, ease: "sine.inOut" }, t);
          tl.to(el, { scale: 1, duration: 0.24, ease: "sine.inOut" }, t + 0.24);
        });
      })();
    </script>
  </body>
</html>
