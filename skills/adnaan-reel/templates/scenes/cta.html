<!doctype html>
<!-- adnaan-reel scene starter: CTA — 'Comment "X"' giant in accent (in quotes), a dotted loop down to the MODE A split band,
     a "→ your inbox" pill; the end hold (freeze) stays alive: float, breathe, marching dots. Last scene = padded speaker clip. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>cta</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
  </head>
  <body data-face="0.43">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="5.500">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <div class="line sup" data-x="76" data-base="1066" data-size="96">
          <span class="w" data-t="0.3" data-pop>Comment</span>
        </div>
        <div id="word" class="line hero ocean" data-x="70" data-base="1250" data-size="200" data-fit="900">
          <span class="w" data-t="0.8" data-hero data-peak="1.1" data-punch="0.8">“reverse”</span>
        </div>

        <svg class="paths"><path id="loop" class="dotted" d="M 520 700 C 560 820, 900 820, 880 950 C 860 1060, 600 1030, 600 1120" /></svg>

        <!-- MODE A (v6): his footage edge to edge in the TOP half (no border/shadow/tilt/float); the paper below is yours:
             content band y 1000–1480, keep x <= 900 below y 1200 (IG icons). P.splitOut / P.splitIn switch modes mid-scene. -->
        <div id="spk" class="spk split" data-h="960">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="5.500" data-track-index="1"></video></div>
          </div>
        </div>
        <div class="line sup kin" data-x="76" data-base="1440" data-size="90">
          <span class="w" data-t="2.2">and</span><span class="w gap-s" data-t="2.4">I'll</span><span class="w gap-s" data-t="2.6">send</span><span class="w gap-s" data-t="2.8">it</span>
        </div>
        <div id="inbox" class="pill" style="left: 560px; top: 1400px"><svg viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>your inbox</div>

      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);   // hand-drawn marker layer (hf/marker.js header): loops, underlines, arrows, highlighter, notes
        const { tl, D, F } = P;
        P.drawPath("#loop", 1.1, 0.6);
        P.marchPath("#loop", 1.1, D - 1.1);
        P.pillIn("#inbox", 3.1);
        P.breathe("#word", 1.015);           // the end hold stays alive
      })();
    </script>
  </body>
</html>
