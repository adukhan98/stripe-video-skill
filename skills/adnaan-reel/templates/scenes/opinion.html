<!doctype html>
<!-- adnaan-reel scene starter: OPINION / VERDICT — he is the subject: MODE A split band (top half), words on his chest;
     a struck-through word with a ✗ pill, then the accent word with a ✓ pill. Replace words/timings. Keep data-duration. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>opinion</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
  </head>
  <body data-face="0.43">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="5.000">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <!-- MODE A (v6): his footage edge to edge in the TOP half (no border/shadow/tilt/float); the paper below is yours:
             content band y 1000–1480, keep x <= 900 below y 1200 (IG icons). P.splitOut / P.splitIn switch modes mid-scene. -->
        <div id="spk" class="spk split" data-h="960">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="5.000" data-track-index="1"></video></div>
          </div>
        </div>

        <div class="line sup kin" data-x="76" data-base="1180" data-size="96" data-exit="2.3">
          <span class="w" data-t="0.3">it's</span><span class="w gap-s" data-t="0.5">not</span>
          <span class="w hero ink gap-s" style="font-size: 160px" data-t="0.9" data-hero data-strike="1.25">perfect</span>
        </div>
        <div id="no" class="pill" style="left: 600px; top: 1260px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>not yet</div>

        <div class="line sup kin" data-x="76" data-base="1200" data-size="96">
          <span class="w" data-t="2.6">but</span><span class="w gap-s" data-t="2.8">it's</span>
        </div>
        <div class="line hero ocean kin" data-x="76" data-base="1420" data-size="220" data-fit="880">
          <span class="w" data-t="3.3" data-hero data-peak="1.1" data-punch="3.3" data-underline="3.45">insane</span>
        </div>
        <div id="yes" class="pill" style="left: 500px; top: 1115px"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" stroke="var(--brand-primary)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>works</div>

      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);   // hand-drawn marker layer (hf/marker.js header): loops, underlines, arrows, highlighter, notes
        P.pillIn("#no", 1.35);
        P.exitDown("#no", 2.3);
        P.pillIn("#yes", 3.6);
      })();
    </script>
  </body>
</html>
