<!doctype html>
<!-- adnaan-reel scene starter: FULL-SCREEN SPEAKER — HE fills the frame edge to edge (no card, no tilt), kinetic
     words land low on his chest / the bottom third with the paper glow. The minimal beat: nothing else on screen
     unless the brief names ONE object. Use for the hook, verdict/opinion lines, the wrap-up, the CTA — 2–4 per reel,
     alternating with paper-world scenes. (flashcheck knows this window is not paper: type "fullscreen" in slots.json.)
     Optional: add <div class="paper-strip"></div> before the words if the background behind the words is busy.
     Optional mid-scene version: start as a portrait card and call P.growFull("#spk", t) on the hero word. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>fullscreen</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
  </head>
  <body data-face="0.43">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="5.000">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>

      <!-- full-screen speaker: the whole frame, slow push only -->
      <div id="spk" class="spk full" data-push="1.03">
        <div class="spk-card">
          <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="5.000" data-track-index="1"></video></div>
        </div>
      </div>

      <div id="cam"><div id="punch">
        <!-- words sit in the bottom third, on his chest, never over the face (face ≈ y 500–1000 in the source) -->
        <div class="line sup kin" data-x="76" data-base="1500" data-size="100" data-exit="2.4">
          <span class="w" data-t="0.3">this</span><span class="w gap-s" data-t="0.5">is</span><span class="w gap-s" data-t="0.7">the</span>
        </div>
        <div class="line hero ocean kin" data-x="76" data-base="1720" data-size="230" data-fit="900" data-exit="2.4" data-exit-lag="2">
          <span class="w" data-t="1.1" data-hero data-peak="1.1" data-punch="1.1">point</span>
        </div>
        <div class="line sup kin" data-x="76" data-base="1500" data-size="100">
          <span class="w" data-t="2.7">and</span><span class="w gap-s" data-t="2.9">nothing</span>
        </div>
        <div class="line hero ink kin" data-right="1000" data-base="1720" data-size="200" data-fit="900">
          <span class="w" data-t="3.4" data-hero>else</span>
        </div>
      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);   // hand-drawn marker layer (hf/marker.js header): loops, underlines, arrows, highlighter, notes
        const { tl, D, F } = P;
        // nothing else: the minimal beat. (If the brief names one object, add it here, small, bottom-right.)
      })();
    </script>
  </body>
</html>
