<!doctype html>
<!-- adnaan-reel scene starter: HOOK — text hook on frame 0 + MODE A split band + kinetic phrases on his chest
     + one bespoke object (here: an isometric app-tile stack that explodes on the payoff word).
     Runtime: paper.css/paper.js do the world, card, words, exits, floats. You write: the copy (from words.txt),
     positions/sizes, and the hero object's timeline. Keep data-duration (preset = exact frame count). -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>hook</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
    <style>
      /* ---- bespoke object: isometric app tiles (hero idea of this scene) ---- */
      #tiles { position: absolute; left: 800px; top: 1374px; width: 0; height: 0; perspective: 2200px; }
      #iso { position: absolute; left: -70px; top: -70px; width: 140px; height: 140px; transform-style: preserve-3d; transform: rotateX(58deg) rotateZ(-45deg) scale(1.5); }
      .tile { position: absolute; inset: 0; transform-style: preserve-3d; }
      .tile .lay { position: absolute; inset: 0; border-radius: 30px; }
      .tile .side { background: #cfc8c0; transform: translateZ(-15px); }
      .tile .side2 { background: #d9d3cc; transform: translateZ(-8px); }
      .tile.deep .side { background: #061820; } .tile.deep .side2 { background: #08202a; }
      .tile .face { background: var(--brand-card); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
      .tile.deep .face { background: var(--brand-deep); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
      .tile .g { position: absolute; border-radius: 6px; background: var(--wire); }
      .tile.deep .g { background: rgba(255, 255, 255, 0.16); }
      .tile .g.acc { background: var(--brand-primary); }
      #tiles .ground { left: -110px; top: -110px; width: 212px; height: 212px; border-radius: 60px; }
    </style>
  </head>
  <body data-face="0.43">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="4.433" data-strength="subtle">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <!-- FRAME 0 = THE THUMBNAIL: only finished, true content (no random/transient numbers, nothing mid-entrance).
             TEXT HOOK (user-written; readable on frame 0, stays the whole scene) -->
        <div class="layer" data-breathe="1.01">
          <div class="line hero" data-x="76" data-base="1046" data-size="80"><span>Software</span><span class="gap-s">is</span></div>
          <div class="line hero ocean" data-right="940" data-base="1166" data-size="150"><span data-underline="0">cooked</span></div>
          <div class="line hero" data-x="84" data-base="1252" data-size="80"><span>and</span><span class="gap-s">finished</span></div>
        </div>

        <!-- MODE A split band: on screen from frame 0 (data-at omitted), face centred by data-face -->
        <!-- MODE A (v6): his footage edge to edge in the TOP half (no border/shadow/tilt/float); the paper below is yours:
             content band y 1000–1480, keep x <= 900 below y 1200 (IG icons). P.splitOut / P.splitIn switch modes mid-scene. -->
        <div id="spk" class="spk split" data-h="960">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="4.433" data-track-index="1"></video></div>
          </div>
        </div>

        <!-- KINETIC WORDS = words.txt, landing on the sweatshirt (class kin = paper glow). data-exit clears a phrase. -->
        <div class="line sup kin" data-x="76" data-base="1352" data-size="96" data-exit="0.68">
          <span class="w" data-t="0.13">is</span><span class="w gap-s" data-t="0.20">it</span>
        </div>
        <div class="line kin" data-x="74" data-base="1462" data-size="176" data-exit="0.68" data-exit-lag="2">
          <span class="w hero ink" data-t="0.56" data-accent data-rise="6">possible</span>
        </div>
        <div class="line hero ocean kin" data-x="74" data-base="1452" data-size="170" data-exit="1.62">
          <span class="w" data-t="1.08" data-hero data-rise="40" data-origin="30% 85%" data-peak="1.08" data-punch="1.0">reverse</span>
        </div>
        <div class="line hero ink kin" data-right="936" data-base="1462" data-size="120" data-exit="1.62" data-exit-lag="2">
          <span class="w" data-t="1.44" data-pop data-rise="8" data-origin="60% 80%">engineer</span>
        </div>
        <div class="line sup kin" data-x="76" data-base="1458" data-size="96" data-exit="2.92">
          <span class="w" data-t="1.88" data-rise="24">all</span><span class="w gap-s" data-t="2.08" data-rise="24">the</span>
          <span class="w hero ocean" style="margin-left: 0.12em; font-size: 190px" data-t="2.32" data-hero data-rise="30" data-origin="35% 80%" data-peak="1.08">apps</span>
        </div>
        <div class="line sup kin" data-x="78" data-base="1360" data-size="70">
          <span class="w" data-t="3.25" data-rise="24">every</span><span class="w gap-s" data-t="3.85" data-rise="24">single</span>
        </div>
        <div class="line hero ocean kin" data-x="76" data-base="1462" data-size="150">
          <span class="w" data-t="4.29" data-hero data-rise="30" data-peak="1.10">day?</span>
        </div>

        <!-- BESPOKE OBJECT: app-tile stack (built in the script) -->
        <div id="tiles"><div class="ground"></div><div id="iso"></div></div>

      </div></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);   // hand-drawn marker layer (hf/marker.js header): loops, underlines, arrows, highlighter, notes
        const { tl, D, F, $, $$ } = P;

        // ---- build 5 tiles (wireframe glyphs, no logos); top one is deep and explodes into layers on "day?"
        const iso = $("#iso");
        const glyphs = [
          [[30, 30, 80, 14], [30, 56, 50, 14], [30, 82, 64, 14]],
          [[28, 28, 36, 36, 1], [76, 28, 36, 36], [28, 76, 84, 14]],
          [[30, 30, 80, 14, 0, 1], [30, 56, 80, 14], [30, 82, 40, 14]],
          [[28, 28, 84, 84, 1]],
          [[30, 34, 80, 12], [30, 60, 80, 12], [30, 86, 80, 12]],
        ];
        const tiles = glyphs.map((gl, i) => {
          const t = document.createElement("div");
          t.className = "tile" + (i === 4 ? " deep" : "");
          t.innerHTML = `<div class="lay side"></div><div class="lay side2"></div><div class="lay face">${gl
            .map(([x, y, w, h, round, acc]) => `<i class="g${round ? " round" : ""}${acc ? " acc" : ""}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`).join("")}</div>`;
          gsap.set(t, { z: i * 25, opacity: 0 });
          iso.appendChild(t);
          return t;
        });
        // tiles drop in on "every" (3.25): 3 f stagger, each from above with squash-free settle (cards: no squash)
        tiles.forEach((t, i) => {
          const s = 3.14 + i * 3 * F;
          tl.fromTo(t, { opacity: 0, z: i * 25 + 160, x: -40 }, { opacity: 1, z: i * 25, x: 0, duration: 0.3, ease: "power3.out" }, s);
          tl.fromTo(t, { scale: 1.08 }, { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, s + 0.1);
        });
        tl.fromTo("#tiles .ground", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 3.2);
        // anticipation on "single" (3.85): the top tile lifts and sinks back
        tl.to(tiles[4], { z: 4 * 25 + 40, duration: 0.14, ease: "power2.out" }, 3.74).to(tiles[4], { z: 4 * 25, duration: 0.2, ease: "power2.in" }, 3.88);
        // exaggeration on "day?" (4.29): the top tile explodes into its three layers, 2 f apart (overlap)
        const lays = $$(".lay", tiles[4]);
        lays.forEach((l, k) => tl.to(l, { z: 30 + k * 34, duration: 0.3, ease: "back.out(1.8)" }, 4.22 + k * 2 * F));
        P.shake(4.29, 2);
        // secondary action: the stack breathes while it holds
        tl.fromTo("#tiles", { y: 0 }, { y: -4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.3);
      })();
    </script>
  </body>
</html>
