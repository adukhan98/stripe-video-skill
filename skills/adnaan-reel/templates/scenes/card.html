<!doctype html>
<!-- adnaan-reel v7 starter: CARD — he is present while a visual plays: full-screen at first, then the SIGNATURE SHRINK
     into the small rounded card (LEFT side only, ~360×460, mint ring; never bottom-right — IG icons) and the board
     fills the rest; V.grow brings him back full-screen on the payoff line. 0–2 card beats per reel. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>scene</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="v7.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="v7.js"></script>
    <style>
      @font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
    </style>
  </head>
  <body data-face="0.40">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="5.000">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="world" class="v7-world"></div>

      <div id="spk" class="spk full" data-push="1">
        <div class="spk-card">
          <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="5.000" data-track-index="1"></video></div>
        </div>
      </div>

      <div id="cam"><div id="punch">
        <div class="line hero ocean" data-x="470" data-base="560" data-size="180" data-fit="460">
          <span class="w" data-t="1.0" data-hero>hero</span>
        </div>
      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init();
        const V = V7.init(P);
        const { tl, D, F, $ } = P;
        const CARD = { x: 80, y: 330, w: 360, h: 460, r: 34 };
        V.shrink("#spk", 0.4, { to: CARD });                // full → card (left, top)
        // the visual plays to the right/below the card (world layer) …
        // V.grow("#spk", D - 0.8, { from: CARD });          // … and he grows back for the payoff line
      })();
    </script>
  </body>
</html>
