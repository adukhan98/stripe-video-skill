<!doctype html>
<!-- adnaan-reel scene starter: BLANK (v6 Mode B) — the world + kinetic words + the doodle you invent, no speaker.
     Use when no other starter fits: add the scene's bespoke hero object in the <style> and the script. Keep data-duration. -->

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>scene</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <style>
      /* bespoke object styles go here (soft shadows, no outlines, brand tokens only) */
    </style>
  </head>
  <body data-face="0.43">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="5.000">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <!-- MODE B (v6): no speaker — the doodles, kinetic type and cards own the whole zone (x 60–960, y 285–1480).

             cards (.spk small/secondary) are allowed but rare — 0–2 per reel. -->

        <!-- paste from words.html; words over the card get class="kin" (never over the face) -->
        <div class="line sup kin" data-x="76" data-base="1200" data-size="96">
          <span class="w" data-t="0.3">first</span><span class="w gap-s" data-t="0.5">words</span>
        </div>
        <div class="line hero ocean kin" data-x="76" data-base="1420" data-size="220" data-fit="880">
          <span class="w" data-t="1.0" data-hero data-punch="1.0">hero</span>
        </div>

      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);   // hand-drawn marker layer (hf/marker.js header): loops, underlines, arrows, highlighter, notes
        const { tl, D, F, $, $$ } = P;
        // bespoke hero object timeline here (key poses on words; anticipation → overshoot → settle; arcs; one focal point)
      })();
    </script>
  </body>
</html>
