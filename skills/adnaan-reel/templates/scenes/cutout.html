<!doctype html>
<!-- adnaan-reel scene starter: CUTOUT (v6 Mode C) — he stands on the bottom edge of the frame, background removed
     (assets/speaker_cut.webm, made by `scenes.py cut-speaker` with `hyperframes remove-background` for type "cutout"),
     IN FRONT of a big real page / screenshot card. The page title or hero line stays fully readable above his head;
     words sit on paper/page where they never cross his face. Replace the page, words, timings. Keep data-duration. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>cutout</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
    <style>
      /* the real page: a big browser card behind him (capture.py strip/page; ≥ 0.7 scale so the title reads) */
      #page { position: absolute; left: 88px; top: 310px; width: 900px; height: 1100px; }
      .mk-hl path { fill: none !important; }
    </style>
  </head>
  <body data-face="0.43">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="5.000">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <!-- the REAL page, big (behind him) -->
        <div id="page" class="browser">
          <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">example.com</span></div>
          <div class="viewport"><img id="pageimg" class="page" src="assets/page.png" alt="" /></div>
        </div>

        <!-- MODE C cutout: full width keeps the crop lines on the frame edges; data-drop pushes him down so the title
             above his head stays clear. Check the matte edge on your sheet (hair, ears) against the page. -->
        <div id="spk" class="spk cutout" data-w="1080" data-x="0" data-drop="380">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker_cut.webm" muted playsinline data-start="0" data-duration="5.000" data-track-index="1"></video></div>
          </div>
        </div>

        <!-- words on paper/page, above his head (never across the face), nothing below y 1480 -->
        <div class="line sup" data-x="96" data-base="760" data-size="110" data-exit="2.4">
          <span class="w" data-t="0.6">an</span><span class="w gap-s" data-t="0.8">article</span>
        </div>
        <div class="line hero ocean" data-x="96" data-base="770" data-size="190" data-fit="860">
          <span class="w" data-t="2.6" data-hero data-peak="1.08">called</span>
        </div>

      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);   // highlighter behind the spoken phrase on the page: M.highlight($("#page .viewport"), [x, y, w, h], t)
        const { tl, $ } = P;
        P.cardIn("#page", 0.4);
        // e.g. scroll the page to the next strip on a later sentence:  P.scrollPage("#pageimg", t, dur, px)
      })();
    </script>
  </body>
</html>
