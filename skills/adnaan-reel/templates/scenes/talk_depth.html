<!doctype html>
<!-- adnaan-reel v7 starter: TALK + DEPTH ("behind me") — the full-screen footage, then objects/words in .v7-behind,
     then his MATTE (assets/speaker_cut.webm: the same window with the background removed; cut-speaker makes it for this
     type) with IDENTICAL data-push, then words in front. Things in .v7-behind read as behind his head/shoulders; slide
     them out from behind him on their word (the matte occludes them on the way). Never cover his face; anything that
     must stay readable (name tags) goes in front. reel-08's approved hook (CEO cards behind him) is the reference. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>scene</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="v7.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="v7.js"></script>
    <style>
      @font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
    </style>
  </head>
  <body data-face="0.40">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="5.000">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>

      <div id="spk" class="spk full" data-push="1.02">
        <div class="spk-card">
          <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="5.000" data-track-index="1"></video></div>
        </div>
      </div>

      <!-- BEHIND HIM: between the footage and his matte -->
      <div id="behind" class="v7-behind">
        <!-- e.g. photo cards / a giant word / an icon disc that slides out from behind his shoulder -->
      </div>

      <!-- HIS MATTE: same timing + same data-push as #spk -->
      <div id="spkcut" class="spk full matte" data-push="1.02">
        <div class="spk-card">
          <div class="spk-vid"><video id="speakercut" class="clip" src="assets/speaker_cut.webm" muted playsinline data-start="0" data-duration="5.000" data-track-index="2"></video></div>
        </div>
      </div>

      <div id="cam"><div id="punch">
        <div class="line hero ocean g7" data-x="80" data-base="1440" data-size="210" data-fit="820">
          <span class="w" data-t="1.0" data-hero data-punch="1.0">hero</span>
        </div>
      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init();
        const V = V7.init(P);
        const { tl, D, F, $ } = P;
        // slide objects in #behind out from behind his head on their word: start them near his head centre
        // (V.faceRect() gives it in source px) and move outward with anticipation + overshoot.
      })();
    </script>
  </body>
</html>
