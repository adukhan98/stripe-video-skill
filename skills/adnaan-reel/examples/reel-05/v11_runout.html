<!doctype html>
<!-- adnaan-reel scene: v11_runout — OPINION with a bespoke drain gauge. Portrait card left, a tall tank card of
     person icons right; from "run" they drop out of the bottom one by one (arms flailing) while the liquid sloshes
     down to zero; the tank coughs a dust puff and blinks grey; a tiny wrench taps "AI" with sparks. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v11_runout</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <style>
      @font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }

      /* ---------- bespoke hero object: the drain gauge (tank of people) ---------- */
      #gfloat { position: absolute; left: 766px; top: 410px; width: 176px; height: 782px; }
      #gwrap { position: absolute; inset: 0; opacity: 0; }
      #gauge { position: absolute; inset: 0; opacity: 1; border-radius: 30px; }
      #gdot, #gdot-off { position: absolute; left: 22px; top: 22px; width: 18px; height: 18px; border-radius: 50%; }
      #gdot-off { background: var(--brand-muted); }
      #gdot { background: var(--brand-primary); box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand-primary) 50%, transparent); }
      #tank {
        position: absolute; left: 18px; top: 58px; width: 140px; height: 684px; border-radius: 24px; overflow: hidden;
        background: color-mix(in srgb, var(--brand-background) 60%, var(--brand-card));
        box-shadow: inset 0 8px 16px -6px rgba(60, 50, 40, 0.22), inset 0 -2px 6px rgba(255, 255, 255, 0.6);
      }
      /* liquid: a body + a sine-wave crest (scaled for amplitude, slid for phase) + an accent surface line */
      #fill { position: absolute; left: -70px; top: 0; width: 280px; height: 900px; transform-origin: 50% 0; }
      #fill .body {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        background: linear-gradient(180deg, color-mix(in srgb, var(--brand-primary) 28%, var(--brand-card)) 0px, color-mix(in srgb, var(--brand-primary) 15%, var(--brand-card)) 520px);
      }
      #fill .wave { position: absolute; left: 0; top: -30px; width: 280px; height: 80px; overflow: visible; transform-origin: 50% 30px; }
      #fill .wave .wf { fill: color-mix(in srgb, var(--brand-primary) 28%, var(--brand-card)); }
      #fill .wave .ws { fill: none; stroke: var(--brand-primary); stroke-width: 6; stroke-linecap: round; }
      .ghost { position: absolute; left: 40px; width: 60px; height: 66px; opacity: 0; }
      .ghost svg, .p svg { width: 60px; height: 66px; display: block; overflow: visible; }
      .ghost svg { fill: color-mix(in srgb, var(--brand-text) 11%, transparent); }
      .ghost .arm { display: none; }
      .tk { position: absolute; left: 118px; width: 12px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--brand-text) 14%, transparent); }
      #valve { position: absolute; left: 53px; top: 752px; width: 70px; height: 12px; border-radius: 6px; background: var(--brand-text); }
      #folk { position: absolute; left: 0; top: 0; width: 176px; height: 782px; }
      .p { position: absolute; left: 58px; width: 60px; height: 66px; opacity: 0; }
      .p svg { fill: var(--brand-deep); filter: drop-shadow(2px 5px 5px rgba(13, 39, 49, 0.25)); }
      .p .arm { fill: none; stroke: var(--brand-deep); stroke-width: 7; stroke-linecap: round; opacity: 0; }
      .puff { position: absolute; border-radius: 50%; opacity: 0; background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--brand-muted) 55%, var(--brand-card)), color-mix(in srgb, var(--brand-muted) 30%, transparent) 70%); }
      /* "out" letters drain individually */
      .lt { display: inline-block; }
      .ai-in { display: inline-block; transform-origin: 50% 90%; }
      /* tiny wrench + sparks that tap "AI" */
      #wrench { position: absolute; left: 858px; top: 1270px; width: 96px; height: 96px; opacity: 0; }
      #wrench svg { width: 96px; height: 96px; display: block; overflow: visible; filter: drop-shadow(3px 7px 6px rgba(40, 30, 20, 0.28)); }
            .spark { position: absolute; width: 0; height: 0; }
      .spark i { position: absolute; left: -3px; top: -30px; width: 6px; height: 18px; border-radius: 3px; background: var(--brand-primary); opacity: 0; transform-origin: 50% 100%; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
  </head>
  <body data-face="0.47">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="5.1167">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <div class="spk portrait" data-x="64" data-y="392" data-w="680" data-h="780">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="5.1167" data-track-index="1"></video></div>
            <div class="spk-sheen"></div>
          </div>
        </div>

        <!-- the drain gauge: a tall soft tank card of people (no label, no numbers) -->
        <div id="gfloat" data-float="3" data-float-period="1.4">
          <div id="gwrap">
            <div id="gauge" class="uicard">
              <div id="gdot-off"></div><div id="gdot"></div>
              <div class="g" style="left: 52px; top: 26px; width: 84px; height: 10px"></div>
              <div id="tank">
                <div id="fill">
                  <div class="body"></div>
                  <svg class="wave" viewBox="0 0 280 80"><g id="wavex"><path class="wf" /><path class="ws" /></g></svg>
                </div>
                <div class="tk" style="top: 82px"></div><div class="tk" style="top: 172px"></div><div class="tk" style="top: 262px"></div>
                <div class="tk" style="top: 352px"></div><div class="tk" style="top: 442px"></div><div class="tk" style="top: 532px"></div>
                <div id="ghosts"></div>
              </div>
              <div id="valve"></div>
            </div>
            <!-- people: built below, DOM order bottom (0) → top (6); outside the card so they can fall out of it -->
            <div id="folk"></div>
            <div id="puffs"></div>
          </div>
        </div>

        <!-- top row: "Even with all that,"; "I think" waits in the lower zone where "of people" will land -->
        <div id="even" class="line sup" data-x="64" data-base="368" data-size="84" data-exit="3.72" data-exit-dy="-14">
          <span class="w" data-t="0.16">Even</span><span class="w gap-s" data-t="0.38">with</span><span class="w gap-s" data-t="0.56">all</span><span class="w gap-s" data-t="0.84">that,</span>
        </div>
        <div id="ithink" class="line sup" data-x="150" data-base="1442" data-size="84" data-exit="2.14" data-exit-dy="-16">
          <span class="w" data-t="1.16" data-rise="26">I</span><span class="w gap-s" data-t="1.38" data-rise="26">think</span>
        </div>

        <!-- hero: run out (accent), of people -->
        <div class="line hero ocean kin" data-x="64" data-base="1344" data-size="230" data-fit="880">
          <span class="w" data-t="1.92" data-hero>run</span><span id="out" class="w gap-s" data-t="2.24" data-hero data-peak="1.1"><span class="lt">o</span><span class="lt">u</span><span class="lt">t</span></span>
        </div>
        <div class="line sup" data-x="150" data-base="1442" data-size="112" data-exit="3.62" data-exit-dy="-18">
          <span class="w" data-t="2.46" data-rise="26">of</span><span class="w gap-s" data-t="2.70" data-pop data-rise="14">people</span>
        </div>

        <!-- lower zone: implement AI (a tiny wrench taps it) -->
        <div class="line sup" data-right="940" data-base="1440" data-size="110">
          <span class="w" data-t="4.00" data-rise="16">implement</span><span id="ai" class="w hero ocean gap-s" data-t="4.28" data-pop data-rise="30"><span class="ai-in">AI</span></span>
        </div>
        <div id="wrench">
          <svg viewBox="0 0 80 80">
            <defs><mask id="wmask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="120"><rect x="-20" y="-20" width="120" height="120" fill="white" /><rect x="16" y="-6" width="12" height="27" rx="2" fill="black" transform="rotate(-45 22 22)" /></mask></defs>
            <g class="wtap"><g transform="rotate(-90 40 40)"><g mask="url(#wmask)" style="fill: var(--brand-text)"><circle cx="22" cy="22" r="17" /><rect x="16" y="22" width="12" height="56" rx="6" transform="rotate(-45 22 22)" /></g></g></g>
          </svg>
        </div>
        <div id="sparks"></div>

      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        // ---- build the repeated parts once (deterministic DOM) before the runtime lays out and wires the timeline
        const PERSON = `<svg viewBox="0 0 60 66"><path class="arm l" d="M13 44 L1 27"/><path class="arm r" d="M47 44 L59 27"/><circle cx="30" cy="16" r="14"/><path d="M4 64c0-19 11-29 26-29s26 10 26 29z"/></svg>`;
        const tops = [662, 572, 482, 392, 302, 212, 122];
        document.getElementById("folk").innerHTML = tops.map((t) => `<div class="p" style="top:${t}px">${PERSON}</div>`).join("");
        document.getElementById("ghosts").innerHTML = tops.map((t) => `<div class="ghost" style="top:${t - 58}px">${PERSON}</div>`).join("");
        const PUFFS = [[-52, 18, 34], [-24, 34, 40], [6, 42, 46], [36, 30, 38], [60, 14, 30], [-8, 20, 28]];
        document.getElementById("puffs").innerHTML = PUFFS.map(([dx, dy, s]) => `<div class="puff" data-dx="${dx}" data-dy="${dy}" style="left:${88 - s / 2}px;top:${758 - s / 2}px;width:${s}px;height:${s}px"></div>`).join("");
        // the wave crest: a sine (λ 70, A 8) long enough to slide ~7 wavelengths
        const LAM = 70, A = 8, WW = 280 + 7 * LAM;
        let pts = [];
        for (let x = 0; x <= WW; x += 5) pts.push(`${x} ${(30 - A * Math.sin((2 * Math.PI * x) / LAM)).toFixed(2)}`);
        document.querySelector("#wavex .ws").setAttribute("d", "M" + pts.join(" L"));
        document.querySelector("#wavex .wf").setAttribute("d", "M" + pts.join(" L") + ` L${WW} 80 L0 80 Z`);
        // sparks: three short rays fanning out of the tap point on "AI"
        document.getElementById("sparks").innerHTML = [-58, -12, 34].map((r) => `<div class="spark" style="left:900px;top:1364px;transform:rotate(${r}deg)"><i></i></div>`).join("");

        const P = await Paper.init();
        const { tl, D, F, $, $$ } = P;
        const folk = $$("#folk .p"), ghosts = $$("#tank .ghost");
        const TANK_H = 684, FULL = 40;           // fill y (tank px): FULL = brim above the top icon, TANK_H - 6 = zero line

        // 1) the gauge card arrives beside him (heavy: 16 f, tilts into travel, settles)
        P.cardIn("#gwrap", 0.24, { fromY: 110, rot: 3 });
        // 2) "with all that": the tank fills — people pop in bottom-up (3 f stagger), the liquid rises under them
        folk.forEach((p, i) => P.pop(p, 0.52 + i * 3 * F, { peak: 1.12, from: 0.3 }));
        ghosts.forEach((g, i) => tl.set(g, { opacity: 1 }, 0.52 + i * 3 * F));
        tl.fromTo("#fill", { y: TANK_H + 30 }, { y: FULL, duration: 0.8, ease: "power2.out" }, 0.38);
        // the liquid is never still: the crest travels (continuous → linear), amplitude breathes and reacts
        tl.fromTo("#wavex", { x: 0 }, { x: -6.5 * LAM, duration: D, ease: "none" }, 0);
        tl.fromTo("#fill .wave", { scaleY: 1.5 }, { scaleY: 0.55, duration: 0.9, ease: "sine.out" }, 0.38)       // pours in choppy, calms
          .to("#fill .wave", { scaleY: 0.8, duration: 0.5, ease: "sine.inOut" }, 1.3)
          .to("#fill .wave", { scaleY: 0.35, duration: 4 * F, ease: "power2.out" }, 1.70)                           // anticipation: it goes still
          .to("#fill .wave", { scaleY: 1.9, duration: 0.18, ease: "power2.out" }, 1.86)                             // the drain churns it
          .to("#fill .wave", { scaleY: 1.4, duration: 0.5, ease: "sine.inOut" }, 2.04)
          .to("#fill .wave", { scaleY: 1.8, duration: 0.12, ease: "power2.out" }, 2.6)                              // slosh as it hits bottom
          .to("#fill .wave", { scaleY: 0.25, duration: 0.7, ease: "power2.out" }, 2.72)
          .to("#fill .wave", { scaleY: 0.12, duration: 1.2, ease: "sine.out" }, 3.42);
        tl.fromTo("#fill", { rotation: 0 }, { rotation: 1.6, duration: 0.42, ease: "sine.inOut" }, 0.7)
          .to("#fill", { rotation: -1.4, duration: 0.42, ease: "sine.inOut" }, 1.12)
          .to("#fill", { rotation: 0.6, duration: 0.36, ease: "sine.inOut" }, 1.54);
        folk.forEach((p, i) => tl.fromTo($("svg", p), { y: 0 }, { y: -4, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.08 + i * 2 * F));

        // 3) anticipation (going to …): people hop up 10 px, top first; the valve slides open
        folk.forEach((p, i) => tl.to(p, { y: -10, duration: 4 * F, ease: "power2.out" }, 1.70 + (6 - i) * F));
        tl.to("#valve", { x: 48, duration: 5 * F, ease: "power3.out" }, 1.78);

        // 4) RUN (whoosh 1.86): they drop out of the bottom one by one (2 f stagger) under gravity, arms flailing,
        //    stretched while falling; once clear of the card they veer right on an arc and fade before the hero words
        const G = 5000, EXIT_Y = 782, LAND = 872;
        folk.forEach((p, i) => {
          const top = parseFloat(p.style.top), t = 1.86 + i * 2 * F;
          const d = LAND - top, T = Math.sqrt(d / G);
          const tauExit = Math.sqrt(Math.max(0, EXIT_Y - 30 - top) / d);   // fraction of the fall when it clears the card
          const dx = 40 + (i % 3) * 14, rot = 16 + (i % 3) * 8;
          gsap.set(p, { transformOrigin: "50% 50%" });
          tl.fromTo(p, { y: -10 }, { y: d - 10, duration: T, ease: "power2.in", immediateRender: false }, t);
          tl.to(p, { scaleX: 0.9, scaleY: 1.12, duration: T * 0.6, ease: "power1.out" }, t);
          tl.to(p, { x: dx, rotation: rot, duration: T * (1 - tauExit) + 0.06, ease: "power1.out" }, t + T * tauExit);
          tl.to(p, { opacity: 0, filter: "blur(4px)", duration: T * (1 - tauExit) + 0.04, ease: "power1.in" }, t + T * tauExit);
          // arms: up on the drop, then flail (alternating, 3 f beats) until they are gone
          const [al, ar] = $$(".arm", p);
          gsap.set(al, { transformOrigin: "100% 100%" }); gsap.set(ar, { transformOrigin: "0% 100%" });
          tl.fromTo([al, ar], { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "power1.out", immediateRender: false }, t);
          tl.fromTo(al, { rotation: -28 }, { rotation: 22, duration: 3 * F, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, t);
          tl.fromTo(ar, { rotation: 28 }, { rotation: -22, duration: 3 * F, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, t + F);
        });
        // the liquid drains with them and hits zero just as the last one leaves …
        tl.to("#fill", { y: TANK_H - 70, duration: 0.7, ease: "power1.in" }, 1.9);
        tl.to("#fill", { y: TANK_H - 6, duration: 0.14, ease: "power2.out" }, 2.6);
        // … and sloshes flat at zero (follow-through)
        tl.to("#fill", { rotation: 4, duration: 0.1, ease: "power2.out" }, 2.6)
          .to("#fill", { rotation: -3, duration: 0.14, ease: "sine.inOut" }, 2.7)
          .to("#fill", { rotation: 1.8, duration: 0.14, ease: "sine.inOut" }, 2.84)
          .to("#fill", { rotation: -0.8, duration: 0.14, ease: "sine.inOut" }, 2.98)
          .to("#fill", { rotation: 0, duration: 0.2, ease: "sine.out" }, 3.12);

        // 5) "out" drains too: its letters sag one by one (3 f apart) and climb back (readable the whole time)
        $$("#out .lt").forEach((l, i) => {
          gsap.set(l, { transformOrigin: "50% 100%" });
          tl.to(l, { y: 12, duration: 5 * F, ease: "power2.in" }, 2.56 + i * 3 * F);
          tl.to(l, { y: 0, duration: 12 * F, ease: "back.out(2.2)" }, 2.56 + i * 3 * F + 5 * F);
        });

        // 6) EMPTY (pop 2.86): the valve coughs a dust puff, the card trembles + squashes, the dot rings then blinks grey
        $$("#puffs .puff").forEach((pf, i) => {
          const dx = +pf.dataset.dx, dy = +pf.dataset.dy;
          gsap.set(pf, { transformOrigin: "50% 50%" });
          tl.fromTo(pf, { opacity: 0, x: 0, y: 0, scale: 0.3 }, { opacity: 0.9, x: dx * 0.6, y: dy * 0.6, scale: 1, duration: 5 * F, ease: "power3.out", immediateRender: false }, 2.84 + i * F);
          tl.to(pf, { opacity: 0, x: dx, y: dy - 10, scale: 1.5, duration: 0.42, ease: "power1.out" }, 2.84 + i * F + 5 * F);
        });
        tl.to("#gauge", { x: 2.5, duration: F, ease: "none" }, 2.86)
          .to("#gauge", { x: -2, duration: F, ease: "none" }, 2.86 + F)
          .to("#gauge", { x: 1.2, duration: F, ease: "none" }, 2.86 + 2 * F)
          .to("#gauge", { x: 0, duration: 2 * F, ease: "power1.out" }, 2.86 + 3 * F);
        P.squash("#gwrap", 2.9, 0.025);
        tl.to("#valve", { x: 0, duration: 6 * F, ease: "power2.inOut" }, 3.0);
        tl.fromTo("#gdot", { boxShadow: "0 0 0 0 color-mix(in srgb, var(--brand-primary) 55%, transparent)" },
          { boxShadow: "0 0 0 16px color-mix(in srgb, var(--brand-primary) 0%, transparent)", duration: 0.45, ease: "power2.out" }, 2.86);
        tl.to("#gdot", { opacity: 0, duration: 0.2, ease: "power1.inOut" }, 3.0);
        [3.3, 3.62].forEach((b) => tl.to("#gdot-off", { opacity: 0.15, duration: 3 * F, yoyo: true, repeat: 1, ease: "power1.inOut" }, b));

        // 7) the ONE hero beat: camera punch on "out"
        P.punch(2.24, { scale: 1.008, origin: "510px 882px" });

        // 8) staging: "Even with all that," and the speaker step back while the hero plays; he returns for "implement AI"
        P.recede("#even", 1.78, { opacity: 0.4, blur: 4 });
        P.recede(".spk", 1.8, { opacity: 0.92, blur: 1.5, scale: 0.985 });
        P.restore(".spk", 3.4, 0.4);
        P.recede("#gwrap", 3.86, { opacity: 0.9, blur: 1, scale: 0.985 });

        // 9) "implement AI": a tiny wrench swings in on an arc (whoosh 4.16) and taps "AI" twice (tick 4.48, ding 4.70)
        tl.fromTo("#wrench", { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "power1.out" }, 4.16);
        P.arc("#wrench", 4.16, { fromX: -50, fromY: -110, dur: 12 * F, tilt: -20 });
        const wt = $("#wrench .wtap");
        gsap.set(wt, { svgOrigin: "62 18" });          // pivot = the handle end
        [4.48, 4.70].forEach((h, k) => {
          tl.to(wt, { rotation: 16, duration: 3 * F, ease: "power2.out" }, h - 6 * F)                 // lift (anticipation)
            .to(wt, { rotation: -14, duration: 3 * F, ease: "power3.in" }, h - 3 * F)                  // strike — contact on h
            .to(wt, { rotation: 0, duration: 8 * F, ease: "back.out(2.4)" }, h);
          tl.fromTo("#ai .ai-in", { y: 0 }, { y: 5, duration: 2 * F, ease: "power2.out", immediateRender: false }, h)     // type: position only, no squash
            .to("#ai .ai-in", { y: 0, duration: 7 * F, ease: "back.out(2.6)" }, h + 2 * F);
          $$("#sparks .spark i").forEach((s, j) => {
            tl.fromTo(s, { opacity: 0, y: 6, scaleY: 0.3 }, { opacity: 1, y: -10 - 4 * k, scaleY: 1, duration: 3 * F, ease: "power3.out", immediateRender: false }, h + j * F * 0.5)
              .to(s, { opacity: 0, y: -22 - 4 * k, scaleY: 0.4, duration: 5 * F, ease: "power1.in" }, h + 3 * F + j * F * 0.5);
          });
        });
        tl.fromTo("#wrench svg", { y: 0 }, { y: -4, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.80);
      })();
    </script>
  </body>
</html>
