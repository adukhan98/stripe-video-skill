<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v07 mengto</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      #cam,
      .beat {
        position: absolute;
        inset: 0;
      }
      .abs {
        position: absolute;
      }
      #b6 {
        z-index: 1;
      }
      #b4 {
        z-index: 2;
      }

      /* ---------- speaker card (secondary size) ---------- */
      #spk-float {
        position: absolute;
        left: 280px;
        top: 310px;
        width: 580px;
        height: 420px;
      }
      #spk-card {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      #vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 30px;
      }
      /* source 1080x1920 scaled to the card width (580 → 1031 tall); window ≈ 24.5–65 % of source height, face centred */
      #speaker {
        position: absolute;
        left: 0;
        top: -253px;
        width: 580px;
        height: 1031px;
        object-fit: cover;
      }
      #sheen {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 45%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }

      /* ---------- coin 04 ---------- */
      #coin4 {
        position: absolute;
        left: 232px;
        top: 742px;
        width: 0;
        height: 0;
      }
      #coin4-flip {
        position: absolute;
        left: -110px;
        top: -110px;
        width: 220px;
        height: 220px;
      }
      .coin-face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 92px;
        letter-spacing: -0.03em;
      }
      .coin-white {
        background: radial-gradient(circle at 35% 30%, #ffffff, #f1eeea 70%);
        box-shadow:
          0 18px 30px rgba(60, 50, 40, 0.22),
          inset 0 -6px 12px rgba(60, 50, 40, 0.06);
        color: var(--brand-text);
      }
      .coin-ocean {
        background: radial-gradient(circle at 35% 30%, #74c6e8, var(--brand-primary) 55%, var(--brand-primary-dark) 100%);
        box-shadow:
          0 20px 34px rgba(31, 126, 168, 0.32),
          inset 0 -8px 14px rgba(13, 39, 49, 0.16);
        color: var(--brand-deep);
        opacity: 0;
      }
      .tick {
        position: absolute;
        border-radius: 2px;
      }
      .coin-white .tick {
        background: #cfc9c2;
      }
      .coin-ocean .tick {
        background: rgba(13, 39, 49, 0.35);
      }

      /* ---------- kinetic serif ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.95;
        letter-spacing: -0.015em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .serif {
        font-family: var(--font-heading);
        font-weight: 600;
        color: var(--brand-text);
      }
      .ital {
        font-family: var(--font-accent);
        font-weight: 700;
        font-style: italic;
        letter-spacing: -0.02em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.24em;
      }

      /* ---------- browser card (real repo page) ---------- */
      #br-float {
        position: absolute;
        left: 170px;
        top: 312px;
        width: 740px;
        height: 690px;
      }
      #br {
        position: absolute;
        inset: 0;
        opacity: 0;
        border-radius: 26px;
        overflow: hidden;
        background: var(--brand-card);
        box-shadow: 0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      .chrome {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 66px;
        background: #f3f0ec;
        display: flex;
        align-items: center;
        padding: 0 22px;
        gap: 10px;
      }
      .chrome i {
        display: block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #d6d0c9;
        flex: none;
      }
      .url {
        margin-left: 14px;
        flex: 1;
        height: 44px;
        border-radius: 22px;
        background: var(--brand-card);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: var(--brand-muted);
      }
      .page {
        position: absolute;
        left: 0;
        right: 0;
        top: 66px;
        bottom: 0;
        overflow: hidden;
        background: #0d1117;
      }
      #br-img {
        position: absolute;
        left: 0;
        top: 0;
        width: 840px;
        height: auto;
        display: block;
      }

      /* ---------- skill chips ---------- */
      .chip {
        position: absolute;
        height: 88px;
      }
      .chip-in {
        position: relative;
        height: 88px;
        padding: 0 34px 0 24px;
        border-radius: 44px;
        background: var(--brand-card);
        box-shadow:
          0 22px 36px -10px rgba(60, 50, 40, 0.32),
          0 4px 10px rgba(60, 50, 40, 0.06);
        display: flex;
        align-items: center;
        gap: 16px;
        white-space: nowrap;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 37px;
        letter-spacing: -0.01em;
        color: var(--brand-text);
      }
      .chip-ocean {
        position: absolute;
        inset: 0;
        border-radius: 44px;
        background: linear-gradient(135deg, #6cc3e8, var(--brand-primary) 55%, var(--brand-primary-dark));
        opacity: 0;
      }
      .chip-ico {
        position: relative;
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #e5e0da;
      }
      .chip-ico::after {
        content: "";
        position: absolute;
        left: 11px;
        top: 12px;
        width: 18px;
        height: 4px;
        border-radius: 2px;
        background: #fbfaf8;
        box-shadow:
          0 7px 0 #fbfaf8,
          0 14px 0 #fbfaf8;
      }
      .chip-ico.play::after {
        left: 15px;
        top: 11px;
        width: 0;
        height: 0;
        border-radius: 0;
        background: none;
        box-shadow: none;
        border-left: 14px solid #fbfaf8;
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
      }
      #chip0 .chip-ico {
        background: var(--brand-text);
      }
      .chip-t {
        position: relative;
      }

      /* ---------- REC card ---------- */
      #rec-pos {
        position: absolute;
        left: 540px;
        top: 730px;
        width: 0;
        height: 0;
      }
      #rec-float {
        position: absolute;
        left: -400px;
        top: -250px;
        width: 800px;
        height: 500px;
      }
      #rec {
        position: absolute;
        inset: 0;
        opacity: 0;
        border-radius: 28px;
        background: var(--brand-card);
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      .rec-bar {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 74px;
        display: flex;
        align-items: center;
        padding: 0 28px;
        gap: 14px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 30px;
        color: var(--brand-text);
      }
      #rec-dot {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #e5484d;
        box-shadow: 0 0 14px rgba(229, 72, 77, 0.55);
      }
      .rec-time {
        position: relative;
        width: 96px;
        height: 36px;
        margin-left: 6px;
        color: var(--brand-muted);
        font-weight: 500;
      }
      .rec-time span {
        position: absolute;
        left: 0;
        top: 0;
        line-height: 36px;
        opacity: 0;
        font-variant-numeric: tabular-nums;
      }
      .rec-dots {
        margin-left: auto;
        display: flex;
        gap: 10px;
      }
      .rec-dots i {
        display: block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #d6d0c9;
      }
      .rec-screen {
        position: absolute;
        left: 22px;
        right: 22px;
        top: 74px;
        bottom: 22px;
        border-radius: 18px;
        overflow: hidden;
        background: #f1eeea;
      }
      #rec-page {
        position: absolute;
        left: 0;
        top: 0;
        width: 756px;
        height: 900px;
      }
      .wf {
        position: absolute;
        border-radius: 10px;
        background: #e5e0da;
      }
      .wf.white {
        background: var(--brand-card);
        box-shadow: 0 10px 20px -8px rgba(60, 50, 40, 0.18);
      }
      .wf.dark {
        background: #cfc8c0;
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 40px;
        height: 48px;
      }

      /* ---------- dotted path ---------- */
      #path-svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }

      /* ---------- agent puck ---------- */
      #puck-pos {
        position: absolute;
        left: 720px;
        top: 960px;
        width: 0;
        height: 0;
      }
      #puck {
        position: absolute;
        left: -125px;
        top: -125px;
        width: 250px;
        height: 250px;
      }
      #puck-glow {
        position: absolute;
        inset: -30px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(46, 156, 203, 0.5) 40%, rgba(46, 156, 203, 0) 70%);
        opacity: 0;
      }
      .ripple {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow:
          0 0 0 5px rgba(46, 156, 203, 0.55),
          0 0 26px 6px rgba(46, 156, 203, 0.35);
        opacity: 0;
      }
      .puck-body {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 28%, #3d3d3d, var(--brand-text) 62%);
        box-shadow:
          0 34px 50px -10px rgba(40, 30, 20, 0.45),
          inset 0 -10px 20px rgba(0, 0, 0, 0.45);
      }
      .bot {
        position: absolute;
        left: 61px;
        top: 74px;
        width: 128px;
        height: 112px;
      }
      .bot-ant {
        position: absolute;
        left: 60px;
        top: 0;
        width: 8px;
        height: 22px;
        border-radius: 4px;
        background: var(--brand-card);
      }
      .bot-ant::before {
        content: "";
        position: absolute;
        left: -5px;
        top: -9px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--brand-card);
      }
      .bot-head {
        position: absolute;
        left: 8px;
        top: 18px;
        width: 112px;
        height: 90px;
        border-radius: 32px;
        background: var(--brand-card);
      }
      .bot-ear {
        position: absolute;
        top: 46px;
        width: 12px;
        height: 34px;
        border-radius: 6px;
        background: var(--brand-card);
      }
      .bot-visor {
        position: absolute;
        left: 13px;
        top: 22px;
        width: 86px;
        height: 46px;
        border-radius: 23px;
        background: var(--brand-deep);
      }
      .eye {
        position: absolute;
        top: 13px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--brand-primary);
        box-shadow: 0 0 12px rgba(46, 156, 203, 0.9);
      }

      /* ---------- built website card ---------- */
      #site-float {
        position: absolute;
        left: 128px;
        top: 318px;
        width: 812px;
        height: 640px;
      }
      #site {
        position: absolute;
        inset: 0;
        opacity: 0;
        border-radius: 28px;
        overflow: hidden;
        background: var(--brand-deep);
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.38);
      }
      #site .chrome {
        background: #f3f0ec;
        height: 62px;
      }
      #site .url-blank {
        margin-left: 14px;
        flex: 1;
        height: 40px;
        border-radius: 20px;
        background: var(--brand-card);
        position: relative;
      }
      #site .url-blank::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 15px;
        width: 200px;
        height: 10px;
        margin-left: -100px;
        border-radius: 5px;
        background: #e5e0da;
      }
      .site-body {
        position: absolute;
        left: 0;
        right: 0;
        top: 62px;
        bottom: 0;
      }
      .blk {
        position: absolute;
        border-radius: 12px;
      }
      .b-white {
        background: var(--brand-card);
      }
      .b-ocean {
        background: linear-gradient(135deg, #5dbbe2, var(--brand-primary) 60%, var(--brand-primary-dark));
      }
      .b-dim {
        background: rgba(228, 222, 217, 0.32);
      }
      .b-tile {
        background: var(--brand-card);
        border-radius: 18px;
        box-shadow: 0 16px 26px -10px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="8.033">
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <!-- ===================== BEAT 1: CHAPTER ===================== -->
        <div id="b1" class="beat">
          <div id="spk-float">
            <div id="spk-card">
              <div id="vid-wrap">
                <video
                  id="speaker"
                  class="clip"
                  src="assets/speaker.mp4"
                  muted
                  playsinline
                  data-start="0"
                  data-duration="1.6"
                  data-track-index="1"
                ></video>
              </div>
              <div id="sheen"></div>
            </div>
          </div>

          <div id="coin4">
            <div id="coin4-flip">
              <div class="coin-face coin-white" id="coin4-w">04</div>
              <div class="coin-face coin-ocean" id="coin4-o">04</div>
            </div>
          </div>

          <div id="c1" class="line serif" data-x="372" data-base="895" data-out="1.18" style="font-size: 96px">
            <span class="bl"></span>
            <span class="w" data-t="0.00">fourth</span>
            <span class="w gap-s" data-t="0.24">one,</span>
          </div>
          <div id="c2" class="line ital ocean" data-x="92" data-base="1140" data-out="1.22" style="font-size: 208px">
            <span class="bl"></span>
            <span class="w" data-t="0.60" data-hero="1" data-origin="30% 85%">Meng&nbsp;To</span>
          </div>
          <div id="c3" class="line serif" data-right="944" data-base="1330" data-out="1.26" style="font-size: 140px">
            <span class="bl"></span>
            <span class="w" data-t="0.88" data-accent="1">skills.</span>
          </div>
        </div>

        <!-- ===================== BEAT 2: BUNCH ===================== -->
        <div id="b2" class="beat">
          <div id="br-float">
            <div id="br">
              <div class="chrome">
                <i></i><i></i><i></i>
                <div class="url">github.com/MengTo/Skills</div>
              </div>
              <div class="page"><img id="br-img" src="assets/mengto.png" alt="" /></div>
            </div>
          </div>
          <div id="chips"></div>

          <div id="k1" class="line serif" data-x="96" data-base="1200" data-out="2.48" style="font-size: 104px">
            <span class="bl"></span>
            <span class="w" data-t="1.58">a</span>
            <span class="w gap-s" data-t="1.66">whole</span>
          </div>
          <div id="k2" class="line ital ocean" data-x="300" data-base="1374" data-out="2.51" style="font-size: 210px">
            <span class="bl"></span>
            <span class="w" data-t="1.80" data-hero="1" data-origin="20% 85%">bunch</span>
          </div>
          <div id="k3" class="line serif" data-right="944" data-base="1468" data-out="2.54" style="font-size: 102px">
            <span class="bl"></span>
            <span class="w" data-t="1.94">of</span>
            <span class="w gap-s" data-t="2.08">skills</span>
          </div>
        </div>

        <!-- ===================== BEAT 3: FAVOURITE (text; the chip lives in #chips) ===================== -->
        <div id="b3" class="beat">
          <div id="f1" class="line serif" data-x="132" data-base="905" data-out="3.86" style="font-size: 108px">
            <span class="bl"></span>
            <span class="w" data-t="2.66">but</span>
            <span class="w gap-s" data-t="2.74">my</span>
          </div>
          <div id="f2" class="line ital ink" data-x="84" data-base="1112" data-out="3.89" style="font-size: 222px">
            <span class="bl"></span>
            <span class="w" data-t="2.98" data-hero="1" data-origin="25% 85%">favorite</span>
          </div>
          <div id="f3" class="line serif" data-right="944" data-base="1282" data-out="3.92" style="font-size: 110px">
            <span class="bl"></span>
            <span class="w" data-t="3.32">is</span>
            <span class="w gap-s" data-t="3.54">the</span>
            <span class="w gap-s" data-t="3.66">one</span>
          </div>
        </div>

        <!-- ===================== BEAT 4 + 5: RECORD → AGENT ===================== -->
        <div id="b4" class="beat">
          <svg id="path-svg" viewBox="0 0 1080 1920">
            <defs>
              <mask id="path-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
                <path id="path-reveal" d="" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" />
              </mask>
            </defs>
            <path
              id="dot-path"
              d=""
              fill="none"
              stroke="#141414"
              stroke-width="3"
              stroke-linecap="round"
              stroke-dasharray="2 12"
              mask="url(#path-mask)"
            />
          </svg>

          <div id="puck-pos">
            <div id="puck">
              <div id="puck-glow"></div>
              <div class="ripple" id="rip1"></div>
              <div class="ripple" id="rip2"></div>
              <div id="puck-core" class="abs" style="inset: 0">
                <div class="puck-body"></div>
                <div class="bot" id="bot">
                  <div class="bot-ant"></div>
                  <div class="bot-ear" style="left: 0"></div>
                  <div class="bot-ear" style="right: 0"></div>
                  <div class="bot-head">
                    <div class="bot-visor">
                      <div id="eyes" class="abs" style="inset: 0">
                        <i class="eye" id="eyeL" style="left: 16px"></i>
                        <i class="eye" id="eyeR" style="right: 16px"></i>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="rec-pos">
            <div id="rec-float">
              <div id="rec">
                <div class="rec-bar">
                  <span id="rec-dot"></span>
                  <span>REC</span>
                  <span class="rec-time" id="rec-time"></span>
                  <span class="rec-dots"><i></i><i></i><i></i></span>
                </div>
                <div class="rec-screen">
                  <div id="rec-page"></div>
                  <svg id="cursor" viewBox="0 0 40 48">
                    <path
                      d="M4 3 L4 38 L13.5 29.5 L20 44 L27 41 L20.5 27 L33 26.5 Z"
                      fill="#ffffff"
                      stroke="#141414"
                      stroke-width="3"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <div id="r1" class="line ital ocean" data-x="96" data-base="1220" data-out="5.12" style="font-size: 230px">
            <span class="bl"></span>
            <span class="w" data-t="4.30" data-hero="1" data-origin="20% 85%">record</span>
          </div>
          <div id="r2" class="line serif" data-right="944" data-base="1378" data-out="5.15" style="font-size: 130px">
            <span class="bl"></span>
            <span class="w" data-t="4.62">a</span>

    <script>
      (async () => {
        const fontSpecs = ['600 64px "Newsreader"', 'italic 700 64px "Fraunces"', '500 30px "Geist"', '600 30px "Geist"'];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }
        const img = document.getElementById("br-img");
        if (!img.complete) await new Promise((r) => img.addEventListener("load", r, { once: true }));

        const D = 8.033;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        // ---------------- layout: kinetic lines placed by baseline (measured once) ----------------
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          else line.style.left = line.dataset.x + "px";
        }

        // ---------------- coin ticks ----------------
        for (const face of $$(".coin-face")) {
          for (const [x, y, w, h] of [
            [106, 10, 8, 20],
            [106, 190, 8, 20],
            [10, 106, 20, 8],
            [190, 106, 20, 8],
          ]) {
            const t = document.createElement("span");
            t.className = "tick";
            Object.assign(t.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
            face.appendChild(t);
          }
        }

        // ---------------- chips (REAL skill names from the MengTo/Skills repo) ----------------
        const chipSpec = [
          { t: "Video to Super Prompt", side: "L", x: 72, cy: 596, r: -3, ico: "play" },
          { t: "HTML to Interaction Prompts", side: "R", x: 946, cy: 686, r: 2.5 },
          { t: "Stitched Full Page Capture", side: "L", x: 80, cy: 776, r: -2 },
          { t: "Daily UI Inspiration", side: "R", x: 936, cy: 866, r: 3 },
          { t: "browser-video-recording", side: "L", x: 72, cy: 956, r: 2 },
          { t: "audit-reference-originality", side: "R", x: 946, cy: 1046, r: -2 },
        ];
        const chipsEl = $("#chips");
        const chips = chipSpec.map((s, i) => {
          const c = document.createElement("div");
          c.className = "chip";
          c.id = "chip" + i;
          const inn = document.createElement("div");
          inn.className = "chip-in";
          inn.innerHTML =
            '<div class="chip-ocean"></div><span class="chip-ico ' +
            (s.ico || "") +
            '"></span><span class="chip-t">' +
            s.t +
            "</span>";
          c.appendChild(inn);
          chipsEl.appendChild(c);
          const w = inn.offsetWidth;
          c.style.width = w + "px";
          c.style.left = (s.side === "L" ? s.x : s.x - w) + "px";
          c.style.top = s.cy - 44 + "px";
          c.dataset.w = w;
          return c;
        });

        // ---------------- REC wireframe page + timer ----------------
        const page = $("#rec-page");
        const wf = (cls, x, y, w, h, extra = "") => {
          const d = document.createElement("div");
          d.className = "wf " + cls;
          d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}`;
          page.appendChild(d);
        };
        // nav
        wf("dark", 26, 22, 34, 34, "border-radius:50%");
        wf("", 72, 32, 110, 14);
        wf("", 470, 32, 60, 12);
        wf("", 546, 32, 60, 12);
        wf("dark", 622, 22, 108, 34, "border-radius:17px");
        // hero
        wf("dark", 26, 100, 420, 40);
        wf("dark", 26, 152, 300, 40);
        wf("", 26, 214, 360, 14);
        wf("", 26, 238, 280, 14);
        wf("dark", 26, 276, 170, 46, "border-radius:23px");
        wf("white", 470, 96, 260, 230, "border-radius:18px");
        // cards
        for (let i = 0; i < 3; i++) {
          wf("white", 26 + i * 240, 368, 220, 170, "border-radius:16px");
          wf("dark", 46 + i * 240, 388, 40, 40);
          wf("", 46 + i * 240, 446, 150, 12);
          wf("", 46 + i * 240, 468, 100, 12);
        }
        // more content
        wf("dark", 26, 580, 340, 34);
        wf("", 26, 630, 300, 12);
        wf("", 26, 652, 240, 12);
        wf("white", 400, 572, 330, 190, "border-radius:18px");
        wf("", 26, 700, 330, 60, "border-radius:14px");
        wf("white", 26, 800, 704, 90, "border-radius:18px");

        const timeEl = $("#rec-time");
        const timeSpans = [];
        for (let i = 0; i <= 17; i++) {
          const s = document.createElement("span");
          s.textContent = "00:" + String(i).padStart(2, "0");
          timeEl.appendChild(s);
          timeSpans.push(s);
        }

        // ---------------- dotted path (REC card → agent puck) ----------------
        const PUCK = { x: 720, y: 960 };
        const REC0 = { x: 540, y: 730 }; // rec-pos anchor
        const REC1 = { x: 330, y: 620 }; // parked, small, upper-left
        const pathD = `M ${REC1.x} ${REC1.y} C 590 470, 840 640, ${PUCK.x} ${PUCK.y - 30}`;
        $("#dot-path").setAttribute("d", pathD);
        $("#path-reveal").setAttribute("d", pathD);
        const pathEl = $("#dot-path");
        const PL = pathEl.getTotalLength();
        const reveal = $("#path-reveal");
        reveal.setAttribute("stroke-dasharray", PL + " " + (PL + 10));
        reveal.setAttribute("stroke-dashoffset", PL);
        const N = 24;
        const pathPts = [];
        for (let i = 0; i <= N; i++) {
          const p = pathEl.getPointAtLength((PL * i) / N);
          pathPts.push({ x: p.x - REC0.x, y: p.y - REC0.y });
        }

        // ================= timeline =================
        const tl = gsap.timeline({ paused: true });

        // continuous: grid drift + slow camera push
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -14, duration: D, ease: "none" }, 0);
        tl.fromTo("#cam", { scale: 1, transformOrigin: "540px 900px" }, { scale: 1.02, duration: D, ease: "none" }, 0);

        // ---------- word entrances (contact frame on the spoken word) ----------
        for (const w of $$(".line .w")) {
          const t = parseFloat(w.dataset.t);
          if (w.dataset.hero) {
            const s = Math.max(0, t - 0.2);
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 80%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 80, scale: 0.55, rotation: -7, filter: "blur(8px)" },
              { opacity: 1, y: -8, scale: 1.1, rotation: 1.5, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, s + 0.2);
          } else if (w.dataset.accent) {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: "50% 85%" });
            tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, s);
            tl.fromTo(
              w,
              { y: 56, scale: 0.78, rotation: -6 },
              { y: 0, scale: 1, rotation: 0, duration: 0.46, ease: "back.out(2.2)" },
              s,
            );
          } else {
            const s = Math.max(0, t - 0.13);
            tl.fromTo(
              w,
              { opacity: 0, y: 40, filter: "blur(5px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
              s,
            );
          }
        }
        // line exits (quick, up + blur)
        for (const line of $$(".line[data-out]")) {
          tl.to(line, { y: -46, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, parseFloat(line.dataset.out));
        }

        // =============== BEAT 1: CHAPTER (0 – 1.4) ===============
        gsap.set("#spk-card", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        tl.fromTo("#spk-card", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0);
        tl.fromTo("#spk-card", { y: 120 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
        tl.fromTo("#spk-card", { scale: 0.88 }, { scale: 1, duration: 0.48, ease: "back.out(1.5)", immediateRender: false }, 0);
        tl.fromTo("#spk-card", { rotationX: 26 }, { rotationX: 5, duration: 0.62, ease: "back.out(1.8)", immediateRender: false }, 0);
        tl.fromTo("#spk-card", { rotationY: 20 }, { rotationY: 8, duration: 0.55, ease: "power3.out", immediateRender: false }, 0);
        tl.to("#spk-card", { rotationY: 6, rotationX: 3.5, duration: 0.56, ease: "sine.inOut" }, 0.62);
        tl.fromTo("#vid-wrap", { scale: 1.14, transformOrigin: "52% 50%" }, { scale: 1, duration: 0.7, ease: "power3.out" }, 0);
        tl.to("#vid-wrap", { scale: 1.03, duration: 0.7, ease: "none" }, 0.7);
        tl.fromTo("#sheen", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.08);
        tl.fromTo(
          "#sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut", immediateRender: false },
          0.08,
        );
        tl.to("#sheen", { opacity: 0, duration: 0.25, ease: "power1.in" }, 0.55);
        tl.to("#spk-float", { y: -6, duration: 0.6, ease: "sine.inOut" }, 0.5);
        // exit: card tips back and sinks out
        tl.to("#spk-card", { y: -40, scale: 0.9, opacity: 0, rotationX: 14, duration: 0.24, ease: "power2.in" }, 1.2);

        // coin 04: pops white at the card's corner, flips to ocean on "one"
        tl.fromTo("#coin4", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, 0.04);
        tl.fromTo("#coin4", { scale: 0.3 }, { scale: 1.08, duration: 0.16, ease: "power3.out", immediateRender: false }, 0.04);
        tl.to("#coin4", { scale: 1, duration: 0.24, ease: "back.out(1.6)" }, 0.2);
        tl.fromTo("#coin4", { y: 30 }, { y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.04);
        tl.to("#coin4-flip", { scaleX: 0.04, duration: 0.08, ease: "power2.in" }, 0.2);
        tl.set("#coin4-o", { opacity: 1 }, 0.28);
        tl.set("#coin4-w", { opacity: 0 }, 0.28);
        tl.to("#coin4-flip", { scaleX: 1, duration: 0.24, ease: "back.out(2)" }, 0.28);
        tl.fromTo("#coin4", { rotation: -10 }, { rotation: 0, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, 0.2);
        tl.to("#coin4-flip", { y: -5, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.55);
        // exit: shrink away (2 f after the card)
        tl.to("#coin4", { scale: 0.2, opacity: 0, y: -30, duration: 0.22, ease: "power2.in" }, 1.25);

        // =============== BEAT 2: BUNCH (1.3 – 2.6) ===============
        gsap.set("#br", { transformPerspective: 1600, transformOrigin: "50% 40%" });
        tl.fromTo("#br", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, 1.3);
        tl.fromTo("#br", { y: 90 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.3);
        tl.fromTo("#br", { scale: 0.9 }, { scale: 1, duration: 0.46, ease: "back.out(1.5)", immediateRender: false }, 1.3);
        tl.fromTo("#br", { rotationX: 22 }, { rotationX: 4, duration: 0.6, ease: "back.out(1.7)", immediateRender: false }, 1.3);
        tl.fromTo("#br", { rotationY: -18 }, { rotationY: -7, duration: 0.55, ease: "power3.out", immediateRender: false }, 1.3);
        tl.to("#br", { rotationY: -5, duration: 0.65, ease: "sine.inOut" }, 1.85);
        tl.fromTo("#br-img", { y: 0 }, { y: -90, duration: 1.2, ease: "power1.inOut" }, 1.4);
        // exit: drops away with gravity
        tl.to("#br", { y: 220, rotation: 4, opacity: 0, duration: 0.36, ease: "power2.in" }, 2.52);

        // chips pop fast around the page (~3.6 f apart)
        chips.forEach((c, i) => {
          const s = 1.5 + i * 0.12;
          const r = chipSpec[i].r;
          gsap.set(c, { transformOrigin: "50% 50%" });
          tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, s);
          tl.fromTo(c, { scale: 0.5 }, { scale: 1.07, duration: 0.15, ease: "power3.out" }, s);
          tl.to(c, { scale: 1, duration: 0.22, ease: "back.out(1.6)" }, s + 0.15);
          tl.fromTo(c, { y: 34 }, { y: 0, duration: 0.3, ease: "power2.out" }, s);
          tl.fromTo(c, { rotation: r - 9 }, { rotation: r, duration: 0.4, ease: "back.out(1.8)" }, s);
          tl.to(c.firstChild, { y: i % 2 ? 4 : -4, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, s + 0.3);
          if (i > 0) {
            // everything but the favourite falls away
            const fs = 2.54 + (i - 1) * 0.05;
            tl.to(c, { y: 340 + i * 18, rotation: r + (i % 2 ? 14 : -14), opacity: 0, duration: 0.34, ease: "power2.in" }, fs);
          }
        });

        // =============== BEAT 3: FAVOURITE (2.6 – 4.1) ===============
        const c0 = chips[0];
        const c0w = parseFloat(c0.dataset.w);
        const c0cx = parseFloat(c0.style.left) + c0w / 2;
        const c0cy = chipSpec[0].cy;
        const FAV = { x: 540, y: 660 };
        // arc to centre: x leads, y lags → curved path; grows with overshoot, lands on "favorite"
        tl.to(c0, { x: FAV.x - c0cx, duration: 0.42, ease: "power3.inOut" }, 2.58);
        tl.to(c0, { y: FAV.y - c0cy, duration: 0.42, ease: "power2.inOut" }, 2.6);
        tl.to(c0, { rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, 2.6);
        tl.to(c0, { scale: 1.66, duration: 0.36, ease: "power3.out" }, 2.68);
        tl.to(c0, { scale: 1.55, duration: 0.3, ease: "back.out(1.4)" }, 3.04);
        tl.to("#chip0 .chip-ocean", { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.82);
        tl.to("#chip0 .chip-t", { color: "#0D2731", duration: 0.2, ease: "power1.out" }, 2.82);
        tl.to("#chip0 .chip-ico", { backgroundColor: "#0D2731", duration: 0.2, ease: "power1.out" }, 2.82);
        tl.to(c0.firstChild, { y: -6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.2);

        // =============== BEAT 4: RECORD (4.0 – 5.2) ===============
        // favourite chip becomes the header label up top
        tl.to(c0, { y: 372 - c0cy, scale: 1.08, duration: 0.4, ease: "power3.inOut" }, 3.76);
        tl.to(c0.firstChild, { y: 4, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.5);

        gsap.set("#rec", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        tl.fromTo("#rec", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, 4.08);
        tl.fromTo("#rec", { y: 100 }, { y: 0, duration: 0.46, ease: "power3.out", immediateRender: false }, 4.08);
        tl.fromTo("#rec", { scale: 0.86 }, { scale: 1, duration: 0.44, ease: "back.out(1.6)", immediateRender: false }, 4.08);
        tl.fromTo("#rec", { rotationX: 24 }, { rotationX: 4, duration: 0.58, ease: "back.out(1.8)", immediateRender: false }, 4.08);
        tl.fromTo("#rec", { rotationY: 18 }, { rotationY: 7, duration: 0.52, ease: "power3.out", immediateRender: false }, 4.08);
        tl.to("#rec", { rotationY: 4, rotationX: 2, duration: 0.46, ease: "sine.inOut" }, 4.66);
        // inner screen recording: page scrolls, cursor moves + clicks, REC dot blinks, timer counts
        tl.fromTo("#rec-page", { y: 0 }, { y: -420, duration: 1.9, ease: "sine.inOut" }, 4.15);
        gsap.set("#cursor", { x: 560, y: 250, transformOrigin: "10% 8%" });
        tl.to("#cursor", { x: 330, duration: 0.5, ease: "power2.inOut" }, 4.35);
        tl.to("#cursor", { y: 150, duration: 0.5, ease: "sine.inOut" }, 4.35);
        tl.to("#cursor", { scale: 0.8, duration: 0.06, ease: "power2.in", yoyo: true, repeat: 1 }, 4.88);
        tl.to("#cursor", { x: 470, y: 300, duration: 0.55, ease: "power2.inOut" }, 5.05);
        tl.fromTo("#rec-dot", { opacity: 1 }, { opacity: 0.25, duration: 0.24, ease: "sine.inOut", yoyo: true, repeat: 5 }, 4.3);
        timeSpans.forEach((s, i) => {
          const t = 4.18 + i * 0.1;
          if (i === 0) s.style.opacity = "1";
          else {
            tl.set(timeSpans[i - 1], { opacity: 0 }, t);
            tl.set(s, { opacity: 1 }, t);
          }
        });

        // =============== BEAT 5: AGENT (5.2 – 6.4) ===============
        // REC card shrinks and parks upper-left (arc), puck pops lower-right
        tl.to("#rec-pos", { x: REC1.x - REC0.x, duration: 0.36, ease: "power3.inOut" }, 5.14);
        tl.to("#rec-pos", { y: REC1.y - REC0.y, duration: 0.36, ease: "power2.inOut" }, 5.16);
        tl.to("#rec-pos", { scale: 0.56, duration: 0.36, ease: "power3.inOut" }, 5.14);
        tl.to("#rec", { rotationY: 0, rotationX: 0, duration: 0.36, ease: "power2.inOut" }, 5.14);

        tl.fromTo("#puck", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 5.24);
        tl.fromTo("#puck", { scale: 0.3 }, { scale: 1.08, duration: 0.2, ease: "power3.out", immediateRender: false }, 5.24);
        tl.to("#puck", { scale: 1, duration: 0.26, ease: "back.out(1.6)" }, 5.44);
        tl.fromTo("#puck", { y: 40 }, { y: 0, duration: 0.36, ease: "power2.out", immediateRender: false }, 5.24);
        tl.fromTo("#bot", { y: 14 }, { y: 0, duration: 0.36, ease: "back.out(2.4)" }, 5.3);
        // eyes glance toward the card, then follow it in
        tl.to("#eyes", { x: -7, y: -4, duration: 0.2, ease: "power2.out" }, 5.5);
        tl.to("#eyes", { x: 2, y: -2, duration: 0.3, ease: "power2.inOut" }, 5.8);

        // dotted path draws on
        tl.to("#path-reveal", { attr: { "stroke-dashoffset": 0 }, duration: 0.42, ease: "power2.out" }, 5.3);

        // card travels the path into the puck, shrinking
        tl.to(
          "#rec-pos",
          {
            keyframes: { x: pathPts.map((p) => p.x), y: pathPts.map((p) => p.y), easeEach: "none", ease: "power2.in" },
            duration: 0.5,
          },
          5.62,
        );
        tl.to("#rec-pos", { scale: 0.06, duration: 0.5, ease: "power2.in" }, 5.62);
        tl.to("#rec-float", { opacity: 0, duration: 0.1, ease: "power1.in" }, 6.04);
        // path erases behind it
        tl.to("#path-reveal", { attr: { "stroke-dashoffset": -PL }, duration: 0.42, ease: "power2.in" }, 5.72);

        // puck swallows: squash-pulse + ripples + glow on "agent", then hums
        tl.to("#puck-core", { scaleX: 1.1, scaleY: 0.92, duration: 0.07, ease: "power2.out" }, 6.08);
        tl.to("#puck-core", { scaleX: 0.97, scaleY: 1.05, duration: 0.08, ease: "power2.inOut" }, 6.15);
        tl.to("#puck-core", { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(2)" }, 6.23);
        tl.fromTo("#puck-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.1, duration: 0.14, ease: "power2.out" }, 6.08);
        tl.to("#puck-glow", { opacity: 0.45, scale: 1, duration: 0.36, ease: "power2.out" }, 6.22);
        const ripple = (el, t, peak, grow) => {
          tl.fromTo(el, { opacity: 0, scale: 1 }, { opacity: peak, scale: 1.04, duration: 0.05, ease: "power1.out", immediateRender: false }, t);
          tl.to(el, { opacity: 0, scale: grow, duration: 0.6, ease: "power2.out" }, t + 0.05);
        };
        ripple("#rip1", 6.08, 0.9, 1.55);
        ripple("#rip2", 6.3, 0.7, 1.55);
        tl.fromTo(".eye", { scale: 1 }, { scale: 1.35, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, 6.1);
        tl.to("#eyes", { x: 0, y: 0, duration: 0.2, ease: "power2.out" }, 6.12);
        // hum: tiny rapid breathing + eyes scanning while it "builds"
        tl.to("#bot", { y: -3, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 15 }, 6.36);
        tl.to("#eyes", { x: 6, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: 5 }, 6.5);
        tl.to("#puck-glow", { opacity: 0.85, duration: 0.24, ease: "sine.inOut", yoyo: true, repeat: 5 }, 6.6);
        ripple("#rip1", 6.95, 0.6, 1.45);
        ripple("#rip2", 7.42, 0.6, 1.45);

        // beat clears: chip label lifts out, path gone
        tl.to(c0, { opacity: 0, y: 372 - c0cy - 44, duration: 0.2, ease: "power2.in" }, 6.28);

        // =============== BEAT 6: BUILD (6.35 – 8.03) ===============
        // puck slides (arc) to the site card's lower-right corner and shrinks — the builder
        const PK2 = { x: 872, y: 928 };
        tl.to("#puck-pos", { x: PK2.x - PUCK.x, duration: 0.4, ease: "power2.inOut" }, 6.44);
        tl.to("#puck-pos", { y: PK2.y - PUCK.y, duration: 0.4, ease: "power3.inOut" }, 6.44);
        tl.to("#puck", { scale: 0.58, duration: 0.4, ease: "back.inOut(1.2)" }, 6.44);

        gsap.set("#site", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        tl.fromTo("#site", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "power1.out" }, 194 / 30);
        tl.fromTo("#site", { y: 100 }, { y: 0, duration: 0.48, ease: "power3.out", immediateRender: false }, 6.46);
        tl.fromTo("#site", { scale: 0.88 }, { scale: 1, duration: 0.46, ease: "back.out(1.5)", immediateRender: false }, 6.46);
        tl.fromTo("#site", { rotationX: 22 }, { rotationX: 4, duration: 0.6, ease: "back.out(1.7)", immediateRender: false }, 6.46);
        tl.fromTo("#site", { rotationY: -16 }, { rotationY: -6, duration: 0.55, ease: "power3.out", immediateRender: false }, 6.46);
        tl.to("#site", { rotationY: -4, rotationX: 2.5, duration: 0.98, ease: "sine.inOut" }, 7.06);
        tl.to("#site-float", { y: -6, duration: 0.6, ease: "sine.inOut" }, 7.4);

        // website builds block by block (contact = start + ~0.13)
        const groups = { nav: 6.64, head: 6.77, sub: 6.88, img: 6.96, card: 7.08, btn: 7.3 };
        const seen = {};
        for (const b of $$("#site-body .sb")) {
          const g = b.dataset.g;
          const k = (seen[g] = (seen[g] || 0) + 1) - 1;
          const step = g === "card" ? 0.08 : g === "nav" ? 0.033 : 0.067;
          const s = groups[g] + k * step;
          const big = g === "img" || g === "btn";
          gsap.set(b, { transformOrigin: g === "head" || g === "sub" ? "0% 50%" : "50% 60%" });
          tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, s);
          if (g === "head" || g === "sub") {
            tl.fromTo(b, { scaleX: 0.2 }, { scaleX: 1, duration: 0.32, ease: "back.out(1.5)" }, s);
          } else {
            tl.fromTo(b, { scale: big ? 0.6 : 0.5 }, { scale: big ? 1.08 : 1.06, duration: 0.14, ease: "power3.out" }, s);
            tl.to(b, { scale: 1, duration: 0.24, ease: "back.out(1.8)" }, s + 0.14);
            tl.fromTo(b, { y: 26 }, { y: 0, duration: 0.3, ease: "power2.out" }, s);
          }
        }
        // the button is the hero block: small camera nudge as it lands on "website"
        tl.fromTo("#site-btn", { boxShadow: "0 0 0 0 rgba(46,156,203,0)" }, { boxShadow: "0 0 0 14px rgba(46,156,203,0.35)", duration: 0.16, ease: "power2.out" }, 7.43);
        tl.to("#site-btn", { boxShadow: "0 0 0 26px rgba(46,156,203,0)", duration: 0.4, ease: "power2.out" }, 7.59);

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
