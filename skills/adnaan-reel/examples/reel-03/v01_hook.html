<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v01 hook</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      /* ---------- camera ---------- */
      #cam,
      #punch {
        position: absolute;
        inset: 0;
      }

      /* ---------- speaker card ---------- */
      #card-float {
        position: absolute;
        left: 62px;
        top: 306px;
        width: 868px;
        height: 600px;
      }
      #card {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      #vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 30px;
      }
      /* source 1080x1920 scaled to the card width; window = 20.5%–59.4% of the source height (face centred) */
      #speaker {
        position: absolute;
        left: 0;
        top: -316px;
        width: 868px;
        height: 1543px;
        object-fit: cover;
      }
      #sheen {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 45%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }

      /* ---------- kinetic serif ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.95;
        letter-spacing: -0.015em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .serif {
        font-family: var(--font-heading);
        font-weight: 600;
        color: var(--brand-text);
      }
      .ital {
        font-family: var(--font-accent);
        font-weight: 700;
        font-style: italic;
        letter-spacing: -0.02em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.24em;
      }

      #l1a {
        font-size: 90px;
      }
      #l1b {
        font-size: 90px;
      }
      #l1b .ital {
        font-size: 150px;
      }

      #h1 .w1 {
        font-size: 86px;
      }
      #h1 .w2 {
        font-size: 96px;
      }
      #h2 {
        font-size: 250px;
        line-height: 0.9;
      }
      #h3 {
        font-size: 100px;
      }
      #h3 .ital {
        font-size: 140px;
      }
      #h4 {
        font-size: 164px;
        line-height: 0.9;
      }
      #underline {
        position: absolute;
        height: 15px;
        border-radius: 8px;
        background: linear-gradient(90deg, var(--brand-primary), var(--brand-primary-dark));
        transform-origin: 0% 50%;
      }

      /* ---------- coins ---------- */
      .coin {
        position: absolute;
        width: 92px;
        height: 92px;
        margin-left: -46px;
        margin-top: -46px;
      }
      .coin-body {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff, #f1eeea 70%);
        box-shadow:
          0 18px 30px rgba(60, 50, 40, 0.22),
          inset 0 -4px 8px rgba(60, 50, 40, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 40px;
        letter-spacing: -0.03em;
        color: var(--brand-text);
      }
      .tick {
        position: absolute;
        background: #cfc9c2;
        border-radius: 1px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1080"
      data-height="1920"
      data-duration="3.866"
    >
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <div id="punch">
          <!-- speaker card -->
          <div id="card-float">
            <div id="card">
              <div id="vid-wrap">
                <video
                  id="speaker"
                  class="clip"
                  src="assets/speaker.mp4"
                  muted
                  playsinline
                  data-start="0"
                  data-duration="3.866"
                  data-track-index="1"
                ></video>
              </div>
              <div id="sheen"></div>
            </div>
          </div>

          <!-- coins (secondary action): arc around the card lower-right corner -->
          <div id="coins"></div>

          <!-- intro line: "if you're trying to / design with AI," -->
          <div id="l1a" class="line serif" data-x="78" data-base="1128">
            <span class="bl"></span>
            <span class="w" data-t="0.00">if</span>
            <span class="w gap-s" data-t="0.16">you're</span>
            <span class="w gap-s" data-t="0.32">trying</span>
            <span class="w gap-s" data-t="0.46">to</span>
          </div>
          <div id="l1b" class="line serif" data-x="112" data-base="1290">
            <span class="bl"></span>
            <span class="w ital ocean" data-t="0.56" data-accent="1">design</span>
            <span class="w gap-s" data-t="0.82">with</span>
            <span class="w gap-s" data-t="1.02">AI,</span>
          </div>

          <!-- hero stack -->
          <div id="h1" class="line serif" data-x="72" data-base="1008">
            <span class="bl"></span>
            <span class="w w1" data-t="1.55">having</span>
            <span class="w w2 gap-s" data-t="1.70">these</span>
          </div>
          <div id="h2" class="line ital ocean" data-x="74" data-base="1210">
            <span class="bl"></span>
            <span class="w" data-t="1.96" data-hero="1" data-origin="40% 85%" data-peak="1.08">5</span>
            <span class="w" style="margin-left: 0.2em" data-t="2.22" data-hero="1" data-origin="35% 85%" data-peak="1.06">skills</span>
          </div>
          <div id="h3" class="line serif" data-right="770" data-base="1292">
            <span class="bl"></span>
            <span class="w" data-t="2.56">is</span>
            <span class="w gap-s" data-t="2.80">literally</span>
            <span class="w ital ink" style="margin-left: 0.16em" data-t="3.20" data-pop="1">a</span>
          </div>
          <div id="h4" class="line ital ink" data-x="76" data-base="1424">
            <span class="bl"></span>
            <span class="w" id="w-cheat" data-t="3.40" data-pop="1" data-rise="36" data-origin="15% 85%">cheat</span>
            <span class="w" id="w-code" style="margin-left: 0.18em" data-t="3.56" data-pop="1" data-rise="36">code.</span>
          </div>
          <div id="underline"></div>
        </div>
      </div>
    </div>

    <script>
      (async () => {
        const fontSpecs = ['600 64px "Newsreader"', 'italic 700 64px "Fraunces"', '600 30px "Geist"'];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }

        const D = 3.866;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        // ---- place each line by its baseline (deterministic layout, measured once) ----
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }

        // ---- underline under "cheat code." ----
        const h4 = $("#h4");
        const cheat = $("#w-cheat");
        const code = $("#w-code");
        const ul = $("#underline");
        const h4Base = parseFloat(h4.dataset.base);
        const ulX0 = h4.offsetLeft + cheat.offsetLeft + 8;
        const ulX1 = h4.offsetLeft + code.offsetLeft + code.offsetWidth - 30;
        ul.style.left = ulX0 + "px";
        ul.style.width = ulX1 - ulX0 + "px";
        ul.style.top = h4Base + 14 + "px";

        // ---- coins on a gentle arc hugging the card's lower-right corner ----
        const coinsEl = $("#coins");
        const ARC = { cx: 655, cy: 702, rx: 240, ry: 250, deg: [90, 67, 44, 21, -2] };
        const coins = [];
        for (let i = 0; i < 5; i++) {
          const a = (ARC.deg[i] * Math.PI) / 180;
          const px = ARC.cx + ARC.rx * Math.cos(a);
          const py = ARC.cy + ARC.ry * Math.sin(a);
          const c = document.createElement("div");
          c.className = "coin";
          c.style.left = px + "px";
          c.style.top = py + "px";
          c.dataset.dx = -Math.cos(a) * 44;
          c.dataset.dy = -Math.sin(a) * 44;
          const b = document.createElement("div");
          b.className = "coin-body";
          b.textContent = "0" + (i + 1);
          for (const [x, y, w, h] of [
            [44.5, 7, 3, 8],
            [44.5, 77, 3, 8],
            [7, 44.5, 8, 3],
            [77, 44.5, 8, 3],
          ]) {
            const t = document.createElement("span");
            t.className = "tick";
            Object.assign(t.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
            b.appendChild(t);
          }
          c.appendChild(b);
          coinsEl.appendChild(c);
          coins.push(c);
        }

        // ================= timeline =================
        const tl = gsap.timeline({ paused: true });
        const F = 1 / 30;

        // background drift (continuous, linear on purpose) + slow camera push
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -12, duration: D, ease: "none" }, 0);
        tl.fromTo(
          "#cam",
          { scale: 1, transformOrigin: "510px 620px" },
          { scale: 1.012, duration: D, ease: "none" },
          0,
        );

        // speaker card: rise + soft 3D settle (readable by 0.3 s)
        gsap.set("#card", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0);
        tl.fromTo("#card", { y: 130 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
        tl.fromTo("#card", { scale: 0.88 }, { scale: 1, duration: 0.48, ease: "back.out(1.2)", immediateRender: false }, 0);
        tl.fromTo("#card", { rotationX: 28 }, { rotationX: 5, duration: 0.62, ease: "back.out(1.8)", immediateRender: false }, 0);
        tl.fromTo("#card", { rotationY: -22 }, { rotationY: -9, duration: 0.55, ease: "power3.out", immediateRender: false }, 0);
        // slow orbit while holding
        tl.to("#card", { rotationY: -6.5, rotationX: 3.5, duration: D - 0.62, ease: "sine.inOut" }, 0.62);
        // inner parallax: the video settles inside the card, then a slow push
        tl.fromTo("#vid-wrap", { scale: 1.16 }, { scale: 1, duration: 0.7, ease: "power3.out" }, 0);
        tl.to("#vid-wrap", { scale: 1.035, duration: D - 0.7, ease: "none" }, 0.7);
        // light catches the card as it settles
        tl.fromTo("#sheen", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.08);
        tl.fromTo(
          "#sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut", immediateRender: false },
          0.08,
        );
        tl.to("#sheen", { opacity: 0, duration: 0.25, ease: "power1.in" }, 0.55);
        // gentle float
        tl.to("#card-float", { y: -4, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0.5);

        // ---- word entrances (contact frame on the spoken word) ----
        const words = $$(".line .w");
        for (const w of words) {
          const t = parseFloat(w.dataset.t);
          if (w.dataset.hero) {
            // hero pop: rise, overshoot on the word, settle
            const s = Math.max(0, t - 0.2);
            const peak = parseFloat(w.dataset.peak || "1.07");
            tl.fromTo(
              w,
              { opacity: 0, y: 110, scale: 0.55, rotation: -7, filter: "blur(10px)" },
              { opacity: 1, y: -10, scale: peak, rotation: 1.5, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, s + 0.2);
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 80%" });
          } else if (w.dataset.pop) {
            const s = Math.max(0, t - 0.16);
            tl.fromTo(
              w,
              { opacity: 0, y: parseFloat(w.dataset.rise || "84"), scale: 0.72, rotation: -5, filter: "blur(8px)" },
              { opacity: 1, y: -6, scale: 1.05, rotation: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.28, ease: "back.out(1.5)" }, s + 0.16);
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 85%" });
          } else if (w.dataset.accent) {
            const s = Math.max(0, t - 0.16);
            tl.fromTo(
              w,
              { opacity: 0, y: 80, scale: 0.78, rotation: -6, filter: "blur(8px)" },
              { opacity: 1, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.46, ease: "back.out(2.2)" },
              s,
            );
            gsap.set(w, { transformOrigin: "50% 85%" });
          } else {
            const s = Math.max(0, t - 0.13);
            tl.fromTo(
              w,
              { opacity: 0, y: 56, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
              s,
            );
          }
        }

        // intro line exits up (line B lags 2 f) to make room for the hero stack
        tl.to("#l1a", { y: -64, opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 1.14);
        tl.to("#l1b", { y: -64, opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 1.14 + 2 * F);

        // coins pop on a gentle arc, 2 f apart, then float
        coins.forEach((c, i) => {
          const s = 1.86 + i * 2 * F;
          const body = c.querySelector(".coin-body");
          tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, s);
          tl.fromTo(c, { scale: 0.2 }, { scale: 1, duration: 0.36, ease: "back.out(2)" }, s);
          tl.fromTo(c, { x: parseFloat(c.dataset.dx) }, { x: 0, duration: 0.36, ease: "power3.out" }, s);
          tl.fromTo(c, { y: parseFloat(c.dataset.dy) }, { y: 0, duration: 0.36, ease: "power1.out" }, s);
          tl.to(body, { y: -4, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 1 }, s + 0.36 + i * 0.05);
        });

        // "cheat code." — ocean underline swipe + tiny camera push
        tl.fromTo("#underline", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power3.out" }, 3.38);
        tl.fromTo(
          "#punch",
          { scale: 1, transformOrigin: "510px 620px" },
          { scale: 1.008, duration: 0.45, ease: "power2.out" },
          3.36,
        );

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
</html>
