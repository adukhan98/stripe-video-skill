<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>

    <meta name="viewport" content="width=1080, height=1920">
    <title>v03 genius</title>
    <link rel="stylesheet" href="brand.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      /* ---------- camera ---------- */
      #cam {
        position: absolute;
        inset: 0;
      }

      /* ---------- speaker card ---------- */
      #card-pos {
        position: absolute;
        left: 62px;
        top: 302px;
        width: 868px;
        height: 600px;
      }
      #card-float {
        position: absolute;
        inset: 0;
      }
      #card {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      #vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 30px;
      }
      /* source 1080x1920 scaled to the card width (868 → 1543 tall); window = 23.7 %–62.5 % of the source height
         (this clip's face sits at ~27–63 % of the frame) */
      #speaker {
        position: absolute;
        left: 0;
        top: -365px;
        width: 868px;
        height: 1543px;
        object-fit: cover;
      }
      #sheen {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 45%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }

      /* ---------- kinetic serif ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.95;
        letter-spacing: -0.015em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .serif {
        font-family: var(--font-heading);
        font-weight: 600;
        color: var(--brand-text);
      }
      .ital {
        font-family: var(--font-accent);
        font-weight: 700;
        font-style: italic;
        letter-spacing: -0.02em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.24em;
      }
      #a1 {
        font-size: 84px;
      }
      #a1 .big {
        font-size: 112px;
      }
      #a2 {
        font-size: 92px;
      }
      #a3 {
        font-size: 228px;
        line-height: 0.9;
      }
      #a4 {
        font-size: 80px;
      }
      #a4 .ital {
        font-size: 108px;
      }
      #beatA,
      #a3wrap,
      #skels,
      #pills,
      #notes {
        position: absolute;
        inset: 0;
      }
      #loop {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
        pointer-events: none;
      }

      /* ---------- agent puck ---------- */
      #puck-pos {
        position: absolute;
        left: 800px;
        top: 492px;
        width: 0;
        height: 0;
      }
      #ring {
        position: absolute;
        left: -150px;
        top: -150px;
        width: 300px;
        height: 300px;
        overflow: visible;
      }
      #puck {
        position: absolute;
        left: -124px;
        top: -124px;
        width: 248px;
        height: 248px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, #2a4753 0%, #0d2731 46%, #141414 100%);
        box-shadow:
          0 30px 46px -8px rgba(40, 30, 20, 0.42),

      #glow {
        position: absolute;

      /* ---------- link pills (white) ---------- */
      .pill {

      /* ---------- copied tooltip ---------- */

      /* ---------- cursor ---------- */
      #cursor {

      #cursor svg {
        position: absolute;
        left: -4px;
        top: -3px;
        width: 66px;
        height: 87px;
        overflow: visible;
        filter: drop-shadow(0 8px 10px rgba(40, 30, 20, 0.3));
      }

      /* ---------- notification pills (black) ---------- */
      .note,
      .skel {
        position: absolute;
        width: 820px;
        height: 116px;
      }
      .skel-body {
        position: relative;
        width: 820px;
        height: 116px;
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 0 34px 0 24px;
        border-radius: 32px;
        background: rgba(251, 250, 248, 0.72);

      .sk-dot {
        width: 68px;

      }
      .sk-bar {
        position: relative;
        width: 470px;
        height: 26px;
        border-radius: 13px;

      .sk-fill {
        position: absolute;

      .note-body {
        position: relative;

      .chk {

      }
      .ntxt .rd {

      }
    </style>

  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="6.566">
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <!-- speaker card -->
        <div id="card-pos">
          <div id="card-float">
            <div id="card">
              <div id="vid-wrap">
                <video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="6.566" data-track-index="1"></video>
              </div>

            </div>

        <!-- BEAT A: kinetic serif -->
        <div id="beatA">
          <div id="a1" class="line serif" data-x="96" data-base="1014">
            <span class="bl"></span>
            <span class="w" data-t="0.00" data-fast="1">you</span>
            <span class="w gap-s" data-t="0.09" data-fast="1">also</span>

          </div>
          <div id="a2" class="line serif" data-right="930" data-base="1096">
            <span class="bl"></span>
            <span class="w" data-t="0.49">have</span>
            <span class="w gap-s" data-t="0.61">to</span>

        <!-- BEAT B -->

                  <line x1="60" y1="17" x2="60" y2="29" stroke="#FBFAF8" stroke-width="5" stroke-linecap="round" />
                  <circle id="ant-dot" cx="60" cy="13" r="6" fill="#2E9CCB" />
                </g>
                <rect x="11" y="49" width="9" height="22" rx="4" fill="#FBFAF8" />
                <rect x="100" y="49" width="9" height="22" rx="4" fill="#FBFAF8" />
                <rect x="21" y="29" width="78" height="60" rx="20" fill="none" stroke="#FBFAF8" stroke-width="5.5" />
                <rect x="31" y="43" width="58" height="30" rx="15" fill="#06141a" />
                <g id="eyes">
                  <rect id="eye-l" x="42" y="49" width="11" height="18" rx="5.5" fill="#2E9CCB" />

          <svg viewBox="0 0 38 50">
            <path d="M2 2 L2 38 L11.5 29.5 L18 44 L25 41 L18.5 27 L31 27 Z" fill="#FFFFFF" stroke="#141414" stroke-width="2.6" stroke-linejoin="round" />
          </svg>

    <script>
      (async () => {
        const fontSpecs = ['600 64px "Newsreader"', 'italic 700 64px "Fraunces"', '500 30px "Geist"', '600 30px "Geist"'];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }

        const D = 6.566;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const SVGNS = "http://www.w3.org/2000/svg";

        // ---------------- layout: kinetic lines placed by baseline ----------------
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else if (line.dataset.center) {
            line.style.left = parseFloat(line.dataset.center) - line.offsetWidth / 2 + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }

        // ---------------- hand-drawn dotted loop around "genius" ----------------
        const a3 = $("#a3");
        const gBase = parseFloat(a3.dataset.base);
        const gL = a3.offsetLeft;
        const gW = a3.offsetWidth;
        // fit the loop to the real glyphs: rasterise "genius" (must sit inside, 16px clear) and the lines
        // above/below (must stay outside, 12px clear), then grid-search rotation / centre / radii.
        const glyphPts = (lineEl, wordEls, every) => {
          const cv = document.createElement("canvas");
          cv.width = 1080;
          cv.height = 1920;
          const ctx = cv.getContext("2d");
          ctx.fillStyle = "#000";
          for (const w of wordEls) {
            const cs = getComputedStyle(w);
            ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
            ctx.letterSpacing = cs.letterSpacing === "normal" ? "0px" : cs.letterSpacing;
            ctx.textBaseline = "alphabetic";
            ctx.fillText(w.textContent, lineEl.offsetLeft + w.offsetLeft, parseFloat(lineEl.dataset.base));
          }
          const img = ctx.getImageData(0, 0, 1080, 1920).data;
          const on = (x, y) => img[(y * 1080 + x) * 4 + 3] > 100;
          const pts = [];
          for (let y = 900; y < 1500; y += every) {
            for (let x = 40; x < 1040; x += every) {
              if (!on(x, y)) continue;
              if (on(x - every, y) && on(x + every, y) && on(x, y - every) && on(x, y + every)) continue; // edge pixels only
              pts.push([x, y]);
            }
          }
          return pts;
        };
        const inPts = glyphPts(a3, [$("#w-genius")], 3);
        const outPts = [
          ...glyphPts($("#a2"), $$("#a2 .w"), 3),
          ...glyphPts($("#a4"), $$("#a4 .w"), 3),
        ];
        const gCx = gL + gW / 2;
        let LOOP = null;
        for (let rot = -11; rot <= 3; rot += 1) {
          const cr = Math.cos((rot * Math.PI) / 180);
          const sr = Math.sin((rot * Math.PI) / 180);
          for (let cyo = -70; cyo <= 10; cyo += 2) {
            const cy = gBase + cyo;
            for (let cxo = -16; cxo <= 16; cxo += 4) {
              const cx = gCx + cxo;
              for (let rx = 400; rx <= 452; rx += 4) {
                const rIn = rx - 16;
                const rOut = rx + 10;
                let ryMin = 0;
                for (const [x, y] of inPts) {
                  const dx = x - cx;
                  const dy = y - cy;
                  const u = dx * cr + dy * sr;
                  const v = -dx * sr + dy * cr;
                  if (Math.abs(u) >= rIn) {
                    ryMin = 1e9;
                    break;
                  }
                  ryMin = Math.max(ryMin, Math.abs(v) / Math.sqrt(1 - (u / rIn) ** 2) + 15);
                }
                if (ryMin > 400) continue;
                let ryMax = 1e9;
                for (const [x, y] of outPts) {
                  const dx = x - cx;
                  const dy = y - cy;
                  const u = dx * cr + dy * sr;
                  const v = -dx * sr + dy * cr;
                  if (Math.abs(u) >= rOut) continue;
                  ryMax = Math.min(ryMax, Math.abs(v) / Math.sqrt(1 - (u / rOut) ** 2) - 10);
                }
                if (ryMin > ryMax) continue;
                const ry = Math.min(ryMax, Math.max(ryMin + 2, (ryMin + ryMax) / 2));
                // horizontal extent of the rotated ellipse (+3 % wobble) must stay in x 66–952
                const hx = Math.sqrt((rx * cr) ** 2 + (ry * sr) ** 2) * 1.03;
                if (cx - hx < 66 || cx + hx > 952) continue;
                const score = Math.min(ryMax - ryMin, 40) - Math.abs(rot) * 0.2;
                if (!LOOP || score > LOOP.score) LOOP = { cx, cy, rx, ry, rot, score, ryMin, ryMax };
              }
            }
          }
        }
        if (!LOOP) LOOP = { cx: gCx, cy: gBase - 45, rx: 430, ry: 136, rot: -6 };
        window.__loopFit = LOOP;
        function loopPath({ cx, cy, rx, ry, rot }) {
          const pts = [];
          const N = 40;
          const a0 = (-28 * Math.PI) / 180;
          const sweep = (-392 * Math.PI) / 180; // a bit more than a full turn, like a pen loop
          const cr = Math.cos((rot * Math.PI) / 180);
          const sr = Math.sin((rot * Math.PI) / 180);
          for (let i = 0; i <= N; i++) {
            const k = i / N;
            const a = a0 + sweep * k;
            const wob = 1 + 0.007 * Math.sin(3 * a + 0.9) + 0.005 * Math.sin(5 * a + 2.3) - 0.02 * Math.max(0, k - 0.8) * 5;
            const x = rx * wob * Math.cos(a);
            const y = ry * wob * Math.sin(a);
            pts.push([cx + x * cr - y * sr, cy + x * sr + y * cr]);
          }
          let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[Math.max(0, i - 1)];
            const p1 = pts[i];
            const p2 = pts[i + 1];
            const p3 = pts[Math.min(pts.length - 1, i + 2)];
            const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
            const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
            d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
          }
          return d;
        }
        const loopD = loopPath(LOOP);
        $("#loop-dots").setAttribute("d", loopD);
        const reveal = $("#loop-reveal");
        reveal.setAttribute("d", loopD);
        const loopLen = reveal.getTotalLength();
        reveal.setAttribute("stroke-dasharray", `${loopLen} ${loopLen}`);
        reveal.setAttribute("stroke-dashoffset", `${loopLen}`);

        // ---------------- link pills ----------------
        const ICON_LINK =
          '<svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
        const ICON_COPY =
          '<svg class="ic-copy" viewBox="0 0 24 24" fill="none" stroke="#8E8780" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
        const ICON_OK =
          '<svg class="ic-ok" viewBox="0 0 24 24" fill="none" stroke="#2E9CCB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
        const ICON_CHK =
          '<svg viewBox="0 0 24 24" fill="none" stroke="#0D2731" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

        const LINKS = [
          ["Leonxlnx/", "taste-skill"],
          ["0xdesign/", "design-plugin"],
          ["jamiemill/", "layers-skills"],
          ["MengTo/", "Skills"],
          ["Nutlope/", "hallmark"],
        ];
        const PILL_TOP = 772;
        const PILL_STEP = 138;
        const PILL_H = 120;
        const PILL_X = [86, 190, 118, 232, 150];
        const pillsEl = $("#pills");
        const pills = LINKS.map(([own, repo], i) => {
          const p = document.createElement("div");
          p.className = "pill";
          p.innerHTML = `<div class="pill-body"><div class="lk">${ICON_LINK}</div><div class="slug"><span class="own">${own}</span><span class="repo">${repo}</span></div><div class="cp">${ICON_COPY}${ICON_OK}</div></div>`;
          pillsEl.appendChild(p);
          p.style.top = PILL_TOP + i * PILL_STEP + "px";
          return p;
        });
        // keep every pill inside the zone (right edge ≤ 936)
        pills.forEach((p, i) => {
          const w = p.querySelector(".pill-body").offsetWidth;
          p.style.width = w + "px";
          p.style.left = Math.max(70, Math.min(PILL_X[i], 916 - w)) + "px";
        });

        // ---------------- install skeleton rows + notifications (same slots) ----------------
        const NOTES = [
          ["taste-skill", " ready"],
          ["design-and-refine", " ready"],
          ["layers-skills", " ready"],
          ["Meng To skills", " ready"],
          ["hallmark", " ready"],
        ];
        const NOTE_TOP = 786;
        const NOTE_STEP = 134;
        const NOTE_X = 100;
        const skelsEl = $("#skels");
        const notesEl = $("#notes");
        const skels = NOTES.map((_, i) => {
          const k = document.createElement("div");
          k.className = "skel";
          k.innerHTML = `<div class="skel-body"><div class="sk-dot"></div><div class="sk-bar"><div class="sk-fill"></div></div><div class="sk-bar2"></div></div>`;
          k.style.left = NOTE_X + "px";
          k.style.top = NOTE_TOP + i * NOTE_STEP + "px";
          skelsEl.appendChild(k);
          return k;
        });
        const notes = NOTES.map(([nm, rd], i) => {
          const n = document.createElement("div");
          n.className = "note";
          n.innerHTML = `<div class="note-body"><div class="chk">${ICON_CHK}</div><div class="ntxt"><span class="nm">${nm}</span><span class="rd">${rd}</span></div></div>`;
          n.style.left = NOTE_X + "px";
          n.style.top = NOTE_TOP + i * NOTE_STEP + "px";
          notesEl.appendChild(n);
          return n;
        });

        // ---------------- geometry helpers ----------------
        const PUCK = { x: 800, y: 492 };
        const pillCenter = (p) => ({ x: p.offsetLeft + p.offsetWidth / 2, y: p.offsetTop + PILL_H / 2 });
        const copyPoint = (p) => {
          const cp = p.querySelector(".cp");
          return { x: p.offsetLeft + cp.offsetLeft + 26, y: p.offsetTop + PILL_H / 2 };
        };

        // copied tooltip sits above pill 1's copy icon
        const tip = $("#tip");
        const cp0 = copyPoint(pills[0]);
        tip.style.left = Math.min(936 - tip.offsetWidth, cp0.x - tip.offsetWidth / 2) + "px";
        tip.style.top = pills[0].offsetTop - 80 + "px";

        // ======================= timeline =======================
        const tl = gsap.timeline({ paused: true });

        // background drift + slow camera push (continuous, linear on purpose)
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -12, duration: D, ease: "none" }, 0);
        tl.fromTo("#cam", { scale: 1, transformOrigin: "510px 880px" }, { scale: 1.012, duration: D, ease: "none" }, 0);

        // ---------- speaker card entrance (readable by ~0.2 s) ----------
        gsap.set("#card", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0);
        tl.fromTo("#card", { y: 120 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
        tl.fromTo("#card", { scale: 0.9 }, { scale: 1, duration: 0.46, ease: "back.out(1.5)", immediateRender: false }, 0);
        tl.fromTo("#card", { rotationX: 24 }, { rotationX: 5, duration: 0.6, ease: "back.out(1.8)", immediateRender: false }, 0);
        tl.fromTo("#card", { rotationY: -20 }, { rotationY: -9, duration: 0.55, ease: "power3.out", immediateRender: false }, 0);
        tl.to("#card", { rotationY: -7, rotationX: 3.8, duration: 1.7, ease: "sine.inOut" }, 0.6);
        tl.fromTo("#vid-wrap", { scale: 1.14 }, { scale: 1, duration: 0.7, ease: "power3.out" }, 0);
        tl.to("#vid-wrap", { scale: 1.03, duration: D - 0.7, ease: "none" }, 0.7);
        tl.fromTo("#sheen", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.06);
        tl.fromTo(
          "#sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut", immediateRender: false },
          0.06,
        );
        tl.to("#sheen", { opacity: 0, duration: 0.25, ease: "power1.in" }, 0.52);
        tl.fromTo("#card-float", { y: 0 }, { y: -4, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.5);

        // ---------- BEAT A: word entrances (contact frame on the spoken word) ----------
        for (const w of $$("#beatA .w")) {
          const t = parseFloat(w.dataset.t);
          if (w.dataset.hero) {
            // anticipation (tiny dip) → pop to 112 % on the word → settle
            const s = t - 0.24;
            gsap.set(w, { transformOrigin: "50% 80%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 90, scale: 0.5, rotation: -8, filter: "blur(10px)" },
              { opacity: 1, y: -10, scale: 1.12, rotation: 1.5, filter: "blur(0px)", duration: 0.24, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.36, ease: "back.out(1.7)" }, t);
          } else if (w.dataset.pop) {
            const s = t - 0.16;
            gsap.set(w, { transformOrigin: "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 24, scale: 0.72, rotation: -5, filter: "blur(6px)" },
              { opacity: 1, y: -4, scale: 1.06, rotation: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.28, ease: "back.out(1.5)" }, t);
          } else if (w.closest("#a4")) {
            const s = Math.max(0, t - 0.13);
            tl.fromTo(
              w,
              { opacity: 0, y: 18, scale: 0.94, filter: "blur(5px)" },
              { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "power3.out" },
              s,
            );
          } else if (w.dataset.fast) {
            const s = Math.max(0, t - 0.06);
            tl.fromTo(
              w,
              { opacity: 0, y: 36, filter: "blur(4px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
              s,
            );
          } else {
            const s = Math.max(0, t - 0.13);
            tl.fromTo(
              w,
              { opacity: 0, y: 40, filter: "blur(5px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
              s,
            );
          }
        }
        // the dotted loop draws round "genius" right after it lands (follow-through)
        tl.fromTo(reveal, { attr: { "stroke-dashoffset": loopLen } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.46, ease: "power2.inOut" }, 0.96);

        // BEAT A exit: type drops away (2 f between lines) while the card starts to move
        const exitA = ["#a1", "#a2", "#a3wrap", "#a4"];
        exitA.forEach((sel, i) => {
          tl.to(sel, { y: sel === "#a4" ? 10 : 24, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, 2.24 + i * 2 * F);
        });

        // ---------- BEAT B: card shrinks on an arc to the top-left ----------
        // pinned at its top-left corner: 868x600 → ~560x387 at (74, 306); x/y offsets on different eases bend the path
        gsap.set("#card-pos", { transformOrigin: "0% 0%" });
        tl.to("#card-pos", { scale: 1.008, duration: 3 * F, ease: "power2.out" }, 2.23);
        tl.to("#card-pos", { x: 16, duration: 0.46, ease: "power2.inOut" }, 2.34);
        tl.to("#card-pos", { y: 4, duration: 0.46, ease: "back.inOut(3)" }, 2.34);
        tl.to("#card-pos", { scale: 0.625, duration: 0.4, ease: "power3.inOut" }, 2.33);
        tl.to("#card-pos", { scale: 0.645, duration: 0.24, ease: "sine.out" }, 2.73);
        tl.to("#card", { rotationY: 6, rotationX: 4, duration: 0.56, ease: "power2.inOut" }, 2.32);
        tl.to("#card", { rotationY: 4.5, rotationX: 3, duration: D - 2.88, ease: "sine.inOut" }, 2.88);
        // keep the ocean edge + radius visually constant while scaled down
        tl.to(
          "#card",
          {
            borderRadius: 46,
            boxShadow: "0 24px 0 -3px #2E9CCB, 0 60px 80px -14px rgba(40,30,20,0.35)",
            duration: 0.46,
            ease: "power2.inOut",
          },
          2.34,
        );
        tl.to(["#vid-wrap", "#sheen"], { borderRadius: 46, duration: 0.46, ease: "power2.inOut" }, 2.34);

        // ---------- agent puck pops in ----------
        gsap.set("#puck", { transformOrigin: "50% 50%" });
        gsap.set("#ring", { transformOrigin: "50% 50%" });
        gsap.set(["#eye-l", "#eye-r"], { transformOrigin: "50% 50%" });
        tl.fromTo("#puck", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, 2.5);
        tl.fromTo("#puck", { scale: 0.3, y: 40 }, { scale: 1.08, y: -4, duration: 0.22, ease: "power3.out", immediateRender: false }, 2.5);
        tl.to("#puck", { scale: 1, y: 0, duration: 0.26, ease: "back.out(1.6)" }, 2.72);
        tl.fromTo(["#eye-l", "#eye-r"], { scaleY: 0.08 }, { scaleY: 1, duration: 0.16, ease: "back.out(2)" }, 2.76);
        tl.fromTo("#puck-float", { y: 0 }, { y: -5, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.95);
        tl.fromTo("#ant-dot", { opacity: 1 }, { opacity: 0.35, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.9);

        // ---------- link pills pop in, last one on "links" (3.13) ----------
        const pillContacts = [2.87, 2.93, 3.0, 3.07, 3.13];
        pills.forEach((p, i) => {
          const body = p.querySelector(".pill-body");
          const c = pillContacts[i];
          gsap.set(body, { transformOrigin: "30% 50%" });
          tl.fromTo(body, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, c - 0.16);
          tl.fromTo(
            body,
            { y: 60, scale: 0.86, rotation: -2.5 },
            { y: -4, scale: 1.03, rotation: 0.4, duration: 0.16, ease: "power3.out", immediateRender: false },
            c - 0.16,
          );
          tl.to(body, { y: 0, scale: 1, rotation: 0, duration: 0.26, ease: "back.out(1.6)" }, c);
          const lk = p.querySelector(".lk");
          gsap.set(lk, { transformOrigin: "50% 50%" });
          tl.fromTo(lk, { scale: 0.4, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2)" }, c - 0.08);
        });

        // ---------- cursor arrives on an arc, clicks pill 1's copy icon ----------
        const CLICK = 3.2;
        const cur = $("#cursor");
        const curSvg = cur.querySelector("svg");
        gsap.set(curSvg, { transformOrigin: "4px 3px" });
        const cpt = copyPoint(pills[0]);
        tl.fromTo(cur, { x: 860 }, { x: cpt.x, duration: 0.36, ease: "power2.inOut" }, CLICK - 0.4);
        tl.fromTo(cur, { y: 1330 }, { y: cpt.y, duration: 0.36, ease: "power3.out", immediateRender: false }, CLICK - 0.4);
        tl.fromTo(curSvg, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(2)" }, CLICK - 0.42);
        tl.to(curSvg, { scale: 0.82, duration: 2 * F, ease: "power2.in" }, CLICK - 2 * F);
        tl.to(curSvg, { scale: 1, duration: 0.14, ease: "back.out(2.5)" }, CLICK);
        tl.to(cur, { x: cpt.x + 120, y: cpt.y + 34, duration: 0.3, ease: "power2.inOut" }, CLICK + 0.14);
        tl.to(curSvg, { opacity: 0, scale: 0.7, duration: 0.16, ease: "power2.in" }, CLICK + 0.22);
        // copy icon → ocean check
        const p0 = pills[0];
        const icCopy = p0.querySelector(".ic-copy");
        const icOk = p0.querySelector(".ic-ok");
        gsap.set([icCopy, icOk], { transformOrigin: "50% 50%" });
        gsap.set(pills.slice(1).map((p) => p.querySelector(".ic-ok")), { opacity: 0 });
        tl.fromTo(icOk, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.4)" }, CLICK);
        tl.to(icCopy, { opacity: 0, scale: 0.4, duration: 0.1, ease: "power2.in" }, CLICK);
        tl.to(p0.querySelector(".pill-body"), { scale: 0.975, duration: 2 * F, ease: "power2.in", yoyo: true, repeat: 1 }, CLICK - F);
        // "Copied ✓" flash
        gsap.set(tip, { transformOrigin: "50% 100%" });
        tl.fromTo(tip, { opacity: 0, y: 14, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "back.out(2.2)" }, CLICK + F);
        tl.to(tip, { opacity: 0, y: -10, scale: 0.9, duration: 0.1, ease: "power2.in" }, 3.45);

        // ---------- pills fly on arcs into the puck (3 f apart) ----------
        // each pill zips down to a chip while x leads and y follows late, so it swings right under the
        // speaker card and rises into the puck from below: a curved path that never crosses the card / face.
        const FLY = 0.36;
        const arrivals = [];
        pills.forEach((p, i) => {
          const L = 3.44 + i * 0.09;
          const c = pillCenter(p);
          const dx = PUCK.x - c.x;
          const dy = PUCK.y - c.y;
          gsap.set(p, { transformOrigin: "50% 50%" });
          tl.to(p, { y: 8, x: -10, scale: 0.97, duration: 2 * F, ease: "power2.out" }, L); // anticipation
          const go = L + 2 * F;
          tl.to(p, { x: dx, duration: FLY, ease: "power1.inOut" }, go);
          tl.to(p, { y: dy, duration: FLY, ease: "power3.in" }, go);
          tl.to(p, { scale: 0.42, duration: FLY * 0.45, ease: "power2.out" }, go);
          tl.to(p, { scale: 0.1, duration: FLY * 0.55, ease: "power2.in" }, go + FLY * 0.45);
          tl.to(p, { rotation: -14, duration: FLY, ease: "power2.in" }, go);
          tl.to(p, { opacity: 0, duration: 0.07, ease: "power1.in" }, go + FLY - 0.07);
          arrivals.push(go + FLY);
          // its install slot appears where it left
          const k = skels[i].querySelector(".skel-body");
          tl.fromTo(k, { opacity: 0, y: 24, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power3.out" }, go + 0.1);
        });
        // puck reacts to each arrival, big gulp on the last ("agents" 4.19)
        arrivals.forEach((a, i) => {
          if (i < arrivals.length - 1) {
            tl.to("#puck", { scale: 1.06, duration: 0.04, ease: "power2.out" }, a - 0.02);
            tl.to("#puck", { scale: 1, duration: 0.05, ease: "power2.out" }, a + 0.02);
          }
        });
        const GULP = arrivals[arrivals.length - 1];
        tl.to("#puck", { scaleX: 1.12, scaleY: 0.9, duration: 3 * F, ease: "power2.out" }, GULP - 0.02);
        tl.to("#puck", { scaleX: 1, scaleY: 1, duration: 0.4, ease: "elastic.out(1, 0.45)" }, GULP + 3 * F - 0.02);
        tl.to(["#eye-l", "#eye-r"], { scaleY: 0.15, duration: 3 * F, ease: "power2.in" }, GULP - 0.04);
        tl.to(["#eye-l", "#eye-r"], { scaleY: 1, duration: 0.16, ease: "back.out(2)" }, GULP + 0.12);
        tl.fromTo("#glow", { opacity: 0, scale: 0.7 }, { opacity: 0.95, scale: 1, duration: 0.22, ease: "power2.out" }, GULP - 0.04);
        tl.to("#glow", { opacity: 0.5, scale: 0.92, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 2 }, GULP + 0.2);

        // ---------- processing ("and they should be able to"): install bars fill, eyes glance ----------
        skels.forEach((k, i) => {
          const fill = k.querySelector(".sk-fill");
          gsap.set(fill, { transformOrigin: "0% 50%" });
          tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 0.62, ease: "power1.inOut" }, 4.38 + i * 0.08);
        });
        tl.to("#eyes", { x: -6, duration: 0.18, ease: "power2.inOut" }, 4.46);
        tl.to("#eyes", { x: 6, duration: 0.24, ease: "power2.inOut" }, 4.78);
        tl.to("#eyes", { x: 0, duration: 0.18, ease: "power2.inOut" }, 5.08);
        // done: ocean ring closes round the puck ("to" 5.23), puck pulses
        tl.fromTo("#ring-c", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.inOut" }, 5.02);
        tl.fromTo("#ring", { rotation: 0 }, { rotation: 40, duration: D - 5.02, ease: "none", immediateRender: false }, 5.02);
        tl.to("#ring", { scale: 1.04, duration: 0.1, ease: "power2.out" }, 5.3);
        tl.to("#ring", { scale: 1, duration: 0.3, ease: "back.out(2)" }, 5.4);
        tl.to("#puck", { scale: 1.05, duration: 0.1, ease: "power2.out" }, 5.24);
        tl.to("#puck", { scale: 1, duration: 0.3, ease: "back.out(2)" }, 5.34);
        tl.to("#glow", { opacity: 0.4, duration: 0.4, ease: "sine.inOut" }, 5.3);

        // ---------- notification stack, last one on "immediately" (5.77) ----------
        const noteContacts = [5.37, 5.47, 5.57, 5.67, 5.77];
        notes.forEach((n, i) => {
          const body = n.querySelector(".note-body");
          const chk = n.querySelector(".chk");
          const c = noteContacts[i];
          gsap.set(body, { transformOrigin: "50% 50%" });
          gsap.set(chk, { transformOrigin: "50% 50%" });
          tl.fromTo(body, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power1.out" }, c - 0.16);
          tl.fromTo(
            body,
            { y: 46, scale: 0.92, filter: "blur(4px)" },
            { y: -5, scale: 1.02, filter: "blur(0px)", duration: 0.16, ease: "power3.out", immediateRender: false },
            c - 0.16,
          );
          tl.to(body, { y: 0, scale: 1, duration: 0.28, ease: "back.out(1.6)" }, c);
          tl.fromTo(chk, { scale: 0 }, { scale: 1.15, duration: 0.12, ease: "power3.out" }, c - 0.04);
          tl.to(chk, { scale: 1, duration: 0.2, ease: "back.out(2)" }, c + 0.08);
          tl.to(skels[i], { opacity: 0, scale: 0.97, duration: 0.08, ease: "power1.out" }, c - 0.16);
          // live hold
          tl.to(n, { y: -4, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, c + 0.3 + i * 0.04);
        });
        // final blink during the hold
        tl.to(["#eye-l", "#eye-r"], { scaleY: 0.1, duration: 2 * F, ease: "power2.in", yoyo: true, repeat: 1 }, 6.12);

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
</html>
