<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v10 cta</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette (identical to v01_hook) ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      /* ---------- camera ---------- */
      #cam,
      #punch {
        position: absolute;
        inset: 0;
      }

      /* ---------- dotted hand-drawn line ---------- */
      #path-svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }

      /* ---------- speaker card (secondary) ---------- */
      #card-float {
        position: absolute;
        left: 98px;
        top: 770px;
        width: 580px;
        height: 415px;
      }
      #card {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      #vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 30px;
      }
      /* source 1080x1920 scaled to the card width (580x1031); window = 24.2%–64.4% of the source height (face centred) */
      #speaker {
        position: absolute;
        left: 0;
        top: -249px;
        width: 580px;
        height: 1031px;
        object-fit: cover;
      }
      #sheen {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 45%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }

      /* ---------- coins + pill ---------- */
      #coins,
      #pill-layer {
        position: absolute;
        inset: 0;
      }
      .coin {
        position: absolute;
        width: 110px;
        height: 110px;
        margin-left: -55px;
        margin-top: -55px;
      }
      .coin-bump,
      .coin-rock {
        position: absolute;
        inset: 0;
      }
      .coin-body {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff, #f1eeea 70%);
        box-shadow:
          0 18px 30px rgba(60, 50, 40, 0.22),
          inset 0 -4px 8px rgba(60, 50, 40, 0.07);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 44px;
        letter-spacing: -0.03em;
        color: var(--brand-text);
      }
      .tick {
        position: absolute;
        background: #cfc9c2;
        border-radius: 1px;
      }
      #pill-pos {
        position: absolute;
        left: 650px;
        top: 1110px;
        width: 280px;
        height: 84px;
      }
      #pill {
        position: absolute;
        inset: 0;
        border-radius: 42px;
        background: var(--brand-text);
        box-shadow: 0 24px 38px -12px rgba(40, 30, 20, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 36px;
        letter-spacing: -0.01em;
        color: #fbfaf8;
        white-space: nowrap;
      }
      #pill-arrow {
        display: inline-block;
      }
      #pill-text {
        display: inline-block;
      }

      /* ---------- kinetic serif ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.95;
        letter-spacing: -0.015em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .serif {
        font-family: var(--font-heading);
        font-weight: 600;
        color: var(--brand-text);
      }
      .ital {
        font-family: var(--font-accent);
        font-weight: 700;
        font-style: italic;
        letter-spacing: -0.02em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .gap-s {
        margin-left: 0.24em;
      }

      #hd1 {
        font-size: 144px;
      }
      #hd2 {
        font-size: 196px;
        line-height: 0.9;
      }
      #hd2 .q {
        font-size: 0.78em;
      }
      #q-open {
        margin-right: -0.04em;
      }
      #q-close {
        margin-left: -0.02em;
      }

      #p1 .s {
        font-size: 66px;
      }
      #p1 .m {
        font-size: 88px;
      }
      #p2 .s {
        font-size: 64px;
      }
      #p2 .m {
        font-size: 70px;
      }
      #p2 .h {
        font-size: 134px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1080"
      data-height="1920"
      data-duration="4.033"
    >
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <div id="punch">
          <!-- hand-drawn dotted line: "design" → speaker card (drawn on through a mask) -->
          <svg id="path-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <mask id="draw-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
                <path id="mask-path" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" />
              </mask>
            </defs>
            <path
              id="dots"
              fill="none"
              stroke="#141414"
              stroke-width="3.2"
              stroke-linecap="round"
              stroke-dasharray="2 12"
              mask="url(#draw-mask)"
            />
          </svg>

          <!-- coins sit BEHIND the card so they roll out from under its edge -->
          <div id="coins"></div>

          <!-- speaker card -->
          <div id="card-float">
            <div id="card">
              <div id="vid-wrap">
                <video
                  id="speaker"
                  class="clip"
                  src="assets/speaker.mp4"
                  muted
                  playsinline
                  data-start="0"
                  data-duration="4.033"
                  data-track-index="1"
                ></video>
              </div>
              <div id="sheen"></div>
            </div>
          </div>

          <!-- black pill "→ your inbox" in front of card and coins -->
          <div id="pill-layer">
            <div id="pill-pos">
              <div id="pill"><span id="pill-arrow">→</span><span id="pill-text">your inbox</span></div>
            </div>
          </div>

          <!-- headline: Comment “design” -->
          <div id="hd1" class="line serif" data-center="540" data-base="410">
            <span class="bl"></span>
            <span class="w" id="w-comment">Comment</span>
          </div>
          <div id="hd2" class="line ital ocean" data-center="540" data-base="602">
            <span class="bl"></span>
            <span class="w q" id="q-open">“</span>
            <span class="w" id="w-design">design</span>
            <span class="w q" id="q-close">”</span>
          </div>

          <!-- kinetic phrase -->
          <div id="p1" class="line serif" data-x="128" data-base="1294">
            <span class="bl"></span>
            <span class="w s" data-t="0.59">and</span>
            <span class="w s gap-s" data-t="0.81">I</span>
            <span class="w s gap-s" data-t="0.97">will</span>
            <span class="w m gap-s" data-t="1.15">send</span>
            <span class="w m gap-s" data-t="1.35">these</span>
          </div>
          <div id="p2" class="line serif" data-right="934" data-base="1440">
            <span class="bl"></span>
            <span class="w m" data-t="1.57">straight</span>
            <span class="w s gap-s" data-t="1.87">to</span>
            <span class="w s gap-s" data-t="2.03">your</span>
            <span class="w h ital ocean" id="w-inbox" style="margin-left: 0.14em" data-t="2.17" data-hero="1">inbox</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (async () => {
        const fontSpecs = ['600 64px "Newsreader"', 'italic 700 64px "Fraunces"', '600 30px "Geist"'];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }

        const D = 4.033;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        // ---- place each line by its baseline (deterministic layout, measured once) ----
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.center) {
            line.style.left = parseFloat(line.dataset.center) - line.offsetWidth / 2 + "px";
          } else if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }

        // ---- hand-drawn dotted loop: under "design" → top of the card ----
        const PATH =
          "M 604 664 C 596 716, 506 746, 444 740 C 382 734, 352 700, 374 678 " +
          "C 396 656, 444 672, 442 710 C 440 742, 414 766, 398 794";
        $("#dots").setAttribute("d", PATH);
        $("#mask-path").setAttribute("d", PATH);
        const L = $("#mask-path").getTotalLength();
        $("#mask-path").style.strokeDasharray = L + " " + L;

        // ---- coin tower (stacks up out of the pill) ----
        const TOWER_X = 790;
        const BASE_Y = 1082;
        const STEP = 68;
        const coinsEl = $("#coins");
        const coins = [];
        for (let i = 0; i < 5; i++) {
          const c = document.createElement("div");
          c.className = "coin";
          c.style.left = TOWER_X + "px";
          c.style.top = BASE_Y - i * STEP + "px";
          const bump = document.createElement("div");
          bump.className = "coin-bump";
          const rock = document.createElement("div");
          rock.className = "coin-rock";
          const b = document.createElement("div");
          b.className = "coin-body";
          b.textContent = "0" + (i + 1);
          for (const [x, y, w, h] of [
            [53.5, 8, 3, 9],
            [53.5, 93, 3, 9],
            [8, 53.5, 9, 3],
            [93, 53.5, 9, 3],
          ]) {
            const t = document.createElement("span");
            t.className = "tick";
            Object.assign(t.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
            b.appendChild(t);
          }
          rock.appendChild(b);
          bump.appendChild(rock);
          c.appendChild(bump);
          coinsEl.appendChild(c);
          coins.push(c);
        }

        // ================= timeline =================
        const tl = gsap.timeline({ paused: true });

        // background drift (continuous, linear on purpose) + slow camera push
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -12, duration: D, ease: "none" }, 0);
        tl.fromTo(
          "#cam",
          { scale: 1, transformOrigin: "540px 880px" },
          { scale: 1.016, duration: D, ease: "none" },
          0,
        );

        // ---- "Comment": already moving on f0, contact on f3, settled by f10 ----
        gsap.set("#w-comment", { transformOrigin: "50% 85%" });
        tl.fromTo(
          "#w-comment",
          { opacity: 0.25, y: 34, scale: 0.95, filter: "blur(4px)" },
          { opacity: 1, y: -4, scale: 1.01, filter: "blur(0px)", duration: 0.11, ease: "power3.out" },
          0,
        );
        tl.to("#w-comment", { y: 0, scale: 1, duration: 0.24, ease: "sine.inOut" }, 0.11);

        // ---- “design”: opening quote leads, hero word peaks ON "design" (0.21), closing quote follows ----
        gsap.set("#q-open", { transformOrigin: "50% 70%" });
        gsap.set("#q-close", { transformOrigin: "50% 70%" });
        gsap.set("#w-design", { transformOrigin: "50% 90%" });
        tl.fromTo(
          "#q-open",
          { opacity: 0, y: 40, scale: 0.5, rotation: -14 },
          { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.2)" },
          0.02,
        );
        tl.fromTo(
          "#w-design",
          { opacity: 0, y: 90, scale: 0.55, rotation: -7, filter: "blur(8px)" },
          { opacity: 1, y: -10, scale: 1.07, rotation: 1.5, filter: "blur(0px)", duration: 0.165, ease: "power3.out" },
          0.04,
        );
        tl.to("#w-design", { y: 0, scale: 1, rotation: 0, duration: 0.34, ease: "back.out(1.6)" }, 0.21);
        tl.fromTo(
          "#q-close",
          { opacity: 0, y: 40, scale: 0.5, rotation: 14 },
          { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.2)" },
          0.22,
        );

        // ---- dotted line draws down from "design" to the card (0.40–1.00), then keeps marching ----
        tl.fromTo("#mask-path", { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.6, ease: "power1.inOut" }, 0.4);
        tl.fromTo("#dots", { strokeDashoffset: 0 }, { strokeDashoffset: -56, duration: D, ease: "none" }, 0);

        // ---- speaker card: rise + soft 3D settle (0.50–1.12) ----
        gsap.set("#card", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        const C0 = 0.44;
        tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, C0);
        tl.fromTo("#card", { y: 56 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, C0);
        tl.fromTo("#card", { scale: 0.84 }, { scale: 1, duration: 0.48, ease: "back.out(1.5)", immediateRender: false }, C0);
        tl.fromTo("#card", { rotationX: 28 }, { rotationX: 5, duration: 0.62, ease: "back.out(1.8)", immediateRender: false }, C0);
        tl.fromTo("#card", { rotationY: 22 }, { rotationY: 8, duration: 0.55, ease: "power3.out", immediateRender: false }, C0);
        tl.fromTo("#card", { rotation: -7 }, { rotation: -2, duration: 0.6, ease: "back.out(1.4)", immediateRender: false }, C0);
        // slow orbit while holding
        tl.to("#card", { rotationY: 6, rotationX: 3.5, rotation: -1.4, duration: D - (C0 + 0.62), ease: "sine.inOut" }, C0 + 0.62);
        // inner parallax: video settles inside the card, then a slow push (keeps the frozen end frame alive)
        tl.fromTo("#vid-wrap", { scale: 1.16 }, { scale: 1, duration: 0.7, ease: "power3.out" }, C0);
        tl.to("#vid-wrap", { scale: 1.04, duration: D - (C0 + 0.7), ease: "none" }, C0 + 0.7);
        // light catches the card as it settles, and once more in the end hold
        tl.fromTo("#sheen", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, C0 + 0.08);
        tl.fromTo(
          "#sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut", immediateRender: false },
          C0 + 0.08,
        );
        tl.to("#sheen", { opacity: 0, duration: 0.25, ease: "power1.in" }, C0 + 0.55);
        tl.fromTo(
          "#sheen",
          { backgroundPosition: "100% 0", opacity: 0 },
          { backgroundPosition: "0% 0", opacity: 0.8, duration: 0.9, ease: "power2.inOut", immediateRender: false },
          2.7,
        );
        // gentle float
        tl.to("#card-float", { y: -6, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.05);

        // ---- pill pops at the card's corner (receptacle ready before coin 01) ----
        gsap.set("#pill", { transformOrigin: "50% 60%" });
        tl.fromTo(
          "#pill",
          { opacity: 0, scale: 0.5, y: 30 },
          { opacity: 1, scale: 1.06, y: -3, duration: 0.16, ease: "power3.out" },
          0.86,
        );
        tl.to("#pill", { scale: 1, y: 0, duration: 0.26, ease: "back.out(1.6)" }, 1.02);

        // ---- coins roll out from behind the card and stack into the pill, one per word ----
        const LAND = [1.13, 1.33, 1.54, 1.84, 2.0]; // send, these, straight, to, your
        const bumpTargets = (i) => [
          ...coins.slice(0, i).map((c) => c.querySelector(".coin-bump")),
          "#pill-pos",
        ];
        coins.forEach((c, i) => {
          const T = LAND[i];
          const body = c.querySelector(".coin-body");
          const rock = c.querySelector(".coin-rock");
          const s = T - 0.32;
          gsap.set(body, { transformOrigin: "50% 100%" });
          tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, s);
          // x leads (power3.out), y rises then drops onto the stack → an arc
          tl.fromTo(c, { x: -175 }, { x: 0, duration: 0.32, ease: "power3.out" }, s);
          tl.fromTo(c, { y: 26 }, { y: -44, duration: 0.19, ease: "power2.out" }, s);
          tl.fromTo(c, { y: -44 }, { y: 0, duration: 0.13, ease: "power2.in", immediateRender: false }, s + 0.19);
          // rolling: a turn that settles upright as it lands
          tl.fromTo(rock, { rotation: -150 }, { rotation: 0, duration: 0.34, ease: "power3.out" }, s);
          // contact squash (shape only) + settle
          tl.fromTo(body, { scaleX: 1, scaleY: 1 }, { scaleX: 1.06, scaleY: 0.93, duration: 2 * F, ease: "power2.out", immediateRender: false }, T);
          tl.to(body, { scaleX: 1, scaleY: 1, duration: 0.24, ease: "back.out(2)" }, T + 2 * F);
          // the stack and the pill take the weight
          for (const b of bumpTargets(i)) {
            tl.fromTo(b, { y: 0 }, { y: 5, duration: 0.06, ease: "power2.out", immediateRender: false }, T);
            tl.fromTo(b, { y: 5 }, { y: 0, duration: 0.2, ease: "back.out(2)", immediateRender: false }, T + 0.06);
          }
        });

        // ---- word entrances (contact on the spoken word) ----
        for (const w of $$("#p1 .w, #p2 .w")) {
          const t = parseFloat(w.dataset.t);
          if (w.dataset.hero) {
            const s0 = t - 0.18;
            gsap.set(w, { transformOrigin: "45% 90%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 70, scale: 0.6, rotation: -6, filter: "blur(6px)" },
              { opacity: 1, y: -6, scale: 1.06, rotation: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" },
              s0,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, t);
          } else {
            const s0 = Math.max(0, t - 0.13);
            tl.fromTo(
              w,
              { opacity: 0, y: 40, filter: "blur(5px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
              s0,
            );
          }
        }

        // ---- "inbox" beat: pill pulse, arrow nudge, stack bump, tiny camera punch ----
        const IB = 2.17;
        tl.fromTo("#pill", { scale: 1 }, { scale: 1.08, duration: 0.1, ease: "power2.out", immediateRender: false }, IB - 0.04);
        tl.to("#pill", { scale: 1, duration: 0.32, ease: "back.out(2)" }, IB + 0.06);
        tl.fromTo("#pill-arrow", { x: 0 }, { x: 9, duration: 0.12, ease: "power2.out" }, IB - 0.04);
        tl.to("#pill-arrow", { x: 0, duration: 0.3, ease: "back.out(2)" }, IB + 0.08);
        tl.fromTo("#pill-arrow", { color: "#FBFAF8" }, { color: "#2E9CCB", duration: 0.16, ease: "power1.out", immediateRender: false }, IB - 0.04);
        tl.fromTo(
          "#punch",
          { scale: 1, transformOrigin: "540px 900px" },
          { scale: 1.01, duration: 0.45, ease: "power2.out" },
          IB - 0.02,
        );

        // ---- end hold (2.43 → end, speaker frozen): stack floats and the coins rock gently ----
        tl.fromTo(["#coins", "#pill-layer"], { y: 0 }, { y: -6, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.4);
        coins.forEach((c, i) => {
          const rock = c.querySelector(".coin-rock");
          tl.to(rock, { rotation: i % 2 ? -5 : 5, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.42 + i * 0.07);
        });

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
</html>
