<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v05 refine</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette (identical to v01_hook) ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      /* ---------- camera ---------- */
      #cam,
      #punch {
        position: absolute;
        inset: 0;
      }

      /* ---------- README browser card (chapter, behind the speaker card) ---------- */
      #readme-float {
        position: absolute;
        left: 262px;
        top: 826px;
        width: 668px;
        height: 540px;
      }
      #readme {
        position: absolute;
        inset: 0;
        border-radius: 24px;
        overflow: hidden;
        background: var(--brand-card);
        box-shadow: 0 30px 50px -12px rgba(60, 50, 40, 0.3);
      }
      #chrome {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 58px;
        background: var(--brand-card);
        display: flex;
        align-items: center;
        padding-left: 22px;
        gap: 9px;
        border-bottom: 1.5px solid #ece7e1;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #d9d3cc;
        flex: none;
      }
      #url {
        margin-left: 14px;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: var(--brand-muted);
        white-space: nowrap;
      }
      #viewport {
        position: absolute;
        left: 0;
        top: 58px;
        width: 100%;
        height: 482px;
        overflow: hidden;
        background: #0d1117;
      }
      #readme-img {
        position: absolute;
        left: 0;
        top: 0;
        width: 668px;
        height: auto;
        display: block;
      }

      /* ---------- speaker card (same treatment as v01_hook, secondary size) ---------- */
      #card-float {
        position: absolute;
        left: 84px;
        top: 994px;
        width: 560px;
        height: 390px;
      }
      #card {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      #vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 30px;
      }
      /* source 1080x1920 scaled to the card width (560x996); window = 20.5%–59.6% of the source height (face centred) */
      #speaker {
        position: absolute;
        left: 0;
        top: -204px;
        width: 560px;
        height: 996px;
        object-fit: cover;
      }
      #sheen {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 45%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }

      /* ---------- dotted links (pill → cards) ---------- */
      #links {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }

      /* ---------- fan of variation cards ---------- */
      .vc {
        position: absolute;
      }
      .vc-float,
      .vc-lift,
      .vc-flip {
        position: absolute;
        inset: 0;
      }
      .vc-flip {
        transform-style: preserve-3d;
      }
      .face {
        position: absolute;
        inset: 0;
        border-radius: 24px;
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .face.front {
        background: var(--brand-card);
        box-shadow: 0 30px 50px -12px rgba(60, 50, 40, 0.3);
      }
      .face.back {
        background: var(--brand-deep);
        box-shadow:
          0 12px 0 -2px var(--brand-primary),
          0 34px 54px -12px rgba(30, 30, 30, 0.38);
        transform: rotateY(180deg);
      }
      .r {
        position: absolute;
      }

      /* ---------- merged card ---------- */
      #merged-wrap {
        position: absolute;
        left: 210px;
        top: 530px;
        width: 600px;
        height: 340px;
      }
      #glow {
        position: absolute;
        left: -260px;
        top: -260px;
        width: 1120px;
        height: 860px;
        background: radial-gradient(ellipse at 50% 50%, rgba(46, 156, 203, 0.5), rgba(46, 156, 203, 0) 60%);
        opacity: 0;

      #merged-pop {
        position: absolute;
        inset: 0;
      }
      #merged {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        overflow: hidden;
        background: var(--brand-deep);
        box-shadow:

      #merged-light {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 40%, rgba(255, 255, 255, 0.55), rgba(46, 156, 203, 0.25) 70%);

      }
      #mpill {
        position: absolute;
        right: -26px;
        top: -34px;
        height: 64px;
        padding: 0 28px 0 22px;
        border-radius: 32px;
        background: var(--brand-text);
        color: #fbfaf8;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 32px;
        letter-spacing: -0.01em;
        box-shadow: 0 16px 28px -8px rgba(30, 25, 20, 0.35);
        white-space: nowrap;
      }
      #mpill i {
        display: block;
        width: 14px;
        height: 14px;
        border-radius: 50%;

      }

      /* ---------- codebase pill ---------- */
      #pill-row {
        position: absolute;
        left: 0;
        top: 936px;
        width: 1080px;
        height: 84px;
        display: flex;
        justify-content: center;

      #pill {
        position: relative;
        height: 84px;
        padding: 0 40px 0 34px;

      #pill .code {
        color: var(--brand-primary);

      #badge {

      #badge svg {

      #ring {
        position: absolute;
        width: 72px;
        height: 72px;
        right: -44px;
        top: -38px;
        border-radius: 50%;
        border: 4px solid var(--brand-primary);
        opacity: 0;

      /* ---------- coin 02 ---------- */
      #coin {
        position: absolute;
        left: 86px;
        top: 320px;
        width: 220px;
        height: 220px;
      }
      #coin-body {
        position: absolute;
        inset: 0;

      .coin-face {
        position: absolute;
        inset: 0;
        border-radius: 50%;

        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
        font-weight: 600;

      #coin-ocean {

      .tick {

      #coin-white .tick {
        background: #cfc9c2;

      #coin-ocean .tick {

      /* ---------- kinetic serif ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.95;
        letter-spacing: -0.015em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .serif {
        font-family: var(--font-heading);
        font-weight: 600;
        color: var(--brand-text);
      }
      .ital {
        font-family: var(--font-accent);

        font-style: italic;
        letter-spacing: -0.02em;

      .ocean {
        color: var(--brand-primary);

      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.24em;
      }
      .slug {
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 38px;
        letter-spacing: -0.01em;
        color: var(--brand-muted);
      }

      .sw {
        display: inline-block;
      }

      /* ---------- cursor ---------- */
      #cursor-pos {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
      }
      #cursor {
        position: absolute;
        left: -8px;
        top: -8px;
        width: 81px;
        height: 113px;
        filter: drop-shadow(0 10px 12px rgba(40, 30, 20, 0.28));
      }
    </style>
  </head>

    <script>
      (async () => {
        const fontSpecs = ['600 64px "Newsreader"', 'italic 700 64px "Fraunces"', '600 30px "Geist"', '500 30px "Geist"'];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }
        const img = document.getElementById("readme-img");
        if (!img.complete) await new Promise((res) => img.addEventListener("load", res, { once: true }));

        const D = 8.466;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const rad = Math.PI / 180;

        // ---------------- layout: place each line by its baseline ----------------
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.dataset.bo = baseOff;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }

        // ---------------- coin ticks ----------------
        for (const face of $$(".coin-face")) {
          for (const [x, y, w, h] of [
            [107, 14, 6, 18],
            [107, 188, 6, 18],
            [14, 107, 18, 6],
            [188, 107, 18, 6],
          ]) {
            const t = document.createElement("span");
            t.className = "tick";
            Object.assign(t.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
            face.appendChild(t);
          }
        }

        // ---------------- fan cards ----------------
        const CW = 188,
          CH = 276;
        const SX = CW / 196,
          SY = CH / 284;
        const SLOTS = [
          { x: 190, y: 716, r: -8 },
          { x: 350, y: 680, r: -3.5 },
          { x: 510, y: 668, r: 0 },
          { x: 670, y: 680, r: 3.5 },
          { x: 830, y: 716, r: 8 },
        ];
        // [x, y, w, h, radius, kind] in a 196x284 design space
        // kinds: b bar, k block, K block (ocean tint when picked), a accent (button), c circle
        const rows4 = [];
        for (const y of [20, 68, 116]) {
          rows4.push([16, y, 36, 36, 18, y === 20 ? "a" : "c"], [62, y + 6, 112, 10, 5, "b"], [62, y + 22, 72, 10, 5, "b"]);
        }
        const LAYOUTS = [
          [
            [16, 18, 60, 10, 5, "b"],
            [16, 40, 164, 118, 14, "k"],
            [16, 174, 150, 11, 5.5, "b"],
            [16, 193, 112, 11, 5.5, "b"],
            [16, 230, 84, 32, 16, "a"],
          ],
          [
            [16, 18, 164, 28, 10, "b"],
            [16, 58, 78, 72, 12, "a"],
            [102, 58, 78, 72, 12, "k"],
            [16, 138, 78, 72, 12, "k"],
            [102, 138, 78, 72, 12, "K"],
            [16, 224, 128, 11, 5.5, "b"],
            [16, 243, 84, 11, 5.5, "b"],
          ],
          [
            [16, 18, 44, 10, 5, "b"],
            [16, 38, 150, 16, 8, "b"],
            [16, 68, 164, 146, 14, "k"],
            [16, 228, 164, 10, 5, "b"],
            [16, 245, 134, 10, 5, "b"],
            [16, 262, 92, 10, 5, "b"],
          ],
          [...rows4, [16, 166, 164, 52, 12, "K"], [16, 232, 164, 34, 17, "a"]],
          [

        tl.to("#merged-wrap", { y: 912 - MY - 4, duration: 0.3, ease: "back.out(2)" }, 7.9 + 3 * F);
        // ghosts recede a bit more
        [0, 2, 4].forEach((i) => tl.to(cards[i].el, { opacity: 0.2, duration: 0.3, ease: "power1.out" }, 7.6));
        // pill: squash on contact (shape), ocean ✓ badge, ring pulse
        tl.to(pill, { scaleX: 1.07, scaleY: 0.86, duration: 3 * F, ease: "power2.out" }, 7.9);
        tl.to(pill, { scaleX: 1.16, scaleY: 1.16, duration: 0.36, ease: "back.out(2.2)" }, 7.9 + 3 * F);
        gsap.set("#badge", { transformOrigin: "50% 50%" });
        tl.fromTo("#badge", { opacity: 0, scale: 0.2, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.34, ease: "back.out(2.2)" }, 7.86);
        const tick = $("#tick");
        const tl0 = tick.getTotalLength() + 2;
        tick.style.strokeDasharray = `${tl0} ${tl0}`;
        tl.fromTo(tick, { strokeDashoffset: tl0 }, { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, 7.98);
        gsap.set("#ring", { transformOrigin: "50% 50%" });
        tl.fromTo(
          "#ring",
          { opacity: 0.8, scale: 1 },
          { opacity: 0, scale: 2.3, duration: 0.5, ease: "power2.out", immediateRender: false },
          8.0,
        );
        tl.fromTo(pill, { y: 0 }, { y: -5, duration: 0.3, ease: "sine.inOut" }, 8.16);

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
