<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v02 skills</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      /* ---------- camera ---------- */
      #cam,
      #punch {
        position: absolute;
        inset: 0;
      }

      /* ================= BEAT A: secondary speaker card ================= */
      #a-card-pos {
        position: absolute;
        left: 240px;
        top: 326px;
        width: 560px;
        height: 390px;
      }
      #a-card-float,
      #a-card {
        position: absolute;
        inset: 0;
      }
      #a-card {
        border-radius: 30px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      #a-vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 30px;
      }
      /* source 1080x1920 scaled to the card width (560x996); window = 21.6%–60.8% of source height, face centred */
      #speaker {
        position: absolute;
        left: 0;
        top: -215px;
        width: 560px;
        height: 996px;
        object-fit: cover;
      }
      #a-sheen {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 45%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }

      /* ---------- kinetic serif ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.95;
        letter-spacing: -0.015em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .serif {
        font-family: var(--font-heading);
        font-weight: 600;
        color: var(--brand-text);
      }
      .ital {
        font-family: var(--font-accent);
        font-weight: 700;
        font-style: italic;
        letter-spacing: -0.02em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.24em;
      }

      #a1 {
        font-size: 84px;
      }
      #a2 .big,
      #a3 .big {
        font-size: 240px;
        line-height: 0.9;
      }
      #a2 .mid {
        font-size: 124px;
        margin-left: 0.16em;
      }
      #a4 {
        font-size: 130px;
      }

      #b1 {
        font-size: 270px;
        line-height: 0.9;
      }
      #b2 {
        font-size: 128px;
      }
      #b3 {
        font-size: 124px;
      }
      #b4 {
        font-size: 104px;
      }
      #b5 {
        font-size: 124px;
      }
      #b6 {
        font-size: 220px;
        line-height: 0.9;
      }

      /* ================= BEAT B: SKILL.md envelope card ================= */
      #box-pos {
        position: absolute;
        left: 160px;
        top: 720px;
        width: 700px;
        height: 440px;
      }
      #box-lift,
      #box-float,
      #box-bump,
      #box {
        position: absolute;
        inset: 0;
      }
      #body {
        position: absolute;
        inset: 0;
        z-index: 3;
        border-radius: 28px;
        background: linear-gradient(180deg, #12323e 0%, #0d2731 50%, #0b222b 100%);
        box-shadow:
          0 14px 0 -2px var(--brand-primary),
          0 46px 64px -12px rgba(40, 30, 20, 0.42),
          inset 0 2px 0 rgba(251, 250, 248, 0.07);
      }
      #bx-label {
        position: absolute;
        left: 54px;
        top: 282px;
        display: flex;
        align-items: center;
        gap: 22px;
      }
      #bx-dot-wrap {
        position: relative;
        width: 28px;
        height: 28px;
      }
      #bx-dot,
      #bx-ping {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--brand-primary);
      }
      #bx-ping {
        opacity: 0;
      }
      #bx-name {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 74px;
        letter-spacing: -0.01em;
        color: var(--brand-card);
        line-height: 1;
      }
      .bx-bar {
        position: absolute;
        left: 54px;
        height: 14px;
        border-radius: 7px;
        background: rgba(251, 250, 248, 0.1);
      }

      /* the fold-over lid: two faces, flips about its top edge */
      #flap {
        position: absolute;
        left: 0;
        top: 0;
        width: 700px;
        height: 230px;
        z-index: 5;
        transform-style: preserve-3d;
      }
      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .face svg {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      #face-out {
        filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.32));
      }
      #face-in {
        transform: rotateX(180deg);
      }
      #seal {
        position: absolute;
        left: 322px;
        top: 150px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #6cc0e3 0%, var(--brand-primary) 45%, var(--brand-primary-dark) 100%);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
        opacity: 0;
      }

      /* contents: instruction strips + resource chips (sit between lid and front) */
      #items {
        position: absolute;
        left: 0;
        top: 0;
        width: 700px;
        height: 440px;
        z-index: 2;
      }
      .strip {
        position: absolute;
        left: 30px;
        width: 640px;
        height: 124px;
        border-radius: 22px;
        background: var(--brand-card);
        box-shadow:
          0 18px 30px -12px rgba(30, 25, 20, 0.45),
          0 -2px 10px rgba(0, 0, 0, 0.12);
        opacity: 0;
      }
      .strip .h {
        position: absolute;
        left: 28px;
        top: 12px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 39px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--brand-text);
        white-space: nowrap;
      }
      .strip .h .n {
        color: var(--brand-primary-dark);
        margin-right: 0.3em;
      }
      .strip .bar {
        position: absolute;
        left: 28px;
        height: 12px;
        border-radius: 6px;
        background: #e5e0da;
      }
      #s1 {
        top: -192px;
      }
      #s2 {
        top: -128px;
      }
      #s3 {
        top: -64px;
      }
      .chip {
        position: absolute;
        width: 132px;
        height: 132px;
        border-radius: 32px;
        background: radial-gradient(circle at 35% 30%, #ffffff, #f1eeea 75%);
        box-shadow: 0 18px 30px rgba(60, 50, 40, 0.24);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
      .chip-aa {
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 68px;
        letter-spacing: -0.02em;
        color: var(--brand-text);
        line-height: 1;
        margin-top: -4px;
      }
      .chip-code {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 50px;
        letter-spacing: -0.04em;
        color: var(--brand-primary-dark);
        line-height: 1;
      }

      /* ================= dotted path + agent puck ================= */
      #paths {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      #puck-pos {
        position: absolute;
        left: 450px;
        top: 340px;
        width: 300px;
        height: 300px;
      }
      #puck-float,
      #puck-bob,
      #puck {
        position: absolute;
        inset: 0;
      }
      #puck-glow {
        position: absolute;
        left: -110px;
        top: -110px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(46, 156, 203, 0.5) 0%,
          rgba(46, 156, 203, 0.2) 42%,
          rgba(46, 156, 203, 0) 70%
        );
        opacity: 0;
      }
      #puck-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow:
          0 0 0 9px var(--brand-primary),
          0 0 46px 14px rgba(46, 156, 203, 0.45);
        opacity: 0;
      }
      #puck-disc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 26%, #3d3d3d 0%, #1d1d1d 42%, #141414 72%);
        box-shadow:
          0 34px 54px -10px rgba(40, 30, 20, 0.5),
          inset 0 -8px 18px rgba(0, 0, 0, 0.45);
      }
      #visor {
        position: absolute;
        left: 58px;
        top: 106px;
        width: 184px;
        height: 92px;
        border-radius: 46px;
        background: linear-gradient(180deg, #070707 0%, #1f1f1f 100%);
        box-shadow:
          inset 0 3px 8px rgba(0, 0, 0, 0.7),
          0 1px 0 rgba(255, 255, 255, 0.09);
      }
      .eye {
        position: absolute;
        top: 30px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--brand-primary);
        opacity: 0.32;
      }
      #eye-l {
        left: 42px;
      }
      #eye-r {
        left: 110px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1080"
      data-height="1920"
      data-duration="6.533"
    >
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <div id="punch">
          <!-- ===== BEAT A ===== -->
          <div id="a-card-pos">
            <div id="a-card-float">
              <div id="a-card">
                <div id="a-vid-wrap">
                  <video
                    id="speaker"
                    class="clip"
                    src="assets/speaker.mp4"
                    muted
                    playsinline
                    data-start="0"
                    data-duration="1.8"
                    data-track-index="1"
                  ></video>
                </div>
                <div id="a-sheen"></div>
              </div>
            </div>
          </div>

          <div id="a1" class="line serif" data-x="150" data-base="826">
            <span class="bl"></span>
            <span class="w" data-t="0.08">if</span>
            <span class="w gap-s" data-t="0.22">you're</span>
          </div>
          <div id="a2" class="line ital ocean" data-x="138" data-base="1026">
            <span class="bl"></span>
            <span class="w big" data-t="0.38" data-kind="hero" data-origin="40% 85%">new</span>
            <span class="w mid" data-t="0.56" data-kind="pop">to</span>
          </div>
          <div id="a3" class="line ital ocean" data-right="905" data-base="1232">
            <span class="bl"></span>
            <span class="w big" data-t="0.72" data-kind="hero" data-origin="30% 85%">AI,</span>
          </div>
          <div id="a4" class="line serif" data-x="122" data-base="1400">
            <span class="bl"></span>
            <span class="w" data-t="1.14">don't</span>
            <span class="w gap-s" data-t="1.30" data-fast="1">worry.</span>
          </div>

          <!-- ===== BEAT B ===== -->
          <svg id="paths" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
                <path
                  id="travel-mask"
                  d="M510 940 C340 954 236 806 300 664 C356 548 482 502 600 490"
                  fill="none"
                  stroke="#fff"
                  stroke-width="26"
                  stroke-linecap="round"
                />
              </mask>
            </defs>
            <path
              id="travel"
              d="M510 940 C340 954 236 806 300 664 C356 548 482 502 600 490"
              fill="none"
              stroke="#141414"
              stroke-width="3"
              stroke-linecap="round"
              stroke-dasharray="2 12"
              mask="url(#reveal)"
            />
          </svg>

          <div id="box-pos">
            <div id="box-lift">
            <div id="box-float">
              <div id="box-bump">
                <div id="box">
                  <!-- lid -->
                  <div id="flap">
                    <div id="face-out" class="face">
                      <svg width="700" height="230" viewBox="0 0 700 230">
                        <defs>
                          <linearGradient id="g-out" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#173c4b" />
                            <stop offset="1" stop-color="#11313d" />
                          </linearGradient>
                        </defs>
                        <path d="M0 28 Q0 0 28 0 L672 0 Q700 0 700 28 L388 206 Q350 228 312 206 Z" fill="url(#g-out)" />
                      </svg>
                      <div id="seal"></div>
                    </div>
                    <div id="face-in" class="face">
                      <svg width="700" height="230" viewBox="0 0 700 230">
                        <defs>
                          <linearGradient id="g-in" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#1d5168" />
                            <stop offset="1" stop-color="#133a49" />
                          </linearGradient>
                        </defs>
                        <path d="M0 202 Q0 230 28 230 L672 230 Q700 230 700 202 L388 24 Q350 2 312 24 Z" fill="url(#g-in)" />
                      </svg>
                    </div>
                  </div>

                  <!-- contents -->
                  <div id="items">
                    <div id="c1" class="chip"><span class="chip-aa">Aa</span></div>
                    <div id="c2" class="chip">
                      <svg width="98" height="42" viewBox="0 0 92 40">
                        <circle cx="20" cy="20" r="19" fill="#2E9CCB" />
                        <circle cx="46" cy="20" r="19" fill="#1F7EA8" />
                        <circle cx="72" cy="20" r="19" fill="#0D2731" />
                      </svg>
                    </div>
                    <div id="c3" class="chip">
                      <svg width="86" height="69" viewBox="0 0 80 64">
                        <defs>
                          <clipPath id="img-clip"><rect x="0" y="0" width="80" height="64" rx="12" /></clipPath>
                        </defs>
                        <g clip-path="url(#img-clip)">
                          <rect x="0" y="0" width="80" height="64" fill="#D3E7F0" />
                          <circle cx="58" cy="18" r="8" fill="#2E9CCB" />
                          <path d="M-4 64 L26 30 L46 52 L58 40 L86 64 Z" fill="#1F7EA8" />
                          <path d="M-4 64 L22 40 L44 64 Z" fill="#0D2731" />
                        </g>
                      </svg>
                    </div>
                    <div id="c4" class="chip"><span class="chip-code">&lt;/&gt;</span></div>
                    <div id="s1" class="strip">
                      <div class="h"><span class="n">0.</span>Brief inference</div>
                      <div class="bar" style="top: 74px; width: 400px"></div>
                    </div>
                    <div id="s2" class="strip">
                      <div class="h"><span class="n">0.A</span>Read these signals first</div>
                      <div class="bar" style="top: 74px; width: 470px"></div>
                    </div>
                    <div id="s3" class="strip">
                      <div class="h"><span class="n">0.D</span>Anti-default discipline</div>
                      <div class="bar" style="top: 74px; width: 430px"></div>
                    </div>

                  </div>

                  <!-- front -->
                  <div id="body">
                    <div id="bx-label">
                      <div id="bx-dot-wrap">
                        <div id="bx-ping"></div>
                        <div id="bx-dot"></div>
                      </div>
                      <div id="bx-name">SKILL.md</div>
                    </div>
                    <div class="bx-bar" style="top: 384px; width: 340px"></div>
                    <div class="bx-bar" style="top: 408px; width: 220px"></div>
                  </div>
                </div>
              </div>
            </div>
            </div>
          </div>

          <!-- agent puck (above the card so the card slides under it) -->
          <div id="puck-pos">
            <div id="puck-float">
              <div id="puck-bob">
                <div id="puck">
                  <div id="puck-glow"></div>
                  <div id="puck-ring"></div>
                  <div id="puck-disc">
                    <div id="visor">
                      <div id="eye-l" class="eye"></div>
                      <div id="eye-r" class="eye"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- beat B kinetic labels -->
          <div id="b1" class="line ital ocean" data-x="170" data-base="1262">
            <span class="bl"></span>
            <span class="w" data-t="1.8" data-kind="hero" data-origin="30% 85%" data-dy="20">skills</span>
          </div>
          <div id="b2" class="line serif" data-x="110" data-base="1306">
            <span class="bl"></span>
            <span class="w" data-t="3.32">repackaging</span>
          </div>
          <div id="b3" class="line ital ocean" data-x="84" data-base="1296">
            <span class="bl"></span>
            <span class="w" data-t="4.00" data-kind="accent">instructions</span>
          </div>
          <div id="b4" class="line serif" data-right="935" data-base="1436">
            <span class="bl"></span>
            <span class="w" data-t="4.43">+</span>
            <span class="w gap-s" data-t="4.58">resources</span>
          </div>
          <div id="b5" class="line ital ink" data-x="126" data-base="1236">
            <span class="bl"></span>
            <span class="w" data-t="5.78" data-kind="pop">to</span>
            <span class="w gap-s" data-t="5.90" data-kind="pop">your</span>
          </div>
          <div id="b6" class="line ital ocean" data-right="905" data-base="1388">
            <span class="bl"></span>
            <span class="w" data-t="6.10" data-kind="hero" data-origin="70% 85%" data-dy="44">agents.</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (async () => {
        const fontSpecs = [
          '600 64px "Newsreader"',
          'italic 700 64px "Fraunces"',
          '600 30px "Geist"',
          '500 30px "Geist"',
        ];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }
        gsap.registerPlugin(MotionPathPlugin);

        const D = 6.533;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        // ---- place each kinetic line by its baseline (deterministic, measured once) ----
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }

        const tl = gsap.timeline({ paused: true });

        // ================= continuous life =================
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -12, duration: D, ease: "none" }, 0);
        tl.fromTo(
          "#cam",
          { scale: 1, transformOrigin: "510px 880px" },
          { scale: 1.02, duration: D, ease: "none" },
          0,
        );

        // ================= word entrances (contact frame on the spoken word) =================
        for (const w of $$(".line .w")) {
          const t = parseFloat(w.dataset.t);
          const kind = w.dataset.kind;
          if (kind === "hero") {
            const s = Math.max(0, t - 0.2);
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: parseFloat(w.dataset.dy || 80), scale: 0.55, rotation: -7, filter: "blur(8px)" },
              { opacity: 1, y: -8, scale: 1.1, rotation: 1.5, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, s + 0.2);
          } else if (kind === "pop") {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 60, scale: 0.72, rotation: -5, filter: "blur(6px)" },
              { opacity: 1, y: -5, scale: 1.06, rotation: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.28, ease: "back.out(1.5)" }, s + 0.16);
          } else if (kind === "accent") {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: "30% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 56, scale: 0.78, rotation: -6, filter: "blur(6px)" },
              { opacity: 1, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.46, ease: "back.out(2.2)" },
              s,
            );
          } else {
            const fast = !!w.dataset.fast;
            const s = Math.max(0, t - (fast ? 0.1 : 0.13));
            tl.fromTo(
              w,
              { opacity: 0, y: 40, filter: "blur(5px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: fast ? 0.26 : 0.36, ease: "power3.out" },
              s,
            );
          }
        }

        // ================= BEAT A: speaker card =================
        gsap.set("#a-card", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        tl.fromTo("#a-card", { opacity: 0.3 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 0);
        tl.fromTo("#a-card", { y: 96 }, { y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 0);
        tl.fromTo("#a-card", { scale: 0.9 }, { scale: 1, duration: 0.44, ease: "back.out(1.5)", immediateRender: false }, 0);
        tl.fromTo("#a-card", { rotationX: 24 }, { rotationX: 5, duration: 0.56, ease: "back.out(1.8)", immediateRender: false }, 0);
        tl.fromTo("#a-card", { rotationY: 18 }, { rotationY: 8, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
        tl.to("#a-card", { rotationY: 5.5, rotationX: 3.5, duration: 0.82, ease: "sine.inOut" }, 0.56);
        tl.fromTo("#a-vid-wrap", { scale: 1.14 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0);
        tl.to("#a-vid-wrap", { scale: 1.03, duration: 0.8, ease: "none" }, 0.6);
        tl.fromTo("#a-sheen", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 0.04);
        tl.fromTo(
          "#a-sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.6, ease: "power2.inOut", immediateRender: false },
          0.04,
        );
        tl.to("#a-sheen", { opacity: 0, duration: 0.2, ease: "power1.in" }, 0.46);
        tl.to("#a-card-float", { y: -7, duration: 0.46, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.44);

        // beat A clears: card + upper lines lift away 1 f apart; "don't worry." holds a beat longer, then drops away
        tl.to("#a-card-pos", { y: -70, scale: 0.95, opacity: 0, filter: "blur(4px)", duration: 0.16, ease: "power2.in" }, 1.34);
        ["#a1", "#a2", "#a3"].forEach((id, i) =>
          tl.to(id, { y: -50, opacity: 0, filter: "blur(6px)", duration: 0.16, ease: "power2.in" }, 1.34 + i * F),
        );
        tl.to("#a4", { y: 36, opacity: 0, filter: "blur(6px)", duration: 0.16, ease: "power2.in" }, 1.48);

        // ================= BEAT B: SKILL.md card rises (contact on "Skills") =================
        const B0 = 1.56;
        gsap.set("#box", { transformPerspective: 1600, transformOrigin: "50% 60%" });
        gsap.set("#box-bump", { transformOrigin: "50% 100%" });
        gsap.set("#box-pos", { transformOrigin: "50% 50%" });
        // B1 home is 160 px higher; it sets down when the lid opens
        tl.fromTo("#box-lift", { y: -160 }, { y: -160, duration: 0.01, ease: "none" }, 0);
        tl.fromTo("#box", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, B0);
        tl.fromTo("#box", { y: 60 }, { y: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, B0);
        tl.fromTo("#box", { scale: 0.8 }, { scale: 1, duration: 0.4, ease: "back.out(1.7)", immediateRender: false }, B0);
        tl.fromTo("#box", { rotationX: 26 }, { rotationX: 6, duration: 0.5, ease: "back.out(1.8)", immediateRender: false }, B0);
        tl.fromTo("#box", { rotationY: -18 }, { rotationY: -6, duration: 0.48, ease: "power3.out", immediateRender: false }, B0);
        tl.to("#box", { rotationY: -2.5, rotationX: 4, duration: 3.0, ease: "sine.inOut" }, B0 + 0.5);
        tl.to("#box-float", { y: -7, duration: 0.76, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.0);

        // label details: dot pops, bars draw, ping on "easy"
        gsap.set(".bx-bar", { transformOrigin: "0% 50%" });
        tl.fromTo("#bx-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.6)" }, 1.8);
        tl.fromTo(".bx-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.36, ease: "power3.out", stagger: 3 * F }, 1.86);
        tl.fromTo("#bx-ping", { scale: 1, opacity: 0.75 }, { scale: 3.2, opacity: 0, duration: 0.7, ease: "power2.out" }, 2.38);

        // ---- "repackaging": "skills" is pushed out, card squashes, sets down, lid flips open ----
        tl.to("#b1", { y: 46, opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, 3.0);
        tl.to("#box-bump", { scaleY: 0.972, scaleX: 1.012, duration: 0.1, ease: "power2.out" }, 3.04);
        tl.to("#box-bump", { scaleY: 1, scaleX: 1, duration: 0.36, ease: "back.out(2.2)" }, 3.16);
        tl.to("#box-lift", { y: 0, duration: 0.32, ease: "power3.inOut" }, 3.08);
        gsap.set("#flap", { transformPerspective: 1400, transformOrigin: "50% 0%" });
        tl.to("#flap", { rotationX: -5, duration: 0.1, ease: "power2.out" }, 3.04);
        tl.to("#flap", { rotationX: 90, duration: 0.11, ease: "power2.in" }, 3.14);
        tl.set("#flap", { zIndex: 1 }, 3.25);
        tl.to("#flap", { rotationX: 180, duration: 0.32, ease: "back.out(1.7)" }, 3.25);

        // "repackaging" clears for "instructions"
        tl.to("#b2", { y: -36, opacity: 0, filter: "blur(6px)", duration: 0.17, ease: "power2.in" }, 3.64);

        // ---- three instruction strips arc down from above and dunk into the pocket ----
        const strips = [
          { el: "#s1", T: 4.0, x: -56, y: -170, apex: -190, r0: -6, r1: -1.4 },
          { el: "#s2", T: 4.14, x: 56, y: -150, apex: -170, r0: 5, r1: 1.1 },
          { el: "#s3", T: 4.28, x: -50, y: -140, apex: -160, r0: -5, r1: -0.6 },
        ];
        for (const s of strips) {
          const st = s.T - 0.28;
          tl.fromTo(s.el, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "none" }, st);
          tl.fromTo(s.el, { x: s.x }, { x: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, st);
          // small lift (anticipation), then an accelerating fall into the slot; x eases out → arc
          tl.fromTo(s.el, { y: s.y }, { y: s.apex, duration: 0.08, ease: "power2.out", immediateRender: false }, st);
          tl.to(s.el, { y: 10, duration: 0.2, ease: "power2.in" }, st + 0.08);
          tl.to(s.el, { y: 0, duration: 0.2, ease: "back.out(2)" }, s.T);
          tl.fromTo(
            s.el,
            { rotation: s.r0, scale: 0.9 },
            { rotation: s.r1, scale: 1, duration: 0.34, ease: "back.out(1.5)", immediateRender: false },
            st,
          );
        }
        // card dips on each strip contact
        tl.fromTo(
          "#box-bump",
          { y: 0 },
          {
            keyframes: [
              { y: 6, duration: 0.05, ease: "power2.out" },
              { y: 1.5, duration: 0.09, ease: "sine.inOut" },
              { y: 6, duration: 0.05, ease: "power2.out" },
              { y: 1.5, duration: 0.09, ease: "sine.inOut" },
              { y: 6, duration: 0.05, ease: "power2.out" },
              { y: 0, duration: 0.25, ease: "back.out(2.4)" },
            ],
            immediateRender: false,
          },
          4.0,
        );

        // ---- four resource chips hop in from the sides, hang over the pocket, drop in behind the strips ----
        // apex = chip top-left in card coords (card origin = screen 160,720)
        const chips = [
          { el: "#c1", A: 4.46, ax: 40, ay: -336, sx: -140, sy: 30, r0: -18, r1: -6 },
          { el: "#c2", A: 4.54, ax: 204, ay: -362, sx: -120, sy: -60, r0: -14, r1: 4 },
          { el: "#c3", A: 4.62, ax: 368, ay: -352, sx: 120, sy: -60, r0: 14, r1: -4 },
          { el: "#c4", A: 4.7, ax: 530, ay: -332, sx: 130, sy: 30, r0: 18, r1: 6 },
        ];
        for (const c of chips) {
          gsap.set(c.el, { left: c.ax, top: c.ay });
          const st = c.A - 0.24;
          tl.fromTo(c.el, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "none" }, st);
          // x steady, y rises fast and levels: a convex hop
          tl.fromTo(c.el, { x: c.sx }, { x: 0, duration: 0.24, ease: "sine.out", immediateRender: false }, st);
          tl.fromTo(c.el, { y: c.sy }, { y: -14, duration: 0.24, ease: "power3.out", immediateRender: false }, st);
          tl.to(c.el, { y: 0, duration: 0.1, ease: "sine.inOut" }, c.A);
          tl.fromTo(
            c.el,
            { rotation: c.r0, scale: 0.7 },
            { rotation: c.r1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false },
            st,
          );
          tl.to(c.el, { y: 420, rotation: c.r1 * 0.4, duration: 0.2, ease: "power2.in" }, c.A + 0.1);
        }
        tl.fromTo(
          "#box-bump",
          { y: 0 },
          {
            keyframes: [
              { y: 4, duration: 0.05, ease: "power2.out" },
              { y: 1, duration: 0.03, ease: "sine.inOut" },
              { y: 4, duration: 0.05, ease: "power2.out" },
              { y: 1, duration: 0.03, ease: "sine.inOut" },
              { y: 4, duration: 0.05, ease: "power2.out" },
              { y: 1, duration: 0.03, ease: "sine.inOut" },
              { y: 4, duration: 0.05, ease: "power2.out" },
              { y: 0, duration: 0.12, ease: "sine.out" },
            ],
            immediateRender: false,
          },
          4.66,
        );

        // ---- seal: strips sink, lid slaps shut, ocean seal stamps ----
        tl.to(["#s3", "#s2", "#s1"], { y: 215, duration: 0.14, ease: "power2.in", stagger: F }, 4.8);
        tl.to("#flap", { rotationX: 90, duration: 0.1, ease: "power2.in" }, 4.92);
        tl.set("#flap", { zIndex: 5 }, 5.02);
        tl.to("#flap", { rotationX: 0, duration: 0.06, ease: "power2.in" }, 5.02);
        tl.to("#flap", { rotationX: 9, duration: 0.08, ease: "power2.out" }, 5.08);
        tl.to("#flap", { rotationX: 0, duration: 0.16, ease: "power2.in" }, 5.16);
        tl.to("#box-bump", { scaleY: 0.965, scaleX: 1.014, duration: 0.05, ease: "power2.out" }, 5.08);
        tl.to("#box-bump", { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(2.4)" }, 5.13);
        tl.fromTo("#seal", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1.25, duration: 0.08, ease: "power3.out" }, 5.08);
        tl.to("#seal", { scale: 1, duration: 0.22, ease: "back.out(2)" }, 5.16);

        // labels clear
        tl.to("#b3", { y: -40, opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, 5.06);
        tl.to("#b4", { y: -40, opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, 5.06 + 2 * F);

        // card compacts (it is a neat package now)
        tl.to("#box-pos", { scale: 0.5, duration: 0.32, ease: "power3.inOut" }, 5.12);
        tl.to("#box", { rotationY: 0, rotationX: 0, duration: 0.32, ease: "power2.inOut" }, 5.12);

        // ---- agent puck pops in top-centre ----
        gsap.set("#puck", { transformOrigin: "50% 50%" });
        tl.fromTo("#puck", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 5.2);
        tl.fromTo(
          "#puck",
          { scale: 0.35, y: 40 },
          { scale: 1, y: 0, duration: 0.4, ease: "back.out(1.9)", immediateRender: false },
          5.2,
        );

        // ---- dotted path draws from the card to the puck ----
        const mask = $("#travel-mask");
        const L = mask.getTotalLength();
        gsap.set(mask, { attr: { "stroke-dasharray": `${L} ${L}`, "stroke-dashoffset": L } });
        tl.to(mask, { attr: { "stroke-dashoffset": 0 }, duration: 0.42, ease: "power2.inOut" }, 5.3);
        // dots flow toward the agent (continuous mechanical motion → linear)
        tl.fromTo(
          "#travel",
          { attr: { "stroke-dashoffset": 0 } },
          { attr: { "stroke-dashoffset": -126 }, duration: D - 5.3, ease: "none" },
          5.3,
        );

        // ---- "giving it to your agents": card dips, then rides the path under the puck ----
        tl.to("#box-bump", { y: 12, duration: 0.08, ease: "power2.out" }, 5.36);
        tl.to("#box-bump", { y: 0, duration: 0.16, ease: "power2.in" }, 5.44);
        tl.to(
          "#box-pos",
          {
            motionPath: { path: "M0 0 C-170 14 -274 -134 -210 -276 C-154 -392 -28 -438 90 -450" },
            duration: 0.58,
            ease: "power2.inOut",
          },
          5.44,
        );
        tl.to("#box-pos", { scale: 0.2, duration: 0.58, ease: "sine.inOut" }, 5.44);
        tl.to("#box-bump", { rotation: -7, duration: 0.24, ease: "sine.out" }, 5.44);
        tl.to("#box-bump", { rotation: 4, duration: 0.24, ease: "sine.inOut" }, 5.69);
        tl.to("#box-pos", { opacity: 0, duration: 0.08, ease: "power1.in" }, 5.94);

        // ---- the agent swallows it, lights ocean, bobs on "agents" ----
        tl.to("#puck", { scale: 0.93, duration: 0.05, ease: "power2.out" }, 5.98);
        tl.to("#puck", { scale: 1.06, duration: 0.08, ease: "power2.out" }, 6.03);
        tl.to("#puck", { scale: 1, duration: 0.24, ease: "back.out(2)" }, 6.11);
        tl.fromTo("#puck-ring", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, 6.02);
        tl.fromTo("#puck-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.08, duration: 0.24, ease: "power3.out" }, 6.02);
        tl.to("#puck-glow", { scale: 0.98, duration: 0.25, ease: "sine.inOut" }, 6.26);
        tl.to("#puck-glow", { scale: 1.04, duration: 0.25, ease: "sine.inOut" }, 6.52);
        tl.to(".eye", { opacity: 1, boxShadow: "0 0 18px 5px rgba(46,156,203,0.85)", duration: 0.1, ease: "power2.out" }, 6.02);
        tl.to("#puck-bob", { y: -16, duration: 0.1, ease: "power2.out" }, 6.0);
        tl.to("#puck-bob", { y: 0, duration: 0.34, ease: "back.out(2.2)" }, 6.1);
        // blink + float through the hold
        gsap.set(".eye", { transformOrigin: "50% 50%" });
        tl.to(".eye", { scaleY: 0.12, duration: 0.05, ease: "power2.in" }, 6.3);
        tl.to(".eye", { scaleY: 1, duration: 0.08, ease: "power2.out" }, 6.35);
        tl.fromTo("#puck-float", { y: 0 }, { y: 6, duration: D - 5.4, ease: "sine.inOut" }, 5.4);

        // small camera punch on the payoff
        tl.fromTo(
          "#punch",
          { scale: 1, transformOrigin: "560px 860px" },
          { scale: 1.01, duration: 0.45, ease: "power2.out" },
          6.02,
        );

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
</html>
