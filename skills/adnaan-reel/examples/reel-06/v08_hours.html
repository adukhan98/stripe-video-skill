<!doctype html>
<!-- adnaan-reel scene v08_hours — EXPLAINER (explainer starter on the shared runtime + reel-06 marker layer).
     Beat A: small speaker card, "agentic" (red hero) with an ink loop, "capabilities"; the words glide up to make room
     for a dark terminal card — official Claude Code chip drops on its edge, glyph prompt types; Codex chip squash-lands.
     Beat B (hero): a hand-drawn 3x7 calendar draws on "complete tasks", task scribbles fill the days, the red marker
     zig-zags through all 21 days on "weeks", the calendar collapses into a hand-drawn alarm clock whose minute hand
     spins two full turns (the hour hand moves two hours) on "couple of hours"; "hours" lands red with a 1 % punch.
     Keep data-duration. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v08_hours</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
    <style>
      @font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: block; }
      @font-face { font-family: "Caveat"; src: url("fonts/Caveat-Variable.ttf") format("truetype"); font-weight: 400 700; font-style: normal; font-display: block; }

      /* ---- beat A: the terminal card + official tool chips (one wrapper so it can recede to a corner in beat B) ---- */
      #termX { position: absolute; left: 90px; top: 1066px; width: 850px; height: 370px; }
      #termIn { position: absolute; inset: 0; }
      #term { left: 0; top: 46px; width: 850px; height: 320px; background: var(--brand-deep); overflow: hidden; }
      #term .cmd { left: 40px; height: 64px; font-size: 44px; }
      #term .cmd .pr { color: var(--brand-primary); margin-right: 18px; }
      #term .cell { display: inline-block; width: 21px; height: 24px; margin-right: 4px; border-radius: 5px; background: var(--brand-card); opacity: 0; }
      #term .cell.k { background: var(--brand-primary); }
      #term .cell.dim { background: color-mix(in srgb, var(--brand-card) 55%, var(--brand-deep)); }
      #term .cell.sp { background: transparent; width: 14px; }
      #caret { position: absolute; left: 0; top: 0; width: 22px; height: 44px; border-radius: 4px; background: var(--brand-card); opacity: 0; }
      #termIn .chip { top: 0; height: 96px; padding: 0 36px 0 22px; gap: 16px; border-radius: 48px; font-size: 44px; }
      #termIn .chip img { width: 56px; height: 56px; border-radius: 14px; }
      #chClaude { left: 136px; }
      #chCodex { left: 560px; }
    </style>
  </head>
  <body data-face="0.42">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="7.2167">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <!-- terminal card with the official Claude Code + Codex chips (glyph prompt, no invented words) -->
        <div id="termX">
          <div id="termIn">
            <div id="term" class="term">
              <i class="tdot"></i><i class="tdot"></i><i class="tdot"></i>
              <div id="cmd1" class="cmd" style="top: 84px"><span class="pr">&gt;</span></div>
              <div id="cmd2" class="cmd" style="top: 160px"><span class="pr">&gt;</span></div>
              <div id="cmd3" class="cmd" style="top: 236px"><span class="pr">&gt;</span></div>
              <div id="caret"></div>
            </div>
            <div id="chClaude" class="chip"><img src="assets/claude.svg" alt="Claude" />Claude Code</div>
            <div id="chCodex" class="chip"><img src="assets/codex.png" alt="Codex" />Codex</div>
          </div>
        </div>

        <!-- small speaker card, top-left, on from frame 0 (whole head: face at 52 % of the card) -->
        <div class="spk small" data-x="76" data-y="314" data-w="420" data-h="380" data-face-at="0.52" data-ry="6">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="7.2167" data-track-index="1"></video></div>
            <div class="spk-sheen"></div>
          </div>
        </div>

        <!-- ===== BEAT A words ===== -->
        <div class="line sup" data-right="944" data-base="440" data-size="96" data-exit="3.80">
          <span class="w" data-t="0.43">using</span>
        </div>
        <div class="line sup" data-x="572" data-base="580" data-size="130" data-exit="3.80" data-exit-lag="2">
          <span class="w" data-t="0.65" data-pop>more</span>
        </div>
        <div id="aW1" class="layer">
          <div id="lAgentic" class="line hero" data-x="130" data-base="1010" data-size="180" data-fit="900" data-exit="3.84">
            <span class="w ocean" data-t="0.97" data-hero>agentic</span>
          </div>
        </div>
        <div id="aW2" class="layer">
          <div id="lCap" class="line sup" data-right="950" data-base="1190" data-size="110" data-exit="3.86">
            <span class="w" data-t="1.63" data-accent>capabilities</span>
          </div>
        </div>

        <!-- ===== BEAT B words: the band under the hero object, two rows (base ~1310 / ~1455), replaced in turn ===== -->
        <div class="line sup" data-x="96" data-base="1310" data-size="110" data-exit="5.30">
          <span class="w" data-t="4.51">complete</span>
        </div>
        <div class="line sup" data-right="936" data-base="1452" data-size="140" data-exit="5.30" data-exit-lag="2">
          <span class="w" data-t="5.03" data-pop data-rise="30">tasks</span>
        </div>
        <div class="line small" data-right="936" data-base="1310" data-size="104" data-exit="5.98">
          <span class="w" data-t="5.43">used</span><span class="w gap-s" data-t="5.61">to</span>
        </div>
        <div class="line sup" data-x="96" data-base="1452" data-size="140" data-exit="5.98" data-exit-lag="2">
          <span class="w" data-t="5.81" data-pop data-rise="30">take</span>
        </div>
        <div id="lWeeks" class="line hero" data-x="96" data-base="1290" data-size="150">
          <span id="wWeeks" class="w ink" data-t="6.21" data-hero>weeks</span>
        </div>
        <div class="line sup" data-right="936" data-base="1290" data-size="100">
          <span class="w" data-t="6.63">couple</span><span class="w gap-s" data-t="6.83">of</span>
        </div>
        <div id="lHours" class="line hero" data-x="96" data-base="1464" data-size="204" data-fit="880">
          <span class="w ocean" data-t="7.03" data-hero data-peak="1.08" data-rise="24">hours</span>
        </div>

      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      // ---- build the terminal's glyph prompt lines (deterministic; before the runtime lays out) ----
      function glyphs(id, groups) {
        const el = document.getElementById(id);
        groups.forEach(([n, cls], gi) => {
          if (gi) el.insertAdjacentHTML("beforeend", '<span class="cell ch sp"></span>');
          for (let i = 0; i < n; i++) el.insertAdjacentHTML("beforeend", `<span class="cell ch ${cls || ""}"></span>`);
        });
      }
      glyphs("cmd1", [[4, "k"], [6], [3], [7, "dim"], [5]]);
      glyphs("cmd2", [[5, "k"], [3], [8], [4, "dim"]]);

      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"', '500 40px "Geist Mono"'] });
        const M = Marker.init(P);
        const { tl, D, F, $, $$ } = P;
        const NS = "http://www.w3.org/2000/svg";
        const grp = (id) => { const g = document.createElementNS(NS, "g"); g.setAttribute("id", id); M.layer.appendChild(g); return g; };
        // seek-safe SVG transforms about fixed frame-px origins (proxy objects → transform attribute)
        function xf(g, origins) {
          const st = origins.map(([cx, cy]) => ({ cx, cy, s: 1, r: 0 }));
          const apply = () => g.setAttribute("transform", st.map((o) => `translate(${o.cx} ${o.cy}) rotate(${o.r}) scale(${o.s}) translate(${-o.cx} ${-o.cy})`).join(" "));
          apply();
          return { st, apply };
        }
        const lineRect = (line, w) => {                       // layout rect of a word (no transforms), by its baseline
          const fs = parseFloat(getComputedStyle(line).fontSize), base = parseFloat(line.dataset.base);
          const x = line.offsetLeft + (w ? w.offsetLeft : 0), wd = w ? w.offsetWidth : line.offsetWidth;
          return { x, w: wd, top: base - 0.74 * fs, bot: base + 0.22 * fs, base, fs };
        };

        // ================= BEAT A — "agentic" gets an ink loop, then the words make room for the terminal =================
        const ag = lineRect($("#lAgentic"));
        const loopG = grp("agLoop");
        // loop sized so the ellipse clears the x-height letters at both ends (a…c), never crossing the word
        const lcy = (ag.top + ag.bot) / 2, lry = (ag.bot - ag.top) / 2 + 36, ldy = ag.base - 0.53 * ag.fs - lcy;
        const lrx = (ag.w / 2 + 12) / Math.sqrt(1 - (ldy / lry) ** 2);
        M.circle(ag.x + ag.w / 2, lcy, lrx, lry, 1.12, { color: "ink", width: 9, dur: 0.4, tilt: -2, parent: loopG, seed: 811 });

        // anticipation dip, then glide up 175 px (capabilities lags 2 f); the loop rides with its word
        // the loop has done its job before the glide (it would brush the card edge) — wiped quickly
        M.erase({ g: loopG }, 2.24, 0.12);
        [["#aW1", 2.28], ["#aW2", 2.28 + 2 * F]].forEach(([s, t]) => {
          tl.to(s, { y: 8, duration: 3 * F, ease: "power2.in" }, t);
          tl.to(s, { y: -160, duration: 0.42, ease: "power3.inOut" }, t + 3 * F);
        });

        // terminal: heavy card rises in (16 f, sheen lag) → Claude Code chip drops on its edge on "Claude" → prompt types
        P.cardIn("#term", 2.62, { fromY: 50, rot: -1.5 });
        P.pillIn("#chClaude", 2.70, { fromY: 46 });           // pops up out of the card edge, lands ~2.97 ("Claude Code")
        const caret = $("#caret");
        const caretAt = (cmd, cell) => {                      // caret position after a cell (term px)
          const c = $(cmd), r = cell ? cell.offsetLeft + cell.offsetWidth + 6 : c.querySelector(".pr").offsetLeft + c.querySelector(".pr").offsetWidth + 18;
          return { x: c.offsetLeft + r, y: c.offsetTop + 10 };
        };
        function typeLine(cmd, t, cps) {
          const cells = $$(".ch", $(cmd));
          const p0 = caretAt(cmd, null);
          tl.set(caret, { x: p0.x, y: p0.y, opacity: 1 }, t - 2 * F);
          cells.forEach((c, i) => { const p = caretAt(cmd, c); tl.set(caret, { x: p.x }, t + (i + 1) / cps); });
          return P.typeIn(cmd, t, cps);
        }
        tl.set(caret, { opacity: 0 }, 0);
        const e1 = typeLine("#cmd1", 2.97, 40);
        // Codex chip falls (stretching) and squash-lands on the card edge on "Codex" (3.75)
        tl.fromTo("#chCodex", { opacity: 0, y: -40, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.2, ease: "power2.in" }, 3.55);
        P.squash("#chCodex", 3.75, 0.1);
        tl.to("#chClaude", { x: -10, duration: 0.1, ease: "power2.out" }, 3.75);   // neighbour gets nudged
        tl.to("#chClaude", { x: 0, duration: 0.3, ease: "back.out(2)" }, 3.85);
        const e2 = typeLine("#cmd2", 3.70, 44);
        const p3 = caretAt("#cmd3", null);
        tl.set(caret, { x: p3.x, y: p3.y }, e2 + 3 * F);
        for (let bt = e2 + 3 * F + 0.24, on = false; bt < D; bt += 0.24, on = !on) tl.set(caret, { opacity: on ? 1 : 0 }, bt);   // idle blink

        // beat B staging: the terminal glides on an arc to the top-right corner at 0.6x, tucked behind the speaker card (opaque)
        gsap.set("#termX", { transformOrigin: "100% 0%" });
        tl.to("#termX", { scale: 0.6, duration: 0.5, ease: "power3.inOut" }, 3.94);
        tl.to("#termX", { y: -744, duration: 0.5, ease: "power2.inOut" }, 3.94);
        tl.to("#termX", { x: -40, duration: 0.25, ease: "sine.out" }, 3.94);
        tl.to("#termX", { x: 0, duration: 0.25, ease: "sine.in" }, 4.19);

        // ================= BEAT B — the hand-drawn calendar (hero) =================
        const CX0 = 100, CX1 = 920, CY0 = 800, CH = 862, CY1 = 1160, COL = (CX1 - CX0) / 7, ROW = (CY1 - CH) / 3;
        const calG = grp("calG");
        const ink = { color: "ink", parent: calG };
        M.line([[CX0 + 2, CY0], [CX1, CY0 - 3], [CX1 + 2, CY1], [CX0, CY1 + 2], [CX0 + 1, CY0 - 4]], 4.32, { ...ink, width: 13, dur: 0.24, amp: 2.6, seed: 301 });
        M.line([[CX0, CH], [CX1, CH - 2]], 4.50, { ...ink, width: 11, dur: 0.09, amp: 1.8, seed: 302 });
        M.hatch([[CX0, CY0], [CX1, CY0], [CX1, CH], [CX0, CH]], 4.54, { color: "pencil", spacing: 19, width: 9, dur: 0.22, opacity: 0.7, parent: calG, seed: 303 });
        M.circle(CX0 + 160, CY0 - 4, 14, 30, 4.56, { ...ink, width: 10, dur: 0.12, turns: 1.05, seed: 304 });
        M.circle(CX1 - 160, CY0 - 4, 14, 30, 4.60, { ...ink, width: 10, dur: 0.12, turns: 1.05, seed: 305 });
        for (let k = 1; k < 7; k++) M.line([[CX0 + k * COL, CH], [CX0 + k * COL + 1, CY1]], 4.62 + (k - 1) * F, { ...ink, width: 9, dur: 0.07, amp: 1.6, seed: 310 + k });
        for (let k = 1; k < 3; k++) M.line([[CX0, CH + k * ROW], [CX1, CH + k * ROW - 1]], 4.80 + (k - 1) * 2 * F, { ...ink, width: 9, dur: 0.1, amp: 1.6, seed: 320 + k });
        // the calendar lands with weight: tiny anticipation shrink, overshoot, settle (whole group, svg origin = centre)
        const OX = 510, OY = 980, R = 172;
        const calX = xf(calG, [[OX, OY], [(CX0 + CX1) / 2, (CY0 + CY1) / 2]]);   // [0] collapse about the clock centre, [1] landing about its own centre
        tl.fromTo(calX.st[1], { s: 0.94 }, { s: 1.02, duration: 0.3, ease: "power3.out", onUpdate: calX.apply }, 4.32);
        tl.to(calX.st[1], { s: 1, duration: 0.3, ease: "back.out(2)", onUpdate: calX.apply }, 4.62);

        // "tasks": a few days get scribbled tasks, 1 f apart (secondary action)
        const TASKS = [[0, 1], [0, 3], [0, 4], [1, 0], [1, 2], [1, 5], [2, 1], [2, 3], [2, 6], [0, 6]];
        TASKS.forEach(([r, c], i) => {
          const x = CX0 + c * COL + 20, y = CH + r * ROW + ROW * 0.5;
          M.line([[x, y + 4], [x + 24, y - 6], [x + 48, y + 3], [x + COL - 40, y - 4]], 4.92 + i * F, { ...ink, width: 8, dur: 0.07, amp: 1.4, seed: 340 + i });
        });

        // "weeks": the RED marker strikes all 21 days in one zig-zag sweep (contact mid-sweep on 6.21)
        const zig = [];
        for (let r = 0; r < 3; r++) {
          const y0 = CH + r * ROW + 16, y1 = CH + (r + 1) * ROW - 16;
          zig.push([CX0 + 18, y0 + (r ? 4 : 0)], [CX1 - 18, y1]);
        }
        M.line(zig, 6.06, { color: "marker", width: 17, dur: 0.3, amp: 3, ease: "power1.inOut", parent: calG, seed: 360 });
        // the struck word
        const wk = lineRect($("#lWeeks"));
        const wy = wk.base - 0.3 * wk.fs;
        M.line([[wk.x - 10, wy + 8], [wk.x + wk.w * 0.5, wy - 4], [wk.x + wk.w + 8, wy + 2]], 6.40, { color: "marker", width: 14, dur: 0.2, seed: 361 });

        // collapse: the calendar squeezes into the clock centre (anticipation swell 3 f, then a twisting pull-in)
        tl.to(calX.st[0], { s: 1.04, duration: 3 * F, ease: "power2.out", onUpdate: calX.apply }, 6.36);
        tl.to(calX.st[0], { s: 0.16, r: -40, duration: 0.16, ease: "power2.in", onUpdate: calX.apply }, 6.36 + 3 * F);
        tl.to(calG, { opacity: 0, duration: 0.16, ease: "power2.in" }, 6.36 + 3 * F);

        // ================= the hand-drawn alarm clock =================
        const clockG = grp("clockG"), handM = grp("handM"), handH = grp("handH");
        clockG.appendChild(handH); clockG.appendChild(handM);
        const cInk = { color: "ink", parent: clockG };
        const pol = (a, r) => [OX + Math.cos((a * Math.PI) / 180) * r, OY + Math.sin((a * Math.PI) / 180) * r];
        M.circle(OX, OY, R, R, 6.50, { ...cInk, width: 15, dur: 0.24, turns: 1.08, tilt: 0, start: -1.9, seed: 401 });
        // bells (domes outside the rim at 10:30 and 1:30) + legs
        [-128, -52].forEach((a, i) => {
          const c = pol(a, R + 26), pts = [];
          for (let k = 0; k <= 10; k++) { const b = a - 90 + (k / 10) * 180; pts.push([c[0] + Math.cos((b * Math.PI) / 180) * 44, c[1] + Math.sin((b * Math.PI) / 180) * 44]); }
          M.line(pts, 6.58 + i * 2 * F, { ...cInk, width: 13, dur: 0.1, amp: 1.2, seed: 410 + i });
        });
        [128, 52].forEach((a, i) => M.line([pol(a, R + 2), pol(a, R + 34)], 6.62 + i * F, { ...cInk, width: 13, dur: 0.06, amp: 1, seed: 420 + i }));
        [0, 90, 180, 270].forEach((a, i) => M.line([pol(a - 90, R - 36), pol(a - 90, R - 14)], 6.60 + i * F, { ...cInk, width: 10, dur: 0.05, amp: 0.6, seed: 430 + i }));
        // hands: hour (ink) starts at 10 o'clock, minute (red) at 12 — two full minute turns = two hours
        M.line([[OX, OY], pol(-150, 92)], 6.60, { color: "ink", width: 17, dur: 0.07, amp: 1, parent: handH, seed: 440 });
        M.line([[OX, OY], pol(-90, 138)], 6.62, { color: "marker", width: 13, dur: 0.07, amp: 1, parent: handM, seed: 441 });
        M.circle(OX, OY, 7, 7, 6.64, { color: "ink", width: 15, dur: 0.05, parent: clockG, seed: 442 });
        // pop in with overshoot (the calendar's energy carries into it), settle
        const clX = xf(clockG, [[OX, OY]]), mX = xf(handM, [[OX, OY]]), hX = xf(handH, [[OX, OY]]);
        tl.fromTo(clX.st[0], { s: 0.35, r: 18 }, { s: 1.08, r: -3, duration: 0.2, ease: "power3.out", onUpdate: clX.apply }, 6.50);
        tl.to(clX.st[0], { s: 1, r: 0, duration: 0.3, ease: "back.out(2)", onUpdate: clX.apply }, 6.70);
        // the spin: minute hand two full turns over "couple of hours", hour hand moves 60°
        tl.fromTo(mX.st[0], { r: 0 }, { r: 720, duration: 0.56, ease: "power1.inOut", onUpdate: mX.apply }, 6.64);
        tl.fromTo(hX.st[0], { r: 0 }, { r: 60, duration: 0.56, ease: "power1.inOut", onUpdate: hX.apply }, 6.64);
        // speed ticks chase the minute hand outside the rim (drawn on, wiped quickly)
        [[-60, 6.72], [40, 6.84], [150, 6.96], [250, 7.06]].forEach(([a, t], i) => {
          const pts = []; for (let k = 0; k <= 6; k++) pts.push(pol(a - 20 + k * 6, R + 36));
          const s = M.line(pts, t, { color: "marker", width: 9, dur: 0.07, amp: 0.8, seed: 450 + i });
          M.erase(s, t + 0.16, 0.1);
        });
        // "hours": the bells rattle (2-frame shakes) + ring marks flick on
        [7.03, 7.03 + 2 * F, 7.03 + 4 * F, 7.03 + 6 * F].forEach((t, i) => tl.to(clX.st[0], { r: i % 2 ? -4 : 4, duration: 2 * F, ease: "sine.inOut", onUpdate: clX.apply }, t));
        [-150, -30].forEach((a, i) => {
          const p0 = pol(a, R + 70), p1 = pol(a, R + 96);
          M.line([p0, p1], 7.04 + i * F, { color: "marker", width: 9, dur: 0.05, amp: 0.5, seed: 470 + i });
        });

        // staging
        P.punch(7.03, { scale: 1.01, origin: "480px 1000px", dur: 0.2 });
      })();
    </script>
  </body>
</html>
