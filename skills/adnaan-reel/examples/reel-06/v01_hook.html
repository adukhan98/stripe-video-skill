<!doctype html>
<!-- reel-06 v01_hook — HOOK: text hook on frame 0 ("you're in the top 0.2%", red marker loop already drawn) +
     PORTRAIT speaker card + kinetic phrases below his chin + the payoff stamp "0.2%" (impact, double underline,
     sparkle ticks, arrow from the hook's 0.2%). Runtime: paper.js/paper.css + marker.js/marker.css (untouched). -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v01_hook</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <style>
      @font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Caveat"; src: url("fonts/Caveat-Variable.ttf") format("truetype"); font-weight: 400 700; font-style: normal; font-display: block; }
      .lt, .wx, .hw { display: inline-block; font-style: normal; }
      .wx { will-change: transform, opacity, filter; }
      /* hook letters shimmer individually */
      .lt { will-change: transform; }
      /* paper strip inside the card so the kinetic words land on paper, not on the dark polo */
      .spk-card .paper-strip { height: 310px; opacity: 0; }
      /* AI echoes (ghosts of the word that fan out and snap back) */
      .echo { position: absolute; font-family: var(--font-heading); font-weight: 900; letter-spacing: -0.045em; line-height: 0.88;
        color: var(--brand-primary); white-space: nowrap; opacity: 0; pointer-events: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
  </head>
  <body data-face="0.42">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="4.5833" data-strength="subtle">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <!-- TEXT HOOK (user-approved; readable on frame 0, whole scene, no entrance) -->
        <div class="layer" id="hookL">
          <div class="line hero" id="h1" data-x="76" data-base="385" data-size="112">
            <span class="hw" id="hy">you're</span><span class="hw gap-s">in</span><span class="hw gap-s">the</span><span class="hw gap-s">top</span>
          </div>
          <div class="line hero ocean" id="h2" data-right="878" data-base="578" data-size="196">
            <span class="lt">0</span><span class="lt">.</span><span class="lt">2</span><span class="lt">%</span>
          </div>
        </div>

        <!-- PORTRAIT speaker card: on screen from frame 0, face centred by data-face -->
        <div class="spk portrait" data-x="110" data-y="626" data-w="740" data-h="786">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="4.5833" data-track-index="1"></video></div>
            <div class="paper-strip" id="strip"></div>
            <div class="spk-sheen"></div>
          </div>
        </div>

        <!-- KINETIC WORDS = words.txt, below his chin, over the paper strip. data-exit clears the phrase (~3.0-3.2). -->
        <div class="line hero ink kin" id="kBuilt" data-x="76" data-base="1262" data-size="120" data-exit="2.96">
          <span class="w" data-t="1.54" data-pop data-rise="40" data-origin="30% 85%">built</span>
        </div>
        <div class="line hero ink kin" id="kAny" data-right="915" data-base="1366" data-size="120" data-exit="2.98" data-exit-lag="2">
          <span class="w" id="wAny" data-t="1.92" data-pop data-rise="46" data-origin="50% 85%"><i class="lt">a</i><i class="lt">n</i><i class="lt">y</i><i class="lt">t</i><i class="lt">h</i><i class="lt">i</i><i class="lt">n</i><i class="lt">g</i></span>
        </div>
        <div class="line sup ink kin" id="kWith" data-x="76" data-base="1444" data-size="88" data-exit="3.0" data-exit-lag="3">
          <span class="w" data-t="2.12" data-rise="16">with</span>
        </div>
        <div class="line hero ocean kin" id="kAI" data-x="270" data-base="1444" data-size="170" data-exit="3.02" data-exit-lag="4">
          <span class="w" id="wAI" data-t="2.34" data-hero data-rise="34" data-origin="40% 85%" data-peak="1.1">AI</span>
        </div>

        <!-- THE HERO: top 0.2% -->
        <div class="line hero ink kin" id="kTop" data-x="84" data-base="1238" data-size="110">
          <span class="w" data-t="3.50" data-pop data-rise="40" data-origin="30% 85%">top</span>
        </div>
        <div class="line hero ocean kin" id="kHero" data-x="76" data-base="1428" data-size="230">
          <span class="wx" id="wxHero" data-tt="3.76">0.2%</span>
        </div>

      </div></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);
        const { tl, D, F, $, $$ } = P;
        const W = {};   // measured geometry (frame px), taken from layout (unaffected by transforms)
        const geo = (el) => { const l = el.closest(".line"); return { x: l.offsetLeft + el.offsetLeft, y: l.offsetTop + el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; };

        // ============================================================ TEXT HOOK (frame 0)
        const h2 = $("#h2"), h2fs = parseFloat(getComputedStyle(h2).fontSize);
        const h2x = h2.offsetLeft, h2w = h2.offsetWidth, h2base = 578, h2cy = h2base - 0.37 * h2fs, h2capH = 0.73 * h2fs;
        W.h2 = { x: h2x, w: h2w, cy: h2cy, capH: h2capH, fs: h2fs };
        // red marker loop around the hook's 0.2%, already drawn on frame 0, then boils on fours
        const loop = M.circle(h2x + h2w / 2, h2cy, h2w / 2 + 50, h2capH / 2 + 17, 0, { width: 11, tilt: -3, seed: 31 });
        // continuous life: hook + loop breathe together (1 %), origin at the loop's centre
        const hx = h2x + h2w / 2, hy0 = 470;
        gsap.set("#hookL", { transformOrigin: hx + "px " + hy0 + "px" });
        tl.fromTo("#hookL", { scale: 1 }, { scale: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: Math.floor(D / 1.5) }, 0);
        tl.fromTo(loop.g, { scale: 1, svgOrigin: hx + " " + hy0 }, { scale: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: Math.floor(D / 1.5) }, 0);

        // secondary 1: a light-wave shimmer runs through the hook's 0.2% letters (0.50 and 2.00 s) — each letter hops 8 px
        const hl = $$(".lt", h2);
        gsap.set(hl, { transformOrigin: "50% 85%" });
        [0.5, 2.0].forEach((t0) =>
          hl.forEach((l, i) => {
            tl.to(l, { y: -9, scale: 1.05, duration: 0.1, ease: "power2.out" }, t0 + i * 3 * F);
            tl.to(l, { y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t0 + 0.1 + i * 3 * F);
          })
        );
        // the loop answers the wave with a tiny squeeze (it is a hand drawing, not a shape: scale only 2 %)
        // secondary 2: "you" (1.16 and 2.56) — the hook's "you're" hops, and at 2.56 a red marker underline is drawn under it
        const hyEl = $("#hy"), hyG = geo(hyEl);
        gsap.set(hyEl, { transformOrigin: "50% 90%" });
        [1.04, 2.44].forEach((t0) => {
          tl.to(hyEl, { y: -6, rotation: -2, scale: 1.03, duration: 0.1, ease: "power2.out" }, t0);
          tl.to(hyEl, { y: 0, rotation: 0, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, t0 + 0.1);
        });
        const uYou = M.underline(hyG.x + 4, hyG.x + hyG.w - 4, 385 + 28, 2.5, { width: 10, seed: 77 });

        // ============================================================ KINETIC: built anything with AI
        // secondary 3: "anything" — the letters cascade (2 f apart) after the word lands on 1.92
        const anyL = $$(".lt", $("#wAny"));
        gsap.set(anyL, { transformOrigin: "50% 90%" });
        anyL.forEach((l, i) => {
          tl.fromTo(l, { y: 0 }, { y: -14, duration: 0.09, ease: "power2.out", immediateRender: false }, 2.0 + i * 2 * F);
          tl.to(l, { y: 0, duration: 0.28, ease: "back.out(2.6)" }, 2.09 + i * 2 * F);
        });
        // paper strip fades in just before the first kinetic word
        tl.fromTo("#strip", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, 1.2);

        // AI echoes on 2.34: two ghosts fan out from the word, then snap back into it (secondary 4)
        const ai = $("#wAI"), aiG = geo(ai), aiFs = parseFloat(getComputedStyle($("#kAI")).fontSize);
        [[-26, -20, 0.28], [22, 18, 0.2]].forEach(([dx, dy, op], k) => {
          const e = document.createElement("div");
          e.className = "echo"; e.textContent = "AI"; e.style.fontSize = aiFs + "px";
          e.style.left = aiG.x + "px"; e.style.top = (parseFloat($("#kAI").style.top) || 0) + "px";
          $("#punch").appendChild(e);
          tl.set(e, { opacity: 0 }, 0);
          tl.fromTo(e, { opacity: op, x: 0, y: 0, scale: 1 }, { opacity: op, x: dx, y: dy, scale: 1.04, duration: 0.2, ease: "power2.out", immediateRender: false }, 2.34 + k * 2 * F);
          tl.to(e, { x: 0, y: 0, scale: 1, opacity: 0, duration: 0.24, ease: "power3.in" }, 2.56 + k * 2 * F);
        });

        // ============================================================ THE HERO: top 0.2% (3.50 / 3.76)
        const hero = $("#wxHero"), hg = geo(hero), hfs = parseFloat(getComputedStyle($("#kHero")).fontSize);
        const hBase = 1428, hCap = 0.73 * hfs, hcx = hg.x + hg.w / 2, hcy = hBase - hCap / 2;
        W.hero = { x: hg.x, w: hg.w, cx: hcx, cy: hcy, cap: hCap, fs: hfs };
        gsap.set(hero, { transformOrigin: "10% 85%" });
        // stamp-in: 1.45 -> 0.95 -> 1.0, contact on 3.76; a faint ghost hovers above first (anticipation)
        tl.fromTo(hero, { opacity: 0, scale: 1.55, y: -36, rotation: -4, filter: "blur(8px)" },
          { opacity: 0.001, scale: 1.5, y: -44, rotation: -4, duration: 3 * F, ease: "power2.out" }, 3.5);
        tl.to(hero, { opacity: 1, scale: 0.95, y: 4, rotation: 0.5, filter: "blur(0px)", duration: 0.15, ease: "power3.in" }, 3.61);
        tl.to(hero, { scale: 1, y: 0, rotation: 0, duration: 0.3, ease: "back.out(2.6)" }, 3.76);
        P.punch(3.76, { scale: 1.01, origin: "460px 1250px" });
        P.shake(3.76, 3);

        // red marker arrow from the hook's 0.2% down the right side to the kinetic one (draws 3.40 -> lands 3.8)
        const arr = M.arrow(792, 606, hg.x + hg.w + 28, hcy + 6, 3.4, { bend: -0.5, width: 11, dur: 0.42, seed: 55 });
        // black-marker DOUBLE underline under the stamp (after it lands)
        const ul = M.underline(hg.x + 8, hg.x + hg.w - 6, hBase + 14, 3.93, { double: true, color: "ink", width: 11, seed: 91 });
        // 6 red sparkle ticks flick out around it (short M.line dashes radiating from an ellipse), then boil
        const rx = hg.w / 2 + 34, ry = hCap / 2 + 30;
        [-90, -70, -50, -31, -12, 28].forEach((deg, i) => {
          const a = (deg * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a);
          const p0 = [hcx + c * rx, hcy + s * ry], len = 52;
          M.line([p0, [p0[0] + c * len, p0[1] + s * len * 1.15]], 3.82 + i * F, { width: 11, dur: 0.11, amp: 1.2, seed: 200 + i * 7 });
        });
        // a one-off cheer: the strip under the hero warms (light flash) is NOT used - the impact is carried by the stamp + punch + shake

        window.__W = W;
      })();
    </script>
  </body>
</html>
