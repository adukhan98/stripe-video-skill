    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);
        const { tl, D, F, $, $$ } = P;

        // ---------------------------------------------------------------- speaker: top → top-right corner
        // card box 240..840 x 306..846 (centre 540, 576) → ×0.7 (420x378), centre (727, 497) → x 517..937, y 308..686
        gsap.set("#spkMove", { transformOrigin: "540px 576px" });
        tl.to("#spkMove", { scale: 1.015, duration: 3 * F, ease: "power2.in" }, 0.50);                // anticipation
        tl.to("#spkMove", { scale: 0.7, duration: 0.42, ease: "power3.inOut" }, 0.60);
        tl.to("#spkMove", { y: -79, duration: 0.42, ease: "power3.inOut" }, 0.60);                      // y and x eased differently → arc
        tl.to("#spkMove", { x: 187, duration: 0.42, ease: "power2.inOut" }, 0.60);

        // ---------------------------------------------------------------- card deal (arc + fade + overshoot)
        function deal(sel, t, fromX, fromY, tilt) {
          const wrap = $(sel), card = $(".uicard", wrap);
          gsap.set(wrap, { transformOrigin: "50% 60%" });
          tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "power1.out" }, t);
          P.arc(wrap, t, { fromX, fromY, dur: 14 * F, tilt });
          tl.fromTo(wrap, { scale: 0.84 }, { scale: 1.025, duration: 10 * F, ease: "power3.out" }, t);
          tl.to(wrap, { scale: 1, duration: 9 * F, ease: "back.out(1.8)" }, t + 10 * F);
        }

        // ================= CARD 1: search bar + crown on "glorified" (1.19) =================
        deal("#w1", 0.80, -30, 0, -6);
        P.floatY($("#w1 .fl"), 3, 1.3);
        // blinking caret (on/off every 12 f; deterministic sets)
        for (let t = 0.78 + 12 * F, on = false; t < D; t += 12 * F, on = !on) tl.set("#caret", { opacity: on ? 1 : 0 }, t);
        // magnifier "looks around" on "search" (1.73): swings, overshoots, settles
        gsap.set("#mag", { transformOrigin: "42% 42%" });
        tl.to("#mag", { rotation: 14, scale: 0.94, duration: 3 * F, ease: "power2.in" }, 1.58);
        tl.to("#mag", { rotation: -22, scale: 1.14, duration: 6 * F, ease: "power3.out" }, 1.58 + 3 * F);
        tl.to("#mag", { rotation: 0, scale: 1, duration: 12 * F, ease: "back.out(2.2)" }, 1.58 + 9 * F);
        tl.to("#mag", { x: 16, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.0);        // peeks along the empty field

        // crown (card-local px; card top edge = y 0): zig-zag band drawn in ONE stroke, then three jewel dots
        const loc1 = $("#loc1");
        const cx0 = 120;  // crown spans x 120..320 local (×1.25 on screen: frame x ≈ 225..485, clear of the corner speaker card)
        const crownPts = [[cx0 + 6, -10], [cx0 - 4, -104], [cx0 + 54, -50], [cx0 + 100, -124], [cx0 + 146, -50], [cx0 + 204, -104], [cx0 + 194, -10], [cx0 + 4, -12]];
        const crown = M.line(crownPts, 1.03, { parent: loc1, width: 9, dur: 0.30, amp: 2.0, color: "marker" });
        const j1 = M.circle(cx0 - 4, -118, 9, 9, 1.34, { parent: loc1, width: 9, dur: 0.06, turns: 1.05 });
        const j2 = M.circle(cx0 + 100, -140, 10, 10, 1.37, { parent: loc1, width: 9, dur: 0.06, turns: 1.05 });
        const j3 = M.circle(cx0 + 204, -118, 9, 9, 1.40, { parent: loc1, width: 9, dur: 0.06, turns: 1.05 });
        // crown wobble on its base (damped), then a gentle sway while held
        const crownG = [crown.g, j1.g, j2.g, j3.g];
        const cg = document.createElementNS("http://www.w3.org/2000/svg", "g");
        loc1.appendChild(cg); crownG.forEach((g) => cg.appendChild(g));
        gsap.set(cg, { svgOrigin: `${cx0 + 100} -10` });
        tl.fromTo(cg, { rotation: 0, y: 0 }, { rotation: -9, y: -10, duration: 4 * F, ease: "power2.out", immediateRender: false }, 1.36);
        tl.to(cg, { rotation: 7, y: 0, duration: 5 * F, ease: "sine.inOut" }, 1.36 + 4 * F);
        tl.to(cg, { rotation: -4, duration: 5 * F, ease: "sine.inOut" }, 1.36 + 9 * F);
        tl.to(cg, { rotation: 2, duration: 5 * F, ease: "sine.inOut" }, 1.36 + 14 * F);
        tl.to(cg, { rotation: -6, duration: 0.5, ease: "sine.inOut" }, 1.36 + 19 * F);                 // sits a bit askew
        tl.to(cg, { rotation: -3, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.15);
        // two sparkle ticks off the crown points (little ✦ = two crossing strokes)
        const spark = (x, y, s, t) => {
          M.line([[x - s, y], [x + s, y]], t, { parent: loc1, width: 6, dur: 0.06, amp: 0.6 });
          M.line([[x, y - s * 1.2], [x, y + s * 1.2]], t + 2 * F, { parent: loc1, width: 6, dur: 0.06, amp: 0.6 });
        };
        spark(cx0 - 52, -150, 16, 1.46);
        spark(cx0 + 224, -26, 12, 1.60);

        // ================= CARD 2: email draft, "or to write their stupid emails" =================
        P.recede("#w1 .tilt", 2.28, { opacity: 0.55, blur: 3, scale: 0.97, dur: 0.3 });
        deal("#w2", 2.34, -40, -50, 6);
        P.floatY($("#w2 .fl"), 3, 1.5);
        // body lines write themselves on "write" (2.57), a caret leading each line
        const lines = ["#el1", "#el2", "#el3"].map((s) => $(s));
        lines.forEach((l) => gsap.set(l, { scaleX: 0 }));
        let tw = 2.48;
        tl.set("#ecaret", { opacity: 1, left: 30, top: 202 }, tw);
        lines.forEach((l, i) => {
          const w = parseFloat(l.style.width), x0 = 30, y0 = parseFloat(l.style.top) - 8, dur = 0.12 + w / 2400;
          tl.set("#ecaret", { left: x0, top: y0 }, tw);
          tl.to(l, { scaleX: 1, duration: dur, ease: "steps(" + Math.round(w / 26) + ")" }, tw);            // typed, word by word
          tl.to("#ecaret", { left: x0 + w + 6, duration: dur, ease: "steps(" + Math.round(w / 26) + ")" }, tw);
          tw += dur + 2 * F;
        });
        for (let t = tw, on = false; t < 3.62; t += 10 * F, on = !on) tl.set("#ecaret", { opacity: on ? 1 : 0 }, t);
        tl.set("#ecaret", { opacity: 0 }, 3.62);
        // red marker underline under "stupid" (3.01) — drawn just after the word lands
        const ls = $("#wStupid").closest(".line"), ws = $("#wStupid");
        const sx0 = ls.offsetLeft + ws.offsetLeft + 8, sx1 = ls.offsetLeft + ws.offsetLeft + ws.offsetWidth - 10;
        const sUL = M.underline(sx0, sx1, 1424 + 14, 3.08, { width: 11, dur: 0.26 });
        M.erase(sUL, 3.60, 0.12);
        // send pressed on "emails" (3.43): anticipation dip, squash, release
        P.squash("#send", 3.43, 0.12);
        tl.fromTo("#send i", { scaleX: 1 }, { scaleX: 0.7, duration: 3 * F, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 3.43);

        // ================= CARD 3: the LinkedIn post, scrawled over on "sloppy" (4.37) =================
        P.recede("#w2 .tilt", 3.64, { opacity: 0.5, blur: 4, scale: 0.96, dur: 0.3 });
        tl.to("#w2", { y: -120, duration: 0.34, ease: "power3.inOut" }, 3.62);   // tucks back into the stack
        // card 1 (and its crown) has done its job: it slips back out of the stack as the post deals in (exit 6 f)
        tl.to("#w1 .tilt", { opacity: 0, y: -24, filter: "blur(8px)", duration: 6 * F, ease: "power2.in" }, 3.60);
        deal("#w3", 3.62, -20, 60, -6);
        P.floatY($("#w3 .fl"), 3, 1.25);
        // logo pops in after the card (parts lag the whole), the post lines draw in 2 f apart
        P.pop("#lilogo", 3.90, { peak: 1.12 });
        tl.fromTo("#w3 .pl", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 8 * F, ease: "power3.out", stagger: 2 * F }, 3.82);
        // THE SCRAWL: a fast, messy red zig-zag across the post body (card-local px), 0.35 s, contact on "sloppy"
        const loc3 = $("#loc3"), zz = [];
        let seed = 17;
        const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed % 1000) / 1000; };
        for (let i = 0; i <= 16; i++) {
          const x = 40 + i * 33 + (rnd() - 0.5) * 22;
          const y = (i % 2 ? 236 : 116) + (rnd() - 0.5) * 34 + (i % 4 === 3 ? -24 : 0);
          zz.push([x, y]);
        }
        zz.push([560, 150], [470, 214], [380, 160]);   // the hand loops back for a last swipe
        M.line(zz, 4.22, { parent: loc3, width: 11, dur: 0.35, amp: 5, ease: "power1.inOut" });
        // the post lines under the scrawl tremble once (they got hit)
        tl.to("#w3 .pl", { x: 4, duration: 2 * F, ease: "power2.out", yoyo: true, repeat: 1, stagger: 1 * F }, 4.37);
        P.punch(4.37, { scale: 1.01, origin: "510px 1260px", dur: 0.3 });
        P.shake(4.37, 4);
        // "sloppy" itself is sloppy: its letters boil out of line on fours after it lands
        const wS = $("#wSloppy"), txt = wS.textContent;
        wS.innerHTML = txt.split("").map((c) => `<span class="lt">${c}</span>`).join("");
        const lts = $$("#wSloppy .lt");
        let k = 0;
        for (let t = 4.62; t < D; t += 4 * F, k++) {
          lts.forEach((el, i) => {
            const h = ((i * 7919 + k * 104729) >>> 0) % 1000 / 1000, h2 = ((i * 3571 + k * 7727) >>> 0) % 1000 / 1000;
            tl.set(el, { rotation: (h - 0.5) * 9, y: (h2 - 0.5) * 10 }, t);
          });
        }
        // red loop around the LinkedIn logo on "LinkedIn" (4.69)
        M.circle(571, 53, 44, 41, 4.56, { parent: loc3, width: 8, dur: 0.3 });
        P.pulse("#lilogo", 4.62, 1.1);
        // "posts": the reaction row pops 2 f apart
        $$("#w3 .react").forEach((r, i) => {
          gsap.set(r, { transformOrigin: "15px 15px" });
          tl.to(r, { scale: 1.18, duration: 3 * F, ease: "power2.out" }, 4.92 + i * 2 * F);
          tl.to(r, { scale: 1, duration: 8 * F, ease: "back.out(2.2)" }, 4.92 + i * 2 * F + 3 * F);
        });
      })();
    </script>
