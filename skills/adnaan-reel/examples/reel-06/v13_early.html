<!doctype html>
<!-- v13_early - OPINION: portrait card + hand-drawn sunrise (horizon, red marker sun, rays). Runtime = paper.js, drawing = marker.js. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v13_early</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
    <style>
      @font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Caveat"; src: url("fonts/Caveat-Variable.ttf") format("truetype"); font-weight: 400 700; font-style: normal; font-display: block; }
      .lt { display: inline-block; }
    </style>
  </head>
  <body data-face="0.42">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="3.8167">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <!-- portrait card, settled from frame 0, below the horizon -->
        <div class="spk portrait" data-x="305" data-y="765" data-w="590" data-h="515" data-face-at="0.5">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="3.8167" data-track-index="1"></video></div>
            <div class="spk-sheen"></div>
          </div>
        </div>

        <!-- one small connective line at a time, always in the same low-right slot (never two at once) -->
        <div class="line sup kin" data-right="936" data-base="1352" data-size="70" data-exit="1.3" data-exit-dy="-8">
          <span class="w" data-t="0.00">We're</span><span class="w gap-s" data-t="0.36">actually</span>
        </div>
        <div class="line sup kin" data-right="936" data-base="1352" data-size="64" data-exit="2.2" data-exit-dy="-8">
          <span class="w" data-t="1.64">and</span><span class="w gap-s" data-t="1.78">this</span><span class="w gap-s" data-t="1.88">is</span><span class="w gap-s" data-t="2.04">such</span><span class="w gap-s" data-t="2.24">a</span>
        </div>

        <!-- top row: incredibly (ink) + early (red hero) -->
        <div id="L-incr" class="line sup" data-x="72" data-base="450" data-size="98">
          <span class="w hero ink" data-t="1.04" data-pop>incredibly</span>
        </div>
        <div id="L-early" class="line hero ocean" data-right="926" data-base="450" data-size="200">
          <span id="early" class="w" data-t="1.42" data-hero data-peak="1.07"><span class="lt">e</span><span class="lt">a</span><span class="lt">r</span><span class="lt">l</span><span class="lt">y</span></span>
        </div>

        <!-- low collage on paper below the card -->
        <div class="line hero ocean kin" data-x="84" data-base="1380" data-size="130">
          <span id="golden" class="w" data-t="2.48" data-hero data-peak="1.08"><span class="lt">g</span><span class="lt">o</span><span class="lt">l</span><span class="lt">d</span><span class="lt">e</span><span class="lt">n</span></span>
        </div>
        <div class="line sup kin" data-right="936" data-base="1352" data-size="70">
          <span class="w" data-t="3.26">that</span><span class="w gap-s" data-t="3.44">we</span>
        </div>
        <div id="L-opp" class="line hero ink kin" data-right="934" data-base="1444" data-size="116" data-fit="840">
          <span id="opp" class="w" data-t="3.00" data-pop data-rise="-34">opportunity</span>
        </div>

      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);
        const { tl, D, F } = P;
        const NS = "http://www.w3.org/2000/svg";
        const SX = 600, HZ = 760, SR = 185;               // sun centre x, horizon y, sun radius
        const g = (parent, attrs = {}) => { const e = document.createElementNS(NS, "g"); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
        // the drawing layer sits BEHIND the speaker card (horizon passes behind him, sun rises behind him like a halo)
        const punchEl = document.querySelector("#punch");
        punchEl.insertBefore(M.layer, punchEl.firstChild);

        // ---- sky: everything sun-related is clipped by the horizon, so the sun really rises from behind it
        const defs = M.layer.querySelector("defs");
        defs.insertAdjacentHTML("beforeend",
          `<clipPath id="sky"><rect x="0" y="0" width="1080" height="${HZ - 2}"/></clipPath>
           <radialGradient id="sunglow"><stop offset="0" stop-color="var(--brand-primary)" stop-opacity="0.34"/><stop offset="0.62" stop-color="var(--brand-primary)" stop-opacity="0.12"/><stop offset="1" stop-color="var(--brand-primary)" stop-opacity="0"/></radialGradient>`);
        const sky = g(M.layer, { "clip-path": "url(#sky)" });
        const glow = document.createElementNS(NS, "circle");
        glow.setAttribute("cx", SX); glow.setAttribute("cy", HZ); glow.setAttribute("r", 330); glow.setAttribute("fill", "url(#sunglow)");
        sky.appendChild(glow);
        const sunMove = g(sky);                            // the rising part (circle + hatch)
        const raysG = g(sky);                              // rays: draw, boil, rotate slowly
        const sparkG = g(M.layer);

        // ---- 1. HORIZON: ink line across the zone on 'actually' (0.36), contact ~0.2 s before
        const horizon = M.line([[80, HZ + 2], [300, HZ - 3], [560, HZ + 3], [800, HZ - 2], [938, HZ + 1]], 0.2, { color: "ink", width: 11, dur: 0.46, seed: 5151 });
        tl.fromTo(horizon.g, { y: 4 }, { y: 0, duration: 0.26, ease: "back.out(2.4)", immediateRender: false }, 0.62);

        // ---- 2. SUN: marker circle + hatch, rises from behind the horizon on 'early' (1.42): anticipation, stretch, overshoot, squash
        gsap.set(sunMove, { y: SR + 28, svgOrigin: `${SX} ${HZ}` });
        tl.to(sunMove, { y: SR + 40, duration: 0.1, ease: "power2.in" }, 1.08);                       // anticipation: sinks first
        tl.to(sunMove, { y: -18, scaleY: 1.07, scaleX: 0.97, duration: 0.36, ease: "power3.out" }, 1.18);   // rise + stretch
        tl.to(sunMove, { scaleY: 0.95, scaleX: 1.04, duration: 0.07, ease: "power2.in" }, 1.54);          // squash at the top
        tl.to(sunMove, { y: 0, scaleY: 1, scaleX: 1, duration: 0.36, ease: "back.out(2.2)" }, 1.61);      // settle
        M.circle(SX, HZ, SR, SR, 1.3, { parent: sunMove, color: "marker", width: 14, dur: 0.46, turns: 1.1, tilt: -3, seed: 8801 });
        const sunPoly = Array.from({ length: 36 }, (_, i) => { const a = (i / 36) * Math.PI * 2; return [SX + Math.cos(a) * (SR - 4), HZ + Math.sin(a) * (SR - 4)]; });
        M.hatch(sunPoly, 1.58, { parent: sunMove, spacing: 21, angle: -36, width: 13, dur: 0.46, opacity: 0.86, seed: 6620 });
        tl.set(glow, { opacity: 0 }, 0);
        tl.to(glow, { opacity: 0.55, duration: 0.5, ease: "power2.out" }, 1.55);
        tl.to(glow, { opacity: 1, scale: 1.1, duration: 0.3, ease: "power3.out", svgOrigin: `${SX} ${HZ}` }, 2.4);
        tl.to(glow, { scale: 1, duration: 0.5, ease: "sine.inOut" }, 2.7);
        tl.to(sunMove, { scale: 1.025, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 2, svgOrigin: `${SX} ${HZ}` }, 1.98);

        // ---- 3. RAYS on 'golden' (2.48): 11 rays draw outward one by one (2 f stagger), then boil + slowly rotate
        const RAYS = 11;
        for (let i = 0; i < RAYS; i++) {
          const ang = ((-168 + (156 / (RAYS - 1)) * i) * Math.PI) / 180;
          const r0 = SR + 30, r1 = SR + (i % 2 ? 80 : 94);
          const x0 = SX + Math.cos(ang) * r0, y0 = HZ + Math.sin(ang) * r0, x1 = SX + Math.cos(ang) * r1, y1 = HZ + Math.sin(ang) * r1;
          M.line([[x0, y0], [x1, y1]], 2.31 + i * 2 * F, { parent: raysG, color: "marker", width: 13, dur: 0.15, amp: 1.6, seed: 3300 + i * 41 });
        }
        gsap.set(raysG, { svgOrigin: `${SX} ${HZ}` });
        tl.to(raysG, { rotation: 4, duration: D - 2.5, ease: "none", svgOrigin: `${SX} ${HZ}` }, 2.5);

        // ---- 4. type effects: hero hits (1 % punch on 'early'), letters wave after landing, 
        P.punch(1.42, { scale: 1.01, origin: "510px 880px", dur: 0.3 });
        const wave = (sel, t, amp = 16) => document.querySelectorAll(sel + " .lt").forEach((l, i) => {
          tl.to(l, { y: -amp, duration: 0.12, ease: "power2.out" }, t + i * 2 * F);
          tl.to(l, { y: 0, duration: 0.3, ease: "back.out(2.4)" }, t + i * 2 * F + 0.12);
        });
        wave("#early", 1.78, 14);
        wave("#golden", 2.78, 12);

        // ---- 5. sparkles twinkle beside 'golden', double underline under 'opportunity'
        const sparkle = (cx, cy, s, at, seed) => {
          const sg = g(sparkG);
          M.line([[cx, cy - s], [cx + 2, cy + s]], at, { parent: sg, color: "marker", width: 9, dur: 0.1, amp: 1.2, seed });
          M.line([[cx - s, cy + 1], [cx + s, cy - 1]], at + 2 * F, { parent: sg, color: "marker", width: 9, dur: 0.1, amp: 1.2, seed: seed + 7 });
          gsap.set(sg, { svgOrigin: `${cx} ${cy}` });
          tl.fromTo(sg, { scale: 0.3, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.2, ease: "back.out(2.6)", svgOrigin: `${cx} ${cy}`, immediateRender: false }, at);
          tl.to(sg, { scale: 1.22, rotation: 8, duration: 0.34, ease: "sine.inOut", yoyo: true, repeat: 3, svgOrigin: `${cx} ${cy}` }, at + 0.25);
        };
        sparkle(496, 1352, 22, 2.62, 7100);
        sparkle(546, 1330, 15, 2.7, 7200);
        sparkle(100, 1446, 14, 2.78, 7300);
        const oppLine = document.querySelector("#L-opp"), opp = document.querySelector("#opp");
        const ox0 = oppLine.offsetLeft + opp.offsetLeft + 8, ox1 = oppLine.offsetLeft + opp.offsetLeft + opp.offsetWidth - 8;
        M.underline(ox0, ox1, 1444 + 6, 3.1, { double: true, width: 10, color: "marker", seed: 9090 });
      })();
    </script>
  </body>
</html>
