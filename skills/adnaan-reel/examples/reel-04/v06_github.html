<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v06 github</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist Mono";
        src: url("fonts/GeistMono-Medium.ttf") format("truetype");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      /* ---------- camera ---------- */
      #cam,
      #punch {
        position: absolute;
        inset: 0;
      }

      /* ---------- kinetic type v2: Inter Tight (accent = colour, no italics) ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.88;
        letter-spacing: -0.03em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .sup {
        font-family: var(--font-heading);
        font-weight: 800;
        font-style: normal;
        color: var(--brand-text);
      }
      .hv {
        font-family: var(--font-heading);
        font-weight: 900;
        font-style: normal;
        letter-spacing: -0.045em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.22em;
      }

      /* beat A */
      #a1 {
        font-size: 128px;
      }
      #a1 .small {
        font-size: 84px;
        font-weight: 700;
      }
      #a2 {
        font-size: 250px;
      }
      #a3 {
        font-size: 116px;
      }
      /* beat B */
      #b1 {
        font-size: 86px;
      }
      #b1 .hv {
        font-size: 124px;
      }
      #b2 {
        font-size: 92px;
      }
      #b2 .hv {
        font-size: 128px;
      }
      #b3 {
        font-size: 190px;
      }

      /* ---------- browser card (from v04_taste) ---------- */
      #br-float {
        position: absolute;
        left: 76px;
        top: 306px;
        width: 840px;
        height: 580px;
      }
      #br-move {
        position: absolute;
        inset: 0;
      }
      #browser {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        overflow: hidden;
        background: var(--brand-card);
        box-shadow:
          0 30px 50px -12px rgba(60, 50, 40, 0.3),
          0 50px 70px -10px rgba(40, 30, 20, 0.22);
        opacity: 0;
      }
      #chrome {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        height: 66px;
        background: #f1eeea;
        z-index: 2;
      }
      .dot {
        position: absolute;
        top: 26px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #d6d0ca;
      }
      #url {
        position: absolute;
        left: 50%;
        top: 12px;
        width: 360px;
        margin-left: -180px;
        height: 42px;
        border-radius: 21px;
        background: #e4ded9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: var(--brand-muted);
      }
      #viewport {
        position: absolute;
        left: 0;
        right: 0;
        top: 66px;
        bottom: 0;
        overflow: hidden;
        background: #0d1117;
      }
      #pagewrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 5200px;
        transform-origin: 0 0;
      }
      #page {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 5200px;
        display: block;
      }
      #ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 5200px;
        overflow: visible;
      }
      .sheen {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.26) 45%,
          rgba(255, 255, 255, 0.06) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
        z-index: 3;
      }

      /* ---------- black pills (from v04_taste) ---------- */
      .bpill-wrap {
        position: absolute;
      }
      .bpill {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 88px;
        padding: 0 38px 0 32px;
        border-radius: 44px;
        background: var(--brand-text);
        color: #ffffff;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 38px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 24px 40px -10px rgba(20, 20, 20, 0.38);
        opacity: 0;
      }
      .bpill svg {
        width: 36px;
        height: 36px;
        display: block;
      }
      #tag {
        height: 64px;
        padding: 0 26px;
        border-radius: 32px;
        font-size: 32px;
        gap: 10px;
      }
      #tag b {
        color: var(--brand-primary);
        font-weight: 600;
      }

      /* ---------- secondary speaker card ---------- */
      #spk-float {
        position: absolute;
        left: 330px;
        top: 438px;
        width: 620px;
        height: 432px;
      }
      #spk-card {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
        opacity: 0;
      }
      #vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 30px;
      }
      /* source 1080x1920 scaled to 620 wide; window = 23.4%–62.6% of the source height (face centred, eyes ~42 %) */
      #speaker {
        position: absolute;
        left: 0;
        top: -258px;
        width: 620px;
        height: 1102px;
        object-fit: cover;
      }

      /* ---------- terminal card ---------- */
      #term-wrap {
        position: absolute;
        left: 96px;
        top: 902px;
        width: 848px;
        height: 172px;
      }
      #term {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: var(--brand-text);
        box-shadow:
          0 30px 50px -12px rgba(20, 20, 20, 0.42),
          0 12px 20px -8px rgba(20, 20, 20, 0.3);
        opacity: 0;
      }
      .tdot {
        position: absolute;
        top: 28px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #3a3836;
      }
      #chip {
        position: absolute;
        right: 18px;
        top: 14px;
        width: 196px;
        height: 50px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.1);
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: #ffffff;
      }
      #chip-ring {
        position: absolute;
        inset: 0;
        border-radius: 25px;
        box-shadow: 0 0 0 4px var(--brand-primary);
        opacity: 0;
      }
      .chip-face {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        white-space: nowrap;
      }
      .chip-face svg {
        width: 28px;
        height: 28px;
        display: block;
      }
      #cmd {
        position: absolute;
        left: 38px;
        top: 70px;
        height: 84px;
        display: flex;
        align-items: center;
        font-family: "Geist Mono", var(--font-body);
        font-weight: 500;
        font-size: 42px;
        letter-spacing: -0.01em;
        color: #ffffff;
        white-space: pre;
      }
      #cmd .pr {
        color: var(--brand-muted);
      }
      #cmd .ch {
        opacity: 0;
      }
      #caret {
        position: absolute;
        left: 0;
        top: 89px;
        width: 22px;
        height: 46px;
        border-radius: 4px;
        background: var(--brand-primary);
      }

      /* ---------- cursor (from v03_genius) ---------- */
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
      }
      #cursor svg {
        position: absolute;
        left: -4px;
        top: -3px;
        width: 62px;
        height: 82px;
        overflow: visible;
        filter: drop-shadow(0 8px 10px rgba(40, 30, 20, 0.3));
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="4.233">
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <div id="punch">
          <!-- browser card: the real GitHub Trending page -->
          <div id="br-float">
            <div id="br-move">
              <div id="browser">
                <div id="chrome">
                  <span class="dot" style="left: 28px"></span>
                  <span class="dot" style="left: 54px"></span>
                  <span class="dot" style="left: 80px"></span>
                  <div id="url">github.com/trending</div>
                </div>
                <div id="viewport">
                  <div id="pagewrap">
                    <img id="page" src="assets/gh_trending.png" alt="" />
                    <svg id="ring" viewBox="0 0 1080 5200">
                      <rect id="ring-fill" x="50" y="993" width="862" height="282" rx="24" fill="rgba(46,156,203,0.16)" />
                      <rect
                        id="ring-line"
                        x="50"
                        y="993"
                        width="862"
                        height="282"
                        rx="24"
                        fill="none"
                        stroke="#2E9CCB"
                        stroke-width="8"
                        stroke-linecap="round"
                      />
                    </svg>
                  </div>
                </div>
                <div id="br-sheen" class="sheen"></div>
              </div>
            </div>
          </div>

          <!-- "#1 Trending" tag pinned on the ring's top edge -->
          <div id="tag-wrap" class="bpill-wrap">
            <div id="tag" class="bpill"><b>#1</b><span>Trending</span></div>
          </div>
          <!-- stat pill -->
          <div id="stat-wrap" class="bpill-wrap">
            <div id="stat" class="bpill">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#ffffff" d="M12 2.2l2.95 6.2 6.8.85-4.98 4.7 1.27 6.75L12 17.4l-6.04 3.3 1.27-6.75-4.98-4.7 6.8-.85z" />
              </svg>
              <span>25,585 stars today</span>
            </div>
          </div>

          <!-- secondary speaker card -->
          <div id="spk-float">
            <div id="spk-card">
              <div id="vid-wrap">
                <video
                  id="speaker"
                  class="clip"
                  src="assets/speaker.mp4"
                  muted
                  playsinline
                  data-start="0"
                  data-duration="4.233"
                  data-track-index="1"
                ></video>
              </div>
              <div id="spk-sheen" class="sheen" style="border-radius: 30px"></div>
            </div>
          </div>

          <!-- terminal card -->
          <div id="term-wrap">
            <div id="term">
              <span class="tdot" style="left: 30px"></span>
              <span class="tdot" style="left: 56px"></span>
              <span class="tdot" style="left: 82px"></span>
              <div id="chip">
                <div id="chip-ring"></div>
                <div id="face-copy" class="chip-face">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="13" height="13" x="9" y="9" rx="2.5" />
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                  </svg>
                  <span>Copy</span>
                </div>
                <div id="face-ok" class="chip-face" style="opacity: 0">
                  <span>Copied</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="#2E9CCB" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6 9 17l-5-5" />
                  </svg>
                </div>
              </div>
              <div id="cmd"></div>
              <div id="caret"></div>
            </div>
          </div>

          <!-- beat A: it's growing / crazy / on GitHub -->
          <div id="a1" class="line sup" data-x="92" data-base="1040" data-max="820">
            <span class="bl"></span>
            <span class="w small" data-t="0.05">it's</span>
            <span class="w gap-s" data-t="0.47" data-pop="1">growing</span>
          </div>
          <div id="a2" class="line hv ocean" data-x="132" data-base="1258" data-max="770">
            <span class="bl"></span>
            <span class="w" data-t="1.13" data-hero="1" data-origin="45% 85%" data-peak="1.08">crazy</span>
          </div>
          <div id="a3" class="line sup" data-right="940" data-base="1420" data-max="760">
            <span class="bl"></span>
            <span class="w" data-t="1.43">on</span>
            <span class="w gap-s" data-t="1.71">GitHub</span>
          </div>

          <!-- beat B: you can try to / just type in this / command -->
          <div id="b1" class="line sup" data-right="904" data-base="1180" data-max="800">
            <span class="bl"></span>
            <span class="w" data-t="2.11">you</span>
            <span class="w gap-s" data-t="2.29">can</span>
            <span class="w hv ocean gap-s" data-t="2.51" data-accent="1">try</span>
            <span class="w gap-s" data-t="2.79">to</span>
          </div>
          <div id="b2" class="line sup" data-x="88" data-base="1308" data-max="840">
            <span class="bl"></span>
            <span class="w" data-t="3.05">just</span>
            <span class="w gap-s" data-t="3.27">type</span>
            <span class="w gap-s" data-t="3.39">in</span>
            <span class="w hv ink gap-s" data-t="3.53" data-pop="1">this</span>
          </div>
          <div id="b3" class="line hv ink" data-right="916" data-base="1447" data-max="790">
            <span class="bl"></span>
            <span class="w" data-t="3.87" data-hero="1" data-origin="55% 85%" data-peak="1.06" data-rise="18">command</span>
          </div>

          <div id="cursor">
            <svg viewBox="0 0 38 50">
              <path d="M2 2 L2 38 L11.5 29.5 L18 44 L25 41 L18.5 27 L31 27 Z" fill="#FFFFFF" stroke="#141414" stroke-width="2.6" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const fontSpecs = [
          '900 100px "Inter Tight"',
          '800 100px "Inter Tight"',
          '700 100px "Inter Tight"',
          '500 40px "Inter"',
          '600 40px "Inter"',
          '500 42px "Geist Mono"',
        ];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }
        const pageImg = document.getElementById("page");
        if (!pageImg.complete) {
          await new Promise((res) => {
            pageImg.addEventListener("load", res, { once: true });
            pageImg.addEventListener("error", res, { once: true });
          });
        }

        const D = 4.233;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        // ---- fit each line to its max width (Inter Tight is wide), then place by baseline ----
        for (const line of $$(".line[data-max]")) {
          const max = parseFloat(line.dataset.max);
          if (line.offsetWidth > max) {
            const r = max / line.offsetWidth;
            line.style.fontSize = parseFloat(getComputedStyle(line).fontSize) * r + "px";
            for (const w of line.querySelectorAll(".w")) {
              w.style.fontSize = parseFloat(getComputedStyle(w).fontSize) * r + "px";
            }
          }
        }
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }

        // ---- page framing inside the browser viewport (PNG px -> card px) ----
        // start: the "Trending" header; end: the #1 row (morluto / rea, PNG y 983-1284) zoomed in
        const P0 = { s: 0.7778, x: 0, y: -0.7778 * 230 };
        const P1 = { s: 0.95, x: -0.95 * 40, y: 132 - 0.95 * 983 };
        const P2 = { s: 0.985, x: -0.985 * 44, y: 132 - 0.985 * 990 };

        // ring perimeter for the draw-on
        const ringLine = $("#ring-line");
        const per = ringLine.getTotalLength();
        gsap.set(ringLine, { strokeDasharray: per, strokeDashoffset: per });

        // pills: tag pinned to the ring's top-left, stat pill beside the row (bottom-right, over the card edge)
        // ring top edge on screen (card left 76, viewport top 306+66) at P1/P2 framing
        const ringTopY = 306 + 66 + P1.y + P1.s * 993; // ~ 504
        const tagWrap = $("#tag-wrap");
        const ringRightX = 76 + P1.s * (912 - 40);
        tagWrap.style.left = ringRightX - 22 - $("#tag").offsetWidth + "px";
        tagWrap.style.top = ringTopY - 32 + "px";
        const statWrap = $("#stat-wrap");
        const statW = $("#stat").offsetWidth;
        statWrap.style.left = 944 - statW + "px";
        statWrap.style.top = "828px";

        // ---- command: one span per character ----
        const CMD = "npx rea-agents@latest setup";
        const cmd = $("#cmd");
        cmd.innerHTML = '<span class="pr">$ </span>';
        const chars = [];
        for (const c of CMD) {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          cmd.appendChild(s);
          chars.push(s);
        }
        // fit: command + caret must stay left of the card's right padding
        const maxW = 848 - 38 - 60;
        if (cmd.offsetWidth > maxW) {
          cmd.style.fontSize = (42 * maxW) / cmd.offsetWidth + "px";
        }
        const caret = $("#caret");
        const caretX = (i) => {
          // i = number of typed chars; caret sits right after the last typed char
          const pr = cmd.querySelector(".pr");
          const el = i === 0 ? pr : chars[i - 1];
          return cmd.offsetLeft + el.offsetLeft + el.offsetWidth + 4;
        };

        // ================= timeline =================
        const tl = gsap.timeline({ paused: true });

        // background drift (continuous, linear on purpose) + slow camera push
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -12, duration: D, ease: "none" }, 0);
        tl.fromTo("#cam", { scale: 1, transformOrigin: "540px 880px" }, { scale: 1.012, duration: D, ease: "none" }, 0);

        // ---- word entrances (contact frame on the spoken word) ----
        function wordIn(w) {
          const t = parseFloat(w.dataset.t);
          if (w.dataset.hero) {
            const s = Math.max(0, t - 0.2);
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 80%" });
            tl.fromTo(
              w,
              { opacity: 0, y: parseFloat(w.dataset.rise || "100"), scale: 0.55, rotation: -7, filter: "blur(10px)" },
              { opacity: 1, y: -8, scale: parseFloat(w.dataset.peak || "1.1"), rotation: 1.5, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, s + 0.2);
          } else if (w.dataset.pop) {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 64, scale: 0.72, rotation: -5, filter: "blur(8px)" },
              { opacity: 1, y: -5, scale: 1.06, rotation: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.28, ease: "back.out(1.5)" }, s + 0.16);
          } else if (w.dataset.accent) {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 60, scale: 0.78, rotation: -6, filter: "blur(8px)" },
              { opacity: 1, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.46, ease: "back.out(2.2)" },
              s,
            );
          } else {
            const s = Math.max(0, t - 0.13);
            tl.fromTo(
              w,
              { opacity: 0, y: 44, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
              s,
            );
          }
        }
        $$(".line .w").forEach(wordIn);

        function lineOut(sel, t, dy = -54) {
          tl.to(sel, { y: dy, opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, t);
        }

        // ================= BEAT A 0–2.4: the real Trending page =================
        gsap.set("#browser", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        tl.fromTo("#browser", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, 0);
        tl.fromTo("#browser", { y: 120 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
        tl.fromTo("#browser", { scale: 0.88 }, { scale: 1, duration: 0.48, ease: "back.out(1.5)", immediateRender: false }, 0);
        tl.fromTo("#browser", { rotationX: 26 }, { rotationX: 4, duration: 0.62, ease: "back.out(1.8)", immediateRender: false }, 0);
        tl.fromTo("#browser", { rotationY: -20 }, { rotationY: -7, duration: 0.55, ease: "power3.out", immediateRender: false }, 0);
        tl.to("#browser", { rotationY: -4.5, rotationX: 2.5, duration: 2.08 - 0.62, ease: "sine.inOut" }, 0.62);
        tl.fromTo("#br-sheen", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.08);
        tl.fromTo(
          "#br-sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut", immediateRender: false },
          0.08,
        );
        tl.to("#br-sheen", { opacity: 0, duration: 0.25, ease: "power1.in" }, 0.56);
        tl.to("#br-float", { y: -5, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.6);

        // the page scrolls from the header down to the #1 row and zooms in (lands on "growing")
        gsap.set("#pagewrap", { x: P0.x, y: P0.y, scale: P0.s });
        tl.to("#pagewrap", { x: P1.x, y: P1.y, scale: P1.s, duration: 0.62, ease: "power3.inOut" }, 0.16);
        tl.to("#pagewrap", { x: P2.x, y: P2.y, scale: P2.s, duration: 3.4, ease: "sine.inOut" }, 0.78);

        // ocean ring draws round the row on "growing"
        tl.fromTo("#ring-fill", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.5);
        tl.to(ringLine, { strokeDashoffset: 0, duration: 0.42, ease: "power2.inOut" }, 0.33);
        // little pulse on the ring when "crazy" lands
        tl.to("#ring-fill", { opacity: 0.45, duration: 0.1, ease: "power2.out" }, 1.06);
        tl.to("#ring-fill", { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 1.17);

        // "#1 Trending" tag + stat pill pop on "crazy" (contact 1.13)
        gsap.set("#tag", { transformOrigin: "80% 60%" });
        tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, 0.94);
        tl.fromTo("#tag", { scale: 0.5, y: 22 }, { scale: 1.08, y: -3, duration: 0.18, ease: "power3.out", immediateRender: false }, 0.94);
        tl.to("#tag", { scale: 1, y: 0, duration: 0.28, ease: "back.out(1.6)" }, 1.12);
        gsap.set("#stat", { transformOrigin: "70% 50%" });
        const stIn = 0.95 + 3 * F;
        tl.fromTo("#stat", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, stIn);
        tl.fromTo("#stat", { scale: 0.55, y: 28 }, { scale: 1.08, y: -3, duration: 0.18, ease: "power3.out", immediateRender: false }, stIn);
        tl.to("#stat", { scale: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, stIn + 0.18);
        tl.to("#stat-wrap", { y: -5, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.45);
        tl.to("#tag-wrap", { y: -4, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.5);

        // "crazy" — camera punch
        tl.fromTo("#punch", { scale: 1, transformOrigin: "540px 880px" }, { scale: 1.008, duration: 0.45, ease: "power2.out" }, 1.06);

        // beat A type clears bottom-up-ish ("crazy" first, then "it's growing"), pills leave
        lineOut("#a2", 1.8, -60);
        lineOut("#a1", 1.8 + F, -54);
        tl.to("#stat", { scale: 0.85, opacity: 0, filter: "blur(4px)", duration: 0.18, ease: "power2.in" }, 1.9);
        tl.to("#tag", { scale: 0.85, opacity: 0, filter: "blur(4px)", duration: 0.18, ease: "power2.in" }, 1.9 + F);
        lineOut("#a3", 2.78, -46);

        // ================= BEAT B 2.2–4.25: try this command =================
        // browser anticipates (tiny lift), then slides back + shrinks to the top-left corner on an arc
        const bOut = 2.0;
        gsap.set("#br-move", { transformOrigin: "0% 0%", transformPerspective: 1600 });
        tl.to("#br-move", { scale: 1.012, y: 6, duration: 3 * F, ease: "power2.out" }, bOut);
        tl.to("#br-move", { scale: 0.6, duration: 0.5, ease: "power3.out" }, bOut + 3 * F);
        tl.to("#br-move", { y: 12, duration: 0.5, ease: "power2.inOut" }, bOut + 3 * F);
        tl.to("#br-move", { x: 4, duration: 0.5, ease: "power3.out" }, bOut + 3 * F);
        tl.to("#br-move", { scale: 0.615, duration: 0.3, ease: "sine.inOut" }, bOut + 3 * F + 0.5);
        tl.to("#browser", { rotationY: -10, rotationX: 4, duration: 0.5, ease: "power2.inOut" }, bOut + 3 * F);
        tl.to("#browser", { rotationY: -7, rotationX: 3, duration: D - (bOut + 0.6), ease: "sine.inOut" }, bOut + 0.6);

        // secondary speaker card swings in on the right (readable ~2.45)
        gsap.set("#spk-card", { transformPerspective: 1600, transformOrigin: "60% 60%" });
        const sIn = 2.28;
        tl.fromTo("#spk-card", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, sIn);
        tl.fromTo("#spk-card", { x: 26 }, { x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, sIn);
        tl.fromTo("#spk-card", { y: 110 }, { y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, sIn);
        tl.fromTo("#spk-card", { scale: 0.86 }, { scale: 1, duration: 0.48, ease: "back.out(1.5)", immediateRender: false }, sIn);
        tl.fromTo("#spk-card", { rotationX: 24 }, { rotationX: 4, duration: 0.6, ease: "back.out(1.8)", immediateRender: false }, sIn);
        tl.fromTo("#spk-card", { rotationY: 22 }, { rotationY: 8, duration: 0.55, ease: "power3.out", immediateRender: false }, sIn);
        tl.to("#spk-card", { rotationY: 6, rotationX: 3, duration: D - (sIn + 0.6), ease: "sine.inOut" }, sIn + 0.6);
        tl.fromTo("#vid-wrap", { scale: 1.16 }, { scale: 1, duration: 0.7, ease: "power3.out" }, sIn);
        tl.to("#vid-wrap", { scale: 1.025, duration: D - (sIn + 0.7), ease: "none" }, sIn + 0.7);
        tl.fromTo("#spk-sheen", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, sIn + 0.08);
        tl.fromTo(
          "#spk-sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut", immediateRender: false },
          sIn + 0.08,
        );
        tl.to("#spk-sheen", { opacity: 0, duration: 0.25, ease: "power1.in" }, sIn + 0.55);
        tl.to("#spk-float", { y: -5, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 1 }, sIn + 0.5);

        // terminal card rises in (readable on "try" 2.51)
        gsap.set("#term", { transformPerspective: 1600, transformOrigin: "50% 60%" });
        const tIn = 2.36;
        tl.fromTo("#term", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, tIn);
        tl.fromTo("#term", { y: 80 }, { y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, tIn);
        tl.fromTo("#term", { scale: 0.9 }, { scale: 1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, tIn);
        tl.fromTo("#term", { rotationX: 22 }, { rotationX: 0, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, tIn);
        tl.fromTo("#term", { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false }, tIn);
        tl.to("#term-wrap", { y: -4, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, tIn + 0.5);

        // typing: one char per step, 2.62 -> 3.72; the caret follows the last char
        const T0 = 2.62;
        const T1 = 3.72;
        const step = (T1 - T0) / (chars.length - 1);
        gsap.set(caret, { x: caretX(0) });
        chars.forEach((c, i) => {
          const t = T0 + i * step;
          tl.set(c, { opacity: 1 }, t);
          tl.set(caret, { x: caretX(i + 1) }, t);
        });
        // caret blinks before typing starts and after it ends (steps, not tweens)
        for (const t of [2.46, 2.54]) tl.set(caret, { opacity: t === 2.46 ? 0 : 1 }, t);
        for (let k = 0, t = T1 + 0.2; t < D; k++, t += 0.17) tl.set(caret, { opacity: k % 2 === 0 ? 0 : 1 }, t);

        // cursor arcs down from the card edge to the Copy chip and clicks (contact 3.96)
        const chipEl = $("#chip");
        const termWrap = $("#term-wrap");
        const chipPt = {
          x: termWrap.offsetLeft + chipEl.offsetLeft + chipEl.offsetWidth * 0.62,
          y: termWrap.offsetTop + chipEl.offsetTop + chipEl.offsetHeight * 0.58,
        };
        const CLICK = 3.96;
        const cur = $("#cursor");
        const curSvg = cur.querySelector("svg");
        gsap.set(curSvg, { transformOrigin: "4px 3px" });
        gsap.set(cur, { x: 884, y: 690 });
        tl.fromTo(curSvg, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(2)" }, CLICK - 0.46);
        tl.to(cur, { x: chipPt.x, duration: 0.4, ease: "power3.out" }, CLICK - 0.42);
        tl.to(cur, { y: chipPt.y, duration: 0.4, ease: "power2.inOut" }, CLICK - 0.42);
        tl.to(curSvg, { scale: 0.8, duration: 2 * F, ease: "power2.in" }, CLICK - 2 * F);
        tl.to(curSvg, { scale: 1, duration: 0.14, ease: "back.out(2.5)" }, CLICK);
        tl.to(cur, { x: chipPt.x + 4, y: chipPt.y + 44, duration: 0.24, ease: "power2.inOut" }, CLICK + 0.1);
        tl.to(curSvg, { opacity: 0, duration: 0.1, ease: "power2.in" }, CLICK + 0.1);

        // chip: press dip, "Copy" -> "Copied ✓", ocean flash + ring pulse
        gsap.set(chipEl, { transformOrigin: "50% 50%" });
        tl.to(chipEl, { scale: 0.92, duration: 2 * F, ease: "power2.in" }, CLICK - 2 * F);
        tl.to(chipEl, { scale: 1, duration: 0.24, ease: "back.out(2.4)" }, CLICK);
        tl.to("#face-copy", { opacity: 0, y: -10, duration: 0.1, ease: "power2.in" }, CLICK);
        tl.fromTo("#face-ok", { opacity: 0, y: 12, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(2.2)" }, CLICK + F);
        tl.fromTo(chipEl, { backgroundColor: "rgba(255,255,255,0.1)" }, { backgroundColor: "rgba(46,156,203,0.55)", duration: 0.06, ease: "power1.out" }, CLICK);
        tl.to(chipEl, { backgroundColor: "rgba(46,156,203,0.2)", duration: 0.22, ease: "power2.out" }, CLICK + 0.06);
        tl.fromTo("#chip-ring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.16, duration: 0.26, ease: "power2.out" }, CLICK);
        tl.to("#term", { scale: 0.99, duration: 2 * F, ease: "power2.in", yoyo: true, repeat: 1 }, CLICK - F);

        // "command" — tiny second punch
        tl.to("#punch", { scale: 1.012, duration: 0.4, ease: "power2.out" }, 3.72);

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
