<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v10 copy</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette (identical to v01_hook) ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      /* ---------- camera ---------- */
      #cam,
      #punch {
        position: absolute;
        inset: 0;
      }

      /* ---------- app cards (deep teal) ---------- */
      .app-pos {
        position: absolute;
        left: 80px;
        top: 740px;
        width: 564px;
        height: 679px;
      }
      /* the card is drawn at 490x590 and shown at 1.15x (564x679) */
      .app-k {
        position: absolute;
        left: 0;
        top: 0;
        width: 490px;
        height: 590px;
        transform: scale(1.15);
        transform-origin: 0 0;
      }
      .app-float,
      .app-bump {
        position: absolute;
        inset: 0;
      }
      .app-glow {
        position: absolute;
        left: -200px;
        top: -200px;
        width: 840px;
        height: 990px;
        background: radial-gradient(ellipse 236px 330px at 50% 50%, rgba(46, 156, 203, 0.32), rgba(46, 156, 203, 0) 100%);
        opacity: 0;
      }
      .app {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        overflow: hidden;
        background: linear-gradient(160deg, #123542 0%, var(--brand-deep) 55%, #0a2029 100%);
        box-shadow:
          0 14px 0 -2px var(--brand-primary),
          0 26px 40px -16px rgba(30, 30, 30, 0.34);
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .r {
        position: absolute;
      }
      .wash {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, rgba(120, 200, 235, 0.35), rgba(46, 156, 203, 0.12) 70%);
        opacity: 0;
      }
      .light {
        position: absolute;
        inset: 0;
        background: rgba(251, 250, 248, 0.6);
        opacity: 0;
      }
      .sheen {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.2) 45%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }
      #scan {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 0;
        opacity: 0;
      }
      #scan-trail {
        position: absolute;
        left: 0;
        top: -150px;
        width: 100%;
        height: 150px;
        background: linear-gradient(to bottom, rgba(46, 156, 203, 0), rgba(46, 156, 203, 0.34));
      }
      #scan-line {
        position: absolute;
        left: 0;
        top: -3px;
        width: 100%;
        height: 6px;
        background: #7cc9ea;
        box-shadow:
          0 0 16px 4px rgba(46, 156, 203, 0.8),
          0 0 40px 10px rgba(46, 156, 203, 0.35);
      }
      .chk {
        position: absolute;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #6ac2e6, #2e9ccb 55%, #1f7ea8 100%);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }
      .chk svg {
        position: absolute;
        inset: 0;
      }

      /* ---------- black pills ---------- */
      .pill {
        position: absolute;
        height: 64px;
        padding: 0 28px 0 22px;
        border-radius: 32px;
        background: var(--brand-text);
        color: #fbfaf8;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 36px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 18px 30px -8px rgba(30, 25, 20, 0.38);
      }
      .pill i {
        display: block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--brand-primary);
        flex: none;
      }

      /* ---------- scan beam ---------- */
      #beam,
      #links,
      #timer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      #beam {
        opacity: 0;
      }

      /* ---------- agent puck (v02_skills, scaled to 220) ---------- */
      #puck-pos {
        position: absolute;
        left: 670px;
        top: 953px;
        width: 253px;
        height: 253px;
      }
      /* puck drawn at 220 and shown at 1.15x (253) */
      #puck-k {
        position: absolute;
        left: 0;
        top: 0;
        width: 220px;
        height: 220px;
        transform: scale(1.15);
        transform-origin: 0 0;
      }
      #puck-float,
      #puck-bob,
      #puck {
        position: absolute;
        inset: 0;
      }
      #puck-glow {
        position: absolute;
        left: -46px;
        top: -46px;
        width: 312px;
        height: 312px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(46, 156, 203, 0.5) 0%,
          rgba(46, 156, 203, 0.2) 42%,
          rgba(46, 156, 203, 0) 70%
        );
        opacity: 0;
      }
      #puck-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow:
          0 0 0 7px var(--brand-primary),
          0 0 34px 10px rgba(46, 156, 203, 0.45);
        opacity: 0;
      }
      #puck-disc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 26%, #3d3d3d 0%, #1d1d1d 42%, #141414 72%);
        box-shadow:
          0 28px 44px -10px rgba(40, 30, 20, 0.5),
          inset 0 -6px 14px rgba(0, 0, 0, 0.45);
      }
      #visor {
        position: absolute;
        left: 42px;
        top: 78px;
        width: 136px;
        height: 68px;
        border-radius: 34px;
        background: linear-gradient(180deg, #070707 0%, #1f1f1f 100%);
        box-shadow:
          inset 0 3px 8px rgba(0, 0, 0, 0.7),
          0 1px 0 rgba(255, 255, 255, 0.09);
      }
      #eyes {
        position: absolute;
        inset: 0;
      }
      .eye {
        position: absolute;
        top: 22px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--brand-primary);
        opacity: 0.32;
      }
      #eye-l {
        left: 31px;
      }
      #eye-r {
        left: 81px;
      }

      /* ---------- speaker card (secondary size, v01_hook treatment) ---------- */
      #card-float {
        position: absolute;
        left: 190px;
        top: 324px;
        width: 640px;
        height: 506px;
      }
      #card {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      #vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 30px;
        transform-origin: 50% 85%;
      }
      /* source 1080x1920 scaled to the card width (640x1138); window = 18.5%–63% of the source height (full head, hair kept) */
      #speaker {
        position: absolute;
        left: 0;
        top: -211px;
        width: 640px;
        height: 1138px;
        object-fit: cover;
      }
      #sheen {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 45%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }

      /* ---------- kinetic serif ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.88;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      /* v2 type: Inter Tight — supporting 800 / -0.03em, hero 900 / -0.045em, accent = colour (no italics) */
      .serif {
        font-family: var(--font-heading);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--brand-text);
      }
      .ital {
        font-family: var(--font-accent);
        font-weight: 900;
        font-style: normal;
        letter-spacing: -0.045em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.24em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1080"
      data-height="1920"
      data-duration="8.5"
    >
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <div id="punch">
          <!-- ===== speaker card (beat B, upper area) ===== -->
          <div id="card-float">
            <div id="card">
              <div id="vid-wrap">
                <video
                  id="speaker"
                  class="clip"
                  src="assets/speaker.mp4"
                  muted
                  playsinline
                  data-start="0"
                  data-duration="8.5"
                  data-track-index="1"
                ></video>
              </div>
              <div id="sheen"></div>
            </div>
          </div>

          <!-- ===== dotted path (beat B) ===== -->
          <svg id="links" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <mask id="lk" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
                <path id="lk-mask" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="butt" />
              </mask>
            </defs>
            <path
              id="lk-path"
              fill="none"
              stroke="#141414"
              stroke-width="3"
              stroke-linecap="round"
              stroke-dasharray="2 12"
              mask="url(#lk)"
            />
          </svg>

          <!-- ===== timer ring around the puck (beat B) ===== -->
          <svg id="timer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <g id="timer-g">
              <rect id="timer-crown" rx="7" fill="#141414" />
              <circle id="timer-track" fill="none" stroke="rgba(20,20,20,0.10)" stroke-width="12" />
              <g id="timer-ticks"></g>
              <circle
                id="timer-arc"
                fill="none"
                stroke="#2E9CCB"
                stroke-width="12"
                stroke-linecap="round"
              />
            </g>
          </svg>

          <!-- ===== "your app" card (original) ===== -->
          <div id="app-pos" class="app-pos">
            <div class="app-k">
            <div class="app-float">
              <div class="app-bump" id="app-bump">
                <div class="app-glow" id="app-glow"></div>
                <div class="app" id="app">
                  <div class="layer" id="ly-ui"></div>
                  <div class="layer" id="ly-code"></div>
                  <div class="layer" id="ly-feat"></div>
                  <div class="wash" id="app-wash"></div>
                  <div id="scan">
                    <div id="scan-trail"></div>
                    <div id="scan-line"></div>
                  </div>
                </div>
              </div>
            </div>
            </div>
          </div>

          <!-- ===== scan beam (cone + dotted edges) ===== -->
          <svg id="beam" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="beam-grad" gradientUnits="userSpaceOnUse" x1="770" y1="0" x2="638" y2="0">
                <stop offset="0" stop-color="#2E9CCB" stop-opacity="0.72" />
                <stop offset="1" stop-color="#2E9CCB" stop-opacity="0.3" />
              </linearGradient>
            </defs>
            <polygon id="cone" fill="url(#beam-grad)" />
            <line id="edge-a" x1="790" y1="1082" x2="630" y2="800" stroke="#2E9CCB" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" />
            <line id="edge-b" x1="790" y1="1082" x2="630" y2="928" stroke="#2E9CCB" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" />
          </svg>

          <!-- ===== agent puck ===== -->
          <div id="puck-pos">
            <div id="puck-k">
            <div id="puck-float">
              <div id="puck-bob">
                <div id="puck">
                  <div id="puck-glow"></div>
                  <div id="puck-ring"></div>
                  <div id="puck-disc">
                    <div id="visor">
                      <div id="eyes">
                        <div id="eye-l" class="eye"></div>
                        <div id="eye-r" class="eye"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            </div>
          </div>

          <!-- ===== the copy (beat B) ===== -->
          <div id="copy-pos" class="app-pos">
            <div class="app-k">
            <div class="app-float" id="copy-float">
              <div class="app-bump" id="copy-bump">
                <div class="app" id="copy">
                  <div class="layer" id="cp-feat"></div>
                  <div class="sheen" id="copy-sheen"></div>
                  <div class="light" id="copy-light"></div>
                </div>
              </div>
            </div>
            </div>
          </div>

          <!-- ===== label pills ===== -->
          <div id="pill-app" class="pill"><i></i>your app</div>
          <div id="pill-else" class="pill"><i></i>someone else</div>

          <!-- ===== BEAT A kinetic type (top) ===== -->
          <div id="p0a" class="line serif" data-x="92" data-base="392" style="font-size: 84px">
            <span class="bl"></span>
            <span class="w" data-t="0.32">if</span>
            <span class="w gap-s" data-t="0.38">an</span>
          </div>
          <div id="p0b" class="line ital ink" data-maxw="760" data-x="128" data-base="664" style="font-size: 190px">
            <span class="bl"></span>
            <span class="w" data-t="0.68" data-hero="1" data-origin="30% 85%">AI</span>
            <span class="w" style="margin-left: 0.2em" data-t="1.10" data-hero="1" data-origin="20% 85%">agent</span>
          </div>

          <div id="r1" class="line serif" data-x="92" data-base="392" style="font-size: 84px">
            <span class="bl"></span>
            <span class="w" id="w-can" data-t="1.34">can</span>
            <span class="w gap-s" id="w-look" data-t="1.56">look</span>
            <span class="w gap-s" id="w-at" data-t="1.76">at</span>
            <span class="w gap-s" id="w-your" data-t="1.88">your</span>
          </div>
          <div id="r1b" class="line ital ocean" data-x="560" data-base="392" style="font-size: 120px">
            <span class="bl"></span>
            <span class="w" data-t="4.13" data-pop="1">all</span>
            <span class="w" style="margin-left: 0.2em" data-t="4.29" data-pop="1">the</span>
          </div>

          <div id="h-app" class="line ital ocean" data-x="420" data-base="652" style="font-size: 220px">
            <span class="bl"></span>
            <span class="w" data-t="2.20" data-hero="1" data-origin="40% 85%">app</span>
          </div>
          <div id="h-soft" class="line ital ink" data-maxw="790" data-x="100" data-base="652" style="font-size: 200px">
            <span class="bl"></span>
            <span class="w" data-t="3.28" data-hero="1" data-origin="30% 85%">software</span>
          </div>
          <div id="h-feat" class="line ital ocean" data-maxw="820" data-right="896" data-base="652" style="font-size: 190px">
            <span class="bl"></span>
            <span class="w" data-t="4.65" data-hero="1" data-origin="40% 85%">features</span>
          </div>

          <!-- ===== BEAT B kinetic type (bottom) ===== -->
          <div id="b1" class="line serif" data-maxw="850" data-x="92" data-base="1290" style="font-size: 84px">
            <span class="bl"></span>
            <span class="w" data-t="5.27">build</span>
            <span class="w gap-s" data-t="5.61">someone</span>
            <span class="w gap-s" data-t="5.85">else</span>
            <span class="w gap-s" data-t="6.07">a</span>
          </div>
          <div id="b2" class="line ital ink" data-maxw="800" data-right="890" data-base="1466" style="font-size: 200px">
            <span class="bl"></span>
            <span class="w" data-t="6.31" data-hero="1" data-origin="30% 85%">version</span>
          </div>
          <div id="c1" class="line serif" data-x="118" data-base="1274" style="font-size: 96px">
            <span class="bl"></span>
            <span class="w" data-t="7.59">a</span>
            <span class="w gap-s" data-t="7.67">couple</span>
            <span class="w gap-s" data-t="7.95">of</span>
          </div>
          <div id="c2" class="line ital ocean" data-maxw="820" data-x="0" data-base="1460" style="font-size: 220px">
            <span class="bl"></span>
            <span class="w" data-t="8.31" data-hero="1" data-peak="1.06" data-origin="50% 85%">minutes.</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (async () => {
        const fontSpecs = ['900 100px "Inter Tight"', '800 100px "Inter Tight"', '700 100px "Inter Tight"', '500 40px "Inter"', '600 40px "Inter"'];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }

        const D = 8.5;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const svgNS = "http://www.w3.org/2000/svg";

        // ---------------- fit wide lines to the zone (Inter Tight is wider than the old serif) ----------------
        const sizes = {};
        for (const line of $$(".line")) {
          line.style.left = "0px";
          if (line.dataset.maxw) {
            const mw = parseFloat(line.dataset.maxw);
            const fs = parseFloat(getComputedStyle(line).fontSize);
            if (line.offsetWidth > mw) line.style.fontSize = (fs * mw) / line.offsetWidth + "px";
          }
          sizes[line.id] = Math.round(parseFloat(getComputedStyle(line).fontSize));
        }
        window.__sizes = sizes;
        // ---------------- layout: place each line by its baseline ----------------
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.dataset.bo = baseOff;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }
        {
          const c2 = $("#c2");
          c2.style.left = 510 - c2.offsetWidth / 2 + "px";
        }
        // "all the" sits where "your" was, right after "at"
        {
          const r1 = $("#r1");
          const at = $("#w-at");
          const r1b = $("#r1b");
          const lx = r1.offsetLeft + at.offsetLeft + at.offsetWidth + 0.24 * 84;
          const mw = 936 - lx;
          if (r1b.offsetWidth > mw) {
            r1b.style.fontSize = (parseFloat(getComputedStyle(r1b).fontSize) * mw) / r1b.offsetWidth + "px";
            r1b.style.top = parseFloat(r1b.dataset.base) - r1b.querySelector(".bl").offsetTop + "px";
          }
          r1b.style.left = lx + "px";
          sizes.r1b = Math.round(parseFloat(getComputedStyle(r1b).fontSize));
        }

        // ---------------- card painting ----------------
        const PAL = {
          t: "rgba(228,222,217,0.88)", // title bars
          b: "rgba(228,222,217,0.2)", // body bars
          k: "rgba(228,222,217,0.08)", // blocks
          a: "#2E9CCB", // accent
          A: "linear-gradient(150deg, #5fbde3 0%, #2E9CCB 55%, #1F7EA8 100%)",
          m: "rgba(228,222,217,0.42)", // mid bars
          c: "rgba(46,156,203,0.55)", // code accent
          d: "rgba(142,135,128,0.55)", // code muted
        };
        const SX = 490 / 440; // card art was laid out at 440 wide
        const paint = (el, list) => {
          for (const [x, y, w, h, r, k] of list) {
            const d = document.createElement("div");
            d.className = "r";
            Object.assign(d.style, {
              left: x * SX + "px",
              top: y + "px",
              width: w * SX + "px",
              height: h + "px",
              borderRadius: r + "px",
              background: PAL[k],
            });
            el.appendChild(d);
          }
        };
        const HEADER = [
          [30, 30, 26, 26, 13, "a"],
          [272, 38, 40, 10, 5, "b"],
          [322, 38, 40, 10, 5, "b"],
        ];
        const BG = (el) => {
          el.style.background = "linear-gradient(160deg, #123542 0%, #0D2731 55%, #0a2029 100%)";
        };
        // UI layer: the app as you see it
