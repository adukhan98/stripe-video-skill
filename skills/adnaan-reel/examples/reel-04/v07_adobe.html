<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v07 adobe</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      /* ---------- camera ---------- */
      #cam,
      #punch,
      .layer {
        position: absolute;
        inset: 0;
      }

      /* ---------- kinetic type v2: Inter Tight, accent = colour, no italics ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.88;
        letter-spacing: -0.03em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .sup {
        font-family: var(--font-heading);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--brand-text);
      }
      .hero {
        font-family: var(--font-accent);
        font-weight: 900;
        font-style: normal;
        letter-spacing: -0.045em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.24em;
      }

      /* beat A, phrase 1 */
      #a1 {
        font-size: 100px;
      }
      #a2,
      #a3 {
        font-size: 176px;
        line-height: 0.9;
      }
      /* beat A, phrase 2 */
      #b1 {
        font-size: 96px;
      }
      #b1 .big {
        font-size: 120px;
      }
      #b2 {
        font-size: 270px;
        line-height: 0.9;
      }
      #b3 {
        font-size: 100px;
      }
      #b3 .hero {
        font-size: 170px;
      }
      /* beat B */
      #s1 {
        font-size: 250px;
        line-height: 0.9;
      }
      #s2 {
        font-size: 82px;
      }
      #s2 .big {
        font-size: 96px;
      }
      #o1 {
        font-size: 140px;
        line-height: 0.9;
      }

      /* ---------- browser card (as v04_taste) ---------- */
      #br-pos {
        position: absolute;
        left: 100px;
        top: 302px;
        width: 820px;
        height: 560px;
      }
      #br-float {
        position: absolute;
        inset: 0;
      }
      #browser {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        overflow: hidden;
        background: var(--brand-card);
        box-shadow:
          0 30px 50px -12px rgba(60, 50, 40, 0.3),
          0 50px 70px -10px rgba(40, 30, 20, 0.22);
        opacity: 0;
      }
      #chrome {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        height: 66px;
        background: #f1eeea;
        z-index: 2;
      }
      .dot {
        position: absolute;
        top: 26px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #d6d0ca;
      }
      #url {
        position: absolute;
        left: 50%;
        top: 12px;
        width: 560px;
        margin-left: -270px;
        height: 42px;
        border-radius: 21px;
        background: #e4ded9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: var(--brand-muted);
        white-space: nowrap;
      }
      #viewport {
        position: absolute;
        left: 0;
        right: 0;
        top: 66px;
        bottom: 0;
        overflow: hidden;
        background: #0d1117;
      }
      #page-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 820px;
        height: 3948px;
      }
      #page {
        position: absolute;
        left: 0;
        top: 0;
        width: 820px;
        height: 3948px;
        display: block;
      }
      .hl {
        position: absolute;
        border-radius: 5px;
        background: rgba(46, 156, 203, 0.38);
        transform-origin: 0% 50%;
      }
      .sheen {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.26) 45%,
          rgba(255, 255, 255, 0.06) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
        z-index: 3;
      }

      /* ---------- black stat pill ---------- */
      #star-wrap {
        position: absolute;
        left: 128px;
        top: 808px;
      }
      #star {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 88px;
        padding: 0 38px 0 32px;
        border-radius: 44px;
        background: var(--brand-text);
        color: #ffffff;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 38px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 24px 40px -10px rgba(20, 20, 20, 0.38);
        opacity: 0;
      }
      #star svg {
        width: 36px;
        height: 36px;
        display: block;
      }

      /* ---------- app chips: real Adobe icon → open-source rebuild, coin at the right end ---------- */
      .chip {
        position: absolute;
        width: 428px;
        height: 104px;
      }
      .chip-float {
        position: absolute;
        inset: 0;
      }
      .chip-body {
        position: absolute;
        right: 0;
        top: 0;
        width: 428px;
        height: 104px;
        border-radius: 30px;
        background: var(--brand-card);
        box-shadow:
          0 24px 38px -14px rgba(60, 50, 40, 0.32),
          0 2px 4px rgba(60, 50, 40, 0.05);
        overflow: hidden;
      }
      .chip-in {
        position: absolute;
        right: 0;
        top: 0;
        width: 428px;
        height: 104px;
      }
      .sk {
        position: absolute;
        background: #e5e0da;
      }
      .ico {
        position: absolute;
        left: 13px;
        top: 21px;
        width: 64px;
        height: 62px;
        object-fit: contain;
        display: block;
      }
      .arw {
        position: absolute;
        left: 81px;
        top: 39px;
        width: 26px;
        height: 26px;
        overflow: visible;
      }
      .txt-clip {
        position: absolute;
        left: 110px;
        top: 0;
        width: 260px;
        height: 104px;
        overflow: hidden;
      }
      .chip-txt {
        position: absolute;
        left: 0;
        top: 0;
        height: 104px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        white-space: nowrap;
      }
      .nm {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 42px;
        line-height: 1;
        letter-spacing: -0.025em;
        color: var(--brand-text);
      }
      .sl {
        margin-top: 7px;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 23px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: var(--brand-muted);
      }
      .chip-sheen {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.9) 45%,
          rgba(255, 255, 255, 0.2) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }
      .coin {
        position: absolute;
        width: 46px;
        height: 46px;
        margin-left: -23px;
        margin-top: -23px;
      }
      .coin-flip {
        position: absolute;
        inset: 0;
      }
      .coin-face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }
      .coin-white {
        background: radial-gradient(circle at 35% 30%, #ffffff, #f1eeea 70%);
        box-shadow:
          0 8px 14px rgba(60, 50, 40, 0.24),
          inset 0 -3px 6px rgba(60, 50, 40, 0.07);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 20px;
        letter-spacing: -0.03em;
        color: var(--brand-text);
      }
      .coin-ocean {
        background: radial-gradient(circle at 35% 30%, #7cc3e2, var(--brand-primary) 52%, var(--brand-primary-dark) 100%);
        box-shadow:
          0 8px 16px rgba(31, 126, 168, 0.34),
          inset 0 -3px 6px rgba(13, 39, 49, 0.14);
        opacity: 0;
      }
      .coin-ocean svg {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 26px;
        height: 26px;
        overflow: visible;
      }
      .tick {
        position: absolute;
        background: #cfc9c2;
        border-radius: 1px;
      }
      /* ---------- "all open source" stamp pill ---------- */
      #stamp-pos {
        position: absolute;
        width: 0;
        height: 0;
      }
      #stamp {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 92px;
        padding: 0 32px 0 16px;
        border-radius: 46px;
        background: var(--brand-text);
        color: var(--brand-card);
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 38px;
        letter-spacing: -0.02em;
        white-space: nowrap;
        box-shadow:
          0 30px 44px -12px rgba(20, 20, 20, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        opacity: 0;
      }
      .chk {
        width: 60px;
        height: 60px;
        flex: 0 0 60px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #63bde3 0%, #2e9ccb 52%, #1f7ea8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
      }
      .chk svg {
        width: 32px;
        height: 32px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="5.549">
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <div id="punch">
          <!-- ===== the real repo page in a tilted browser card ===== -->
          <div id="br-pos">
            <div id="br-float">
              <div id="browser">
                <div id="chrome">
                  <span class="dot" style="left: 28px"></span>
                  <span class="dot" style="left: 54px"></span>
                  <span class="dot" style="left: 80px"></span>
                  <div id="url">github.com/storytold/photocraft</div>
                </div>
                <div id="viewport">
                  <div id="page-wrap">
                    <img id="page" src="assets/photocraft_repo.png" alt="" />
                    <div id="hl1" class="hl"></div>
                    <div id="hl2" class="hl"></div>
                  </div>
                </div>
                <div id="br-sheen" class="sheen"></div>
              </div>
            </div>
          </div>

          <div id="star-wrap">
            <div id="star">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#ffffff" d="M12 2.2l2.95 6.2 6.8.85-4.98 4.7 1.27 6.75L12 17.4l-6.04 3.3 1.27-6.75-4.98-4.7 6.8-.85z" />
              </svg>
              <span>47.2k stars</span>
            </div>
          </div>

          <!-- ===== BEAT A, phrase 1: last week someone else ===== -->
          <div id="a1" class="line sup" data-x="92" data-base="1060">
            <span class="bl"></span>
            <span class="w" data-t="0.05">last</span>
            <span class="w gap-s" data-t="0.27">week</span>
          </div>
          <div id="a2" class="line hero ink" data-x="78" data-base="1250">
            <span class="bl"></span>
            <span class="w" data-t="0.57" data-accent="1">someone</span>
          </div>
          <div id="a3" class="line hero ink" data-right="934" data-base="1420">
            <span class="bl"></span>
            <span class="w" data-t="0.77" data-pop="1">else</span>
          </div>

          <!-- ===== BEAT A, phrase 2: also used AI to rebuild ===== -->
          <div id="b1" class="line sup" data-x="96" data-base="1046">
            <span class="bl"></span>
            <span class="w" data-t="1.17">also</span>
            <span class="w gap-s big" data-t="1.53">used</span>
          </div>
          <div id="b2" class="line hero ocean" data-x="88" data-base="1270">
            <span class="bl"></span>
            <span class="w" data-t="1.81" data-hero="1" data-origin="35% 85%">AI</span>
          </div>
          <div id="b3" class="line sup" data-right="918" data-base="1440">
            <span class="bl"></span>
            <span class="w" data-t="2.07">to</span>
            <span class="w gap-s hero ink" data-t="2.49" data-pop="1">rebuild</span>
          </div>

          <!-- ===== BEAT B: seven applications of Adobe ===== -->
          <div id="s1" class="line hero ocean" data-right="934" data-base="682">
            <span class="bl"></span>
            <span class="w" id="w-seven" data-t="2.93" data-hero="1" data-peak="1.09" data-origin="80% 85%">seven</span>
          </div>
          <div id="s2" class="line sup" data-x="76" data-base="802">
            <span class="bl"></span>
            <span class="w" data-t="3.47">applications</span>
            <span class="w gap-s" data-t="3.71">of</span>
            <span class="w gap-s big" data-t="3.89" data-pop="1">Adobe</span>
          </div>

          <div id="chips"></div>

          <div id="stamp-pos">
            <div id="stamp">
              <div class="chk">
                <svg viewBox="0 0 24 24" fill="none" stroke="#0D2731" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
              </div>
              <span>all open source</span>
            </div>
          </div>

          <div id="o1" class="line hero ink" data-right="928" data-base="1414">
            <span class="bl"></span>
            <span class="w" data-t="5.17" data-snap="1">open</span>
            <span class="w" style="margin-left: 0.22em" data-t="5.43" data-snap="1">source.</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (async () => {
        const fontSpecs = ['900 100px "Inter Tight"', '800 100px "Inter Tight"', '700 100px "Inter Tight"', '500 40px "Inter"', '600 40px "Inter"'];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }
        const pageImg = document.getElementById("page");
        if (!pageImg.complete) {
          await new Promise((res) => {
            pageImg.addEventListener("load", res, { once: true });
            pageImg.addEventListener("error", res, { once: true });
          });
        }

        const D = 5.549;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const SVGNS = "http://www.w3.org/2000/svg";

        // ---- place each line by its baseline (deterministic layout, measured once) ----
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }

        // ---- page geometry: 1080-wide capture shown at 820 (k = 0.7593) ----
        const K = 820 / 1080;
        const VIEW_H = 560 - 66;
        // README: "clean-room reimplementation" (line 1, right half) + "of Adobe Photoshop, rebuilt in pure Rust." (line 2)
        const HL = [
          ["#hl1", 594, 2966, 1010, 3010],
          ["#hl2", 224, 3014, 856, 3058],
        ];
        for (const [sel, x0, y0, x1, y1] of HL) {
          Object.assign($(sel).style, {
            left: x0 * K + "px",
            top: y0 * K + "px",
            width: (x1 - x0) * K + "px",
            height: (y1 - y0) * K + "px",
          });
        }
        const scrollTo = (pageY) => -pageY * K; // page-y (capture px) at the top of the viewport

        // ---- chips: real Adobe icon → Craft rebuild; coins 01–07 sit at each chip's right end ----
        const APPS = [
          ["PhotoCraft", "adobe_photoshop.svg"],
          ["VectorCraft", "adobe_illustrator.svg"],
          ["FilmCraft", "adobe_premiere.svg"],
          ["LightCraft", "adobe_lightroom.svg"],
          ["PdfCraft", "adobe_acrobat.svg"],
          ["EffectCraft", "adobe_aftereffects.svg"],
          ["DesignCraft", "adobe_indesign.svg"],
        ];
        const COL_X = [70, 512];
        const ROW_Y = [842, 956, 1070, 1184];
        const CHIP_W = 428;
        const CHIP_H = 104;
        const COIN_CX = CHIP_W - 12 - 23; // coin centre inside the chip (right end)
        const ICON_TICK =
          '<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path class="ck" d="M20 6 9 17l-5-5" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></svg>';
        const ICON_ARROW =
          '<svg class="arw" viewBox="0 0 24 24" fill="none" stroke="#8E8780" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h17M14 6l6 6-6 6"/></svg>';
        const chipsEl = $("#chips");
        const chips = APPS.map(([name, icon], i) => {
          const col = i % 2;
          const row = Math.floor(i / 2);
          const x = COL_X[col];
          const y = ROW_Y[row];
          const c = document.createElement("div");
          c.className = "chip";
          c.style.left = x + "px";
          c.style.top = y + "px";
          c.innerHTML =
            `<div class="chip-float"><div class="chip-body"><div class="chip-in">` +
            `<i class="sk sk-ico" style="left:15px;top:23px;width:58px;height:58px;border-radius:15px;background:#ece7e2"></i>` +
            `<i class="sk sk-b1" style="left:110px;top:33px;width:168px;height:18px;border-radius:9px"></i>` +
            `<i class="sk sk-b2" style="left:110px;top:61px;width:118px;height:11px;border-radius:6px;background:#ebe7e2"></i>` +
            `<img class="ico" src="assets/${icon}" alt="" />${ICON_ARROW}` +
            `<div class="txt-clip"><div class="chip-txt"><div class="nm">${name}</div><div class="sl">storytold/${name.toLowerCase()}</div></div></div>` +
            `</div><div class="chip-sheen"></div></div></div>`;
          chipsEl.appendChild(c);
          const coin = document.createElement("div");
          coin.className = "coin";
          coin.style.left = x + COIN_CX + "px";
          coin.style.top = y + CHIP_H / 2 + "px";
          const flip = document.createElement("div");
          flip.className = "coin-flip";
          const white = document.createElement("div");
          white.className = "coin-face coin-white";
          white.textContent = "0" + (i + 1);
          for (const [tx, ty, tw, th] of [
            [21.5, 3, 3, 5],
            [21.5, 38, 3, 5],
            [3, 21.5, 5, 3],
            [38, 21.5, 5, 3],
          ]) {
            const t = document.createElement("span");
            t.className = "tick";
            Object.assign(t.style, { left: tx + "px", top: ty + "px", width: tw + "px", height: th + "px" });
            white.appendChild(t);
          }
          const ocean = document.createElement("div");
          ocean.className = "coin-face coin-ocean";
          ocean.innerHTML = ICON_TICK;
          flip.appendChild(white);
          flip.appendChild(ocean);
          coin.appendChild(flip);
          chipsEl.appendChild(coin);
          const q = (sel) => c.querySelector(sel);
          return {
            el: c, body: q(".chip-body"), txt: q(".chip-txt"), sheen: q(".chip-sheen"), float: q(".chip-float"),
            ico: q(".ico"), arw: q(".arw"), sk: [q(".sk-ico"), q(".sk-b1"), q(".sk-b2")],
            coin, flip, white, ocean, ck: ocean.querySelector(".ck"), x, y, cx: x + COIN_CX, cy: y + CHIP_H / 2,
          };
        });
        // wait for the icon SVGs so the first frame they appear is complete
        await Promise.all(
          chips.map((ch) =>
            ch.ico.complete ? null : new Promise((res) => { ch.ico.addEventListener("load", res, { once: true }); ch.ico.addEventListener("error", res, { once: true }); }),
          ),
        );

        // stamp: lands in the empty slot beside chip 07, tilted, overlapping chip 06's corner
        const stamp = $("#stamp");
        const stampW = stamp.offsetWidth;
        const STAMP_CX = 726; // centre of the empty column-2 slot (x 512–940)
        const STAMP_CY = 1236;
        $("#stamp-pos").style.left = STAMP_CX - stampW / 2 + "px";
        $("#stamp-pos").style.top = STAMP_CY - 46 + "px";

        // "seven" centre = the dealer's hand
        const s1 = $("#s1");
        const seven = $("#w-seven");
        const DEAL = { x: 510, y: 1420 }; // coins are dealt up from the bottom of the stack

        window.__layout = {
          lines: $$(".line").map((l) => [l.id, l.offsetLeft, l.offsetTop, l.offsetWidth, l.offsetHeight]),
          stampW,
          DEAL,
        };

        // ================= timeline =================
        const tl = gsap.timeline({ paused: true });

        // background drift (continuous, linear on purpose) + slow camera push
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -12, duration: D, ease: "none" }, 0);
        tl.fromTo("#cam", { scale: 1, transformOrigin: "510px 880px" }, { scale: 1.01, duration: D, ease: "none" }, 0);

        // ---- word entrances (contact frame on the spoken word) ----
        for (const w of $$(".line .w")) {
          const t = parseFloat(w.dataset.t);
          if (w.dataset.hero) {
            const s = Math.max(0, t - 0.2);
            const peak = parseFloat(w.dataset.peak || "1.08");
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 80%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 100, scale: 0.55, rotation: -7, filter: "blur(10px)" },
              { opacity: 1, y: -10, scale: peak, rotation: 1.5, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, s + 0.2);
          } else if (w.dataset.pop) {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 70, scale: 0.72, rotation: -5, filter: "blur(8px)" },
              { opacity: 1, y: -6, scale: 1.06, rotation: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.28, ease: "back.out(1.5)" }, s + 0.16);
          } else if (w.dataset.snap) {
            // the last words land fast: readable within 3 f, settle into the hard cut
            const s = Math.max(0, t - 0.19);
            gsap.set(w, { transformOrigin: "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 30, scale: 0.7, rotation: -5, filter: "blur(8px)" },
              { opacity: 1, y: -5, scale: 1.05, rotation: 1, filter: "blur(0px)", duration: 0.1, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.17, ease: "power2.out" }, s + 0.1);
          } else if (w.dataset.accent) {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: "30% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 80, scale: 0.78, rotation: -6, filter: "blur(8px)" },
              { opacity: 1, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.46, ease: "back.out(2.2)" },
              s,
            );
          } else {
            const s = Math.max(0, t - 0.13);
            tl.fromTo(
              w,
              { opacity: 0, y: 50, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
              s,
            );
          }
        }
        const lineOut = (sel, t, dy = -56) =>
          tl.to(sel, { y: dy, opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, t);

        // phrase 1 exits bottom-up (2 f apart) to make room for "also used AI"
        lineOut("#a3", 0.94);
        lineOut("#a2", 0.94 + F);
        lineOut("#a1", 0.94 + 2 * F);

        // ================= browser card (0.30 →) =================
        gsap.set("#browser", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        const bIn = 0.3;
        tl.fromTo("#browser", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, bIn);
        tl.fromTo("#browser", { y: 130 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, bIn);
        tl.fromTo("#browser", { scale: 0.86 }, { scale: 1, duration: 0.48, ease: "back.out(1.4)", immediateRender: false }, bIn);
        tl.fromTo("#browser", { rotationX: 28 }, { rotationX: 4.5, duration: 0.62, ease: "back.out(1.8)", immediateRender: false }, bIn);
        tl.fromTo("#browser", { rotationY: -22 }, { rotationY: -7, duration: 0.55, ease: "power3.out", immediateRender: false }, bIn);
        tl.to("#browser", { rotationY: -4.5, rotationX: 3, duration: 2.54 - (bIn + 0.62), ease: "sine.inOut" }, bIn + 0.62);
        tl.fromTo("#br-sheen", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, bIn + 0.1);
        tl.fromTo(
          "#br-sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut", immediateRender: false },
          bIn + 0.1,
        );
        tl.to("#br-sheen", { opacity: 0, duration: 0.25, ease: "power1.in" }, bIn + 0.58);
        tl.fromTo("#br-float", { y: 0 }, { y: -5, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.8);

        // page scroll: title + About → star row → a quick scroll down to the README on "rebuild"
        tl.fromTo("#page-wrap", { y: scrollTo(300) }, { y: scrollTo(800), duration: 1.25, ease: "sine.inOut" }, 0.45);
        tl.to("#page-wrap", { y: scrollTo(2760), duration: 0.5, ease: "power3.inOut" }, 1.9);
        tl.to("#page-wrap", { y: scrollTo(2810), duration: 1.0, ease: "sine.out" }, 2.4);
        tl.to("#page-wrap", { y: scrollTo(2930), duration: D - 3.4, ease: "sine.inOut" }, 3.4);
        // README highlight: "clean-room reimplementation / of Adobe Photoshop, rebuilt …" sweeps on as "rebuild" lands
        tl.fromTo("#hl1", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out" }, 2.16);
        tl.fromTo("#hl2", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out" }, 2.28);

        // black stat pill pops on the card's lower-left (contact ≈ 1.3, as the star row scrolls into view)
        gsap.set("#star", { transformOrigin: "30% 60%" });
        tl.fromTo("#star", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, 1.1);
        tl.fromTo("#star", { scale: 0.55, y: 26 }, { scale: 1.08, y: -3, duration: 0.18, ease: "power3.out", immediateRender: false }, 1.1);
        tl.to("#star", { scale: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 1.28);
        tl.fromTo("#star-wrap", { y: 0 }, { y: -5, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.6);

        // ================= BEAT A → B (2.62–3.10) =================
        tl.to("#star", { scale: 0.8, opacity: 0, filter: "blur(4px)", duration: 0.16, ease: "power2.in" }, 2.62);
        lineOut("#b3", 2.66, -50);
        lineOut("#b2", 2.66 + F, -50);
        lineOut("#b1", 2.66 + 2 * F, -50);

        // page card shrinks on an arc into the top-left corner (820x560 → ~336x230), pinned at its top-left
        gsap.set("#br-pos", { transformOrigin: "0% 0%" });
        tl.to("#br-pos", { scale: 1.01, duration: 3 * F, ease: "power2.out" }, 2.44);
        tl.to("#br-pos", { scale: 0.34, duration: 0.38, ease: "power3.inOut" }, 2.54);
        tl.to("#br-pos", { scale: 0.35, duration: 0.24, ease: "sine.out" }, 2.92);
        tl.to("#br-pos", { x: -14, duration: 0.42, ease: "power2.inOut" }, 2.54);
        tl.to("#br-pos", { y: -4, duration: 0.42, ease: "back.inOut(3)" }, 2.54);
        tl.to("#browser", { rotationY: 9, rotationX: 5, rotationZ: -3, duration: 0.56, ease: "power2.inOut" }, 2.56);
        tl.to("#browser", { rotationY: 6.5, rotationX: 3.5, rotationZ: -2.2, duration: D - 3.14, ease: "sine.inOut" }, 3.14);
        // keep radius visually constant while scaled down
        tl.to("#browser", { borderRadius: 66, duration: 0.42, ease: "power2.inOut" }, 2.54);
        tl.to("#br-sheen", { borderRadius: 66, duration: 0.42, ease: "power2.inOut" }, 2.54);

        // "seven" punch: tiny camera push on the hero word
        tl.fromTo("#punch", { scale: 1, transformOrigin: "540px 700px" }, { scale: 1.012, duration: 0.4, ease: "power2.out" }, 2.86);
        tl.to("#punch", { scale: 1.004, duration: 0.6, ease: "sine.inOut" }, 3.3);

        // ================= coins dealt up from below, blank chips unfurl leftward out of them =================
        chips.forEach((ch, i) => {
          const land = 3.2 + i * 2 * F; // coin contact (after beat A has cleared)
          const fly = 0.34;
          const s = land - fly;
          const dx = DEAL.x - ch.cx;
          const dy = DEAL.y - ch.cy;
          const dist = Math.hypot(dx, dy);
          const rollDeg = -Math.sign(dx || 1) * (dist / 23) * (180 / Math.PI) * 0.25;
          gsap.set(ch.coin, { transformOrigin: "50% 50%" });
          tl.fromTo(ch.coin, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power1.out" }, s);
          tl.fromTo(ch.coin, { x: dx }, { x: 0, duration: fly, ease: "power1.inOut", immediateRender: false }, s);
          tl.fromTo(ch.coin, { y: dy }, { y: 0, duration: fly, ease: "back.out(1.2)", immediateRender: false }, s);
          tl.fromTo(ch.coin, { scale: 0.5 }, { scale: 1, duration: fly, ease: "power2.out", immediateRender: false }, s);
          tl.fromTo(ch.white, { rotation: rollDeg }, { rotation: 0, duration: fly + 0.08, ease: "power3.out" }, s);
          tl.to(ch.flip, { scaleX: 1.12, scaleY: 0.88, duration: 0.05, ease: "power2.out" }, land - 0.02);
          tl.to(ch.flip, { scaleX: 1, scaleY: 1, duration: 0.16, ease: "back.out(2)" }, land + 0.03);
          // the (still blank) chip unfurls leftward out of its coin, wireframe placeholders inside
          tl.fromTo(ch.body, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power1.out" }, land - 0.02);
          tl.fromTo(ch.body, { width: 70 }, { width: CHIP_W, duration: 0.3, ease: "power3.out", immediateRender: false }, land - 0.02);
          tl.fromTo(ch.float, { y: 0 }, { y: -4, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, land + 0.3 + i * 0.03);
        });

        // ================= "of Adobe": the real Adobe icon lands, then "→ <Craft>" slides out of it =================
        chips.forEach((ch, i) => {
          const c = 3.72 + i * 1.5 * F; // icon contacts 3.72 … 4.02 ("Adobe" 3.89)
          gsap.set(ch.ico, { transformOrigin: "50% 60%" });
          tl.to(ch.sk[0], { opacity: 0, scale: 0.8, duration: 0.08, ease: "power1.in" }, c - 0.12);
          tl.fromTo(ch.ico, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power1.out" }, c - 0.14);
          tl.fromTo(ch.ico, { scale: 0.3, rotation: -14, y: 10 }, { scale: 1.12, rotation: 3, y: -2, duration: 0.14, ease: "power3.out", immediateRender: false }, c - 0.14);
          tl.to(ch.ico, { scale: 1, rotation: 0, y: 0, duration: 0.24, ease: "back.out(2)" }, c);
          tl.fromTo(ch.arw, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, c + 0.03);
          tl.to([ch.sk[1], ch.sk[2]], { opacity: 0, x: 40, duration: 0.14, ease: "power2.in" }, c + 0.02);
          tl.fromTo(ch.txt, { x: -150, opacity: 0, filter: "blur(4px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power3.out" }, c + 0.06);
        });

        // a light sweep runs down the finished stack ("and make")
        chips.forEach((ch, i) => {
          const t = 4.46 + i * 1.5 * F;
          tl.fromTo(ch.sheen, { opacity: 0 }, { opacity: 0.8, duration: 0.08, ease: "power1.out" }, t);
          tl.fromTo(ch.sheen, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 0.4, ease: "power2.inOut", immediateRender: false }, t);
          tl.to(ch.sheen, { opacity: 0, duration: 0.12, ease: "power1.in" }, t + 0.3);
        });

        // "make them all" — the stack gathers itself (anticipation dip before the ticks)
        chips.forEach((ch, i) => {
          tl.to(ch.el, { y: 6, scale: 0.985, duration: 0.14, ease: "power2.inOut" }, 4.72 + i * F);
          tl.to(ch.coin, { y: 6, duration: 0.14, ease: "power2.inOut" }, 4.72 + i * F);
        });

        // "open source" — every coin flips to ocean and ticks, fast stagger
        chips.forEach((ch, i) => {
          const c = 5.0 + i * 1.5 * F;
          tl.to(ch.el, { y: -4, scale: 1, duration: 0.16, ease: "back.out(2)" }, c);
          tl.to(ch.coin, { y: -4, duration: 0.16, ease: "back.out(2)" }, c);
          tl.to(ch.flip, { scaleX: 0, duration: 0.06, ease: "power2.in" }, c - 0.06);
          tl.set(ch.white, { opacity: 0 }, c);
          tl.set(ch.ocean, { opacity: 1 }, c);
          tl.fromTo(ch.flip, { scaleX: 0, scaleY: 1 }, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "back.out(2.4)", immediateRender: false }, c);
          tl.fromTo(ch.ck, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.14, ease: "power2.out" }, c + 0.04);
        });

        // black "all open source" pill stamps down beside chip 07 (contact ≈ 5.25)
        gsap.set("#stamp", { transformOrigin: "60% 50%" });
        const ST = 5.12;
        tl.fromTo("#stamp", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power1.out" }, ST - 0.12);
        tl.fromTo(
          "#stamp",
          { scale: 1.12, rotation: -7, y: -22, filter: "blur(4px)" },
          { scale: 0.95, rotation: -2, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.in", immediateRender: false },
          ST - 0.12,
        );
        tl.to("#stamp", { scale: 1, rotation: -2, duration: 0.18, ease: "back.out(1.6)" }, ST);
        // impact: the neighbours flinch
        [chips[5], chips[6]].forEach((ch, k) => {
          tl.to(ch.float, { y: 3, duration: 0.05, ease: "power2.out" }, ST + k * F);
          tl.to(ch.float, { y: 0, duration: 0.16, ease: "power2.out" }, ST + 0.05 + k * F);
        });

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
</html>
