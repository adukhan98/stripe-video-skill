<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v11 personal</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }
      body.nobg #bg,
      body.nobg #root,
      body.nobg {
        background: transparent !important;
      }
      body.nobg #bg {
        display: none;
      }

      /* ---------- camera ---------- */
      #cam,
      #punch {
        position: absolute;
        inset: 0;
      }

      /* ---------- speaker card (portrait hero 840x980 → 700 → secondary 600x415) ---------- */
      #card-move {
        position: absolute;
        left: 90px;
        top: 306px;
        width: 840px;
        height: 980px;
      }
      #card-float {
        position: absolute;
        inset: 0;
      }
      #card {
        position: absolute;
        inset: 0;
        border-radius: 34px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      #vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 34px;
      }
      /* source 1080x1920 scaled to the card width (840x1493); portrait window starts at 16.7 % (full head + shoulders,
         face centre ≈ 40 % of card height); landscape secondary window shifts to keep the face centred */
      #speaker {
        position: absolute;
        left: 0;
        top: -250px;
        width: 840px;
        height: 1493px;
        object-fit: cover;
      }
      #sheen {
        position: absolute;
        inset: 0;
        border-radius: 34px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 45%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
      }

      /* ---------- kinetic serif ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.88;
        letter-spacing: -0.03em;
        text-shadow:
          0 0 28px rgba(228, 222, 217, 0.95),
          0 0 14px rgba(228, 222, 217, 0.9),
          0 0 6px rgba(228, 222, 217, 0.9);
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        position: relative;
        will-change: transform, opacity, filter;
      }
      .serif {
        font-family: "Inter Tight", sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--brand-text);
      }
      .ital {
        /* v2: hero weight, no italics — accent is colour only */
        font-family: "Inter Tight", sans-serif;
        font-weight: 900;
        font-style: normal;
        letter-spacing: -0.045em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.22em;
      }

      #a1 {
        font-size: 84px;
      }
      #a1 .ital {
        font-size: 178px;
      }
      #a1b {
        font-size: 100px;
      }
      #a1b .ital {
        font-size: 140px;
      }
      #a2 {
        font-size: 100px;
      }
      #a3 {
        font-size: 222px;
      }
      #a4 {
        font-size: 72px;
        font-weight: 700;
      }
      #b1 {
        font-size: 104px;
      }
      #b2 {
        font-size: 132px;
      }
      #b3 {
        font-size: 260px;
      }
      #b4 {
        font-size: 84px;
      }
      #b5 {
        font-size: 130px;
      }
      #b6 {
        font-size: 240px;
      }
      #b7 {
        font-size: 84px;
      }
      .bar-accent {
        position: absolute;
        border-radius: 9px;
        background: linear-gradient(90deg, var(--brand-primary), var(--brand-primary-dark));
        transform-origin: 0% 50%;
      }
      #b3 .w,
      #a1 .w {
        z-index: 1;
      }

      /* ---------- up-arrow chip ---------- */
      #chip-up {
        position: absolute;
        width: 176px;
        height: 88px;
        border-radius: 44px;
        background: var(--brand-text);
        box-shadow: 0 26px 40px -14px rgba(40, 30, 20, 0.45);
      }
      #chip-disc {
        position: absolute;
        left: 14px;
        top: 14px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #4fb3dd, var(--brand-primary) 55%, var(--brand-primary-dark));
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mbar {
        position: absolute;
        bottom: 24px;
        width: 14px;
        border-radius: 4px;
        background: var(--brand-card);
        transform-origin: 50% 100%;
      }

      /* ---------- bento: dotted slots + tiles ---------- */
      #slots-svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .tile {
        position: absolute;
      }
      .tile-body {
        position: absolute;
        inset: 0;
        border-radius: 24px;
        background: var(--brand-card);
        box-shadow: 0 30px 50px -12px rgba(60, 50, 40, 0.3);
        overflow: hidden;
      }
      .tile-body.deep {
        background: var(--brand-deep);
        box-shadow: 0 30px 50px -12px rgba(20, 30, 40, 0.42);
      }
      .tile-body.black {
        background: var(--brand-text);
        border-radius: 50px;
        box-shadow: 0 26px 40px -14px rgba(40, 30, 20, 0.45);
        overflow: visible;
      }
      .wf {
        position: absolute;
        border-radius: 8px;
        background: #e5e0da;
      }
      .wf-d {
        position: absolute;
        border-radius: 7px;
        background: rgba(228, 222, 217, 0.16);
      }
      #t1-av {
        position: absolute;
        left: 22px;
        top: 22px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff, #e2dcd5 75%);
        box-shadow: inset 0 -3px 6px rgba(60, 50, 40, 0.1);
      }
      .sq {
        position: absolute;
        top: 118px;
        width: 64px;
        height: 58px;
        border-radius: 14px;
        background: #efebe6;
      }
      #sq2-pick {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        background: var(--brand-deep);
        opacity: 0;
      }
      #sq2-dot {
        position: absolute;
        left: 21px;
        top: 18px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--brand-primary);
        opacity: 0;
      }
      #tog {
        position: absolute;
        left: 150px;
        top: 24px;
        width: 80px;
        height: 44px;
        border-radius: 22px;
        background: rgba(228, 222, 217, 0.16);
        overflow: hidden;
      }
      #tog-on {
        position: absolute;
        inset: 0;
        border-radius: 22px;
        background: linear-gradient(90deg, var(--brand-primary), var(--brand-primary-dark));
        opacity: 0;
      }
      #tog-knob {
        position: absolute;
        left: 5px;
        top: 5px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--brand-card);
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
      }
      #sl-track {
        position: absolute;
        left: 22px;
        top: 45px;
        width: 110px;
        height: 10px;
        border-radius: 5px;
        background: #e5e0da;
      }
      #sl-fill {
        position: absolute;
        left: 0;
        top: 0;
        width: 110px;
        height: 10px;
        border-radius: 5px;
        background: linear-gradient(90deg, var(--brand-primary), var(--brand-primary-dark));
        transform-origin: 0% 50%;
      }
      #sl-knob {
        position: absolute;
        left: 0;
        top: 33px;
        width: 34px;
        height: 34px;
        margin-left: -17px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff, #f1eeea 70%);
        box-shadow: 0 6px 12px rgba(60, 50, 40, 0.3);
      }
      #days {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 15px;
      }
      .day {
        position: relative;
        flex: 1;
        justify-content: center;
        height: 70px;
        padding: 0 8px;
        border-radius: 35px;
        background: rgba(251, 250, 248, 0.07);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chk {
        position: relative;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2.5px solid rgba(251, 250, 248, 0.32);
        flex: none;
      }
      .chk-fill {
        position: absolute;
        left: -2.5px;
        top: -2.5px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #4fb3dd, var(--brand-primary) 55%, var(--brand-primary-dark));
      }
      .chk svg {
        position: absolute;
        left: -2.5px;
        top: -2.5px;
      }
      .dl {
        position: relative;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 34px;
        letter-spacing: -0.02em;
        color: rgba(251, 250, 248, 0.5);
      }
      .dl-on {
        position: absolute;
        left: 0;
        top: 0;
        color: var(--brand-card);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10.23"
    >
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <div id="punch">
          <!-- BEAT B: dotted slot outlines (frame shaped to the card) -->
          <svg id="slots-svg" viewBox="0 0 1080 1920">
            <defs></defs>
          </svg>

          <!-- BEAT B: tiles that snap around the card -->
          <div id="tiles">
            <div class="tile" id="t1">
              <div class="tile-body">
                <div id="t1-av"></div>
                <div class="wf" id="t1-b1" style="left: 110px; top: 34px; width: 118px; height: 18px"></div>
                <div class="wf" id="t1-b2" style="left: 110px; top: 64px; width: 80px; height: 14px"></div>
                <div class="sq" style="left: 22px"></div>
                <div class="sq" id="sq2" style="left: 94px"><div id="sq2-pick"></div><div id="sq2-dot"></div></div>
                <div class="sq" style="left: 166px"></div>
              </div>
            </div>
            <div class="tile" id="t2">
              <div class="tile-body deep">
                <div class="wf-d" style="left: 24px; top: 30px; width: 104px; height: 16px"></div>
                <div class="wf-d" style="left: 24px; top: 58px; width: 72px; height: 12px"></div>
                <div id="tog"><div id="tog-on"></div><div id="tog-knob"></div></div>
                <div class="wf-d t2l" style="left: 24px; top: 110px; width: 204px; height: 13px"></div>
                <div class="wf-d t2l" style="left: 24px; top: 138px; width: 168px; height: 13px"></div>
                <div class="wf-d t2l" style="left: 24px; top: 166px; width: 126px; height: 13px"></div>
              </div>
            </div>
            <div class="tile" id="t3">
              <div class="tile-body">
                <div id="sl-track"><div id="sl-fill"></div></div>
                <div id="sl-knob"></div>
              </div>
            </div>
            <div class="tile" id="t4">
              <div class="tile-body black">
                <div id="days"></div>
              </div>
            </div>
          </div>

          <!-- speaker card -->
          <div id="card-move">
            <div id="card-float">
              <div id="card">
                <div id="vid-wrap">
                  <video
                    id="speaker"
                    class="clip"
                    src="assets/speaker.mp4"
                    muted
                    playsinline
                    data-start="0"
                    data-duration="10.23"
                    data-track-index="1"
                  ></video>
                </div>
                <div id="sheen"></div>
              </div>
            </div>
          </div>

          <!-- BEAT A: kinetic stack -->
          <div id="a1" class="line serif" data-x="76" data-base="1195">
            <span class="bl"></span>
            <span class="w" data-t="0.06">our</span>
            <span class="w ital ink" id="w-features" style="margin-left: 0.2em" data-t="0.54" data-hero="1" data-peak="1.04" data-origin="50% 85%">features</span>
            <div class="bar-accent" id="strike"></div>
          </div>
          <div id="a1b" class="line serif" data-right="936" data-base="1330">
            <span class="bl"></span>
            <span class="w" data-t="0.92">are</span>
            <span class="w ital ink" style="margin-left: 0.2em" data-t="1.30" data-accent="1">not</span>
          </div>
          <div id="a2" class="line serif" data-x="80" data-base="1195">
            <span class="bl"></span>
            <span class="w" data-t="2.20">keep</span>
            <span class="w gap-s" data-t="2.36">you</span>
          </div>
          <div id="chip-up">
            <div id="chip-disc">
              <svg width="30" height="30" viewBox="0 0 34 34">
                <path
                  d="M17 28 L17 7 M8 15 L17 6 L26 15"
                  fill="none"
                  stroke="#FBFAF8"
                  stroke-width="4.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div class="mbar" style="left: 92px; height: 16px"></div>
            <div class="mbar" style="left: 115px; height: 28px"></div>
            <div class="mbar" style="left: 138px; height: 40px"></div>
          </div>
          <div id="a3" class="line ital ocean" data-x="288" data-base="1372">
            <span class="bl"></span>
            <span class="w" id="w-ahead" data-t="2.64" data-hero="1" data-peak="1.06" data-origin="50% 85%">ahead</span>
          </div>
          <div id="a4" class="line serif" data-right="936" data-base="1444">
            <span class="bl"></span>
            <span class="w" data-t="2.82">of</span>
            <span class="w gap-s" data-t="3.14">everyone</span>
            <span class="w gap-s" data-t="3.40">else</span>
          </div>

          <!-- BEAT B: kinetic -->
          <div id="b1" class="line serif" data-x="80" data-base="1110">
            <span class="bl"></span>
            <span class="w" data-t="4.04">what’s</span>
            <span class="w gap-s" data-t="4.42">left</span>
            <span class="w gap-s" data-t="4.62">of</span>
          </div>
          <div id="b2" class="line serif" data-right="936" data-base="1272">
            <span class="bl"></span>
            <span class="w" data-t="5.16">software</span>
            <span class="w gap-s" data-t="5.66">is</span>
          </div>
          <div id="b3" class="line ital ocean" data-x="98" data-base="1345" data-fit="822">
            <span class="bl"></span>
            <span class="w" id="w-personal" data-t="6.28" data-hero="1" data-peak="1.05" data-rise="90" data-origin="40% 85%">personal</span>
            <div class="bar-accent" id="underline"></div>
          </div>
          <div id="b4" class="line serif" data-right="936" data-base="1452">
            <span class="bl"></span>
            <span class="w" data-t="6.54">built</span>
            <span class="w gap-s" data-t="6.76">for</span>
          </div>
          <div id="b5" class="line ital ink" data-x="80" data-base="1140">
            <span class="bl"></span>
            <span class="w" data-t="7.80" data-accent="1">how</span>
            <span class="w" style="margin-left: 0.2em" data-t="7.88" data-accent="1">you</span>
          </div>
          <div id="b6" class="line ital ink" data-right="926" data-base="1335">
            <span class="bl"></span>
            <span class="w" id="w-work" data-t="8.18" data-hero="1" data-peak="1.04" data-origin="50% 85%">work</span>
          </div>
          <div id="b7" class="line serif" data-x="80" data-base="1432">
            <span class="bl"></span>
            <span class="w" data-t="9.45">every</span>
            <span class="w gap-s" data-t="9.79">single</span>
            <span class="w gap-s" data-t="10.05">day.</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        if (new URLSearchParams(location.search).has("nobg")) document.body.classList.add("nobg");
        const fontSpecs = [
          '900 100px "Inter Tight"',
          '800 100px "Inter Tight"',
          '700 100px "Inter Tight"',
          '500 40px "Inter"',
          '600 40px "Inter"',
        ];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }

        const D = 10.23;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const SVGNS = "http://www.w3.org/2000/svg";

        // ---- fit lines that must span the zone ----
        for (const line of $$(".line[data-fit]")) {
          const maxW = parseFloat(line.dataset.fit);
          const fs = parseFloat(getComputedStyle(line).fontSize);
          if (line.offsetWidth > maxW) line.style.fontSize = Math.floor((fs * maxW) / line.offsetWidth) + "px";
        }

        // ---- place each line by its baseline ----
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.dataset.baseOff = baseOff;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }

        // ---- strike-through across "features" (child of #a1) ----
        const a1 = $("#a1");
        const feat = $("#w-features");
        const featFs = parseFloat(getComputedStyle(feat).fontSize);
        const strike = $("#strike");
        strike.style.left = feat.offsetLeft - 6 + "px";
        strike.style.width = feat.offsetWidth + 14 + "px";
        strike.style.height = "18px";
        strike.style.top = parseFloat(a1.dataset.baseOff) - featFs * 0.28 - 9 + "px";

        // ---- underline under "personal" (child of #b3, behind the glyphs) ----
        const b3 = $("#b3");
        const pers = $("#w-personal");
        const persFs = parseFloat(getComputedStyle(pers).fontSize);
        const ul = $("#underline");
        ul.style.left = pers.offsetLeft + persFs * 0.12 + "px";
        ul.style.width = pers.offsetWidth - persFs * 0.2 + "px";
        ul.style.height = "16px";
        ul.style.top = parseFloat(b3.dataset.baseOff) + 16 + "px";

        // ---- up-arrow chip: left of "ahead", centred on its x-height ----
        const a3 = $("#a3");
        const chip = $("#chip-up");
        chip.style.left = a3.offsetLeft - 176 - 22 + "px";
        chip.style.top = parseFloat(a3.dataset.base) - 222 * 0.27 - 44 + "px";

        // ---- bento geometry around the secondary card (card visual: x72–672, y310–725) ----
        const G = {
          t1: [690, 310, 252, 198],
          t2: [690, 526, 252, 199],
          t3: [788, 745, 154, 100],
          t4: [72, 745, 698, 100],
        };
        for (const [id, [x, y, w, h]] of Object.entries(G)) {
          Object.assign($("#" + id).style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
        }

        // dotted slot outlines, each drawn on through a mask
        const svg = $("#slots-svg");
        const defs = svg.querySelector("defs");
        const rr = (x, y, w, h, r) =>
          `M ${x + r} ${y} H ${x + w - r} A ${r} ${r} 0 0 1 ${x + w} ${y + r} V ${y + h - r} A ${r} ${r} 0 0 1 ${x + w - r} ${y + h} H ${x + r} A ${r} ${r} 0 0 1 ${x} ${y + h - r} V ${y + r} A ${r} ${r} 0 0 1 ${x + r} ${y} Z`;
        const slots = {};
        for (const [id, [x, y, w, h]] of Object.entries(G)) {
          const d = rr(x, y, w, h, id === "t4" ? 50 : 24);
          const m = document.createElementNS(SVGNS, "mask");
          m.setAttribute("id", "m-" + id);
          m.setAttribute("maskUnits", "userSpaceOnUse");
          m.setAttribute("x", "0");
          m.setAttribute("y", "0");
          m.setAttribute("width", "1080");
          m.setAttribute("height", "1920");
          const mp = document.createElementNS(SVGNS, "path");
          mp.setAttribute("d", d);
          mp.setAttribute("fill", "none");
          mp.setAttribute("stroke", "#fff");
          mp.setAttribute("stroke-width", "14");
          m.appendChild(mp);
          defs.appendChild(m);
          const g = document.createElementNS(SVGNS, "g");
          g.setAttribute("mask", "url(#m-" + id + ")");
          const p = document.createElementNS(SVGNS, "path");
          p.setAttribute("d", d);
          p.setAttribute("fill", "none");
          p.setAttribute("stroke", "#141414");
          p.setAttribute("stroke-width", "3");
          p.setAttribute("stroke-dasharray", "2 12");
          p.setAttribute("stroke-linecap", "round");
          g.appendChild(p);
          svg.appendChild(g);
          const L = mp.getTotalLength() + 4;
          mp.setAttribute("stroke-dasharray", L + " " + L);
          mp.setAttribute("stroke-dashoffset", L);
          slots[id] = { mp, L, g };
        }

        // day chips inside the black strip
        const daysEl = $("#days");
        const days = [];
        for (const name of ["Mon", "Tue", "Wed", "Thu", "Fri"]) {
          const c = document.createElement("div");
          c.className = "day";
          const k = document.createElement("div");
          k.className = "chk";
          const kf = document.createElement("div");
          kf.className = "chk-fill";
          k.appendChild(kf);
          const ks = document.createElementNS(SVGNS, "svg");
          ks.setAttribute("width", "36");
          ks.setAttribute("height", "36");
          ks.setAttribute("viewBox", "0 0 30 30");
          const kp = document.createElementNS(SVGNS, "path");
          kp.setAttribute("d", "M 9 15.5 L 13.2 19.6 L 21.2 11");
          kp.setAttribute("fill", "none");
          kp.setAttribute("stroke", "#FBFAF8");
          kp.setAttribute("stroke-width", "3.4");
          kp.setAttribute("stroke-linecap", "round");
          kp.setAttribute("stroke-linejoin", "round");
          ks.appendChild(kp);
          k.appendChild(ks);
          const l = document.createElement("span");
          l.className = "dl";
          l.textContent = name;
          const lo = document.createElement("span");
          lo.className = "dl-on";
          lo.textContent = name;
          l.appendChild(lo);
          c.appendChild(k);
          c.appendChild(l);
          daysEl.appendChild(c);
          const KL = kp.getTotalLength() + 1;
          kp.setAttribute("stroke-dasharray", KL + " " + KL);
          kp.setAttribute("stroke-dashoffset", KL);
          days.push({ c, kf, kp, KL, lo });
        }

        // ================= timeline =================
        const tl = gsap.timeline({ paused: true });

        // background drift (continuous, linear on purpose) + slow camera push
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -12, duration: D, ease: "none" }, 0);
        tl.fromTo("#cam", { scale: 1, transformOrigin: "510px 900px" }, { scale: 1.008, duration: D, ease: "none" }, 0);

        // ---------- speaker card: hero entrance (as v01_hook) ----------
        gsap.set("#card", { transformPerspective: 1600, transformOrigin: "50% 50%" });
        gsap.set("#card-move", { transformOrigin: "0px 0px" });
        gsap.set("#card-float", { transformOrigin: "50% 50%" });
        tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0);
        tl.fromTo("#card", { y: 130 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
        tl.fromTo("#card", { scale: 0.88 }, { scale: 1, duration: 0.48, ease: "back.out(1.2)", immediateRender: false }, 0);
        tl.fromTo("#card", { rotationX: 22 }, { rotationX: 3, duration: 0.62, ease: "back.out(1.8)", immediateRender: false }, 0);
        tl.fromTo("#card", { rotationY: -18 }, { rotationY: -6, duration: 0.55, ease: "power3.out", immediateRender: false }, 0);
        tl.to("#card", { rotationY: -4.5, rotationX: 2.5, duration: 3.58 - 0.62, ease: "sine.inOut" }, 0.62);
        tl.fromTo("#vid-wrap", { scale: 1.16, transformOrigin: "50% 45%" }, { scale: 1, duration: 0.7, ease: "power3.out" }, 0);
        tl.to("#vid-wrap", { scale: 1.03, duration: D - 0.7, ease: "none" }, 0.7);
        tl.fromTo("#sheen", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.08);
        tl.fromTo(
          "#sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut", immediateRender: false },
          0.08,
        );
        tl.to("#sheen", { opacity: 0, duration: 0.25, ease: "power1.in" }, 0.55);
        // gentle float for the whole slot
        tl.to("#card-float", { y: -5, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0.5);

                // A → B1: portrait card 840 → 700 wide, centred (visual x160–860, y306–1123)
        tl.to("#card-move", { x: 70, duration: 0.48, ease: "power2.inOut" }, 3.58);
        tl.to("#card-move", { y: 0, duration: 0.48, ease: "power3.inOut" }, 3.58);
        tl.to("#card-move", { scale: 0.8333, duration: 0.48, ease: "power3.inOut" }, 3.58);
        tl.to("#card", { rotationY: -8, rotationX: 5, duration: 0.36, ease: "power2.inOut" }, 3.58);
        tl.to("#card", { rotationY: -5, rotationX: 3, duration: 0.45, ease: "back.out(1.6)" }, 3.94);
        // second sheen as it lands small
        tl.fromTo("#sheen", { opacity: 0 }, { opacity: 0.8, duration: 0.1, ease: "power1.out", immediateRender: false }, 3.86);
        tl.fromTo(
          "#sheen",
          { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: 0.6, ease: "power2.inOut", immediateRender: false },
          3.86,
        );
        tl.to("#sheen", { opacity: 0, duration: 0.22, ease: "power1.in" }, 4.26);

        // ---------- kinetic words ----------
        function wordIn(w) {
          const t = parseFloat(w.dataset.t);
          if (w.dataset.hero) {
            const s = Math.max(0, t - 0.2);
            const peak = parseFloat(w.dataset.peak || "1.08");
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: parseFloat(w.dataset.rise || 100), scale: 0.55, rotation: -7, filter: "blur(10px)" },
              { opacity: 1, y: -10, scale: peak, rotation: 1.5, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, s + 0.2);
          } else if (w.dataset.accent) {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 70, scale: 0.78, rotation: -6, filter: "blur(8px)" },
              { opacity: 1, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.46, ease: "back.out(2.2)" },
              s,
            );
          } else {
            const s = Math.max(0, t - 0.13);
            tl.fromTo(
              w,
              { opacity: 0, y: 50, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "power3.out" },
              s,
            );
          }
        }
        for (const w of $$(".line .w")) wordIn(w);

        // ---------- BEAT A ----------
        // ocean strike-through across "features" on "not"; the word gets knocked down a touch
        gsap.set(strike, { transformOrigin: "0% 50%", rotation: -3 });
        tl.fromTo(strike, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power3.out" }, 1.17);
        gsap.set(feat, { transformOrigin: "20% 85%" });
        tl.to(feat, { y: 6, rotation: -1.5, duration: 0.12, ease: "power2.out" }, 1.3);
        tl.to(feat, { y: 3, rotation: -1, duration: 0.4, ease: "back.out(2)" }, 1.42);
        tl.to("#w-features", { opacity: 0.82, duration: 0.3, ease: "power1.out" }, 1.36);

        // "are not" clears before "keep you"
        tl.to("#a1b", { y: -40, opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, 1.88);
        tl.to("#a1", { y: -40, opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, 1.88 + 1.5 * F);

        // up-arrow chip pops just after "ahead" lands, bars grow, arrow nudges up
        gsap.set(chip, { transformOrigin: "100% 50%" });
        tl.fromTo(chip, { opacity: 0, scale: 0.5, x: 30 }, { opacity: 1, scale: 1, x: 0, duration: 0.42, ease: "back.out(2)" }, 2.6);
        tl.fromTo($$(".mbar"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(2)", stagger: 2 * F }, 2.72);
        tl.fromTo("#chip-disc svg", { y: 10 }, { y: 0, duration: 0.3, ease: "back.out(2.4)" }, 2.66);
        tl.to("#chip-disc svg", { y: -3, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.0);
        tl.to(chip, { y: -4, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.0);

        // "ahead" camera punch, released as the beat changes
        tl.fromTo("#punch", { scale: 1, transformOrigin: "510px 1300px" }, { scale: 1.008, duration: 0.4, ease: "power2.out" }, 2.56);
        tl.to("#punch", { scale: 1, duration: 0.4, ease: "power2.inOut" }, 3.5);

        // beat-A type lifts out bottom-up, 1.5 f apart
        ["#a4", "#a3", "#chip-up", "#a2"].forEach((s, i) => {
          tl.to(s, { y: -44, opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, 3.52 + i * 1.5 * F);
        });

        // ---------- BEAT B ----------
        // "personal": underline draws, camera punch
        tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, 6.32);
        tl.fromTo("#punch", { scale: 1, transformOrigin: "510px 1290px" }, { scale: 1.012, duration: 0.4, ease: "power2.out", immediateRender: false }, 6.18);
        tl.to("#punch", { scale: 1, duration: 0.4, ease: "power2.inOut" }, 7.36);

        // B1 → B2: card shrinks to secondary (600 wide) top-left while "personal" holds
        // card reshapes portrait 700 → landscape secondary 600x415 at top-left (visual x72–672, y310–725)
        tl.to("#card-move", { x: -18, duration: 0.46, ease: "power2.inOut" }, 6.42);
        tl.to("#card-move", { y: 4, duration: 0.46, ease: "power3.inOut" }, 6.42);
        tl.to("#card-move", { scale: 0.7143, duration: 0.46, ease: "power3.inOut" }, 6.42);
        tl.to("#card-move", { height: 581, duration: 0.46, ease: "power3.inOut" }, 6.42);
        tl.to("#speaker", { y: -131, duration: 0.46, ease: "power3.inOut" }, 6.42);
        tl.to("#card", { rotationY: -8, rotationX: 5, duration: 0.3, ease: "power2.inOut" }, 6.42);
        tl.to("#card", { rotationY: -5, rotationX: 3, duration: 0.4, ease: "back.out(1.6)" }, 6.72);
        // lines above blur up and out as "personal" lands (bottom-up)
        tl.to("#b2", { y: -40, opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.92);
        tl.to("#b1", { y: -40, opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.92 + 1.5 * F);

        // dotted slot outlines draw around the card on "built"
        const order = ["t1", "t2", "t4", "t3"];
        order.forEach((id, i) => {
          const { mp, L } = slots[id];
          tl.fromTo(mp, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.42, ease: "power2.inOut" }, 6.64 + i * 3 * F);
        });

        // tiles snap into their slots
        const land = { t1: 6.9, t2: 7.08, t4: 7.26, t3: 7.42 };
        const from = {
          t1: { x: 24, y: -24, rotation: 4 },
          t2: { x: 18, y: 50, rotation: -4 },
          t3: { x: 10, y: 50, rotation: 4 },
          t4: { x: 6, y: 50, rotation: -1.2 },
        };
        for (const id of order) {
          const el = $("#" + id);
          const s = land[id] - 0.22;
          gsap.set(el, { transformOrigin: "50% 50%" });
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, s);
          tl.fromTo(
            el,
            { ...from[id], scale: 0.84, filter: "blur(6px)" },
            { x: 0, y: 0, rotation: 0, scale: id === "t4" ? 1.008 : 1.025, filter: "blur(0px)", duration: 0.22, ease: "power3.out", immediateRender: false },
            s,
          );
          tl.to(el, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, land[id]);
          // outline fades as the tile covers its slot
          tl.to(slots[id].g, { opacity: 0, duration: 0.14, ease: "power1.out" }, land[id] - 0.04);
          // the card answers each snap with a tiny nudge
          tl.to("#card-float", { scale: 1.008, duration: 0.07, ease: "power2.out" }, land[id]);
          tl.to("#card-float", { scale: 1, duration: 0.22, ease: "back.out(2)" }, land[id] + 0.07);
        }
        // frame complete: card flattens into the grid
        tl.to("#card", { rotationY: -2.5, rotationX: 1.5, duration: 0.5, ease: "back.out(1.4)" }, 7.42);
        tl.to("#card", { rotationY: -4, rotationX: 2.5, duration: D - 7.92, ease: "sine.inOut" }, 7.92);

        // tile internals pop in after each lands
        tl.fromTo("#t1-av", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2)" }, land.t1 - 0.04);
        tl.fromTo(["#t1-b1", "#t1-b2"], { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power3.out", stagger: 2 * F }, land.t1);
        tl.fromTo($$("#t1 .sq"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: 2 * F }, land.t1 + 0.04);
        tl.fromTo($$(".t2l"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power3.out", stagger: 2 * F }, land.t2);
        gsap.set("#sl-fill", { scaleX: 0.3 });
        gsap.set("#sl-knob", { x: 22 + 110 * 0.3 });
        tl.fromTo("#sl-knob", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, land.t3);
        tl.fromTo($$(".day"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.8)", stagger: 2 * F }, land.t4 - 0.02);

        // tiles float, out of phase
        [
          ["#t1 .tile-body", 7.0, 1.0],
          ["#t2 .tile-body", 7.25, 1.15],
          ["#t3 .tile-body", 7.45, 0.95],
          ["#t4 .tile-body", 7.65, 1.05],
        ].forEach(([s, t0, dur]) => {
          const reps = Math.floor((D - t0) / dur) - 1;
          tl.to(s, { y: -3, duration: dur, ease: "sine.inOut", yoyo: true, repeat: reps }, t0);
        });

        // "personal" + underline shrink and rise next to "built for" (scale leads, rise follows)
        gsap.set(b3, { transformOrigin: "0px " + b3.dataset.baseOff + "px" });
        tl.to(b3, { scale: 0.62, duration: 0.24, ease: "power3.inOut" }, 7.42);
        tl.to(b3, { y: 985 - 1345, x: 82 - 98, duration: 0.3, ease: "power2.inOut" }, 7.46);
        tl.to("#b4", { y: 985 - 1452, duration: 0.28, ease: "power2.inOut" }, 7.56);

        // secondary life on "with these …" (no words): toggle on, slider slides, a square gets picked
        tl.to("#tog-knob", { x: 36, duration: 0.3, ease: "back.out(1.8)" }, 8.42);
        tl.to("#tog-on", { opacity: 1, duration: 0.2, ease: "power1.out" }, 8.44);
        tl.to(".t2l", { backgroundColor: "rgba(228,222,217,0.3)", duration: 0.3, ease: "power1.out", stagger: 2 * F }, 8.5);
        tl.to("#sl-fill", { scaleX: 0.78, duration: 0.5, ease: "power3.inOut" }, 8.56);
        tl.to("#sl-knob", { x: 22 + 110 * 0.78, duration: 0.5, ease: "power3.inOut" }, 8.56);
        tl.to("#sq2-pick", { opacity: 1, duration: 0.2, ease: "power1.out" }, 8.72);
        tl.fromTo("#sq2-dot", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, 8.76);
        tl.fromTo("#sq2", { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, 8.72);
        tl.to("#t1-b1", { width: 96, duration: 0.4, ease: "power2.inOut" }, 8.8);

        // day chips tick ocean in a stagger on "every single day"
        const tickT = [9.3, 9.45, 9.6, 9.76, 9.92];
        days.forEach(({ c, kf, kp, KL, lo }, i) => {
          const s = tickT[i];
          gsap.set(kf, { scale: 0, transformOrigin: "50% 50%" });
          gsap.set(c, { transformOrigin: "50% 50%" });
          tl.to(kf, { scale: 1, duration: 0.24, ease: "back.out(2.2)" }, s);
          tl.to(kp, { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power2.out" }, s + 0.08);
          tl.to(lo, { opacity: 1, duration: 0.16, ease: "power1.out" }, s + 0.04);
          tl.to(c, { scale: 1.12, duration: 0.1, ease: "power2.out" }, s);
          tl.to(c, { scale: 1, duration: 0.28, ease: "back.out(2.2)" }, s + 0.1);
        });

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
</html>
