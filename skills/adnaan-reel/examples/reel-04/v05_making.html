<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v05 making</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      #cam,
      #punch {
        position: absolute;
        inset: 0;
      }
      .abs {
        position: absolute;
      }

      /* ---------- media objects: pos (layout moves) > flt (float) > card (entrance + 3D tilt) ---------- */
      .pos,
      .flt {
        position: absolute;
      }
      .flt {
        inset: 0;
      }
      .card {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      /* desktop window card */
      .win {
        border-radius: 26px;
        overflow: hidden;
        background: var(--brand-card);
        box-shadow:
          0 30px 50px -12px rgba(60, 50, 40, 0.3),
          0 50px 70px -10px rgba(40, 30, 20, 0.24);
      }
      #w1.win {
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
      }
      .wchrome {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        background: #f1eeea;
      }
      .wchrome i {
        position: absolute;
        border-radius: 50%;
        background: #d6d0ca;
      }
      .wtitle {
        position: absolute;
        border-radius: 8px;
        background: #e4ded9;
      }
      .wscreen {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        background: #f1eeea;
      }
      .vwrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #1b1b1b;
      }
      .vwrap video {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .wf {
        position: absolute;
        border-radius: 10px;
        background: #e5e0da;
      }
      .wf.white {
        background: var(--brand-card);
        box-shadow: 0 10px 20px -8px rgba(60, 50, 40, 0.18);
      }
      .wf.dark {
        background: #cfc8c0;
      }
      #w1-prog {
        position: absolute;
        left: 40px;
        right: 40px;
        bottom: 34px;
        height: 14px;
        border-radius: 7px;
        background: #e5e0da;
        overflow: hidden;
      }
      #w1-prog-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        border-radius: 7px;
        background: linear-gradient(90deg, var(--brand-primary), var(--brand-primary-dark));
        transform-origin: 0% 50%;
      }

      /* phone card */
      #ph.card {
        border-radius: 52px;
        background: linear-gradient(160deg, #2c2c2c, var(--brand-text) 45%);
        box-shadow:
          0 40px 60px -14px rgba(40, 30, 20, 0.42),
          inset 0 0 0 2px rgba(255, 255, 255, 0.08);
      }
      #ph-screen {
        position: absolute;
        left: 12px;
        top: 12px;
        width: 360px;
        height: 641px;
        border-radius: 42px;
        overflow: hidden;
        background: #1b1b1b;
      }
      #ph-island {
        position: absolute;
        left: 50%;
        top: 24px;
        width: 104px;
        height: 28px;
        margin-left: -52px;
        border-radius: 14px;
        background: var(--brand-text);
      }

      .sheen {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.26) 45%,
          rgba(255, 255, 255, 0.06) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- app cards (beat C) ---------- */
      .app {
        position: absolute;
        opacity: 0;
      }
      .app-in {
        position: absolute;
        inset: 0;
        border-radius: 24px;
        background: var(--brand-card);
        box-shadow: 0 30px 50px -12px rgba(60, 50, 40, 0.3);
        overflow: hidden;
      }
      .app-in.deep {
        background: var(--brand-deep);
        box-shadow: 0 30px 50px -12px rgba(13, 39, 49, 0.4);
      }
      .app-in.ocean {
        background: linear-gradient(140deg, #6cc3e8, var(--brand-primary) 55%, var(--brand-primary-dark));
        box-shadow: 0 26px 44px -12px rgba(31, 126, 168, 0.4);
      }
      .b {
        position: absolute;
        border-radius: 7px;
        background: #e5e0da;
      }
      .b.oc {
        background: var(--brand-primary);
      }
      .b.dk {
        background: #cfc8c0;
      }
      .b.wh {
        background: var(--brand-card);
      }

      /* ---------- kinetic type (Inter Tight) ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.88;
        letter-spacing: -0.03em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      /* v2 type: Inter Tight. Supporting/connective 800, hero 900; accent = colour, no italics */
      .sup {
        font-family: "Inter Tight", system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--brand-text);
      }
      .hero {
        font-family: "Inter Tight", system-ui, sans-serif;
        font-weight: 900;
        font-style: normal;
        letter-spacing: -0.045em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.24em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="8.5">
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <div id="punch">
          <!-- app cards deal out from behind the fan (beat C) -->
          <div id="apps"></div>

          <!-- W1: desktop window, game_minecraft.mp4 (1760x984 → 800x447) -->
          <div id="w1-pos" class="pos" style="left: 70px; top: 420px; width: 860px; height: 537px">
            <div id="w1-flt" class="flt">
              <div id="w1" class="card win">
                <div class="wchrome" style="height: 56px">
                  <i style="left: 26px; top: 21px; width: 15px; height: 15px"></i>
                  <i style="left: 49px; top: 21px; width: 15px; height: 15px"></i>
                  <i style="left: 72px; top: 21px; width: 15px; height: 15px"></i>
                  <span class="wtitle" style="left: 345px; top: 22px; width: 170px; height: 12px"></span>
                </div>
                <div class="wscreen" style="top: 56px">
                  <div id="w1-wire" class="abs" style="inset: 0">
                    <div class="wf dark w1b" style="left: 38px; top: 32px; width: 44px; height: 44px; border-radius: 50%"></div>
                    <div class="wf w1b" style="left: 96px; top: 46px; width: 160px; height: 16px; border-radius: 8px"></div>
                    <div class="wf w1b" style="left: 600px; top: 46px; width: 86px; height: 16px; border-radius: 8px"></div>
                    <div class="wf dark w1b" style="left: 704px; top: 34px; width: 118px; height: 40px; border-radius: 20px"></div>
                    <div class="wf white w1b" style="left: 38px; top: 104px; width: 505px; height: 290px; border-radius: 20px"></div>
                    <div class="wf white w1b" style="left: 565px; top: 104px; width: 257px; height: 138px; border-radius: 20px"></div>
                    <div class="wf white w1b" style="left: 565px; top: 256px; width: 257px; height: 138px; border-radius: 20px"></div>
                    <div id="w1-prog" class="w1b"><div id="w1-prog-fill"></div></div>
                  </div>
                  <div id="w1-rev" class="vwrap">
                    <video id="mc0" class="clip" src="assets/game_minecraft.mp4" muted playsinline data-start="1.9" data-duration="1.9" data-track-index="2"></video>
                    <video id="mc1" class="clip" src="assets/game_minecraft.mp4" muted playsinline data-start="3.7667" data-duration="1.9" data-track-index="3"></video>
                    <video id="mc2" class="clip" src="assets/game_minecraft.mp4" muted playsinline data-start="5.6333" data-duration="1.9" data-track-index="2"></video>
                    <video id="mc3" class="clip" src="assets/game_minecraft.mp4" muted playsinline data-start="7.5" data-duration="1" data-track-index="3"></video>
                  </div>
                </div>
                <div class="sheen" id="w1-sheen"></div>
              </div>
            </div>
          </div>

          <!-- W2: second window, game_sim.mp4 (1312x980 → 400x299) -->
          <div id="w2-pos" class="pos" style="left: 540px; top: 700px; width: 400px; height: 339px">
            <div id="w2-flt" class="flt">
              <div id="w2" class="card win" style="border-radius: 22px">
                <div class="wchrome" style="height: 40px">
                  <i style="left: 18px; top: 14px; width: 12px; height: 12px"></i>
                  <i style="left: 36px; top: 14px; width: 12px; height: 12px"></i>
                  <i style="left: 54px; top: 14px; width: 12px; height: 12px"></i>
                  <span class="wtitle" style="left: 150px; top: 15px; width: 100px; height: 10px"></span>
                </div>
                <div class="wscreen" style="top: 40px">
                  <div class="vwrap">
                    <video id="sm0" class="clip" src="assets/game_sim.mp4" muted playsinline data-start="2.2333" data-duration="1.4" data-track-index="4"></video>
                    <video id="sm1" class="clip" src="assets/game_sim.mp4" muted playsinline data-start="3.6" data-duration="1.4" data-track-index="5"></video>
                    <video id="sm2" class="clip" src="assets/game_sim.mp4" muted playsinline data-start="4.9667" data-duration="1.4" data-track-index="4"></video>
                    <video id="sm3" class="clip" src="assets/game_sim.mp4" muted playsinline data-start="6.3333" data-duration="1.4" data-track-index="5"></video>
                    <video id="sm4" class="clip" src="assets/game_sim.mp4" muted playsinline data-start="7.7" data-duration="0.8" data-track-index="4"></video>
                  </div>
                </div>
                <div class="sheen" id="w2-sheen"></div>
              </div>
            </div>
          </div>

          <!-- phone: game_fps.mp4 (548x976 → 276x492) -->
          <div id="ph-pos" class="pos" style="left: 556px; top: 318px; width: 384px; height: 665px">
            <div id="ph-flt" class="flt">
              <div id="ph" class="card">
                <div id="ph-screen">
                  <div class="vwrap">
                    <video id="fp0" class="clip" src="assets/game_fps.mp4" muted playsinline data-start="3.6667" data-duration="1.9" data-track-index="6"></video>
                    <video id="fp1" class="clip" src="assets/game_fps.mp4" muted playsinline data-start="5.5333" data-duration="1.9" data-track-index="7"></video>
                    <video id="fp2" class="clip" src="assets/game_fps.mp4" muted playsinline data-start="7.4" data-duration="1.1" data-track-index="6"></video>
                  </div>
                  <div id="ph-island"></div>
                </div>
                <div class="sheen" id="ph-sheen"></div>
              </div>
            </div>
          </div>

          <!-- ============ kinetic type (Inter Tight) ============ -->
          <!-- intro -->
          <div id="i1" class="line sup" data-x="92" data-base="1150" data-out="1.64" style="font-size: 160px">
            <span class="bl"></span>
            <span class="w" data-t="0.06">people</span>
            <span class="w gap-s" data-t="0.26">are</span>
          </div>
          <div id="i2" class="line sup" data-right="944" data-base="1300" data-out="1.67" style="font-size: 150px">
            <span class="bl"></span>
            <span class="w" data-t="0.50">using</span>
            <span class="w gap-s" data-t="0.74">it</span>
            <span class="w gap-s" data-t="0.92">for</span>
          </div>

          <!-- conveyor: each new line pushes the stack up -->
          <div id="k-making" class="line sup" data-x="96" data-base="1434" data-rise="16" data-out="1.70" style="font-size: 120px">
            <span class="bl"></span>
            <span class="w" data-t="1.12" data-accent="1">making</span>
          </div>
          <div id="k-games" class="line hero ocean" data-right="922" data-base="1220" data-out="3.16" style="font-size: 240px">
            <span class="bl"></span>
            <span class="w" data-t="2.07" data-hero="1" data-peak="1.1" data-origin="75% 85%">games</span>
          </div>
          <div id="k-desktop" class="line hero ink" data-x="96" data-base="1420" data-rise="34" data-glide="3.27:-250" data-out="4.16" style="font-size: 170px">
            <span class="bl"></span>
            <span class="w" data-t="2.45" data-hero="1" data-peak="1.07" data-origin="20% 85%">desktop</span>
          </div>
          <div id="k-app1" class="line sup" data-right="940" data-base="1300" data-out="4.19" style="font-size: 92px">
            <span class="bl"></span>
            <span class="w" data-t="3.50">applications</span>
          </div>
          <div id="k-mobile" class="line hero ocean" data-x="110" data-base="1458" data-rise="14" data-glide="4.27:-243" data-out="5.18" style="font-size: 170px">
            <span class="bl"></span>
            <span class="w" data-t="3.85" data-hero="1" data-peak="1.08" data-origin="20% 85%">mobile</span>
          </div>
          <div id="k-app2" class="line sup" data-right="940" data-base="1335" data-out="5.21" style="font-size: 92px">
            <span class="bl"></span>
            <span class="w" data-t="4.55">applications</span>
          </div>

          <!-- beat C -->
          <div id="c1" class="line sup" data-x="96" data-base="1300" data-glide="6.80:-222" style="font-size: 92px">
            <span class="bl"></span>
            <span class="w" data-t="5.45">literally</span>
            <span class="w gap-s" data-t="5.97">every</span>
          </div>
          <div id="c2" class="line sup" data-right="930" data-base="1395" data-glide="6.83:-222" style="font-size: 92px">
            <span class="bl"></span>
            <span class="w" data-t="6.41">single</span>
            <span class="w gap-s" data-t="6.59">piece</span>
            <span class="w gap-s" data-t="6.83">of</span>
          </div>
          <div id="c3" class="line hero ink" data-x="96" data-base="1355" data-rise="40" style="font-size: 200px">
            <span class="bl"></span>
            <span class="w" data-t="7.19" data-hero="1" data-peak="1.06" data-origin="50% 85%">software</span>
          </div>
          <div id="c4" class="line sup" data-right="944" data-base="1454" data-rise="12" style="font-size: 70px">
            <span class="bl"></span>
            <span class="w" data-t="7.39">that</span>
            <span class="w gap-s" data-t="7.57">they</span>
            <span class="w gap-s" data-t="7.75">can</span>
            <span class="w gap-s" data-t="7.95">make</span>
            <span class="w gap-s" data-t="8.13">with</span>
            <span class="w gap-s" data-t="8.33" data-last="1">it.</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (async () => {
        const fontSpecs = ['900 100px "Inter Tight"', '800 100px "Inter Tight"', '700 100px "Inter Tight"', '500 40px "Inter"', '600 40px "Inter"'];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }

        const D = 8.5;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        // ---------------- layout: kinetic lines placed by baseline (measured once) ----------------
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          else line.style.left = line.dataset.x + "px";
        }

        // ---------------- app cards (plain wireframe UI, no logos) ----------------
        const FAN = { x: 520, y: 650 };
        const AS = 1.15; // app-card scale (cloud ~1.15–1.25x of v1)
        const appSpec = [
          { x: 172, y: 398, w: 150, h: 150, k: "icon", r: -8 },
          { x: 392, y: 388, w: 210, h: 128, k: "chart", r: 4 },
          { x: 655, y: 385, w: 200, h: 124, k: "list", r: -3 },
          { x: 866, y: 412, w: 128, h: 128, k: "deep", r: 7 },
          { x: 160, y: 628, w: 128, h: 206, k: "phoneapp", r: 5 },
          { x: 868, y: 648, w: 116, h: 200, k: "tall", r: -6 },
          { x: 190, y: 910, w: 186, h: 128, k: "chat", r: 6 },
          { x: 415, y: 918, w: 206, h: 108, k: "music", r: -4 },
          { x: 660, y: 913, w: 196, h: 128, k: "cal", r: 3 },
          { x: 862, y: 903, w: 136, h: 136, k: "tile", r: -7 },
          { x: 258, y: 800, w: 110, h: 110, k: "icon2", r: 9 },
          { x: 792, y: 470, w: 104, h: 104, k: "tile2", r: -9 },
        ];
        const B = (cls, x, y, w, h, extra = "") =>
          `<div class="b ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}"></div>`;
        const CHECK =
          '<svg viewBox="0 0 24 24" style="position:absolute;left:5px;top:5px;width:14px;height:14px"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#FBFAF8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const inner = {
          icon: () =>
            `<div class="app-in ocean" style="border-radius:36px">` +
            `<svg viewBox="0 0 100 100" style="position:absolute;left:43px;top:43px;width:64px;height:64px"><path d="M34 24 L78 50 L34 76 Z" fill="#FBFAF8" stroke="#FBFAF8" stroke-width="8" stroke-linejoin="round"/></svg></div>`,
          chart: () =>
            `<div class="app-in">` +
            B("", 18, 18, 90, 12) +
            B("dk", 22, 92, 22, 18) +
            B("dk", 54, 72, 22, 38) +
            B("dk", 86, 58, 22, 52) +
            B("oc", 118, 44, 22, 66) +
            B("dk", 150, 64, 22, 46) +
            `</div>`,
          list: () => {
            let s = `<div class="app-in">`;
            for (let i = 0; i < 3; i++) {
              const y = 18 + i * 32;
              s +=
                `<div class="b ${i === 0 ? "oc" : "dk"}" style="left:18px;top:${y}px;width:24px;height:24px;border-radius:50%">${i === 0 ? CHECK : ""}</div>` +
                B("", 54, y + 6, i === 1 ? 92 : 120, 12);
            }
            return s + `</div>`;
          },
          deep: () =>
            `<div class="app-in deep" style="border-radius:32px">` +
            `<div class="b oc" style="left:34px;top:30px;width:60px;height:60px;border-radius:50%"></div>` +
            `<div class="b wh" style="left:56px;top:52px;width:16px;height:16px;border-radius:50%;opacity:.9"></div>` +
            B("wh", 34, 102, 60, 8, "opacity:.5;border-radius:4px") +
            `</div>`,
          phoneapp: () =>
            `<div class="app-in" style="border-radius:28px">` +
            B("dk", 46, 12, 36, 8, "border-radius:4px") +
            B("dk", 16, 34, 96, 64, "border-radius:14px") +
            B("", 16, 110, 80, 10) +
            B("", 16, 128, 60, 10) +
            B("oc", 16, 156, 96, 30, "border-radius:15px") +
            `</div>`,
          tall: () =>
            `<div class="app-in">` +
            B("dk", 14, 14, 88, 88, "border-radius:16px") +
            B("", 14, 116, 80, 10) +
            B("", 14, 134, 60, 10) +
            B("", 14, 152, 72, 10) +
            B("dk", 14, 172, 40, 14, "border-radius:7px") +
            `</div>`,
          chat: () =>
            `<div class="app-in">` +
            B("", 16, 16, 110, 30, "border-radius:15px 15px 15px 4px") +
            B("oc", 70, 54, 100, 28, "border-radius:14px 14px 4px 14px") +
            B("", 16, 90, 80, 24, "border-radius:12px 12px 12px 4px") +
            `</div>`,
          music: () =>
            `<div class="app-in">` +
            `<div class="b dk" style="left:16px;top:16px;width:76px;height:76px;border-radius:50%"></div>` +
            `<div class="b wh" style="left:46px;top:46px;width:16px;height:16px;border-radius:50%"></div>` +
            B("", 106, 24, 82, 12) +
            B("", 106, 46, 56, 10) +
            B("", 106, 74, 82, 8, "border-radius:4px") +
            B("oc", 106, 74, 46, 8, "border-radius:4px") +
            `</div>`,
          cal: () => {
            let s = `<div class="app-in">` + B("", 16, 14, 70, 12);
            for (let r = 0; r < 3; r++)
              for (let c = 0; c < 6; c++) {
                const on = r === 1 && c === 3;
                s += B(on ? "oc" : "dk", 16 + c * 28, 40 + r * 26, 20, 18, "border-radius:5px;" + (on ? "" : "opacity:.7"));
              }
            return s + `</div>`;
          },
          tile: () =>
            `<div class="app-in" style="border-radius:32px">` +
            B("dk", 30, 30, 34, 34, "border-radius:10px") +
            B("dk", 72, 30, 34, 34, "border-radius:10px") +
            B("dk", 30, 72, 34, 34, "border-radius:10px") +
            B("oc", 72, 72, 34, 34, "border-radius:10px") +
            `</div>`,
          icon2: () =>
            `<div class="app-in deep" style="border-radius:28px">` +
            B("oc", 28, 30, 54, 10, "border-radius:5px") +
            B("wh", 28, 50, 40, 10, "border-radius:5px;opacity:.6") +
            B("wh", 28, 70, 50, 10, "border-radius:5px;opacity:.6") +
            `</div>`,
          tile2: () =>
            `<div class="app-in" style="border-radius:26px">` +
            `<div class="b dk" style="left:27px;top:27px;width:50px;height:50px;border-radius:50%"></div>` +
            `<div class="b oc" style="left:42px;top:42px;width:20px;height:20px;border-radius:50%"></div>` +
            `</div>`,
        };
        const appsEl = $("#apps");
        const apps = appSpec.map((s) => {
          const a = document.createElement("div");
          a.className = "app";
          a.style.cssText = `left:${s.x - s.w / 2}px;top:${s.y - s.h / 2}px;width:${s.w}px;height:${s.h}px`;
          a.innerHTML = inner[s.k]();
          appsEl.appendChild(a);
          return a;
        });

        // ================= timeline =================
        const tl = gsap.timeline({ paused: true });

        // continuous: grid drift + slow camera push
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -14, duration: D, ease: "none" }, 0);
        tl.fromTo("#cam", { scale: 1, transformOrigin: "540px 900px" }, { scale: 1.012, duration: D, ease: "none" }, 0);

        // ---------- word entrances (contact frame on the spoken word) ----------
        for (const w of $$(".line .w")) {
          const t = parseFloat(w.dataset.t);
          const rise = parseFloat(w.closest(".line").dataset.rise || "0");
          if (w.dataset.hero) {
            const s = Math.max(0, t - 0.2);
            const peak = parseFloat(w.dataset.peak || "1.08");
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 80%" });
            tl.fromTo(
              w,
              { opacity: 0, y: rise || 90, scale: 0.55, rotation: -7, filter: "blur(10px)" },
              { opacity: 1, y: -8, scale: peak, rotation: 1.5, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, s + 0.2);
          } else if (w.dataset.accent) {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: "50% 85%" });
            tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, s);
            tl.fromTo(w, { y: 60, scale: 0.8, rotation: -5 }, { y: 0, scale: 1, rotation: 0, duration: 0.46, ease: "back.out(2)" }, s);
          } else {
            const s = Math.max(0, t - 0.13);
            tl.fromTo(
              w,
              { opacity: 0, y: rise || 46, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out" },
              s,
            );
          }
        }
        // conveyor glides (the stack moves up as the next line arrives)
        for (const line of $$(".line[data-glide]")) {
          const [t, dy] = line.dataset.glide.split(":").map(parseFloat);
          tl.to(line, { y: dy, duration: 0.3, ease: "power2.inOut" }, t);
        }
        // line exits (quick, up + blur)
        for (const line of $$(".line[data-out]")) {
          const t = parseFloat(line.dataset.out);
          const g = line.dataset.glide ? parseFloat(line.dataset.glide.split(":")[1]) : 0;
          tl.to(line, { y: g - 56, opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, t);
        }

        // generic 3D card entrance
        const dealIn = (sel, t, o) => {
          gsap.set(sel, { transformPerspective: 1600, transformOrigin: o.origin || "50% 50%" });
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, t);
          tl.fromTo(sel, { x: o.x || 0 }, { x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, t);
          tl.fromTo(sel, { y: o.y || 120 }, { y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo(sel, { scale: o.s0 || 0.86 }, { scale: 1, duration: 0.48, ease: "back.out(1.6)", immediateRender: false }, t);
          tl.fromTo(sel, { rotation: o.r0 || 0 }, { rotation: 0, duration: 0.55, ease: "back.out(1.6)", immediateRender: false }, t);
          tl.fromTo(sel, { rotationX: o.rx0 || 24 }, { rotationX: o.rx1, duration: 0.62, ease: "back.out(1.8)", immediateRender: false }, t);
          tl.fromTo(sel, { rotationY: o.ry0 }, { rotationY: o.ry1, duration: 0.55, ease: "power3.out", immediateRender: false }, t);
        };
        const sheen = (sel, t) => {
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, t);
          tl.fromTo(sel, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut", immediateRender: false }, t);
          tl.to(sel, { opacity: 0, duration: 0.25, ease: "power1.in" }, t + 0.47);
        };

        // =============== BEAT A: W1 deals in on "making", builds, game plays on "games" ===============
        dealIn("#w1", 0.3, { y: 150, s0: 0.84, rx0: 26, rx1: 4, ry0: -20, ry1: -6, r0: -3 });
        sheen("#w1-sheen", 0.4);
        tl.to("#w1", { rotationY: -4, rotationX: 2.5, duration: 4.3, ease: "sine.inOut" }, 0.92);
        // wireframe "being made": blocks pop 2 f apart, progress bar fills
        $$(".w1b").forEach((b, i) => {
          const s = 0.62 + i * 0.13;
          gsap.set(b, { transformOrigin: "50% 60%" });
          tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, s);
          tl.fromTo(b, { scale: 0.6, y: 18 }, { scale: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, s);
        });
        tl.fromTo("#w1-prog-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.85, ease: "power1.inOut" }, 1.0);
        // the game bursts out of the build on "games"
        tl.fromTo(
          "#w1-rev",
          { clipPath: "circle(0% at 50% 55%)" },
          { clipPath: "circle(80% at 50% 55%)", duration: 0.3, ease: "power2.out" },
          1.9,
        );
        tl.fromTo("#w1-rev", { scale: 1.18 }, { scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.9);
        tl.to("#w1-flt", { scale: 1.012, duration: 0.12, ease: "power2.out" }, 1.93);
        tl.to("#w1-flt", { scale: 1, duration: 0.36, ease: "back.out(2)" }, 2.05);
        tl.to("#w1-flt", { y: -5, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.45);
        tl.fromTo("#punch", { scale: 1, transformOrigin: "540px 900px" }, { scale: 1.008, duration: 0.14, ease: "power2.out" }, 1.95);
        tl.to("#punch", { scale: 1, duration: 0.4, ease: "sine.inOut" }, 2.09);

        // =============== BEAT B1: W2 deals in on "desktop" ===============
        dealIn("#w2", 2.22, { x: 40, y: 110, s0: 0.7, rx0: 18, rx1: 3, ry0: 24, ry1: 9, r0: 10 });
        sheen("#w2-sheen", 2.3);
        tl.to("#w2", { rotationY: 6, rotationX: 2, duration: 1.2, ease: "sine.inOut" }, 2.84);
        tl.to("#w2-flt", { y: 5, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.75);

        // =============== BEAT B2: windows slide left, phone rises on "mobile" ===============
        // W1 → scale 0.70 at (375, 530)   [base centre 500, 688.5]
        tl.to("#w1-pos", { x: -125, duration: 0.42, ease: "power3.inOut" }, 3.56);
        tl.to("#w1-pos", { y: -158.5, duration: 0.42, ease: "power2.inOut" }, 3.58);
        tl.to("#w1-pos", { scale: 0.7, duration: 0.42, ease: "power3.inOut" }, 3.56);
        // W2 → scale 0.85 at (290, 840)   [base centre 740, 869.5] — arcs left under W1
        tl.to("#w2-pos", { x: -450, duration: 0.46, ease: "power3.inOut" }, 3.56);
        tl.to("#w2-pos", { y: -29.5, duration: 0.46, ease: "sine.inOut" }, 3.56);
        tl.to("#w2-pos", { scale: 0.85, duration: 0.46, ease: "power3.inOut" }, 3.56);
        tl.fromTo("#w2-pos", { rotation: 0 }, { rotation: -4, duration: 0.22, ease: "power2.out" }, 3.56);
        tl.to("#w2-pos", { rotation: 0, duration: 0.4, ease: "back.out(1.6)" }, 3.79);
        // phone
        dealIn("#ph", 3.66, { y: 220, s0: 0.8, rx0: 30, rx1: 4, ry0: -20, ry1: -8, r0: 6 });
        sheen("#ph-sheen", 3.76);
        tl.to("#ph", { rotationY: -5, rotationX: 2.5, duration: 1.05, ease: "sine.inOut" }, 4.3);
        tl.to("#ph-flt", { y: -6, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.1);
        tl.to("#w2-flt", { y: -5, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.16);

        // =============== BEAT C: fan + app cards deal out ===============
        // fan centre ~ (520, 650), 1.25x of v1
        const fanT = 5.24;
        // W1 → scale 0.55 at (350, 615), rot −11
        tl.to("#w1-pos", { x: 350 - 500, duration: 0.5, ease: "power3.inOut" }, fanT);
        tl.to("#w1-pos", { y: 615 - 688.5, duration: 0.5, ease: "power2.inOut" }, fanT + 0.02);
        tl.to("#w1-pos", { scale: 0.55, rotation: -11, duration: 0.5, ease: "back.inOut(1.2)" }, fanT);
        // W2 → scale 0.825 at (700, 625), rot 10
        tl.to("#w2-pos", { x: 700 - 740, duration: 0.5, ease: "power3.inOut" }, fanT + 2 * F);
        tl.to("#w2-pos", { y: 625 - 869.5, duration: 0.5, ease: "power2.inOut" }, fanT + 3 * F);
        tl.to("#w2-pos", { scale: 0.825, rotation: 10, duration: 0.5, ease: "back.inOut(1.2)" }, fanT + 2 * F);
        // phone → scale 0.565 at (525, 668), rot −2  [base centre 748, 650.5]
        tl.to("#ph-pos", { x: 525 - 748, duration: 0.5, ease: "power3.inOut" }, fanT + 4 * F);
        tl.to("#ph-pos", { y: 668 - 650.5, duration: 0.5, ease: "power2.inOut" }, fanT + 4 * F);
        tl.to("#ph-pos", { scale: 0.565, rotation: -2, duration: 0.5, ease: "back.inOut(1.2)" }, fanT + 4 * F);
        tl.to("#ph", { rotationY: 0, rotationX: 0, duration: 0.5, ease: "power2.inOut" }, fanT + 4 * F);
        tl.to("#w1", { rotationY: 0, rotationX: 0, duration: 0.5, ease: "power2.inOut" }, fanT);
        tl.to("#w2", { rotationY: 0, rotationX: 0, duration: 0.5, ease: "power2.inOut" }, fanT + 2 * F);

        // app cards fly out from behind the fan, 2 f apart, overshoot and settle
        apps.forEach((a, i) => {
          const sp = appSpec[i];
          const s = 5.56 + i * 2 * F;
          const dx = FAN.x - sp.x;
          const dy = FAN.y - sp.y;
          gsap.set(a, { transformOrigin: "50% 50%" });
          tl.fromTo(a, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, s);
          tl.fromTo(a, { x: dx * 0.85 }, { x: 0, duration: 0.46, ease: "power3.out" }, s);
          tl.fromTo(a, { y: dy * 0.85 }, { y: 0, duration: 0.46, ease: "power2.out" }, s);
          tl.fromTo(a, { scale: 0.3 }, { scale: AS * 1.08, duration: 0.26, ease: "power3.out" }, s);
          tl.to(a, { scale: AS, duration: 0.3, ease: "back.out(1.8)" }, s + 0.26);
          tl.fromTo(a, { rotation: sp.r + (i % 2 ? 28 : -28) }, { rotation: sp.r, duration: 0.6, ease: "back.out(1.6)" }, s);
          // float (alternating phase)
          tl.to(a.firstChild, { y: i % 2 ? 4 : -4, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 2 }, s + 0.5);
          // ripple on "software": cards pulse outward from the fan, 1 f apart by distance
          const dist = Math.hypot(dx, dy);
          const ps = 7.0 + (dist / 420) * 0.12;
          tl.to(a, { scale: AS * 1.04, duration: 0.1, ease: "power2.out" }, ps);
          tl.to(a, { scale: AS, duration: 0.3, ease: "back.out(2)" }, ps + 0.1);
        });
        // the fan floats while the cards land
        tl.to("#w1-flt", { y: -4, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 2 }, 5.8);
        tl.to("#w2-flt", { y: 4, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 2 }, 5.86);
        tl.to("#ph-flt", { y: -5, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 2 }, 5.9);
        // "software" punch: the fan pops, small camera nudge
        tl.to("#ph-flt", { scale: 1.06, duration: 0.1, ease: "power2.out" }, 6.98);
        tl.to("#ph-flt", { scale: 1, duration: 0.34, ease: "back.out(2)" }, 7.08);
        tl.fromTo("#punch", { scale: 1 }, { scale: 1.004, duration: 0.16, ease: "power2.out", immediateRender: false }, 7.0);
        tl.to("#punch", { scale: 1, duration: 0.5, ease: "sine.inOut" }, 7.16);

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
</html>
