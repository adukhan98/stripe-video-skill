<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v02 rea</title>
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-background);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--brand-background);
        font-family: var(--font-heading);
        color: var(--brand-text);
      }

      /* ---------- shared v2 background: paper + 60px grid + vignette ---------- */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--brand-background);
        overflow: hidden;
      }
      #grid {
        position: absolute;
        left: -120px;
        top: -120px;
        width: 1320px;
        height: 2160px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.055) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(90, 80, 72, 0.22) 100%);
      }

      /* ---------- camera ---------- */
      #cam,
      #punch,
      #title {
        position: absolute;
        inset: 0;
      }

      /* ---------- kinetic type (v2: Inter Tight, accent = colour, no italics) ---------- */
      .line {
        position: absolute;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 0.88;
        letter-spacing: -0.03em;
      }
      .bl {
        display: block;
        width: 0;
        height: 0;
        align-self: baseline;
      }
      .w {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      .sup {
        font-family: "Inter Tight", sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--brand-text);
      }
      .con {
        font-weight: 700;
      }
      .hero {
        font-family: "Inter Tight", sans-serif;
        font-weight: 900;
        letter-spacing: -0.045em;
      }
      .ocean {
        color: var(--brand-primary);
      }
      .ink {
        color: var(--brand-text);
      }
      .gap-s {
        margin-left: 0.24em;
      }

      /* title collage */
      #t1 {
        font-size: 220px;
      }
      #t2 {
        font-size: 170px;
      }
      #t3 {
        font-size: 188px;
      }
      /* beat B rows */
      #r1 {
        font-size: 170px;
      }
      #r2 {
        font-size: 84px;
      }
      #r2 .hero {
        font-size: 130px;
      }
      #r3 {
        font-size: 92px;
      }
      #r3 .or {
        font-size: 72px;
      }

      /* ---------- label ---------- */
      #label {
        position: absolute;
        left: 92px;
        top: 318px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 50px;
        letter-spacing: -0.01em;
        color: var(--brand-muted);
        white-space: nowrap;
      }
      #label-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--brand-primary);
        box-shadow: 0 0 0 7px rgba(46, 156, 203, 0.18);
      }
      #label .lw {
        display: inline-block;
      }

      /* ---------- browser card ---------- */
      #br-pos {
        position: absolute;
        left: 90px;
        top: 432px;
        width: 820px;
        height: 680px;
        transform-origin: 0 0;
      }
      #br-float {
        position: absolute;
        inset: 0;
      }
      #browser {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        overflow: hidden;
        background: var(--brand-card);
        box-shadow:
          0 30px 50px -12px rgba(60, 50, 40, 0.3),
          0 50px 70px -10px rgba(40, 30, 20, 0.22);
        opacity: 0;
      }
      #chrome {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        height: 66px;
        background: #f1eeea;
        z-index: 2;
      }
      .dot {
        position: absolute;
        top: 26px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: #d6d0ca;
      }
      #url {
        position: absolute;
        left: 50%;
        top: 12px;
        width: 420px;
        margin-left: -210px;
        height: 42px;
        border-radius: 21px;
        background: #e4ded9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: var(--brand-muted);
      }
      #viewport {
        position: absolute;
        left: 0;
        right: 0;
        top: 66px;
        bottom: 0;
        overflow: hidden;
        background: #0d1117;
      }
      #page {
        position: absolute;
        left: 0;
        top: 0;
        width: 820px;
        height: 3948px;
        display: block;
      }
      .sheen {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.26) 45%,
          rgba(255, 255, 255, 0.06) 55%,
          transparent 65%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        opacity: 0;
        z-index: 3;
      }

      /* ---------- GitHub stat pill ---------- */
      #pill-pos {
        position: absolute;
        transform-origin: 100% 0%;
      }
      #pill {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 88px;
        padding: 0 38px 0 32px;
        border-radius: 44px;
        background: var(--brand-text);
        color: #ffffff;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 36px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 24px 40px -10px rgba(20, 20, 20, 0.38);
        opacity: 0;
      }
      #pill svg {
        width: 34px;
        height: 34px;
        display: block;
      }

      /* ---------- secondary speaker card ---------- */
      #spk-pos {
        position: absolute;
        left: 340px;
        top: 972px;
        width: 600px;
        height: 418px;
        transform-origin: 0 0;
      }
      #spk-float {
        position: absolute;
        inset: 0;
      }
      #spk-card {
        position: absolute;
        inset: 0;
        border-radius: 30px;
        overflow: hidden;
        background: #1b1b1b;
        box-shadow:
          0 16px 0 -2px var(--brand-primary),
          0 50px 70px -10px rgba(40, 30, 20, 0.35);
        opacity: 0;
      }
      #vid-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 30px;
      }
      /* source 1080x1920 scaled to 610 wide, window ≈ 26.5%–65% of the source height:
         brow to chin fits the card (eyes ~41%, chin ~64%); face centred horizontally */
      #speaker {
        position: absolute;
        left: -5px;
        top: -287px;
        width: 610px;
        height: 1084px;
        object-fit: cover;
      }

      /* ---------- tool pills ---------- */
      .pw {
        position: absolute;
      }
      .tpill {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 86px;
        padding: 0 36px 0 28px;
        border-radius: 43px;
        background: var(--brand-text);
        color: #ffffff;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 38px;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 24px 40px -10px rgba(20, 20, 20, 0.38);
      }
      .tpill svg {
        width: 34px;
        height: 34px;
        display: block;
      }

      /* ---------- dotted paths ---------- */
      #paths {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }

      /* ---------- agent puck (same build as reel-03 v02_skills, scaled to 210 px) ---------- */
      #puck-pos {
        position: absolute;
        left: 435px;
        top: 1230px;
        width: 210px;
        height: 210px;
      }
      #puck-float,
      #puck-bob,
      #puck {
        position: absolute;
        inset: 0;
      }
      #puck-glow {
        position: absolute;
        left: -70px;
        top: -70px;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(46, 156, 203, 0.5) 0%,
          rgba(46, 156, 203, 0.2) 40%,
          rgba(46, 156, 203, 0) 64%
        );
        opacity: 0;
      }
      #puck-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow:
          0 0 0 7px var(--brand-primary),
          0 0 22px 6px rgba(46, 156, 203, 0.45);
        opacity: 0;
      }
      #puck-disc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 26%, #3d3d3d 0%, #1d1d1d 42%, #141414 72%);
        box-shadow:
          0 16px 26px -8px rgba(40, 30, 20, 0.5),
          inset 0 -6px 13px rgba(0, 0, 0, 0.45);
      }
      #visor {
        position: absolute;
        left: 41px;
        top: 74px;
        width: 128px;
        height: 64px;
        border-radius: 32px;
        background: linear-gradient(180deg, #070707 0%, #1f1f1f 100%);
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.7),
          0 1px 0 rgba(255, 255, 255, 0.09);
      }
      .eye {
        position: absolute;
        top: 21px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--brand-primary);
        opacity: 0.32;
      }
      #eye-l {
        left: 29px;
      }
      #eye-r {
        left: 77px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.866"
    >
      <div id="bg">
        <div id="grid"></div>
        <div id="vignette"></div>
      </div>

      <div id="cam">
        <div id="punch">
          <!-- dotted paths (behind everything in beat B) -->
          <svg id="paths" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
                <path id="mp1" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" />
              </mask>
              <mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
                <path id="mp2" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" />
              </mask>
              <mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
                <path id="mp3" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" />
              </mask>
            </defs>
            <path id="tp1" class="trail" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" mask="url(#m1)" />
            <path id="tp2" class="trail" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" mask="url(#m2)" />
            <path id="tp3" class="trail" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" mask="url(#m3)" />
          </svg>

          <!-- real repo page in a tilted browser card -->
          <div id="br-pos">
            <div id="br-float">
              <div id="browser">
                <div id="chrome">
                  <span class="dot" style="left: 28px"></span>
                  <span class="dot" style="left: 54px"></span>
                  <span class="dot" style="left: 80px"></span>
                  <div id="url">github.com/morluto/rea</div>
                </div>
                <div id="viewport">
                  <img id="page" src="assets/rea_repo.png" alt="" />
                </div>
                <div id="br-sheen" class="sheen"></div>
              </div>
            </div>
          </div>

          <!-- small Inter label -->
          <div id="label">
            <span id="label-dot"></span>
            <span class="lw" id="lw1">open-source</span>
            <span class="lw" id="lw2">repo</span>
          </div>

          <!-- secondary speaker card, tucked over the browser card's lower-right corner -->
          <div id="spk-pos">
            <div id="spk-float">
              <div id="spk-card">
                <div id="vid-wrap">
                  <video
                    id="speaker"
                    class="clip"
                    src="assets/speaker.mp4"
                    muted
                    playsinline
                    data-start="0"
                    data-duration="3.9"
                    data-track-index="1"
                  ></video>
                </div>
                <div id="spk-sheen" class="sheen" style="border-radius: 30px"></div>
              </div>
            </div>
          </div>

          <!-- stat pill -->
          <div id="pill-pos">
            <div id="pill-float">
              <div id="pill">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="#ffffff"
                    d="M12 2.2l2.95 6.2 6.8.85-4.98 4.7 1.27 6.75L12 17.4l-6.04 3.3 1.27-6.75-4.98-4.7 6.8-.85z"
                  />
                </svg>
                <span>100.8k on GitHub</span>
              </div>
            </div>
          </div>

          <!-- title collage: Reverse / Engineer / Anything. -->
          <div id="title">
            <div id="t1" class="line hero ocean" data-x="84" data-base="486">
              <span class="bl"></span>
              <span class="w" data-t="2.06" data-hero="1" data-origin="20% 85%" data-peak="1.06">Reverse</span>
            </div>
            <div id="t2" class="line hero ink" data-right="928" data-base="650">
              <span class="bl"></span>
              <span class="w" data-t="2.48" data-pop="1" data-origin="60% 85%">Engineer</span>
            </div>
            <div id="t3" class="line hero ink" data-x="84" data-base="838">
              <span class="bl"></span>
              <span class="w" data-t="3.00" data-hero="1" data-origin="35% 85%" data-peak="1.035">Anything.</span>
            </div>
          </div>

          <!-- beat B rows: Codex / or Claude Code / or any coding agent -->
          <div id="r1" class="line hero ocean" data-x="76" data-base="786">
            <span class="bl"></span>
            <span class="w" data-t="3.92" data-hero="1" data-origin="25% 85%" data-peak="1.08">Codex</span>
          </div>
          <div id="r2" class="line sup" data-right="946" data-base="922">
            <span class="bl"></span>
            <span class="w con" data-t="4.28">or</span>
            <span class="w hero ink gap-s" data-t="4.44" data-accent="1">Claude</span>
            <span class="w hero ink" style="margin-left: 0.22em" data-t="4.60" data-accent="1">Code</span>
          </div>
          <div id="r3" class="line sup" data-x="80" data-base="1034">
            <span class="bl"></span>
            <span class="w or con" data-t="4.92">or</span>
            <span class="w gap-s" data-t="5.24">any</span>
            <span class="w gap-s" data-t="5.54">coding</span>
            <span class="w gap-s" data-t="5.90" data-pop="1">agent</span>
          </div>

          <!-- tool pills (plain Inter text, generic prompt glyph, no logos) -->
          <div id="pw1" class="pw" data-cx="200" data-cy="1104" data-rot="-3">
            <div class="tpill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="#2E9CCB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M12.5 18h7" fill="none" stroke="#2E9CCB" stroke-width="2.6" stroke-linecap="round" /></svg><span>Codex</span></div>
          </div>
          <div id="pw2" class="pw" data-cx="770" data-cy="1100" data-rot="2.5">
            <div class="tpill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="#2E9CCB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M12.5 18h7" fill="none" stroke="#2E9CCB" stroke-width="2.6" stroke-linecap="round" /></svg><span>Claude Code</span></div>
          </div>
          <div id="pw3" class="pw" data-cx="532" data-cy="1196" data-rot="-1">
            <div class="tpill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="#2E9CCB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M12.5 18h7" fill="none" stroke="#2E9CCB" stroke-width="2.6" stroke-linecap="round" /></svg><span>any coding agent</span></div>
          </div>

          <!-- agent puck (above the pills so they slide under it) -->
          <div id="puck-pos">
            <div id="puck-float">
              <div id="puck-bob">
                <div id="puck">
                  <div id="puck-glow"></div>
                  <div id="puck-ring"></div>
                  <div id="puck-disc">
                    <div id="visor">
                      <div id="eye-l" class="eye"></div>
                      <div id="eye-r" class="eye"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const fontSpecs = ['900 100px "Inter Tight"', '800 100px "Inter Tight"', '700 100px "Inter Tight"', '500 40px "Inter"', '600 40px "Inter"'];
        await Promise.all(fontSpecs.map((f) => document.fonts.load(f)));
        await document.fonts.ready;
        for (const f of fontSpecs) {
          if (!document.fonts.check(f)) throw new Error("brand font missing: " + f);
        }
        const pageImg = document.getElementById("page");
        if (!pageImg.complete) {
          await new Promise((res) => {
            pageImg.addEventListener("load", res, { once: true });
            pageImg.addEventListener("error", res, { once: true });
          });
        }
        gsap.registerPlugin(MotionPathPlugin);

        const D = 6.866;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        // ---- place each line by its baseline (deterministic layout, measured once) ----
        for (const line of $$(".line")) {
          const bl = line.querySelector(".bl");
          line.style.top = "0px";
          line.style.left = "0px";
          const baseOff = bl.offsetTop;
          line.style.top = parseFloat(line.dataset.base) - baseOff + "px";
          if (line.dataset.right) {
            line.style.left = parseFloat(line.dataset.right) - line.offsetWidth + "px";
          } else {
            line.style.left = line.dataset.x + "px";
          }
        }

        // ---- stat pill: right-aligned at x 946 ----
        const pillPos = $("#pill-pos");
        const pillW = $("#pill").offsetWidth;
        pillPos.style.left = 946 - pillW + "px";
        pillPos.style.top = "526px";

        // ---- tool pills: centred on (cx, cy) ----
        const PUCK = { x: 540, y: 1343 };
        const pws = $$(".pw");
        const routes = [];
        pws.forEach((pw, i) => {
          const w = pw.firstElementChild.offsetWidth;
          const h = pw.firstElementChild.offsetHeight;
          const cx = parseFloat(pw.dataset.cx);
          const cy = parseFloat(pw.dataset.cy);
          pw.style.left = cx - w / 2 + "px";
          pw.style.top = cy - h / 2 + "px";
          gsap.set(pw, { transformOrigin: "50% 50%", rotation: parseFloat(pw.dataset.rot) });
          routes.push({ cx, cy });
        });
        // curved routes into the puck (absolute control points), arcing outward then in
        const curves = [
          [[200, 1104], [150, 1250], [330, 1364], [470, 1344]],
          [[770, 1100], [900, 1238], [760, 1376], [612, 1344]],
          [[532, 1196], [430, 1236], [420, 1310], [528, 1328]],
        ];
        curves.forEach((c, i) => {
          const d = `M${c[0][0]} ${c[0][1]} C${c[1][0]} ${c[1][1]} ${c[2][0]} ${c[2][1]} ${c[3][0]} ${c[3][1]}`;
          $("#tp" + (i + 1)).setAttribute("d", d);
          $("#mp" + (i + 1)).setAttribute("d", d);
          const o = c[0];
          routes[i].rel = `M0 0 C${c[1][0] - o[0]} ${c[1][1] - o[1]} ${c[2][0] - o[0]} ${c[2][1] - o[1]} ${c[3][0] - o[0]} ${c[3][1] - o[1]}`;
        });

        // ================= timeline =================
        const tl = gsap.timeline({ paused: true });

        // background drift (continuous, linear on purpose) + slow camera push
        tl.fromTo("#grid", { x: 0, y: 0 }, { x: -20, y: -12, duration: D, ease: "none" }, 0);
        tl.fromTo("#cam", { scale: 1, transformOrigin: "510px 880px" }, { scale: 1.012, duration: D, ease: "none" }, 0);

        // ---- word entrances (contact frame on the spoken word) ----
        function wordIn(w) {
          const t = parseFloat(w.dataset.t);
          if (w.dataset.hero) {
            const s = Math.max(0, t - 0.2);
            const peak = parseFloat(w.dataset.peak || "1.08");
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 80%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 90, scale: 0.55, rotation: -7, filter: "blur(8px)" },
              { opacity: 1, y: -8, scale: peak, rotation: 1.5, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
              s,
            );
            tl.to(w, { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.6)" }, s + 0.2);
          } else if (w.dataset.pop) {
            const s = Math.max(0, t - 0.16);
            gsap.set(w, { transformOrigin: w.dataset.origin || "50% 85%" });
            tl.fromTo(
              w,
              { opacity: 0, y: 60, scale: 0.72, rotation: -5, filter: "blur(6px)" },
              { opacity: 1, y: -5, scale: 1.06, rotation: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" },
              s,
