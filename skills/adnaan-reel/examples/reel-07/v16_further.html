      // ================================================================================================

      function gauge(M, P, T) {
        const { tl, F } = P;
        const X0 = 680, X1 = 840, Y0 = 340, Y1 = 1420, R = 70, CX = 760;
        const arc = (cx, cy, a0, a1, n = 6) => Array.from({ length: n + 1 }, (_, k) => {
          const a = ((a0 + (a1 - a0) * (k / n)) * Math.PI) / 180;
          return [cx + Math.cos(a) * R, cy + Math.sin(a) * R];
        });
        const out = {};
        // 1. outline: two halves from the bottom centre UP to the top centre, drawn at the same time (seed 901 / 903)
        const LEFT = [[CX, Y1], ...arc(X0 + R, Y1 - R, 90, 180), [X0, Y0 + R + 470], ...arc(X0 + R, Y0 + R, 180, 270), [CX, Y0]];
        const RIGHT = [[CX, Y1], ...arc(X1 - R, Y1 - R, 90, 0), [X1, Y0 + R + 470], ...arc(X1 - R, Y0 + R, 0, -90), [CX, Y0]];
        const OUT_DUR = 0.52;
        out.left = M.line(LEFT, T.outline, { color: "ink", width: 11, amp: 2.4, dur: OUT_DUR, seed: 901 });
        out.right = M.line(RIGHT, T.outline, { color: "ink", width: 11, amp: 2.4, dur: OUT_DUR, seed: 903 });
        if (T.outline > 0) {
          // the hand accelerates up the long straight and eases into the top (sine.inOut overrides the default power2.out)
          [...out.left.paths, ...out.right.paths].forEach((p) => {
            const len = p.getTotalLength() + 2;
            tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: OUT_DUR, ease: "sine.inOut", immediateRender: false }, T.outline);
          });
        }
        // 2. ticks on the LEFT edge (x 650→680), each ticking on 1 f after the pen passes its height (seeds 931–935)
        const HALF = 10 + (Math.PI / 2) * R + (Y1 - Y0 - 2 * R) + (Math.PI / 2) * R + 10;
        out.ticks = [1240, 1060, 880, 700, 520].map((y, i) => {
          const p = (10 + (Math.PI / 2) * R + (Y1 - R - y)) / HALF;              // fraction of the half-stroke at height y
          const u = Math.acos(1 - 2 * p) / Math.PI;                                   // invert sine.inOut
          const at = T.outline > 0 ? T.outline + u * OUT_DUR + F : T.outline;
          return M.line([[650, y + 1], [681, y]], at, { color: "ink", width: 9, amp: 0.8, dur: 0.07, seed: 931 + i });
        });
        out.tickTimes = out.ticks.map((_, i) => T.outline + (Math.acos(1 - 2 * ((10 + (Math.PI / 2) * R + (Y1 - R - [1240, 1060, 880, 700, 520][i])) / HALF)) / Math.PI) * OUT_DUR + F);
        // 3. TOP label: "so much more" (Caveat ink 92 px), right end at x 646, centred y ~380
        out.top = M.note("so much more", 0, 340, T.notes, { size: 92, rot: -4, color: "ink", cps: 19 });
        out.top.style.left = 646 - out.top.offsetWidth + "px";
        // 4. spark above the bar top (seeds 905–907): three red flicks fanning up, top ≥ y 300
        const SP = [[[CX, 330], [CX + 1, 303]], [[CX - 24, 333], [CX - 44, 312]], [[CX + 24, 333], [CX + 44, 312]]];
        out.spark = SP.map((pts, i) => M.line(pts, T.spark > 0 ? T.spark + i * 2 * F : T.spark, { width: 9, amp: 0.8, dur: 0.07, seed: 905 + i }));
        // 5. BOTTOM fill: red marker hatch of the bar polygon y 1340–1420 = "what most of us ask it for"
        //    two quick passes: seed 911 (−32°) then seed 910 (+38°, cross-hatch). v16 floods with 912–919.
        out.hatchPoly = [[X0, 1340], ...arc(X0 + R, Y1 - R, 180, 90), ...arc(X1 - R, Y1 - R, 90, 0), [X1, 1340]];
        out.hatch1 = M.hatch(out.hatchPoly, T.hatch1, { seed: 911, spacing: 19, angle: -32, dur: 0.2 });
        out.hatch2 = M.hatch(out.hatchPoly, T.hatch2, { seed: 910, spacing: 24, angle: 38, dur: 0.18, width: 11 });
        // 6. red-dark note "ask it for" left of the hatch (84 px), right end at x 650, centred y ~1380
        out.ask = M.note("ask it for", 0, 1338, T.askNote, { size: 84, rot: -4, cps: 20 });
        out.ask.style.left = 650 - out.ask.offsetWidth + "px";
        // 7. GAP brace: red curly brace on the RIGHT of the bar, x 860–920, drawn UP from y 1330 to y 360 (seeds 921 / 923)
        const NX = 920, NY = 845, SX = 889;
        const BR_LO = [[860, 1330], [877, 1325], [886, 1310], [SX, 1286], [SX, 1080], [SX, 905], [893, 872], [905, 854], [NX, NY]];
        const BR_HI = [[NX, NY], [905, 836], [893, 818], [SX, 786], [SX, 600], [SX, 404], [886, 380], [877, 365], [860, 360]];
        out.braceLo = M.line(BR_LO, T.brace, { width: 11, amp: 1.6, dur: 0.24, seed: 921 });
        out.braceHi = M.line(BR_HI, T.brace > 0 ? T.brace + 0.24 + F : T.brace, { width: 11, amp: 1.6, dur: 0.24, seed: 923 });

      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);
        const { tl, D, F, $, $$ } = P;
        const NS = "http://www.w3.org/2000/svg";
        const gNode = (parent, id) => { const g = document.createElementNS(NS, "g"); if (id) g.setAttribute("id", id); parent.appendChild(g); return g; };

        // ================================================================ THE GAUGE (SHARED.md recurring drawing 2)
        // fixed geometry + seeds; `at` = 0 → already drawn (v16 opens on v15's final state)
        const G = { x0: 680, x1: 840, y0: 340, y1: 1420, r: 70, ticks: [520, 700, 880, 1060, 1240], sliver: 1340 };
        // rounded-rect outline as a polygon (clockwise from the top-left straight edge)
        function rrPoly({ x0, y0, x1, y1, r }, n = 7) {
          const pts = [], arc = (cx, cy, a0) => { for (let k = 0; k <= n; k++) { const a = a0 + (k / n) * (Math.PI / 2); pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
          arc(x1 - r, y0 + r, -Math.PI / 2); arc(x1 - r, y1 - r, 0); arc(x0 + r, y1 - r, Math.PI / 2); arc(x0 + r, y0 + r, Math.PI);
          return pts;
        }
        // clip a polygon to the horizontal band ya ≤ y ≤ yb (Sutherland–Hodgman, two planes)
        function clipBand(poly, ya, yb) {
          const cut = (pts, inside, yy) => {
            const out = [];
            pts.forEach((p, i) => {
              const q = pts[(i + 1) % pts.length], pi = inside(p), qi = inside(q);
              if (pi) out.push(p);
              if (pi !== qi) { const t = (yy - p[1]) / (q[1] - p[1]); out.push([p[0] + (q[0] - p[0]) * t, yy]); }
            });
            return out;
          };
          return cut(cut(poly, (p) => p[1] >= ya, ya), (p) => p[1] <= yb, yb);
        }
        const BAR = rrPoly(G);
        // v15's final state, already drawn at frame 0 (every part at 0 = drawn, boiling)
        const GG = gauge(M, P, { outline: 0, notes: 0, spark: 0, hatch1: 0, hatch2: 0, askNote: 0, brace: 0 });

        // ================================================================ BEAT A — "… emails and quick questions"

        const envG = gNode(M.layer, "env"), flapG = gNode(envG, "flap");

        M.line([[EV.x0, EV.y0], [EV.x1, EV.y0 - 2], [EV.x1 + 1, EV.y1], [EV.x0 - 1, EV.y1 + 1], [EV.x0, EV.y0]], 2.20, { parent: envG, color: "ink", width: 11, amp: 1.8, dur: 0.28, seed: 1601 });
        M.line([[EV.x0 + 2, EV.y0 + 2], [230, 1005], [EV.x1 - 2, EV.y0]], 2.50, { parent: flapG, color: "ink", width: 11, amp: 1.2, dur: 0.14, seed: 1602 });
        M.line([[EV.x0 + 4, EV.y1 - 2], [186, 996]], 2.65, { parent: envG, color: "ink", width: 9, amp: 0.8, dur: 0.06, seed: 1603 });
        M.line([[EV.x1 - 3, EV.y1 - 3], [274, 996]], 2.72, { parent: envG, color: "ink", width: 9, amp: 0.8, dur: 0.06, seed: 1604 });
        gsap.set(flapG, { svgOrigin: "230 904" });
        tl.to(flapG, { scaleY: 1.08, duration: 2 * F, ease: "power1.out" }, 2.76);                // anticipation: presses down

        // ---- speech bubble with a red "?" pops beside it on "quick" and wobbles
        const bubPos = gNode(M.layer, "bubPos"), bubG = gNode(bubPos, "bub");
        const BC = [505, 960], K = 1.25;
        const q = (pts) => pts.map(([dx, dy]) => [BC[0] + dx * K, BC[1] + dy * K]);
        M.circle(BC[0], BC[1], 105, 74, 2.66, { parent: bubG, color: "ink", width: 11, dur: 0.22, turns: 1.02, tilt: -3, seed: 1611 });

        M.line(q([[0, 36], [1, 40]]), 3.10, { parent: qG, width: 14, amp: 0.2, dur: 0.04, seed: 1614 });
        gsap.set(bubG, { svgOrigin: BC.join(" ") });
        tl.fromTo(bubG, { scale: 0.55, rotation: -10 }, { scale: 1.1, rotation: 3, duration: 5 * F, ease: "power3.out", immediateRender: false }, 2.66);

        tl.to(envS, { y: 280, duration: 0.5, ease: "power2.in" }, 3.60);
        tl.to(envS, { scale: 0.72, rotation: 4, duration: 0.5, ease: "power2.inOut" }, 3.60);
        tl.to(envS, { scaleX: 0.78, scaleY: 0.66, duration: 2 * F, ease: "power2.out" }, 4.10);         // lands: squash
        tl.to(envS, { scaleX: 0.72, scaleY: 0.72, duration: 8 * F, ease: "back.out(2)" }, 4.10 + 2 * F);
        gsap.set(bubPos, { svgOrigin: BC.join(" ") });
        tl.to(bubPos, { y: -10, duration: 3 * F, ease: "power2.in" }, 3.56);
        tl.to(bubPos, { x: 15, duration: 0.5, ease: "power2.out" }, 3.66);
        tl.to(bubPos, { y: 285, duration: 0.5, ease: "power2.in" }, 3.66);
        tl.to(bubPos, { scale: 0.7, rotation: 5, duration: 0.5, ease: "power2.inOut" }, 3.66);
        tl.to(bubPos, { scaleX: 0.76, scaleY: 0.64, duration: 2 * F, ease: "power2.out" }, 4.16);
        tl.to(bubPos, { scaleX: 0.7, scaleY: 0.7, duration: 8 * F, ease: "back.out(2)" }, 4.16 + 2 * F);

        // ================================================================ HERO — "so much further"
        // anticipation from "get": the bar squashes down (loading), the sliver trembles, the doodles lean back
        gsap.set(gaugeG, { svgOrigin: "760 1420" });
        tl.to(gaugeG, { scaleY: 0.985, scaleX: 1.012, duration: 0.5, ease: "power2.in" }, 4.36);
        tl.to(gaugeG, { scaleY: 1.014, scaleX: 0.994, duration: 0.14, ease: "power3.out" }, 4.88);
        tl.to(gaugeG, { scaleY: 1, scaleX: 1, duration: 0.4, ease: "back.out(2.4)" }, 5.04);
        for (let k = 0; k < 8; k++) tl.to(sliver, { x: k % 2 ? -2 : 2, duration: 2 * F, ease: "none" }, 4.40 + k * 2 * F + 0.12);
        tl.to(sliver, { x: 0, duration: 2 * F, ease: "none" }, 4.40 + 16 * F + 0.12);
        tl.to([envS, bubPos], { rotation: "-=5", duration: 0.4, ease: "power2.inOut" }, 4.40);

        // the brace un-draws upward exactly as the arrow's tip rises through it: the gap turns into the arrow
        const AT = 4.88, AD = 0.19;                                   // arrow shaft 4.88 → ~5.04 (power1.in), head flick on "further"
        const arrow = M.arrow(892, 1400, 892, 382, AT, { bend: 0.02, head: 40, dur: AD, width: 12, seed: 1701 });
        const shaft = arrow.paths[0], shaftDur = AD * (1 / 1.35) * 1.15;
        {
          const len = shaft.getTotalLength() + 2;
          tl.fromTo(shaft, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: shaftDur, ease: "power1.in", immediateRender: false }, AT);
        }
        const tipAt = (y) => AT + shaftDur * Math.sqrt(Math.min(1, (1400 - y) / 1018));   // when the tip passes height y
        // v15's brace strokes run bottom → top (braceLo 1330 → nib, braceHi nib → 360): un-draw each from its START
        const undraw = (shape, t0, t1) => shape.paths.forEach((p) => {
          const len = p.getTotalLength() + 2;
          tl.fromTo(p, { strokeDashoffset: 0 }, { strokeDashoffset: -len, duration: t1 - t0, ease: "none", immediateRender: false }, t0);
        });
        undraw(GG.braceLo, tipAt(1330), tipAt(845));
        undraw(GG.braceHi, tipAt(845), tipAt(382));
        tl.set([GG.braceLo.g, GG.braceHi.g], { opacity: 0 }, tipAt(382) + F);

        // the red hatch floods upward through the whole bar: 8 stacked passes (seeds 912–919), each chasing the tip
        const step = (G.sliver - 360) / 8;
        const flood = [];
        for (let i = 0; i < 8; i++) {
          const yb = G.sliver - i * step + 3, ya = Math.max(360, G.sliver - (i + 1) * step);
          const t = Math.max(AT + 0.03, tipAt(ya) + 0.03);
          flood.push(M.hatch(clipBand(BAR, ya, yb), t, { parent: gaugeG, seed: 912 + i, spacing: 19, angle: -32, dur: 0.09, boil: true }));
        }

        // hero beat: punch + shake on "further"; the doodles hop on the hit
        P.punch(5.11, { scale: 1.008, origin: "640px 700px", dur: 0.3 });

        tl.to([envS, bubPos], { y: "-=22", duration: 0.12, ease: "power2.out" }, 5.11);
        tl.to([envS, bubPos], { y: "+=22", rotation: "+=5", duration: 0.36, ease: "bounce.out" }, 5.23);

        // "further" rides up a few px with the flood, then lands
        tl.to("#furtherLine", { y: -16, duration: 0.3, ease: "power2.out" }, 5.0);
        tl.to("#furtherLine", { y: -12, duration: 0.3, ease: "back.out(2)" }, 5.3);

        // "so much more" gets a red check
        M.check(146, 392, 80, 5.28, { seed: 1721 });
