<!doctype html>
<!-- v06_three - Mode A (split): footage in the top half, paper world below; the three marker-circled numbers pop out from behind the band.
     Runtime = paper.js + marker.js; bespoke: three numbers + loops, book doodle. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v06_three</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
    <style>
      @font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Caveat"; src: url("fonts/Caveat-Variable.ttf") format("truetype"); font-weight: 400 700; font-style: normal; font-display: block; }
      /* the three numbers: Inter Tight 900, ink, centred on their landing spot (set in the script) */
      .num { position: absolute; width: 220px; height: 220px; margin: -110px 0 0 -110px; text-align: center;
        font-family: var(--font-heading); font-weight: 900; font-size: 196px; line-height: 220px; letter-spacing: -0.04em;
        color: var(--brand-text); opacity: 0; will-change: transform; }
    </style>
  </head>
  <body data-face="0.41">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="2.8167">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <!-- the numbers sit BEHIND the footage band and pop out from underneath -->
        <div id="n1" class="num" data-cx="220" data-cy="1345">1</div>
        <div id="n2" class="num" data-cx="480" data-cy="1345">2</div>
        <div id="n3" class="num" data-cx="740" data-cy="1345">3</div>

        <!-- Mode A: footage edge to edge in the top half, paper world below -->
        <div class="spk split" data-h="960">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="2.8167" data-track-index="1"></video></div>
          </div>
        </div>

        <!-- phrase 1 in the paper half -->
        <div id="L1a" class="line sup" data-x="100" data-base="1085" data-size="78" data-exit="1.38">
          <span class="w" data-t="0.01">you</span><span class="w gap-s" data-t="0.21">should</span>
          <span id="read" class="w hero gap-s" style="font-size: 1.6em" data-t="0.33" data-hero data-peak="1.06">read</span>
        </div>
        <div id="L1b" class="line sup" data-x="100" data-base="1205" data-size="84" data-exit="1.38" data-exit-lag="1">
          <span class="w" data-t="0.47">the</span>
          <span id="whole" class="w hero gap-s" style="font-size: 1.46em" data-t="0.61" data-pop>whole</span><span id="thing" class="w hero gap-s" style="font-size: 1.46em" data-t="0.87" data-pop>thing</span>
        </div>

        <!-- phrase 2: three (red) lands on key -->
        <div id="L2a" class="line hero" data-x="100" data-base="1080" data-size="150">
          <span id="three" class="w ocean" data-t="1.95" data-hero data-peak="1.07">three</span><span id="key" class="w gap-s" style="font-size: 0.84em" data-t="2.07" data-pop>key</span>
        </div>
        <div id="L2b" class="line hero" data-right="880" data-base="1190" data-size="130">
          <span id="take" class="w" data-t="2.29" data-pop>takeaways</span>
        </div>

      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);
        const { tl, D, F, $, $$ } = P;
        const NS = "http://www.w3.org/2000/svg";

        // ---- position the numbers (centre), keep them hidden until their pop
        const NUMS = [["#n1", 1.62, 1.70, 6101, -14, 0], ["#n2", 1.72, 1.90, 6202, 10, 1], ["#n3", 1.82, 2.10, 6303, -8, 2]];
        const LOOP_R = 104;
        NUMS.forEach(([sel, tp, tc, seed, tilt], i) => {
          const el = $(sel), cx = +el.dataset.cx, cy = +el.dataset.cy;
          el.style.left = cx + "px"; el.style.top = cy + "px";
          gsap.set(el, { transformOrigin: "50% 55%" });
          // pops out from behind the footage band: starts tucked at (480, 880) under its bottom edge, arcs down to its slot
          const fromX = 480 - cx, fromY = 880 - cy;
          tl.set(el, { opacity: 0 }, 0);
          tl.set(el, { opacity: 1, x: fromX, y: fromY, scale: 0.6, rotation: tilt * 2 }, tp - 0.12);
          // anticipation: tucks up 14 px for 3 f, then springs out
          tl.to(el, { y: fromY - 14, scale: 0.46, duration: 3 * F, ease: "power2.in" }, tp - 0.12);
          tl.to(el, { x: 0, duration: 0.3, ease: "power3.out" }, tp - 0.06);
          tl.to(el, { y: 0, duration: 0.3, ease: "back.out(1.45)" }, tp - 0.06);
          tl.to(el, { scale: 1.12, rotation: -tilt * 0.4, duration: 0.2, ease: "power3.out" }, tp - 0.06);
          tl.to(el, { scale: 1, rotation: 0, duration: 0.28, ease: "back.out(2)" }, tp + 0.14);
          // loop drawn round it, then the number pops under the pen
          M.circle(cx, cy + 2, LOOP_R, LOOP_R, tc, { width: 12, dur: 0.34, turns: 1.1, tilt: -5 + i * 3, seed });
          tl.to(el, { scale: 1.07, duration: 0.1, ease: "power2.out" }, tc + 0.3);
          tl.to(el, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, tc + 0.4);
          // alive in the hold: slow sway, staggered
          tl.to(el, { rotation: i % 2 ? 2.5 : -2.5, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, tc + 0.75 + i * 0.05);
        });

        // ---- HERO beat: impact on 'three' (digit 1 lands) = 4 f shake
        P.shake(1.64, 4);
        // ---- 'whole thing': quick red marker underline, below the descender of the g
        const lb = $("#L1b"), wh = $("#whole"), th = $("#thing");
        const ux0 = lb.offsetLeft + wh.offsetLeft + 8, ux1 = lb.offsetLeft + th.offsetLeft + th.offsetWidth - 8;
        const ul = M.underline(ux0, ux1, 1205 + 34, 0.74, { width: 11, dur: 0.26, seed: 7071 });
        M.erase(ul, 1.38, 0.12);

        // ---- doodle that acts out "read the whole thing": an open book in the lower zone, ink pages + red highlighter line,
        //      drawn 0.36-1.1, erased fast just before the numbers spring out
        const bx = 450, by = 1362;
        const book = [];
        book.push(M.line([[bx, by - 62], [bx - 80, by - 96], [bx - 190, by - 90], [bx - 196, by + 78], [bx - 86, by + 70], [bx, by + 104]], 0.22, { color: "ink", width: 11, dur: 0.34, seed: 8101 }));
        book.push(M.line([[bx, by - 62], [bx + 80, by - 96], [bx + 190, by - 90], [bx + 196, by + 78], [bx + 86, by + 70], [bx, by + 104]], 0.36, { color: "ink", width: 11, dur: 0.34, seed: 8102 }));
        book.push(M.line([[bx, by - 62], [bx + 2, by + 104]], 0.52, { color: "ink", width: 11, dur: 0.14, seed: 8103 }));
        [[-150, -36, -34], [-150, 8, -46], [-150, 52, -76]].forEach(([x0, y0, x1], i) =>
          book.push(M.line([[bx + x0, by + y0], [bx - 30 + (x1 + 150) * 0.2 - 18, by + y0 - 4]], 0.58 + i * 0.07, { color: "ink", width: 9, dur: 0.14, amp: 2, seed: 8110 + i })));
        [[34, -36], [34, 8]].forEach(([x0, y0], i) =>
          book.push(M.line([[bx + x0, by + y0 - 2], [bx + 150, by + y0 + 2]], 0.62 + i * 0.07, { color: "ink", width: 9, dur: 0.14, amp: 2, seed: 8120 + i })));
        book.push(M.line([[bx + 30, by + 54], [bx + 154, by + 50]], 0.78, { color: "marker", width: 15, dur: 0.2, amp: 2, seed: 8131 }));  // the highlighter on the last line
        const bookG = book.map((b) => b.g);
        tl.fromTo(bookG, { y: 0 }, { y: -7, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.78);
        book.forEach((b) => M.erase(b, 1.36, 0.12));

        // ---- sparkles twinkle off the '3' and the '1' once they are circled
        const sparkle = (cx, cy, dirDeg, at, seed) => {
          for (let k = -1; k <= 1; k++) {
            const a = ((dirDeg + k * 28) * Math.PI) / 180, r0 = LOOP_R + 22, r1 = LOOP_R + 46 - Math.abs(k) * 6;
            M.line([[cx + Math.cos(a) * r0, cy + Math.sin(a) * r0], [cx + Math.cos(a) * r1, cy + Math.sin(a) * r1]], at + (k + 1) * 2 * F, { color: "marker", width: 10, dur: 0.12, amp: 1.4, seed: seed + k * 13 });
          }
        };
        sparkle(740, 1345, 10, 2.38, 9100);
        sparkle(220, 1345, 150, 2.5, 9300);
      })();
    </script>
  </body>
</html>
