<!doctype html>
<!-- adnaan-reel scene starter: FULL-SCREEN SPEAKER — HE fills the frame edge to edge (no card, no tilt), kinetic
     words land low on his chest / the bottom third with the paper glow. The minimal beat: nothing else on screen
     unless the brief names ONE object. Use for the hook, verdict/opinion lines, the wrap-up, the CTA — 2–4 per reel,
     alternating with paper-world scenes. (flashcheck knows this window is not paper: type "fullscreen" in slots.json.)
     Optional: add <div class="paper-strip"></div> before the words if the background behind the words is busy.
     Optional mid-scene version: start as a portrait card and call P.growFull("#spk", t) on the hero word. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v04_impossible</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
  </head>
  <body data-face="0.41">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="4.7167">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>

      <!-- full-screen speaker: the whole frame, slow push only -->
      <div id="spk" class="spk full" data-push="1.03">
        <div class="spk-card">
          <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="4.7167" data-track-index="1"></video></div>
        </div>
      </div>
      <!-- solid paper under the words (navy hoodie): slides up just before "nobody" -->
      <div class="paper-strip" id="strip" style="top:1195px;height:725px;bottom:auto;background:linear-gradient(180deg,rgba(228,222,217,0) 0px,rgba(228,222,217,1) 46px,rgba(228,222,217,1) 100%)"></div>

      <div id="cam"><div id="punch">
        <!-- phrase 1 -->
        <div class="line hero ink kin" id="l1" data-x="76" data-base="1266" data-size="100" data-fit="870">
          <span class="w" data-t="1.08" data-pop data-rise="40">nobody</span><span class="w gap-s" data-t="1.30" data-pop data-rise="40">told</span><span class="w gap-s" data-t="1.46" data-pop data-rise="40">him</span>
        </div>
        <div class="line hero ink kin" id="l2" data-right="932" data-base="1426" data-size="200" data-fit="860">
          <span class="w" id="imp" data-t="2.26" data-hero data-peak="1.03" data-rise="44"><span id="im">im</span><span id="po">possible.</span></span>
        </div>
        <!-- phrase 2 -->
        <div class="line hero ink kin" id="l3" data-x="76" data-base="1275" data-size="170" data-fit="880">
          <span class="w" data-t="2.797" data-pop data-rise="40" style="font-size:.6em">the</span><span class="w gap-s ocean" id="prob" data-t="3.057" data-hero data-peak="1.08">problem</span>
        </div>
        <div class="line sup ink kin" id="l4" data-right="900" data-base="1440" data-size="110" data-fit="880">
          <span class="w" data-t="3.757" data-pop data-rise="14">most</span><span class="w gap-s" data-t="3.897" data-pop data-rise="14">of</span><span class="w gap-s" data-t="4.057" data-pop data-rise="14">us</span><span class="w gap-s" data-t="4.237" data-pop data-rise="14">use</span><span class="w gap-s" data-t="4.517" data-pop data-rise="14" style="margin-left:.18em">AI.</span>
        </div>
      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);   // hand-drawn marker layer
        const { tl, D, F } = P;
        const $ = (s) => document.querySelector(s);
        const RED = getComputedStyle(document.documentElement).getPropertyValue("--brand-primary").trim();
        const fsOf = (el) => parseFloat(getComputedStyle(el).fontSize);
        // layout-space rect (transforms of the entrance animation do not matter): x from the line, baseline from data-base
        const ox = (el) => { let x = 0; for (let e = el; e && e.id !== "punch"; e = e.offsetParent) x += e.offsetLeft; return x; };

        // ---- solid paper strip slides up before the first word (a paper object, not a word)
        tl.fromTo("#strip", { y: 640 }, { y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.74);
        tl.set("#strip", { y: 640 }, 0);
        // ---- Mode C -> A: on the sentence boundary the footage shrinks to the top half (face centred); the paper strip then drops away
        // so the bottom half is real paper + grid for phrase 2.
        P.fullToSplit("#spk", 2.62, { h: 960 });
        tl.to("#strip", { y: 760, duration: 0.25, ease: "power2.in" }, 2.94);

        // ---- HERO BEAT: scribble-strike on "im" only, "possible" turns red, 1 % punch + impact
        const l2 = $("#l2"), fs2 = fsOf(l2), base2 = 1426;
        const imEl = $("#im"), xL = ox(imEl) , wIm = imEl.offsetWidth;
        const yc = base2 - fs2 * 0.34, hh = fs2 * 0.30;
        const pts = [];
        const xs0 = xL - 8, xs1 = xL + wIm + 10;
        for (let i = 0; i < 7; i++) {
          const up = i % 2 === 0;
          pts.push([i % 2 === 0 ? xs0 + (i / 6) * 8 : xs1 - (i / 6) * 8, up ? yc - hh : yc + hh * 0.9]);
        }
        const strike = M.line(pts, 2.30, { width: 15, dur: 0.16, amp: 3, until: 2.78 });
        tl.to(strike.g, { y: -60, opacity: 0, filter: "blur(8px)", duration: 4 * F, ease: "power2.in" }, 2.64);
        // phrase 1 leaves in 4 f (the cut removed 7 f of air): before "That's" 2.577, clear before "the" lands
        tl.to("#l1", { y: -60, opacity: 0, filter: "blur(8px)", duration: 4 * F, ease: "power2.in" }, 2.64);
        tl.to("#l2", { y: -60, opacity: 0, filter: "blur(8px)", duration: 4 * F, ease: "power2.in" }, 2.64);   // leaves with the word
        // "the" stays hidden until phrase 1 is gone (no overlapping frames); its pop then lands on 2.797
        const theEl = document.querySelector("#l3 .w");
        tl.set(theEl, { visibility: "hidden" }, 0);
        tl.set(theEl, { visibility: "visible" }, 2.78);
        const po = $("#po");
        tl.to(po, { color: RED, duration: 0.09, ease: "power2.out" }, 2.40);
        P.punch(2.42, { scale: 1.01, origin: "700px 1330px", dur: 0.16 });
        P.shake(2.42, 3);

        // ---- phrase 2: red wobbly underline under "problem" + tiny spark ticks at its right end
        const pl = $("#prob"), pb = 1275;
        const px0 = ox($("#l3")) + pl.offsetLeft, px1 = px0 + pl.offsetWidth;
        const ul = M.underline(px0 + 4, px1 - 4, pb + fsOf($("#l3")) * 0.27, 3.167, { width: 12, dur: 0.30 });
        const tcx = px1 + 22, tcy = 1176;
        const tk = [-78, -38, 2].map((deg) => { const r = deg * Math.PI / 180, c = Math.cos(r), n = Math.sin(r); return [[tcx + c * 30, tcy + n * 30], [tcx + c * 74, tcy + n * 74]]; });
        tk.forEach((q, i) => M.line(q, 3.267 + i * 0.04, { width: 10, dur: 0.1, amp: 0.8 }));

        // ---- alive to the cut: "problem" breathes, "AI." settles with a nudge
        gsap.set("#prob", { transformOrigin: "40% 85%" });
        tl.fromTo("#prob", { scale: 1 }, { scale: 1.015, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 3.517);
      })();
    </script>
  </body>
</html>
