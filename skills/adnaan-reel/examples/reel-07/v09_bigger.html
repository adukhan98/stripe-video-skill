<!doctype html>
<!-- v09_bigger - OPINION: portrait card + 'bigger' grows while a hand-drawn target grows 3x beside it; red arrow thunks in on 'goal'. Runtime = paper.js, drawing = marker.js. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>v09_bigger</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="paper.css" />
    <link rel="stylesheet" href="marker.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <script src="paper.js"></script>
    <script src="marker.js"></script>
    <style>
      @font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      @font-face { font-family: "Caveat"; src: url("fonts/Caveat-Variable.ttf") format("truetype"); font-weight: 400 700; font-style: normal; font-display: block; }
      .lt { display: inline-block; transform-origin: 50% 100%; }
    </style>
  </head>
  <body data-face="0.41">
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="3.3833">
      <div id="bg"><div id="grid"></div><div id="vignette"></div></div>
      <div id="cam"><div id="punch">

        <!-- Mode A: footage edge to edge in the top half; paper, type and the target own the bottom band -->
        <div class="spk split" data-h="960">
          <div class="spk-card">
            <div class="spk-vid"><video id="speaker" class="clip" src="assets/speaker.mp4" muted playsinline data-start="0" data-duration="3.3833" data-track-index="1"></video></div>
            <div class="spk-sheen"></div>
          </div>
        </div>

        <!-- phase A: the model can handle (exits in 5 f by ~1.03, before 'bigger' starts) -->
        <div id="L-i1" class="line sup kin" data-x="76" data-base="1180" data-size="100">
          <span class="w" data-t="0.05" data-rise="-22">the</span><span class="w gap-s" data-t="0.27" data-pop data-rise="-22">model</span>
        </div>
        <div id="L-i2" class="line sup kin" data-x="150" data-base="1290" data-size="100">
          <span class="w" data-t="0.53" data-rise="-22">can</span><span class="w gap-s" data-t="0.79" data-pop data-rise="-22">handle</span>
        </div>
        <!-- the bigger goal -->
        <div id="L-the" class="line sup kin" data-x="112" data-base="1092" data-size="96">
          <span class="w" data-t="0.99">the</span>
        </div>
        <div id="L-big" class="line hero ocean kin" data-x="112" data-base="1295" data-size="240" data-fit="660">
          <span id="bigger" class="w" data-t="1.19" data-hero data-peak="1.12" data-rise="-40"><span class="lt">b</span><span class="lt">i</span><span class="lt">g</span><span class="lt">g</span><span class="lt">e</span><span class="lt">r</span></span>
        </div>
        <div id="L-goal" class="line hero ink kin" data-right="890" data-base="1432" data-size="170">
          <span class="w" data-t="1.47" data-hero data-peak="1.08" data-rise="-34">goal.</span>
        </div>

        <!-- phase B: most of us just / don't ask / for it. -->
        <div class="line sup kin" data-x="76" data-base="1092" data-size="100">
          <span class="w" data-t="1.77" data-rise="-22">most</span><span class="w gap-s" data-t="1.87" data-rise="-22">of</span><span class="w gap-s" data-t="2.03" data-rise="-22">us</span><span class="w gap-s" data-t="2.23" data-pop data-rise="-22">just</span>
        </div>
        <div id="L-ask" class="line hero ink kin" data-x="76" data-base="1310" data-size="190" data-fit="800">
          <span id="dont" class="w" data-t="2.51" data-hero data-peak="1.06" data-rise="-30">don't</span><span id="ask" class="w ocean gap-s" data-t="2.91" data-hero data-peak="1.1" data-rise="-30"><span class="lt">a</span><span class="lt">s</span><span class="lt">k</span></span>
        </div>
        <div class="line sup kin" data-right="880" data-base="1445" data-size="110">
          <span class="w" data-t="3.07" data-rise="-20">for</span><span class="w gap-s" data-t="3.27" data-pop data-rise="-20">it.</span>
        </div>

      </div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (async () => {
        const P = await Paper.init({ extraFonts: ['700 60px "Caveat"'] });
        const M = Marker.init(P);
        const { tl, D, F } = P;
        const NS = "http://www.w3.org/2000/svg";
        const g = (parent) => { const e = document.createElementNS(NS, "g"); parent.appendChild(e); return e; };
        const CX = 840, CY = 1112, R = [92, 60, 28];        // the target: centre + 3 ring radii (final size)
        const O = `${CX} ${CY}`;

        // ---- the target: black felt-tip rings drawn SMALL (x0.333) on handle, then GROWS 3x on 'bigger'
        const TG = g(M.layer);                              // rings + bullseye + sparkle ticks (scale together)
        gsap.set(TG, { scale: 1 / 3, svgOrigin: O });
        M.circle(CX, CY, R[0], R[0], 0.5, { parent: TG, color: "ink", width: 14, dur: 0.3, turns: 1.1, tilt: -3, seed: 7101 });
        M.circle(CX, CY, R[1], R[1], 0.66, { parent: TG, color: "ink", width: 14, dur: 0.24, turns: 1.1, tilt: 4, seed: 7102 });
        M.circle(CX, CY, R[2], R[2], 0.79, { parent: TG, color: "ink", width: 14, dur: 0.2, turns: 1.1, tilt: -5, seed: 7103 });
        // gentle breathing while small (secondary action), then anticipation dip -> 3x grow with overshoot -> settle
        tl.to(TG, { scale: 0.355, duration: 0.3, ease: "sine.inOut", svgOrigin: O }, 0.8);
        tl.to(TG, { scale: 0.3, duration: 0.09, ease: "power2.in", svgOrigin: O }, 1.0);                     // anticipation: squeezes first
        tl.to(TG, { scale: 1.06, duration: 0.24, ease: "power3.out", svgOrigin: O }, 1.09);                   // the exaggerated grow, contact ~1.19
        tl.to(TG, { scale: 1, duration: 0.34, ease: "back.out(2)", svgOrigin: O }, 1.33);                     // settle

        // ---- red arrow thunks into the bullseye on 'goal' (1.47): shaft + head, then a wobble, bullseye hatch, ticks
        const AG = g(M.layer);
        M.arrow(948, 1036, CX + 3, CY - 3, 1.18, { parent: AG, color: "marker", width: 13, dur: 0.3, bend: 0.14, head: 30, seed: 7201 });
        tl.to(AG, { rotation: -5, duration: 0.05, ease: "power2.out", svgOrigin: `${CX} ${CY}` }, 1.47);      // thunk
        tl.to(AG, { rotation: 3, duration: 0.07, ease: "power2.inOut", svgOrigin: `${CX} ${CY}` }, 1.52);
        tl.to(AG, { rotation: -1.5, duration: 0.07, ease: "power2.inOut", svgOrigin: `${CX} ${CY}` }, 1.59);
        tl.to(AG, { rotation: 0, duration: 0.12, ease: "sine.out", svgOrigin: `${CX} ${CY}` }, 1.66);
        const pts = Array.from({ length: 24 }, (_, i) => { const a = (i / 24) * Math.PI * 2; return [CX + Math.cos(a) * 22, CY + Math.sin(a) * 22]; });
        M.hatch(pts, 1.5, { parent: TG, spacing: 10, angle: -38, width: 8, dur: 0.2, opacity: 0.9, seed: 7301 });

        // ---- exits: 5 f blur-up (faster than the 6 f runtime exit), all clear before the next phrase starts
        const exit5 = (sel, t, dy = -50) => tl.to(sel, { y: dy, opacity: 0, filter: "blur(8px)", duration: 5 * F, ease: "power2.in" }, t);
        exit5("#L-i1", 0.86); exit5("#L-i2", 0.86);          // fully gone by 1.05
        exit5("#L-the", 1.45); exit5("#L-big", 1.5); exit5("#L-goal", 1.58);

        // ---- type: 'bigger' swells letter by letter after it lands; impact punch + shake on 'bigger'
        P.punch(1.19, { scale: 1.012, origin: "510px 880px", dur: 0.22 });
        const wave = (sel, t, amp, k = 1) => document.querySelectorAll(sel + " .lt").forEach((l, i) => {
          tl.to(l, { y: -amp, scaleY: 1 + 0.05 * k, duration: 0.11, ease: "power2.out" }, t + i * 2 * F);
          tl.to(l, { y: 0, scaleY: 1, duration: 0.3, ease: "back.out(2.4)" }, t + i * 2 * F + 0.11);
        });
        wave("#bigger", 1.42, 18);
        wave("#ask", 3.06, 12);
        P.punch(2.91, { scale: 1.008, origin: "510px 1100px", dur: 0.2 });

        // ---- phase B: the target shrinks back (most of us ask for little), card keeps breathing
        tl.to(TG, { scale: 0.62, opacity: 0.55, duration: 0.3, ease: "power3.in", svgOrigin: O }, 2.2);
        tl.to(AG, { scale: 0.62, opacity: 0.55, duration: 0.3, ease: "power3.in", svgOrigin: O }, 2.2);
        tl.to([TG, AG], { rotation: -3, duration: 0.9, ease: "sine.inOut", svgOrigin: O, yoyo: true, repeat: 1 }, 2.5);

        // ---- red double underline under "don't ask" (2.95 - 3.25)
        const L = document.querySelector("#L-ask"), a = document.querySelector("#ask"), d = document.querySelector("#dont");
        const x0 = L.offsetLeft + d.offsetLeft + 6, x1 = L.offsetLeft + a.offsetLeft + a.offsetWidth - 6;
        M.underline(x0, x1, 1310 + 20, 2.95, { double: true, width: 11, color: "marker", dur: 0.3, seed: 9191 });
      })();
    </script>
  </body>
</html>
