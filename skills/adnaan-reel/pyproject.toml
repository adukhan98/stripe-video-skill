[project]
name = "adnaan-reel"
version = "0.1.0"
description = "Adnaan's house reel style: talking-head footage in, editorial kinetic-serif reel with full-screen animated scenes out"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "numpy",
    "pillow",
    "fonttools",   # font names, WOFF/WOFF2, static instances for libass
    "brotli",      # WOFF2 decompression
    "pypdfium2",   # brand PDFs: text, embedded images, page and logo renders
    "resvg-py",    # SVG logos → PNG
]

[project.optional-dependencies]
# Local transcription on Apple Silicon: uv sync --extra mlx
mlx = ["mlx-whisper"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
